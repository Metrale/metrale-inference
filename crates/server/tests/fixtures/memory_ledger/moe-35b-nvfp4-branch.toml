# 2026-10-02: One boot's allocation ledger, for the circuit memory model's validation
# (crates/server/src/cli/circuit_memory_ledger_tests.rs). Source: dgx2 2026-10-02, the MOENVFP4 branch binary (feat/moe-nvfp4-checkpoint, not main), /workspace/claude-state/moenvfp4/step/runs/be1_MN/serve.log.
# The `[ledger]` rows are the boot's "by file" rollup (MiB = 2^20 bytes, allocation count), the
# `[reserve]` rows its preflight reserve terms (MB as logged); nothing here is edited by hand.

checkpoint = "nvidia/Qwen3.6-35B-A3B-NVFP4"
# 2026-10-02: Served without a recipe; `serve` is its command line.
serve = ["--disable-thinking", "--enable-prefix-caching", "--gpu-memory-utilization", "0.85", "--kv-cache-dtype", "bf16", "--kv-high-precision-layers", "auto", "--lm-head-dtype", "nvfp4", "--max-batch-size", "128", "--max-seq-len", "2048", "--mtp-quantization", "bf16", "--num-drafts", "1", "--scheduler", "fifo", "--speculative", "--ssm-cache-slots", "32", "--weight-quantization", "declared"]
# 2026-10-02: Checkpoint tensors no weight node binds (norms, conv, gates, a vision tower),
# measured from the safetensors headers by `met circuit memory` (totals.weights_outside).
outside_bytes = 895479776
kv_blocks = 104260
draft_kv_blocks = 16512
capture_rows = 2048
chunk_slack_gb = 0.0
ledger_total_gb = 107.08
ledger_sites = 94

