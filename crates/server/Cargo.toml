# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "met"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metrale Engine: pure Rust LLM inference server (HTTP API, scheduler, TUI, CLI)."

# 2026-10-17: the package is published as `met` (crates.io); the library keeps its
# `metrale_server` name so every `use metrale_server::` path is unchanged.
[lib]
name = "metrale_server"
path = "src/lib.rs"

[features]
default = ["cuda", "nccl"]
cuda = ["metrale-core/cuda", "metrale-config/cuda", "metrale-gpu-runtime/cuda", "metrale-cache/cuda", "metrale-sampling/cuda", "metrale-storage/cuda", "metrale-comm/cuda", "metrale-model-weights/cuda", "metrale-model-layers/cuda", "metrale-model-arch/cuda", "metrale-model-engine/cuda"]
nccl = ["cuda", "metrale-comm/nccl"]
metal = ["metrale-core/metal", "metrale-config/metal", "metrale-gpu-runtime/metal", "metrale-cache/metal", "metrale-sampling/metal", "metrale-storage/metal", "metrale-comm/metal", "metrale-model-weights/metal", "metrale-model-layers/metal", "metrale-model-arch/metal", "metrale-model-engine/metal"]
gpu-examples = []
# 2026-09-26: OTLP/HTTP JSON metrics push. It exports only when --telemetry is
# not off and OTEL_EXPORTER_OTLP_ENDPOINT or OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
# is set.
otlp = ["metrale-telemetry/otlp"]
# 2026-09-26: NVTX ranges around serve lanes at --telemetry kernel.
nvtx = ["metrale-telemetry/nvtx"]

[dependencies]
metrale-bench = { workspace = true }
metrale-cache = { workspace = true }
metrale-comm = { workspace = true }
metrale-config = { workspace = true }
metrale-circuit = { workspace = true }
# 2026-09-30: `met circuit plan --hardware` resolves a class's kernel sources with the layout the
# kernels build compiles (metrale_closure::layout); it was a dev-dependency only before.
metrale-closure = { workspace = true }
metrale-core = { workspace = true }
metrale-gpu-runtime = { workspace = true }
metrale-grammar = { workspace = true }
metrale-kernels = { workspace = true }
metrale-model-arch = { workspace = true }
metrale-kernel-tree = { workspace = true }
# 2026-10-17: Its `links` metadata (`DEP_METRALE_KERNEL_TREE_ROOT`) locates kernels/ for build.rs.
metrale-kernel-root = { workspace = true }
metrale-model-engine = { workspace = true }
metrale-model-layers = { workspace = true }
metrale-model-weights = { workspace = true }
metrale-sampling = { workspace = true }
metrale-speculative = { workspace = true }
metrale-scheduler = { workspace = true }
metrale-storage = { workspace = true }
metrale-telemetry = { workspace = true }
anyhow = { workspace = true, features = ["std"] }
axum = { workspace = true, features = ["form", "http1", "json", "matched-path", "original-uri", "query", "tokio", "tower-log", "tracing"] }
base64 = { workspace = true, features = ["std", "simd-unsafe"] }
clap = { workspace = true, features = ["std", "color", "help", "usage", "error-context", "suggestions", "derive"] }
crossterm = { workspace = true, features = ["bracketed-paste", "windows", "events"] }
futures = { workspace = true, features = ["std", "async-await", "executor"] }
http-body = { workspace = true }
hyper = { workspace = true, features = ["server", "http1", "http2", "client"] }
hyper-util = { workspace = true, features = ["server-auto", "client-legacy", "http1", "tokio"] }
lazy_static = { workspace = true }
libc = { workspace = true, features = ["std"] }
# 2026-10-03: SO_RCVBUF on the serve listener (main_modules/listener_rcvbuf.rs).
socket2 = { workspace = true }
minijinja = { workspace = true, features = ["builtins", "debug", "deserialization", "macros", "multi_template", "adjacent_loop_items", "std_collections", "serde", "json", "loop_controls", "preserve_order"] }
parking_lot = { workspace = true }
prometheus = { workspace = true }
ratatui = { workspace = true, features = ["crossterm", "underline-color"] }
rayon = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
# `preserve_order`: keep JSON object keys in insertion/declaration order
# (IndexMap, not BTreeMap). Required so `serde_json::to_value(ToolDefinition)`
# and the nested `parameters` JSON-schema Value match transformers'
# `tojson` (= `json.dumps(sort_keys=False)`) key order in the `<tools>`
# prompt block. See crates/server/src/tokenizer/jinja_helpers.rs.
serde_json = { workspace = true, features = ["std", "preserve_order"] }
thiserror = { workspace = true, features = ["std"] }
tokenizers = { workspace = true, features = ["onig"] }
tokio = { workspace = true, features = ["full", "parking_lot"] }
tokio-stream = { workspace = true, features = ["time"] }
toml = { workspace = true, features = ["std", "serde", "parse", "display"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["catch-panic", "cors"] }
tracing = { workspace = true, features = ["std", "attributes"] }
tracing-subscriber = { workspace = true, features = ["smallvec", "fmt", "ansi", "tracing-log", "std", "env-filter"] }
tui-textarea = { workspace = true, features = ["crossterm"] }
unicode-width = { workspace = true, features = ["cjk"] }
ureq = { workspace = true, features = ["rustls", "gzip", "json"] }

[dev-dependencies]
tempfile = { workspace = true, features = ["getrandom"] }

[[bin]]
name = "met"
path = "src/main.rs"

[[example]]
name = "k3_tokenizer_check"
required-features = ["gpu-examples"]

[lints]
workspace = true

[package.metadata.metrale]
role = "bin"
