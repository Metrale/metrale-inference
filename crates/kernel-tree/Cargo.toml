[package]
name = "metrale-kernel-tree"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The repository's kernels/ manifests and sources, embedded at build time."
# 2026-10-17: Hands the tree's root to direct dependents' build scripts as
# `DEP_METRALE_KERNEL_TREE_ROOT` (metrale-kernels, metrale-gpu-runtime, metrale-storage) and, through
# their build scripts, to `include_str!` sites (metrale-model-layers, met).
links = "metrale_kernel_tree"

# 2026-10-02: `met serve` plans its memory with `met circuit memory`'s own model, which reads
# kernels/ (DEVICES.toml, the circuits, COPIES.toml, a class's HARDWARE.toml, KERNEL.toml,
# MODEL.toml, FUSIONS.toml, KERNEL_FAMILIES.toml and kernel sources). A deployed binary has no
# repository, so the build embeds those files here, compressed, and the serve unpacks them once
# per content hash. A crate of its own, so an edit under kernels/ recompiles only this one.

[dependencies]
anyhow = { workspace = true, features = ["std"] }
flate2 = { workspace = true, features = ["rust_backend", "runtime_detection"] }

[build-dependencies]
flate2 = { workspace = true, features = ["rust_backend", "runtime_detection"] }
sha2 = { workspace = true, features = ["alloc", "oid"] }

[lints]
workspace = true

[package.metadata.metrale]
role = "device"
