# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "metrale-config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metrale Engine: the typed model config tree (HF config.json parsing, GGUF metadata, capabilities)."

[features]
default = ["cuda"]
cuda = ["metrale-core/cuda"]
metal = ["metrale-core/metal"]

[dependencies]
metrale-core = { workspace = true }
metrale-settings = { workspace = true }
anyhow = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std", "preserve_order"] }
regex = { workspace = true, features = ["std", "perf", "unicode"] }

[lints]
workspace = true
