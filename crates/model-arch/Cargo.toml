# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "metrale-model-arch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metrale Engine: per-family architectures (GLM-5 Next, DeepSeek V4.1, Nemotron, Kimi K3, DFlash/MTP heads) and their weight loaders."

[features]
default = ["cuda"]
cuda = ["metrale-model-layers/cuda"]
metal = ["metrale-model-layers/metal"]

[dependencies]
metrale-cache = { workspace = true }
metrale-comm = { workspace = true }
metrale-config = { workspace = true }
metrale-settings = { workspace = true }
metrale-core = { workspace = true }
metrale-gpu-runtime = { workspace = true }
metrale-model-layers = { workspace = true }
metrale-model-weights = { workspace = true }
metrale-storage = { workspace = true }
metrale-telemetry = { workspace = true }
anyhow = { workspace = true, features = ["std"] }
half = { workspace = true, features = ["std"] }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std", "preserve_order"] }
tracing = { workspace = true, features = ["std", "attributes"] }

[dev-dependencies]
metrale-model-layers = { workspace = true, features = ["test-utils"] }
metrale-gpu-runtime = { workspace = true, features = ["test-utils"] }
metrale-kernels = { workspace = true }

[lints]
workspace = true

[package.metadata.metrale]
role = "device"
