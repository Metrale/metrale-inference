# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "metrale-model-arch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metrale Engine: per-family architectures (GLM-5 Next, DeepSeek V4.1, Nemotron, Kimi K3, DFlash/MTP heads) and their weight loaders."

[features]
default = ["cuda"]
cuda = ["metrale-model-layers/cuda"]
metal = ["metrale-model-layers/metal"]

[dependencies]
metrale-cache = { path = "../cache", default-features = false }
metrale-comm = { path = "../comm", default-features = false }
metrale-config = { path = "../config", default-features = false }
metrale-core = { path = "../core", default-features = false }
metrale-gpu-runtime = { path = "../gpu-runtime", default-features = false }
metrale-model-layers = { path = "../model-layers", default-features = false }
metrale-model-weights = { path = "../model-weights", default-features = false }
metrale-storage = { path = "../storage", default-features = false }
metrale-telemetry = { path = "../telemetry" }
anyhow = { workspace = true }
half = "2"
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"

[dev-dependencies]
metrale-gpu-runtime = { path = "../gpu-runtime", default-features = false, features = ["test-utils"] }
metrale-kernels = { path = "../kernels", default-features = false }

[lints]
workspace = true
