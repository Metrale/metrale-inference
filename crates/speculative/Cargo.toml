[package]
name = "metrale-speculative"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metrale Engine: speculative-decoding policy — MTP gate, adaptive and DFlash rungs, n-gram proposer, spec capacity and stats, scheduler snapshots."

[dependencies]
metrale-model-layers = { workspace = true }
anyhow = { workspace = true, features = ["std"] }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
toml = { workspace = true, features = ["std", "serde", "parse", "display"] }
tracing = { workspace = true, features = ["std", "attributes"] }

[lints]
workspace = true

[package.metadata.metrale]
role = "device"
