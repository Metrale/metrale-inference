[package]
name = "metrale-io-host-std"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metrale Engine: process hosts for the abstract-io ports (env, system clock, tokio timer, OS entropy)."

[package.metadata.metrale]
role = "host-std"

[dependencies]
metrale-abstract-io = { workspace = true }
metrale-error = { workspace = true }
getrandom = { workspace = true }
# 2026-10-17: A Timer dependency, not a Clock one: only timer.rs uses tokio.
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time"] }

[lints]
workspace = true
