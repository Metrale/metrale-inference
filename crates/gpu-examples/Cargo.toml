[package]
name = "metrale-gpu-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Metrale Engine: GPU microtests, parity gates and benches for the model-arch kernels (dev-only; not a default member)."
autoexamples = false
autobins = false
autotests = false
autobenches = false

[features]
default = ["cuda"]
cuda = ["metrale-model-arch/cuda", "dep:cudarc"]
metal = ["metrale-model-arch/metal"]
metal-example = ["metal", "dep:tokenizers", "dep:memmap2", "dep:safetensors"]
gpu-examples = []

[dependencies]
metrale-cache = { workspace = true }
metrale-comm = { workspace = true }
metrale-config = { workspace = true }
metrale-gpu-runtime = { workspace = true }
metrale-kernels = { workspace = true }
metrale-kv-tq128 = { workspace = true }
metrale-target-defaults = { workspace = true }
metrale-model-arch = { workspace = true }
metrale-model-layers = { workspace = true }
metrale-settings = { workspace = true }
metrale-io-host-std = { workspace = true }
metrale-kv-codec = { workspace = true }
# 2026-10-21: The driver graph queries of `pdl_capture_gate` (edge types of a captured graph).
cudarc = { workspace = true, features = ["std", "driver", "fallback-dynamic-loading", "cuda-version-from-build-system"], optional = true }
anyhow = { workspace = true, features = ["std"] }
half = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std", "preserve_order"] }
tokenizers = { workspace = true, optional = true, features = ["onig"] }
memmap2 = { workspace = true, optional = true }
safetensors = { workspace = true, optional = true, features = ["std"] }

[lints]
workspace = true

[package.metadata.metrale]
role = "bin"
