[package]
name = "metrale-kg-derive"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metrale Engine: the kernel knowledge graph's derivation: SSOT files in, a deterministic kg-bundle/v1 out, and the closures, counts and owed rows computed over it; no_std, no I/O."

# 2026-10-23: Pure (DESIGN-kernel-knowledge-graph.md §2.1): every byte arrives as an argument or
# through a port declared here (`ports`); hosts live in metrale-io-host-kg, the binary in
# metrale-kg-mcp. no_std + alloc, forbid(unsafe_code), builds for both wasm32 targets (NSCC).
[dependencies]
# 2026-10-23: The registry error (CERF; the KnowledgeGraph block 0x0800).
libm = { workspace = true }
metrale-error = { workspace = true }
# 2026-10-23: The Timer port the embedding pipeline's backoff waits on (ACNB, SBIO).
metrale-abstract-io = { workspace = true }
# 2026-10-23: The LKB readers (families, rules, measurements, instances, plans): the schema owners,
# never re-parsed here (SSOT).
metrale-circuit = { workspace = true }
serde = { workspace = true, features = ["alloc", "derive"] }
serde_json = { workspace = true, features = ["alloc"] }
# 2026-10-23: sha256 for record shas, point ids and the bundle digest (delegated decision
# 2026-10-23: sha2 instead of blake3; already on PURE_ALLOWLIST).
sha2 = { workspace = true, features = ["alloc"] }
toml = { workspace = true, features = ["serde", "parse"] }

[lints]
workspace = true

[package.metadata.metrale]
role = "core"
