# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "metrale-precision"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metrale Engine: the declared precision plan of a checkpoint's quantization_config, the --weight-quantization policy and --activation-quantization. no_std + alloc."

# 2026-10-22: Split from metrale-config so the architecture circuits (metrale-circuit), which
# ask these same answers, build no_std for both wasm32 targets (NSCC). metrale-config re-exports
# every module at its old path. No features (NSCC).
[features]

[dependencies]
metrale-error = { workspace = true }
# 2026-10-22: compressed-tensors `re:` targets and HF `fp8` module patterns: the engines the
# `regex` crate runs, without its `std` requirement.
regex-automata = { workspace = true, features = [
    "alloc",
    "syntax",
    "meta",
    "nfa-pikevm",
    "nfa-backtrack",
    "hybrid",
    "dfa-onepass",
    "perf-inline",
    "perf-literal-substring",
    "unicode",
] }
serde_json = { workspace = true, features = ["alloc"] }

[lints]
workspace = true

[package.metadata.metrale]
role = "core"
