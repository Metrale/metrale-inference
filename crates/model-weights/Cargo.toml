# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "metrale-model-weights"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metrale Engine: weight store and loaders (safetensors, fast weights, RDMA weight/LoRA tiers, preflight)."
autobenches = false

[features]
default = ["cuda"]
cuda = ["metrale-gpu-runtime/cuda", "metrale-storage/cuda", "metrale-core/cuda", "metrale-config/cuda"]
metal = ["metrale-gpu-runtime/metal", "metrale-storage/metal", "metrale-core/metal", "metrale-config/metal"]
test-utils = ["metrale-gpu-runtime/test-utils"]

[dependencies]
metrale-config = { workspace = true }
metrale-core = { workspace = true }
metrale-gpu-runtime = { workspace = true }
metrale-gpu-sys = { workspace = true }
metrale-settings = { workspace = true }
metrale-storage = { workspace = true }
metrale-telemetry = { workspace = true }
anyhow = { workspace = true, features = ["std"] }
half = { workspace = true, features = ["std"] }
memmap2 = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true, features = ["std", "std_rng", "os_rng", "small_rng", "thread_rng"] }
safetensors = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std", "preserve_order"] }
sha2 = { workspace = true, features = ["alloc", "oid"] }
tracing = { workspace = true, features = ["std", "attributes"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, features = ["std"] }

[dev-dependencies]
metrale-gpu-runtime = { workspace = true, features = ["test-utils"] }
metrale-kernels = { workspace = true }
metrale-settings = { workspace = true, features = ["test-utils"] }
tempfile = { workspace = true, features = ["getrandom"] }

[[bin]]
name = "bench_fast_weights"
path = "benches/bench_fast_weights.rs"
required-features = ["test-utils"]

[[example]]
name = "metal_layer3_attention"
path = "examples/metal_layer3_attention.rs"
required-features = ["metal"]

[[example]]
name = "metal_layer3_bench"
path = "examples/metal_layer3_bench.rs"
required-features = ["metal"]

[[example]]
name = "metal_vision_block_forward"
path = "examples/metal_vision_block_forward.rs"
required-features = ["metal"]

[[test]]
name = "fast_weights_parity"
path = "tests/fast_weights_parity.rs"
required-features = ["test-utils"]

[lints]
workspace = true

[package.metadata.metrale]
role = "device"
