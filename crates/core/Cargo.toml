# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "metrale-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metrale Engine: shared types (dtype, tensor, arch, device, errors, fault scopes)."

[features]
default = ["cuda"]
cuda = ["dep:cudarc"]
metal = []

[dependencies]
# 2026-10-22: `csf_blocks::ENCODING_NAME`, defined beside the plan that accepts it.
metrale-precision = { workspace = true }
anyhow = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std", "preserve_order"] }
thiserror = { workspace = true, features = ["std"] }
cudarc = { workspace = true, optional = true, features = ["std", "driver", "nvrtc", "fallback-dynamic-loading", "cuda-version-from-build-system"] }

[lints]
workspace = true

[package.metadata.metrale]
role = "core"
