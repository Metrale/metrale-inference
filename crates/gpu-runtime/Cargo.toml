# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "metrale-gpu-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metrale Engine: GpuBackend (CUDA/Metal), streams, buffers, op cache, pinned hosts, kernel registry, cuBLASLt/CUTLASS/FlashInfer bridges."

[features]
default = ["cuda"]
cuda = ["dep:cudarc", "metrale-core/cuda", "metrale-config/cuda"]
metal = ["dep:objc2", "dep:objc2-metal", "dep:objc2-foundation", "dep:dispatch2", "metrale-core/metal", "metrale-config/metal"]
test-utils = []

[dependencies]
# 2026-10-17: Its `links` metadata (`DEP_METRALE_KERNEL_TREE_ROOT`) locates kernels/ for build.rs.
metrale-kernel-root = { workspace = true }
metrale-config = { workspace = true }
metrale-core = { workspace = true }
metrale-error = { workspace = true }
metrale-target-defaults = { workspace = true }
metrale-settings = { workspace = true }
metrale-telemetry = { workspace = true }
anyhow = { workspace = true, features = ["std"] }
libc = { workspace = true, features = ["std"] }
parking_lot = { workspace = true }
safetensors = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std", "preserve_order"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "parking_lot"] }
tracing = { workspace = true, features = ["std", "attributes"] }
cudarc = { workspace = true, optional = true, features = ["std", "driver", "nvrtc", "fallback-dynamic-loading", "cuda-version-from-build-system"] }
objc2 = { workspace = true, optional = true, features = ["std"] }
# 2026-10-17: objc2-metal's and objc2-foundation's full default lists (every class gate the
# Metal build compiled with), so the Metal build is unchanged. Trim to the classes in use once
# the Mac runner can prove the smaller set builds.
objc2-metal = { workspace = true, optional = true, features = [
    "std", "MTL4AccelerationStructure", "MTL4Archive", "MTL4ArgumentTable", "MTL4BinaryFunction",
    "MTL4BinaryFunctionDescriptor", "MTL4BufferRange", "MTL4CommandAllocator",
    "MTL4CommandBuffer", "MTL4CommandEncoder", "MTL4CommandQueue", "MTL4CommitFeedback",
    "MTL4Compiler", "MTL4CompilerTask", "MTL4ComputeCommandEncoder", "MTL4ComputePipeline",
    "MTL4Counters", "MTL4FunctionDescriptor", "MTL4LibraryDescriptor",
    "MTL4LibraryFunctionDescriptor", "MTL4LinkingDescriptor", "MTL4MachineLearningCommandEncoder",
    "MTL4MachineLearningPipeline", "MTL4MeshRenderPipeline", "MTL4PipelineDataSetSerializer",
    "MTL4PipelineState", "MTL4RenderCommandEncoder", "MTL4RenderPass", "MTL4RenderPipeline",
    "MTL4SpecializedFunctionDescriptor", "MTL4StitchedFunctionDescriptor",
    "MTL4TileRenderPipeline", "MTLAccelerationStructure",
    "MTLAccelerationStructureCommandEncoder", "MTLAccelerationStructureTypes", "MTLAllocation",
    "MTLArgument", "MTLArgumentEncoder", "MTLBinaryArchive", "MTLBlitCommandEncoder",
    "MTLBlitPass", "MTLBuffer", "MTLCaptureManager", "MTLCaptureScope", "MTLCommandBuffer",
    "MTLCommandEncoder", "MTLCommandQueue", "MTLComputeCommandEncoder", "MTLComputePass",
    "MTLComputePipeline", "MTLCounters", "MTLDataType", "MTLDefines", "MTLDepthStencil",
    "MTLDevice", "MTLDeviceCertification", "MTLDrawable", "MTLDynamicLibrary", "MTLEvent",
    "MTLFence", "MTLFunctionConstantValues", "MTLFunctionDescriptor", "MTLFunctionHandle",
    "MTLFunctionLog", "MTLFunctionStitching", "MTLGPUAddress", "MTLHeap", "MTLIOCommandBuffer",
    "MTLIOCommandQueue", "MTLIOCompressor", "MTLIndirectCommandBuffer",
    "MTLIndirectCommandEncoder", "MTLIntersectionFunctionTable", "MTLLibrary",
    "MTLLinkedFunctions", "MTLLogState", "MTLParallelRenderCommandEncoder", "MTLPipeline",
    "MTLPixelFormat", "MTLRasterizationRate", "MTLRenderCommandEncoder", "MTLRenderPass",
    "MTLRenderPipeline", "MTLResidencySet", "MTLResource", "MTLResourceStateCommandEncoder",
    "MTLResourceStatePass", "MTLResourceViewPool", "MTLSampler", "MTLStageInputOutputDescriptor",
    "MTLTensor", "MTLTexture", "MTLTextureViewPool", "MTLTypes", "MTLVertexDescriptor",
    "MTLVisibleFunctionTable", "bitflags", "block2", "dispatch2", "objc2-core-foundation",
] }
objc2-foundation = { workspace = true, optional = true, features = [
    "std", "FoundationErrors", "FoundationLegacySwiftCompatibility", "NSAffineTransform",
    "NSAppleEventDescriptor", "NSAppleEventManager", "NSAppleScript", "NSArchiver", "NSArray",
    "NSAttributedString", "NSAutoreleasePool", "NSBackgroundActivityScheduler", "NSBundle",
    "NSByteCountFormatter", "NSByteOrder", "NSCache", "NSCalendar", "NSCalendarDate",
    "NSCharacterSet", "NSClassDescription", "NSCoder", "NSComparisonPredicate",
    "NSCompoundPredicate", "NSConnection", "NSData", "NSDate", "NSDateComponentsFormatter",
    "NSDateFormatter", "NSDateInterval", "NSDateIntervalFormatter", "NSDebug", "NSDecimal",
    "NSDecimalNumber", "NSDictionary", "NSDistantObject", "NSDistributedLock",
    "NSDistributedNotificationCenter", "NSEnergyFormatter", "NSEnumerator", "NSError",
    "NSException", "NSExpression", "NSExtensionContext", "NSExtensionItem",
    "NSExtensionRequestHandling", "NSFileCoordinator", "NSFileHandle", "NSFileManager",
    "NSFilePresenter", "NSFileVersion", "NSFileWrapper", "NSFormatter", "NSGarbageCollector",
    "NSGeometry", "NSHFSFileTypes", "NSHTTPCookie", "NSHTTPCookieStorage", "NSHashTable",
    "NSHost", "NSISO8601DateFormatter", "NSIndexPath", "NSIndexSet", "NSInflectionRule",
    "NSInvocation", "NSItemProvider", "NSJSONSerialization", "NSKeyValueCoding",
    "NSKeyValueObserving", "NSKeyValueSharedObservers", "NSKeyedArchiver", "NSLengthFormatter",
    "NSLinguisticTagger", "NSListFormatter", "NSLocale", "NSLocalizedNumberFormatRule", "NSLock",
    "NSMapTable", "NSMassFormatter", "NSMeasurement", "NSMeasurementFormatter", "NSMetadata",
    "NSMetadataAttributes", "NSMethodSignature", "NSMorphology", "NSNetServices",
    "NSNotification", "NSNotificationQueue", "NSNull", "NSNumberFormatter", "NSObjCRuntime",
    "NSObject", "NSObjectScripting", "NSOperation", "NSOrderedCollectionChange",
    "NSOrderedCollectionDifference", "NSOrderedSet", "NSOrthography", "NSPathUtilities",
    "NSPersonNameComponents", "NSPersonNameComponentsFormatter", "NSPointerArray",
    "NSPointerFunctions", "NSPort", "NSPortCoder", "NSPortMessage", "NSPortNameServer",
    "NSPredicate", "NSProcessInfo", "NSProgress", "NSPropertyList", "NSProtocolChecker",
    "NSProxy", "NSRange", "NSRegularExpression", "NSRelativeDateTimeFormatter", "NSRunLoop",
    "NSScanner", "NSScriptClassDescription", "NSScriptCoercionHandler", "NSScriptCommand",
    "NSScriptCommandDescription", "NSScriptExecutionContext", "NSScriptKeyValueCoding",
    "NSScriptObjectSpecifiers", "NSScriptStandardSuiteCommands", "NSScriptSuiteRegistry",
    "NSScriptWhoseTests", "NSSet", "NSSortDescriptor", "NSSpellServer", "NSStream", "NSString",
    "NSTask", "NSTermOfAddress", "NSTextCheckingResult", "NSThread", "NSTimeZone", "NSTimer",
    "NSURL", "NSURLAuthenticationChallenge", "NSURLCache", "NSURLConnection", "NSURLCredential",
    "NSURLCredentialStorage", "NSURLDownload", "NSURLError", "NSURLHandle",
    "NSURLProtectionSpace", "NSURLProtocol", "NSURLRequest", "NSURLResponse", "NSURLSession",
    "NSUUID", "NSUbiquitousKeyValueStore", "NSUndoManager", "NSUnit", "NSUserActivity",
    "NSUserDefaults", "NSUserNotification", "NSUserScriptTask", "NSValue", "NSValueTransformer",
    "NSXMLDTD", "NSXMLDTDNode", "NSXMLDocument", "NSXMLElement", "NSXMLNode", "NSXMLNodeOptions",
    "NSXMLParser", "NSXPCConnection", "NSZone", "bitflags", "block2", "libc",
    "objc2-core-foundation",
] }
dispatch2 = { workspace = true, optional = true, features = ["std", "block2", "libc", "objc2"] }

[dev-dependencies]
# 2026-10-17: The tests build `TargetPtxSet` rows and load real kernel tables; production code
# receives the modules at construction (`MetraleCudaBackend::new`) and never names this crate.
metrale-kernels = { workspace = true }
half = { workspace = true, features = ["std"] }
memmap2 = { workspace = true }
# 2026-10-17: The equivalence harness, for the legacy env readers against the projections.
metrale-settings = { workspace = true, features = ["test-utils"] }

[build-dependencies]
toml = { workspace = true, features = ["std", "serde", "parse", "display"] }

[lints]
workspace = true

[package.metadata.metrale]
role = "device"
