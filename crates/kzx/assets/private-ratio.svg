<text x='70' y='486' font-size='10' text-anchor='start' font-weight='normal' fill='#8b949e'>1.5.5, xz 5.4.5, gzip 1.12, bzip2 1.0.8, Python brotli 1.2.0 (lgwin 24). Every row is a verified round trip.</text>
