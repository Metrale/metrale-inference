<text x='70' y='444' font-size='10' text-anchor='start' font-weight='normal' fill='#8b949e'>Private corpus (aggregates only): Metrale's compiled GB10 kernel set for one large model, 254 PTX modules (71.1 MB); 250 of them</text>
<text x='70' y='458' font-size='10' text-anchor='start' font-weight='normal' fill='#8b949e'>compiled to sm_121a cubins with ptxas 13.0 (25.7 MB); three postcard blueprint bodies at 45-64-layer scale (2.4 MB); one full and one</text>
