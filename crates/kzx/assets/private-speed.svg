<text x='60' y='390' font-size='10' text-anchor='start' font-weight='normal' fill='#8b949e'>container (72.7 MB). Host: NVIDIA DGX Spark GB10 Grace CPU (Cortex-X925), single thread, Linux 6.17, rustc 1.93.1; zstd 1.5.5, xz</text>
<text x='60' y='404' font-size='10' text-anchor='start' font-weight='normal' fill='#8b949e'>5.4.5, gzip 1.12, bzip2 1.0.8, Python brotli 1.2.0 (lgwin 24). Every row is a verified round trip.</text>
