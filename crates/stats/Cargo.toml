# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "metrale-stats"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metrale Engine: measurement statistics (robust location, HAC variance, block and BCa bootstrap, variance components, agreement, NNLS, equivalence and multiplicity, change points); no_std, no I/O."

# 2026-10-22: Pure: no_std + alloc, forbid(unsafe_code), builds for both wasm32 targets (NSCC), so
# the store can show the same intervals the bench computes.
[dependencies]
metrale-error = { workspace = true }
# 2026-10-22: sqrt/ln/exp/lgamma (no_std has no f64 math).
libm = { workspace = true }

# 2026-10-22: Optional, no_std: `Serialize` on `mbb::Interval` for the headroom reports.
serde = { workspace = true, features = ["derive"], optional = true }

[features]
# 2026-10-22: Derive `serde::Serialize` on the record types callers export (headroom JSON).
serde = ["dep:serde"]

[lints]
workspace = true

[package.metadata.metrale]
role = "core"
