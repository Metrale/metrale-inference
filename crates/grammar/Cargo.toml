# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Pure-Rust XGrammar — structured-generation / grammar-constrained
# decoding engine. A from-scratch port of mlc-ai/xgrammar v0.1.32
# (originally C++), eliminating the cxx FFI bridge and the C++
# toolchain dependency. See PORT_PLAN.md for the port roadmap.
# W7: the standalone `[workspace]` table was removed so this crate
# joins the parent metrale workspace (registered in the root
# `Cargo.toml` `members` list); `met` depends on it directly.

[package]
name = "metrale-grammar"
version = "1.0.0-beta-preview"
edition = "2024"
license = "MIT OR Apache-2.0"
repository.workspace = true
description = "Pure-Rust grammar-constrained decoding (XGrammar port)"

[dependencies]
# Support layer — these crates replace cpp/support/* utilities:
#   dynamic_bitset.h -> bitvec ; thread_pool.h -> rayon ;
#   json_serializer.h/reflection.h -> serde
bitvec = { workspace = true, features = ["atomic", "std"] }
rayon = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
ahash = { workspace = true, features = ["std", "runtime-rng"] }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
# Micro-benchmark harness for the Tier-1 perf work — measures
# `GrammarCompiler::compile_*` and `GrammarMatcher::fill_next_token_bitmask`.
criterion = { workspace = true, features = ["rayon", "plotters", "cargo_bench_support"] }
stats_alloc = { workspace = true }

[[bench]]
name = "grammar_bench"
harness = false

[lints.rust]
unsafe_code = "forbid"
