# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "metrale-model-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metrale Engine: the Model trait, the transformer model (prefill, decode, verify, SSM state), the generate engine and the model factory."

[features]
default = ["cuda"]
cuda = ["metrale-model-arch/cuda"]
metal = ["metrale-model-arch/metal"]

[dependencies]
metrale-cache = { workspace = true }
metrale-kv-codec = { workspace = true }
metrale-comm = { workspace = true }
metrale-config = { workspace = true }
metrale-settings = { workspace = true }
metrale-core = { workspace = true }
metrale-gpu-runtime = { workspace = true }
metrale-model-arch = { workspace = true }
metrale-model-layers = { workspace = true }
metrale-model-weights = { workspace = true }
metrale-sampling = { workspace = true }
# 2026-09-25: For `FeedSource` and `RowMask`, which the `Model` trait's
# fed-decode methods take (`src/traits/model.rs`).
metrale-scheduler = { workspace = true }
metrale-storage = { workspace = true }
metrale-telemetry = { workspace = true }
# 2026-09-28: The circuit instance a `ForwardSelect::Circuit` names; also read by `padded_ladder`,
# which checks the batch ladder against the instances' plans.
metrale-circuit = { workspace = true }
anyhow = { workspace = true, features = ["std"] }
half = { workspace = true, features = ["std"] }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std", "preserve_order"] }
# 2026-10-02: `METRALE_DEBUG_ALLOC_DIGEST` (factory/build/alloc_digest.rs).
sha2 = { workspace = true, features = ["alloc", "oid"] }
tracing = { workspace = true, features = ["std", "attributes"] }

[dev-dependencies]
metrale-model-layers = { workspace = true, features = ["test-utils"] }
metrale-gpu-runtime = { workspace = true, features = ["test-utils"] }
# 2026-10-17: Tests load real kernel tables; production code never names this crate, so a
# kernel edit does not rebuild this one.
metrale-kernels = { workspace = true }
base64 = { workspace = true, features = ["std", "simd-unsafe"] }

[lints]
workspace = true

[package.metadata.metrale]
role = "device"
