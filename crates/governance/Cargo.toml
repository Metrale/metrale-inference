[package]
name = "metrale-governance"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The PR journey ledger: an append-only record of how a change reached main."

# 2026-09-26: Host-only: no dependency below reaches CUDA or a GPU.

[dependencies]
anyhow = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std", "preserve_order"] }

# 2026-09-26: The graph engine `ledger::materialize` builds in.
lattice-core = { workspace = true }


[package.metadata.metrale]
role = "tool"
