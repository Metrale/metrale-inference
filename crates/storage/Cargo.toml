# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "metrale-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metrale Engine: GDS/RDMA tiers, expert paging, cache peers, tiered-cache core (SlotArena/SwapStore/Residency)."

[features]
default = ["cuda"]
cuda = []
metal = []

[dependencies]
metrale-core = { workspace = true }
metrale-gpu-sys = { workspace = true }
anyhow = { workspace = true, features = ["std"] }
half = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std", "preserve_order"] }
tracing = { workspace = true, features = ["std", "attributes"] }
rand = { workspace = true, features = ["std", "std_rng", "os_rng", "small_rng", "thread_rng"] }
rand_chacha = { workspace = true, features = ["std"] }
rand_distr = { workspace = true, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { workspace = true }

[target.'cfg(windows)'.dependencies]
getrandom = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["smallvec", "fmt", "ansi", "tracing-log", "std"] }

[build-dependencies]
toml = { workspace = true, features = ["std", "serde", "parse", "display"] }

[[example]]
name = "gds-probe"
path = "examples/gds_probe.rs"

[[example]]
name = "iouring-bench"
path = "examples/iouring_bench.rs"

[[example]]
name = "long-context-bench"
path = "examples/long_context_bench.rs"

[lints]
workspace = true
