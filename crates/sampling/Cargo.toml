# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "metrale-sampling"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metrale Engine: the sampler."

[features]
default = ["cuda"]
cuda = ["metrale-gpu-runtime/cuda"]
metal = ["metrale-gpu-runtime/metal"]

[dependencies]
metrale-gpu-runtime = { workspace = true }
metrale-telemetry = { workspace = true }
anyhow = { workspace = true, features = ["std"] }
rand = { workspace = true, features = ["std", "std_rng", "os_rng", "small_rng", "thread_rng"] }

[dev-dependencies]
metrale-gpu-runtime = { workspace = true, features = ["test-utils"] }

[lints]
workspace = true
