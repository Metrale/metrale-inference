# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "metrale-cache"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metrale Engine: KV cache, KV dequant, KV spill, radix-tree prefix cache."

[features]
default = ["cuda"]
cuda = ["metrale-gpu-runtime/cuda"]
metal = ["metrale-gpu-runtime/metal"]

[dependencies]
metrale-error = { workspace = true }
metrale-kv-codec = { workspace = true }
metrale-core = { workspace = true }
metrale-gpu-runtime = { workspace = true }
metrale-settings = { workspace = true }
metrale-telemetry = { workspace = true }
anyhow = { workspace = true, features = ["std"] }
half = { workspace = true, features = ["std"] }
parking_lot = { workspace = true }
tracing = { workspace = true, features = ["std", "attributes"] }

[dev-dependencies]
metrale-gpu-runtime = { workspace = true, features = ["test-utils"] }

[lints]
workspace = true

[package.metadata.metrale]
role = "device"
