# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "metrale-model-layers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metrale Engine: generic layers (attention, SSM, MoE, FFN, norm, MTP heads, vision, ops), LoRA, weight map, the draft-proposer contract."

[features]
default = ["cuda"]
cuda = ["metrale-core/cuda", "metrale-config/cuda", "metrale-gpu-runtime/cuda", "metrale-cache/cuda", "metrale-storage/cuda", "metrale-comm/cuda", "metrale-model-weights/cuda"]
metal = ["metrale-core/metal", "metrale-config/metal", "metrale-gpu-runtime/metal", "metrale-cache/metal", "metrale-storage/metal", "metrale-comm/metal", "metrale-model-weights/metal"]
# 2026-10-17: `lever_equivalence`, the settings-migration test support, for the dependent crates' tests.
test-utils = ["dep:metrale-io-host-mem"]

[dependencies]
# 2026-10-17: Its `links` metadata (`DEP_METRALE_KERNEL_TREE_ROOT`) locates kernels/ for build.rs.
metrale-kernel-root = { workspace = true }
metrale-cache = { workspace = true }
# 2026-09-28: The circuit plans the executor (`circuit_exec`) compiles into launches.
metrale-circuit = { workspace = true }
metrale-closure = { workspace = true }
metrale-comm = { workspace = true }
metrale-config = { workspace = true }
metrale-settings = { workspace = true }
metrale-io-host-mem = { workspace = true, optional = true }
metrale-core = { workspace = true }
metrale-error = { workspace = true }
# 2026-10-18: The codec kernel table (`kv_kernel_names`) names the KV kernels a layer loads.
metrale-kv-codec = { workspace = true }
metrale-gpu-runtime = { workspace = true }
metrale-model-weights = { workspace = true }
metrale-storage = { workspace = true }
metrale-target-defaults = { workspace = true }
anyhow = { workspace = true, features = ["std"] }
base64 = { workspace = true, features = ["std", "simd-unsafe"] }
half = { workspace = true, features = ["std"] }
image = { workspace = true, features = ["jpeg", "png", "gif"] }
parking_lot = { workspace = true }
serde_json = { workspace = true, features = ["std", "preserve_order"] }
tracing = { workspace = true, features = ["std", "attributes"] }

[dev-dependencies]
metrale-io-host-mem = { workspace = true }
metrale-gpu-runtime = { workspace = true, features = ["test-utils"] }
# 2026-10-17: GPU tests load real kernel tables (`ptx_for_exact_target`, `ptx_modules`);
# production code never names this crate, so a kernel edit does not rebuild this one.
metrale-kernels = { workspace = true }
metrale-model-weights = { workspace = true, features = ["test-utils"] }
serde = { workspace = true, features = ["std", "derive"] }

[lints]
workspace = true

[package.metadata.metrale]
role = "device"
