recipe_version: "2"
model: nvidia/DeepSeek-V4-Flash-NVFP4
runtime: metrale
container: metrale/metrale-inference-gb10:latest
min_nodes: 2
max_nodes: 2

metadata:
  description: |
    DeepSeek-V4-Flash (NVFP4) served with pure expert parallelism across two
    GB10 nodes over NCCL/RoCEv2. This model REQUIRES EP=2: the quantized
    checkpoint is ~153 GB, larger than a single GB10's 119.7 GB, so a
    single-node launch OOMs. It also cannot use tensor parallelism —
    DeepSeek-V4 has num_key_value_heads=1 (MQA), so TP>1 is impossible and
    the topology is fixed at tensor_parallel=1, ep_size=2.

    Architecture: 43 layers, MLA (head_dim 512, kv_lora 512 + 64 rope), 256
    experts / top-6 / 1 shared, sqrtsoftplus routing with the first 3 layers
    hash-routed (static tid2eid), Hyper-Connections residual (mHC, Sinkhorn),
    and DeepSeek Sparse Attention (per-layer compress ratios). The Metrale Engine port
    is validated coherent end-to-end (Paris, counting, haiku, math).

    KV cache is FP8: the MLA decode kernel's V=K rope reconstruction and
    attention sink are only implemented on the FP8 path, and BF16-KV decode
    is measurably worse. CUDA graphs are disabled under EP on GB10 (RoCE
    replay deadlocks) — Metrale Engine defaults METRALE_EP_GRAPHS=0, so no override is
    needed here.

    --speculative is OFF: the public checkpoint ships no usable MTP draft
    weights, so speculative decoding cannot be enabled on either rank.
    Validated decode ~15.5 tok/s (network/all-reduce bound over RoCE).
  maintainer: metrale
  category: agent
  model_params: 280B
  model_dtype: nvfp4
  quantization: nvfp4
  kv_dtype: fp8

defaults:
  # The --activation-quantization routing this recipe was measured under: each projection
  # picks its activation precision by row count, as before the flag existed. The
  # row-invariant modes (declared, bf16, fp8, nvfp4) are opt-in until evaluated.
  activation_quantization: adaptive
  # The --weight-quantization tier this recipe was measured under: FP8-declared layers
  # requantized to NVFP4, the engine as it ran before the tiers. `declared` (the
  # engine default) is not measured on this recipe.
  weight_quantization: nvfp4
  port: 8888
  host: 0.0.0.0
  tensor_parallel: 1
  ep_size: 2
  max_model_len: 32768
  max_batch_size: 1
  kv_cache_dtype: fp8
  gpu_memory_utilization: 0.85
  enable_prefix_caching: true
  oom_guard_mb: 512
  # --- explicit CLI defaults (owner directive 2026-10-05): pinned to today's met-serve
  # clap default so the resolved config is unchanged; see recipe::explicit for the SSOT list.
  block_size: 16
  content_loop_watchdog: auto
  default_min_p: 0.08
  default_top_n_sigma: 1
  dflash_window_size: 4096
  expert_quantization: fp8
  forward: legacy
  fp8_kv_headroom: 2
  high_speed_swap_cache_blocks_per_seq: 64
  high_speed_swap_qd: 8
  high_speed_swap_rank: 32
  kv_high_precision_layers: 0
  lm_head_dtype: default
  marconi_min_tokens: 256
  max_loras: 8
  max_num_seqs: 128
  max_prefill_tokens: 8192
  mtp_quantization: bf16
  mtp_vocab: 100000
  prompt_lookup_max_drafts: 8
  prompt_lookup_max_seqs: 8
  prompt_lookup_min_match: 8
  prompt_lookup_miss_backoff: 16
  prompt_lookup_ngram: 4
  prompt_lookup_shared_cache_scopes: 4
  request_timeout: 300
  scheduler: fifo
  scheduler_config: sync
  spec_cost_model: off
  ssm_batched_recurrent: auto
  ssm_cache_slots: 16
  ssm_checkpoint_interval: 256
  ssm_decode_ring_slots: auto
  ssm_rollback_mode: snapshot
  swap_space_gb: 3
  tbt_deadline_ms: 100
  telemetry: off
  tool_grammar: auto
  tool_max_tokens: 8192
  video_decode_timeout_s: 120
  video_ffmpeg_path: ffmpeg
  video_fps: 2
  video_max_frames: 768
  vision_max_pixels: 0
  vision_remote_image_max_mb: 20
  vision_remote_image_timeout_s: 10
