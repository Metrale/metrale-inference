recipe_version: "2"
model: Qwen/Qwen3-Coder-Next-FP8
runtime: metrale
container: metrale/metrale-inference-gb10:latest
max_nodes: 1

metadata:
  description: |
    Qwen3-Coder-Next-FP8 — 80B MoE (512 experts top-10) with hybrid
    GDN + Attention, served at native FP8 (~58 tok/s decode on a single
    GB10 with no conversion overhead). Same architecture as
    qwen3_next, only `rope_theta=5M` differs.

    Production constraints from the Metrale Engine FP8-native bring-up:
      * `kv_cache_dtype: bf16` — FP8 KV is incompatible with this model
      * `ssm_cache_slots: 0` — Marconi snapshot lookup misses cause SSM
        state divergence in multi-turn
      * `oom_guard_mb: 1024` — the default 4096 is too conservative for
        FP8 (1.5× overhead estimate + 4 GB reserve > available)
      * `tool_call_parser: qwen3_coder` — required for tool calling

    Known limitation: agentic quality degrades after ~5–8 tool-use
    turns (model emits malformed XML, loops). Document but accept —
    this is a model issue, not a Metrale Engine one.
  maintainer: metrale
  category: agent
  model_params: 80B
  model_dtype: fp8
  quantization: fp8
  kv_dtype: bf16

defaults:
  # The --activation-quantization routing this recipe was measured under: each projection
  # picks its activation precision by row count, as before the flag existed. The
  # row-invariant modes (declared, bf16, fp8, nvfp4) are opt-in until evaluated.
  activation_quantization: adaptive
  # The --weight-quantization tier this recipe was measured under: FP8-declared layers
  # requantized to NVFP4, the engine as it ran before the tiers. `declared` (the
  # engine default) is not measured on this recipe.
  weight_quantization: nvfp4
  port: 8888
  host: 0.0.0.0
  max_model_len: 16384
  max_batch_size: 1
  kv_cache_dtype: bf16
  gpu_memory_utilization: 0.85
  scheduler: slai
  ssm_cache_slots: 0
  oom_guard_mb: 1024
  tool_call_parser: qwen3_coder
  # --- explicit CLI defaults (owner directive 2026-10-05): pinned to today's met-serve
  # clap default so the resolved config is unchanged; see recipe::explicit for the SSOT list.
  block_size: 16
  content_loop_watchdog: auto
  default_min_p: 0.08
  default_top_n_sigma: 1
  dflash_window_size: 4096
  ep_size: 1
  expert_quantization: fp8
  forward: legacy
  fp8_kv_headroom: 2
  high_speed_swap_cache_blocks_per_seq: 64
  high_speed_swap_qd: 8
  high_speed_swap_rank: 32
  kv_high_precision_layers: 0
  lm_head_dtype: default
  marconi_min_tokens: 256
  max_loras: 8
  max_num_seqs: 128
  max_prefill_tokens: 8192
  mtp_quantization: bf16
  mtp_vocab: 100000
  prompt_lookup_max_drafts: 8
  prompt_lookup_max_seqs: 8
  prompt_lookup_min_match: 8
  prompt_lookup_miss_backoff: 16
  prompt_lookup_ngram: 4
  prompt_lookup_shared_cache_scopes: 4
  request_timeout: 300
  scheduler_config: sync
  spec_cost_model: off
  ssm_batched_recurrent: auto
  ssm_checkpoint_interval: 256
  ssm_decode_ring_slots: auto
  ssm_rollback_mode: snapshot
  swap_space_gb: 3
  tbt_deadline_ms: 100
  telemetry: off
  tensor_parallel: 1
  tool_grammar: auto
  tool_max_tokens: 8192
  video_decode_timeout_s: 120
  video_ffmpeg_path: ffmpeg
  video_fps: 2
  video_max_frames: 768
  vision_max_pixels: 0
  vision_remote_image_max_mb: 20
  vision_remote_image_timeout_s: 10
