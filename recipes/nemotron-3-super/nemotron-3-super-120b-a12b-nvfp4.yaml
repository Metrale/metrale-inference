recipe_version: "2"
model: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
runtime: metrale
container: metrale/metrale-inference-gb10:latest
max_nodes: 1

metadata:
  description: |
    Nemotron-3-Super-120B (A12B MoE) NVFP4 — NVIDIA's hybrid Mamba-2 +
    MoE + Attention model on a single GB10. Single-node configuration
    from the Metrale Engine alpha-2.7 release announcement.
  maintainer: metrale
  category: agent
  model_params: 120B
  model_dtype: nvfp4
  quantization: nvfp4
  kv_dtype: fp8

defaults:
  # The --activation-quantization routing this recipe was measured under: each projection
  # picks its activation precision by row count, as before the flag existed. The
  # row-invariant modes (declared, bf16, fp8, nvfp4) are opt-in until evaluated.
  activation_quantization: adaptive
  # The --weight-quantization tier this recipe was measured under: FP8-declared layers
  # requantized to NVFP4, the engine as it ran before the tiers. `declared` (the
  # engine default) is not measured on this recipe.
  weight_quantization: nvfp4
  port: 8888
  host: 0.0.0.0
  max_model_len: 65536
  kv_cache_dtype: fp8
  kv_high_precision_layers: auto
  gpu_memory_utilization: 0.85
  scheduler: slai
  tool_call_parser: qwen3_coder
  ssm_cache_slots: 0
  # 2026-09-29: No `speculative`: the engine refuses every speculative proposer for a model
  # with Mamba-2 layers (verify cannot roll Mamba-2 state back), and with no MTP head
  # loaded for Nemotron-H the flag never drafted anything here.
