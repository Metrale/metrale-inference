recipe_version: "2"
model: Qwen/Qwen3.5-0.8B
runtime: metrale
container: metrale/metrale-inference-gb10:latest
max_nodes: 1

metadata:
  description: |
    Qwen3.5-0.8B (upstream BF16) on the Metrale Engine runtime — tiniest member of
    the qwen3.5 family on a single GB10. No quantization, no MTP. Useful
    as a tiny-baseline reproducibility target alongside the 27B/35B/122B
    NVFP4 variants.
  maintainer: metrale
  category: chat
  model_params: 0.8B
  model_dtype: bf16
  quantization: none
  kv_dtype: bf16

defaults:
  # The --activation-quantization routing this recipe was measured under: each projection
  # picks its activation precision by row count, as before the flag existed. The
  # row-invariant modes (declared, bf16, fp8, nvfp4) are opt-in until evaluated.
  activation_quantization: adaptive
  # The --weight-quantization tier this recipe was measured under: FP8-declared layers
  # requantized to NVFP4, the engine as it ran before the tiers. `declared` (the
  # engine default) is not measured on this recipe.
  weight_quantization: nvfp4
  port: 8888
  host: 0.0.0.0
  max_model_len: 131072
  kv_cache_dtype: bf16
  gpu_memory_utilization: 0.5
  scheduler: slai
  enable_prefix_caching: true
