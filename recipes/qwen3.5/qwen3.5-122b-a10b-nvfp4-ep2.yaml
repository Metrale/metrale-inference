recipe_version: "2"
model: Sehyo/Qwen3.5-122B-A10B-NVFP4
runtime: metrale
container: metrale/metrale-inference-gb10:latest
min_nodes: 2
max_nodes: 2

metadata:
  description: |
    Qwen3.5-122B (A10B MoE) NVFP4, expert parallelism across two GB10 nodes
    via NCCL over RoCEv2. Validated end-to-end at ~51 tok/s decode (Metrale Engine
    QUICKSTART). Both ranks must carry the same `--speculative` and
    `--mtp-quantization` flags — the worker's MTP verify lands in the SSM
    layer otherwise (Metrale Engine-internal tracking: feedback_ep2_mtp_flags).
  maintainer: metrale
  category: agent
  model_params: 122B
  model_dtype: nvfp4
  quantization: nvfp4
  kv_dtype: fp8

defaults:
  # The --activation-quantization routing this recipe was measured under: each projection
  # picks its activation precision by row count, as before the flag existed. The
  # row-invariant modes (declared, bf16, fp8, nvfp4) are opt-in until evaluated.
  activation_quantization: adaptive
  # The --weight-quantization tier this recipe was measured under: FP8-declared layers
  # requantized to NVFP4, the engine as it ran before the tiers. `declared` (the
  # engine default) is not measured on this recipe.
  weight_quantization: nvfp4
  port: 8888
  host: 0.0.0.0
  ep_size: 2
  max_model_len: 4096
  max_batch_size: 1
  kv_cache_dtype: fp8
  gpu_memory_utilization: 0.70
  scheduler: slai
  speculative: true
  mtp_quantization: bf16
