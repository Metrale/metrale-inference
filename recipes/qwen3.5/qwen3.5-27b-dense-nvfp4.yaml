recipe_version: "2"
model: Kbenkhaled/Qwen3.5-27B-NVFP4
runtime: metrale
container: metrale/metrale-inference-gb10:latest
max_nodes: 1

metadata:
  description: |
    Qwen3.5-27B Dense — hybrid SSM + Attention, no MoE, no MTP.
    Best for quality-sensitive tasks where throughput is less critical
    (~14 tok/s decode at concurrency=1 per the Metrale Engine QUICKSTART).

    Note: the dense Qwen 27B variants (3.5 and 3.6) have a known
    post-`</think>` repetition attractor on long-code prompts (chess-game
    stress sweep, 2026-05-05). Metrale Engine ships with `enable_loop_watchdog =
    true` for these models in MODEL.toml — the period-N sentence-
    repetition detector in the scheduler catches it and ends generation
    cleanly. If you see `finish_reason: "length"` at low token counts on
    a repetitive output, that's the watchdog firing.
  maintainer: metrale
  category: agent
  model_params: 27B
  model_dtype: nvfp4
  quantization: nvfp4
  kv_dtype: fp8

defaults:
  # The --activation-quantization routing this recipe was measured under: each projection
  # picks its activation precision by row count, as before the flag existed. The
  # row-invariant modes (declared, bf16, fp8, nvfp4) are opt-in until evaluated.
  activation_quantization: adaptive
  # The --weight-quantization tier this recipe was measured under: FP8-declared layers
  # requantized to NVFP4, the engine as it ran before the tiers. `declared` (the
  # engine default) is not measured on this recipe.
  weight_quantization: nvfp4
  port: 8888
  host: 0.0.0.0
  max_model_len: 8192
  kv_cache_dtype: fp8
  gpu_memory_utilization: 0.85
  scheduler: slai
