recipe_version: "2"
model: nvidia/Qwen3.6-27B-NVFP4
runtime: metrale
container: metrale/metrale-inference-gb10:dev
max_nodes: 1

metadata:
  description: |
    Qwen3.6-27B (nvidia modelopt NVFP4, dense hybrid SSM+Attn) — the
    DEFAULT 27B recipe: the agentic + tool-calling config on a single
    GB10, at llama.cpp TTFT parity with the Metrale Engine decode win intact.

    Checkpoint choice: this recipe previously pointed at
    unsloth/Qwen3.6-27B-NVFP4. On 2026-07-10 unsloth re-quantized and
    re-uploaded that repo as a MIXED-PRECISION checkpoint — NVFP4 for
    layers 0-55, FP8 E4M3 with a per-row `weight_scale` for layers 56-63,
    plus FP8 linear_attn projections — which no Metrale Engine release could load
    ("Weight '...layers.56.mlp.gate_proj.weight_global_scale' not found in
    store", or "Expected FP32 for ...linear_attn.in_proj_qkv.weight_scale,
    got BF16"). Metrale Engine loads that layout in current releases, but the default
    recipes now track the nvidia checkpoint, whose on-disk format has been
    stable since 2026-06-12 and does not move under users. The unsloth
    build is still available as qwen3.6-27b-nvfp4-unsloth.

    num_drafts is pinned to 1 deliberately. `speculative: true` alone does
    NOT select the best MTP depth — it happens to coincide with
    MODEL.toml's `default_num_drafts = 1` here, but pin it so the recipe
    stays correct if that default moves. Measured on the 27B dense
    NVFP4 family: K=1 21.78 tok/s vs 14.25 no-spec (+53%); K=2 and K=3 are
    both worse. Do not raise it.

    Config notes:
    - ssm_cache_slots 128 / ssm_checkpoint_interval 32 is the validated
      pair; with the snapshot-eviction fix the interval no longer matters for the warm
      tail (16-token replay at interval 0 and 32 alike) — 32 keeps
      intra-turn checkpoints for branchy/partial-prefix reuse.
    - qwen3_coder parser with tool_grammar off is mandatory for
      parallel tool calls — grammar-constraining collapses them to 0.00.
    - bf16 KV at 32k context: the 27B quality gates were run with bf16 KV;
      fp8 KV frees memory for longer contexts but was not part of that
      validation.
    - The prior unsloth-checkpoint gate (2026-07-10, 1007-turn agentic e2e
      + BFCL ST-995 vs llama.cpp cfff1fc Q4_K_M) measured BFCL 89.59
      normalized, warm TTFT median 1403 ms vs llama 1431, TPOT 58.2 vs
      85.8 ms, 1.38x end-to-end wall. Those numbers belong to the unsloth
      checkpoint, not this one — see qwen3.6-27b-nvfp4-unsloth.

    REQUIRES metrale/metrale-inference-gb10:dev (>= 2026-07-10T19:18Z), which carries
    the SSM snapshot-eviction fix. Before it, deep
    conversations froze the warm-restore anchor and replayed up to 18.6k
    tokens/turn through the GDN layers (TTFT tail to 40 s). :latest lags —
    check the tag date before substituting.
  maintainer: metrale
  category: agent
  model_params: 27B
  model_dtype: nvfp4
  quantization: nvfp4
  kv_dtype: bf16

defaults:
  # The --activation-quantization routing this recipe was measured under: each projection
  # picks its activation precision by row count, as before the flag existed. The
  # row-invariant modes (declared, bf16, fp8, nvfp4) are opt-in until evaluated.
  activation_quantization: adaptive
  # The --weight-quantization tier this recipe was measured under: FP8-declared layers
  # requantized to NVFP4, the engine as it ran before the tiers. `declared` (the
  # engine default) is not measured on this recipe.
  weight_quantization: nvfp4
  port: 8888
  host: 0.0.0.0
  max_model_len: 32768
  max_batch_size: 1
  kv_cache_dtype: bf16
  gpu_memory_utilization: 0.85
  enable_prefix_caching: true
  ssm_cache_slots: 128
  ssm_checkpoint_interval: 32
  speculative: true
  # Measured optimum for the 27B dense NVFP4 family (see description).
  # `speculative: true` alone does not pick this — pin it.
  num_drafts: 1
  mtp_quantization: bf16
  tool_call_parser: qwen3_coder
  tool_grammar: off
  disable_thinking: true
  # --- explicit CLI defaults (owner directive 2026-10-05): pinned to today's met-serve
  # clap default so the resolved config is unchanged; see recipe::explicit for the SSOT list.
  block_size: 16
  content_loop_watchdog: auto
  default_min_p: 0.08
  default_top_n_sigma: 1
  dflash_window_size: 4096
  ep_size: 1
  expert_quantization: fp8
  forward: legacy
  fp8_kv_headroom: 2
  high_speed_swap_cache_blocks_per_seq: 64
  high_speed_swap_qd: 8
  high_speed_swap_rank: 32
  kv_high_precision_layers: 0
  lm_head_dtype: default
  marconi_min_tokens: 256
  max_loras: 8
  max_num_seqs: 128
  max_prefill_tokens: 8192
  mtp_vocab: 100000
  oom_guard_mb: 4096
  prompt_lookup_max_drafts: 8
  prompt_lookup_max_seqs: 8
  prompt_lookup_min_match: 8
  prompt_lookup_miss_backoff: 16
  prompt_lookup_ngram: 4
  prompt_lookup_shared_cache_scopes: 4
  request_timeout: 300
  scheduler: fifo
  scheduler_config: sync
  spec_cost_model: off
  ssm_batched_recurrent: auto
  ssm_decode_ring_slots: auto
  ssm_rollback_mode: snapshot
  swap_space_gb: 3
  tbt_deadline_ms: 100
  telemetry: off
  tensor_parallel: 1
  tool_max_tokens: 8192
  video_decode_timeout_s: 120
  video_ffmpeg_path: ffmpeg
  video_fps: 2
  video_max_frames: 768
  vision_max_pixels: 0
  vision_remote_image_max_mb: 20
  vision_remote_image_timeout_s: 10
