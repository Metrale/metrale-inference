recipe_version: "2"
model: nvidia/Qwen3.6-35B-A3B-NVFP4
runtime: metrale
container: metrale/metrale-inference-gb10:dev
max_nodes: 1

metadata:
  description: |
    Qwen3.6-35B-A3B (nvidia modelopt NVFP4) — the DEFAULT 35B recipe. MTP
    K=1 on a single GB10 with calibrated fp8 KV (256K context) and
    the agentic/tool-calling stack (qwen3_coder parser, tool grammar OFF).

    Checkpoint choice: this recipe previously pointed at
    unsloth/Qwen3.6-35B-A3B-NVFP4. On 2026-07-10 unsloth re-quantized and
    re-uploaded that repo as a MIXED-PRECISION checkpoint — NVFP4 for
    layers 0-31, FP8 E4M3 with a per-row `weight_scale` for the shared
    experts of layers 32-39 — which no Metrale Engine release could load ("Weight
    'model.language_model.layers.32.mlp.shared_expert.gate_proj.weight_global_scale'
    not found in store"). Metrale Engine loads that layout in current releases, but the
    default recipes now track the nvidia checkpoint, whose on-disk format
    has been stable since 2026-05-29 and does not move under users. The
    unsloth build is still available as qwen3.6-35b-a3b-nvfp4-unsloth.

    num_drafts is pinned to 1 deliberately. `speculative: true` on its own
    does NOT select an MTP depth — it falls back to MODEL.toml's
    `default_num_drafts`, so pin it explicitly. Re-measured on this
    checkpoint against metrale/metrale-inference-gb10:dev, N=10, single sequence,
    400-token greedy generation (2026-07-12):

      K=1     116.5 tok/s  (median; min 105.3, max 116.9)  <-- optimum
      no-spec  89.7 tok/s  (median; min  83.3, max  91.5)
      K=2      82.2 tok/s  (median; min  82.0, max  82.5)

    K=1 is +30% over no-spec. K=2 is an 8% LOSS — an MTP verify step costs
    ~2.4x a plain decode step but only lands ~1.3 accepted tokens, so the
    deeper draft never pays for itself. Do NOT raise this to 2: an earlier
    revision of this recipe did, on a stale measurement, and shipped a
    slowdown. The scheduler's MTP gate will still report ENABLED at K=2
    (it admits any depth whose verify multiplier is under the theoretical
    max acceptance, not the observed one), so "ENABLED" in the log is not
    evidence the depth is profitable — only a no-spec A/B is.

    Serving params: calibrated fp8 KV (this checkpoint ships no k/v
    scales, so calibration is required or Metrale Engine refuses to serve;
    validated 2026-06-06 — quality holds vs bf16 within N=10 noise),
    kv_high_precision_layers auto, slai scheduling, native bf16 MTP draft
    head (downcasting lowers draft acceptance). qwen3_coder with
    tool_grammar off is mandatory for parallel tool calls —
    grammar-constraining collapses them to 0.00 on BFCL.

    Requires metrale/metrale-inference-gb10:dev (>= 2026-07-10T19:18Z), which carries
    the SSM snapshot-eviction fix. Without it, deep multi-turn
    conversations freeze the warm-restore anchor and replay up to 18.6k
    tokens/turn through the GDN layers (TTFT tail to 40 s).
  maintainer: metrale
  category: agent
  model_params: 35B
  model_dtype: nvfp4
  quantization: nvfp4
  kv_dtype: fp8

defaults:
  # The --activation-quantization routing this recipe was measured under: each projection
  # picks its activation precision by row count, as before the flag existed. The
  # row-invariant modes (declared, bf16, fp8, nvfp4) are opt-in until evaluated.
  activation_quantization: adaptive
  # The --weight-quantization tier this recipe was measured under: FP8-declared layers
  # requantized to NVFP4, the engine as it ran before the tiers. `declared` (the
  # engine default) is not measured on this recipe.
  weight_quantization: nvfp4
  port: 8888
  host: 0.0.0.0
  # 256K: fp8 KV at 262144 needs only ~18.7 GB of pool (half the 37.4 GB
  # bf16 pool measured on the fp8-mtp flagship at 256K on 2026-07-18 —
  # identical 10-attention-layer layout), and NVFP4 weights are ~14 GB
  # smaller than FP8, so the fit is derived from that measurement, with
  # margin, rather than a separate live run.
  max_model_len: 262144
  kv_cache_dtype: fp8
  gpu_memory_utilization: 0.85
  scheduler: slai
  speculative: true
  # Measured optimum for this checkpoint (see description): K=1 = 116.5
  # tok/s vs 89.7 no-spec vs 82.2 at K=2. K=2 is a net LOSS — do not raise.
  num_drafts: 1
  # bf16 MTP draft head — loading it native maximizes draft acceptance;
  # nvfp4 head measured -1.3% with no accuracy benefit.
  mtp_quantization: bf16
  enable_prefix_caching: true
  # fp8 KV requires online K/V scale calibration on this checkpoint (no
  # shipped k/v scales) — without it, bare fp8 KV clips to E4M3 [-448,448]
  # and Metrale Engine refuses to serve. kv_high_precision_layers auto keeps
  # sink+output bf16.
  fp8_kv_calibration_tokens: 256
  kv_high_precision_layers: auto
  ssm_cache_slots: 128
  ssm_checkpoint_interval: 32
  tool_call_parser: qwen3_coder
  tool_grammar: off
  disable_thinking: true
  # --- explicit CLI defaults (owner directive 2026-10-05): pinned to today's met-serve
  # clap default so the resolved config is unchanged; see recipe::explicit for the SSOT list.
  block_size: 16
  content_loop_watchdog: auto
  default_min_p: 0.08
  default_top_n_sigma: 1
  dflash_window_size: 4096
  ep_size: 1
  expert_quantization: fp8
  forward: legacy
  fp8_kv_headroom: 2
  high_speed_swap_cache_blocks_per_seq: 64
  high_speed_swap_qd: 8
  high_speed_swap_rank: 32
  lm_head_dtype: default
  marconi_min_tokens: 256
  max_batch_size: 8
  max_loras: 8
  max_num_seqs: 128
  max_prefill_tokens: 8192
  mtp_vocab: 100000
  oom_guard_mb: 4096
  prompt_lookup_max_drafts: 8
  prompt_lookup_max_seqs: 8
  prompt_lookup_min_match: 8
  prompt_lookup_miss_backoff: 16
  prompt_lookup_ngram: 4
  prompt_lookup_shared_cache_scopes: 4
  request_timeout: 300
  scheduler_config: sync
  spec_cost_model: off
  ssm_batched_recurrent: auto
  ssm_decode_ring_slots: auto
  ssm_rollback_mode: snapshot
  swap_space_gb: 3
  tbt_deadline_ms: 100
  telemetry: off
  tensor_parallel: 1
  tool_max_tokens: 8192
  video_decode_timeout_s: 120
  video_ffmpeg_path: ffmpeg
  video_fps: 2
  video_max_frames: 768
  vision_max_pixels: 0
  vision_remote_image_max_mb: 20
  vision_remote_image_timeout_s: 10
  # --- explicit `met serve` state (owner directive 2026-10-05, extended): presence-only
  # flags pinned true/false, and no-clap-default flags pinned to the value they resolve to
  # today (MODEL.toml behavior / engine built-in constant / env-unset) -- see
  # recipe::explicit for the SSOT list, exclusions and the byte-identical resolution proof.
  adaptive_sampling: false
  auto_compact: 0
  auto_swap: false
  check_kernels: false
  content_loop_min_repeats: 3
  dangerously_allow_unresolved_kernel_lookups: false
  dflash: false
  disable_template_overrides: false
  exact_verify: false
  fast_load_prefetch_shards: false
  gdn_fused_norm: false
  hermetic: false
  high_speed_swap: false
  max_inter_tool_prose: 3072
  model_name: nvidia/Qwen3.6-35B-A3B-NVFP4
  mtp_experts_nvfp4: false
  mtp_gate: auto
  mtp_max_seqs: 128
  nemotron_shared_expert_e4m3: false
  ngram_speculative: false
  no_canonical_tiers: false
  no_fast_load: false
  no_high_speed_swap_graph: false
  no_ssm_tail_midchunk: false
  no_tui: false
  prefill_codispatch: false
  prefill_varlen_batch: false
  profile: false
  prompt_lookup_decoding: false
  require_auth: false
  self_speculative: false
  # Unread for this model_type (serve_load/adapters.rs::resolve_nllb_lang
  # branches on model_type in m2m_100|nllb only); placeholder, confirmed inert.
  src_lang: not-applicable-non-nllb-checkpoint
  ssm_h_dtype: f32
  tgt_lang: not-applicable-non-nllb-checkpoint
  video_allow_ffmpeg: false
  vision_allow_remote_images: false
  vision_remote_image_allow_private: false
  w4a4_downcast: false
  w4a4_downcast_wide: false
