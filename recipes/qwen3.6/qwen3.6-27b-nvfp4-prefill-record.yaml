recipe_version: "2"
model: nvidia/Qwen3.6-27B-NVFP4
runtime: metrale
container: metrale/metrale-inference-gb10:latest
max_nodes: 1

metadata:
  description: |
    Qwen3.6-27B (dense, NVIDIA mixed-precision NVFP4: MLP W4A16_NVFP4 gs16,
    attn/GDN projections FP8) with the 2026-07-02 prefill record stack.
    Cold prefill measured on a single GB10, solo, coherence 10/10:
      2k 1088 / 4k 1077 / 8k 1057 / 16k 982 / 29k 911 tok/s
    (1.24-1.75x llama.cpp Q4_K_M on identical prompts/probes; 16k TTFT
    28.6s -> 16.3s vs the pre-record baseline). Warm multi-turn TTFT
    median 2217-2253 ms via tail SSM checkpoints (beats llama.cpp's 2401
    on the identical 22-turn driver).

    REQUIRES a build carrying the 27B prefill-record stack
    (attn transposed-NVFP4 routing,
    FFN NVFP4 MMQ, FlashInfer-GDN AOT bridge, tail SSM
    checkpoints). Not yet in a tagged container release — until then,
    build the branch with METRALE_TARGET_MODEL=qwen3.6-27b
    METRALE_TARGET_QUANT=nvfp4.

    Env stack: export no METRALE_* variable for this recipe. The engine
    runs the FFN NVFP4 MMQ (FP4 block-scale MMQ for FFN gate/up) and the
    register-resident GDN warm replay by default (kill-switches
    METRALE_NO_FFN_NVFP4_MMQ and METRALE_NO_GDN_REGRESIDENT), and it
    declares no lever for the FlashInfer-GDN bridge. `met serve` refuses
    to start with an undeclared METRALE_* name in its environment.

    Checkpoint-interval note: with the tail-SSM-checkpoint fix, prefill
    chunks stay full-size at EVERY interval (the old interval=16
    256-token micro-chunking is gone) and warm restores work even at
    interval 0; 16 remains a good default for branchy/partial-prefix
    reuse. For DEEP multi-turn conversations (100+ turns) also require
    the snapshot-eviction fix (in :dev from 2026-07-11): without it the warm-restore anchor freezes and replays
    up to 18.6k tokens/turn regardless of interval. See the
    qwen3.6-27b-nvfp4-unsloth-agentic recipe for the validated agentic
    golden config.
  maintainer: metrale
  category: agent
  model_params: 27B
  model_dtype: nvfp4
  quantization: nvfp4
  kv_dtype: fp8

defaults:
  # The --activation-quantization routing this recipe was measured under: each projection
  # picks its activation precision by row count, as before the flag existed. The
  # row-invariant modes (declared, bf16, fp8, nvfp4) are opt-in until evaluated.
  activation_quantization: adaptive
  # The --weight-quantization tier this recipe was measured under: FP8-declared layers
  # requantized to NVFP4, the engine as it ran before the tiers. `declared` (the
  # engine default) is not measured on this recipe.
  weight_quantization: nvfp4
  port: 8888
  host: 0.0.0.0
  max_model_len: 36864
  max_batch_size: 1
  kv_cache_dtype: fp8
  kv_high_precision_layers: auto
  gpu_memory_utilization: 0.72
  enable_prefix_caching: true
  ssm_cache_slots: 256
  ssm_checkpoint_interval: 16
  tool_call_parser: hermes
  disable_thinking: true
  # --- explicit CLI defaults (owner directive 2026-10-05): pinned to today's met-serve
  # clap default so the resolved config is unchanged; see recipe::explicit for the SSOT list.
  block_size: 16
  content_loop_watchdog: auto
  default_min_p: 0.08
  default_top_n_sigma: 1
  dflash_window_size: 4096
  ep_size: 1
  expert_quantization: fp8
  forward: legacy
  fp8_kv_headroom: 2
  high_speed_swap_cache_blocks_per_seq: 64
  high_speed_swap_qd: 8
  high_speed_swap_rank: 32
  lm_head_dtype: default
  marconi_min_tokens: 256
  max_loras: 8
  max_num_seqs: 128
  max_prefill_tokens: 8192
  mtp_quantization: bf16
  mtp_vocab: 100000
  oom_guard_mb: 4096
  prompt_lookup_max_drafts: 8
  prompt_lookup_max_seqs: 8
  prompt_lookup_min_match: 8
  prompt_lookup_miss_backoff: 16
  prompt_lookup_ngram: 4
  prompt_lookup_shared_cache_scopes: 4
  request_timeout: 300
  scheduler: fifo
  scheduler_config: sync
  spec_cost_model: off
  ssm_batched_recurrent: auto
  ssm_decode_ring_slots: auto
  ssm_rollback_mode: snapshot
  swap_space_gb: 3
  tbt_deadline_ms: 100
  telemetry: off
  tensor_parallel: 1
  tool_grammar: auto
  tool_max_tokens: 8192
  video_decode_timeout_s: 120
  video_ffmpeg_path: ffmpeg
  video_fps: 2
  video_max_frames: 768
  vision_max_pixels: 0
  vision_remote_image_max_mb: 20
  vision_remote_image_timeout_s: 10
