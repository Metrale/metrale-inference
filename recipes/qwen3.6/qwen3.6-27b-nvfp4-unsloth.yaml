recipe_version: "2"
model: unsloth/Qwen3.6-27B-NVFP4
runtime: metrale
container: metrale/metrale-inference-gb10:latest
max_nodes: 1

metadata:
  description: |
    Qwen3.6-27B (unsloth NVFP4, dense hybrid SSM+Attn) — the BFCL / tool-calling
    checkpoint, and the config the `bfcl-subset` PR gate is measured under.

    Checkpoint choice is WORKLOAD-SPLIT, and this recipe exists because of it.
    For BFCL / function calling the unsloth checkpoint wins decisively: it
    reaches 87.44 overall / 88.59 normalized on the golden n=995 MLPerf draw,
    where the nvidia checkpoint has a hard ~82 BFCL ceiling — which is BELOW
    the 83.64 MLPerf floor. For agentic / IoU work the nvidia checkpoint is the
    better one; use qwen3.6-27b-nvfp4.yaml there. Never mix the two.

    ⚠ The unsloth repo was re-quantized IN PLACE on 2026-07-10 into a mixed
    precision layout (NVFP4 layers 0-55, FP8 E4M3 with a per-row weight_scale
    for 56-63, FP8 linear_attn projections). Metrale Engine loads that layout in
    current releases; older ones cannot. That in-place change is why the default
    27B recipes track nvidia, whose on-disk format has been stable since
    2026-06-12. This recipe is deliberately scoped to the BFCL gate.

    PROVENANCE OF THE FLAGS BELOW — read before changing any of them.

    These are the Gate-D golden serve flags, the config both high-water runs
    were taken under. Two honest caveats:

    1. `gpu_memory_utilization: 0.70` is what the one run with a RECORDED util
       actually used (2026-07-26 dgx2, a PR build, 87.34/88.59, n=995
       confirmed, 4753 s). The benchmark-pr skill's Gate D block writes 0.85.
       0.70 is used here because it is the value tied to a measured run rather
       than to prose. The 87.44 component's util is NOT recorded anywhere.
    2. The gate's ratchet is a COMPOSITE OF TWO RUNS: overall 87.44 comes from
       2026-07-13 prestack b45af988, normalized 88.59 from the 2026-07-26 PR build
       de6153f3. No single run produced both. This recipe reproduces the CONFIG
       those runs shared; it does not claim to reproduce either number exactly.

    Draw pinning lives on the client side, not here: the golden draw is
    62/10/10 with a 25-sample floor = exactly n=995, asserted in-tree by
    bfcl/draw_tests.rs::the_golden_draw_is_exactly_995.

  maintainer: metrale
  category: function-calling
  model_params: 27B dense hybrid (48 GDN linear-attn + 16 softmax-attn layers)
  quantization: NVFP4 (mixed precision above layer 55)
  kv_dtype: bf16
  updated: "2026-08-15"

defaults:
  # The --activation-quantization routing this recipe was measured under: each projection
  # picks its activation precision by row count, as before the flag existed. The
  # row-invariant modes (declared, bf16, fp8, nvfp4) are opt-in until evaluated.
  activation_quantization: adaptive
  # The --weight-quantization tier this recipe was measured under: FP8-declared layers
  # requantized to NVFP4, the engine as it ran before the tiers. `declared` (the
  # engine default) is not measured on this recipe.
  weight_quantization: nvfp4
  host: 0.0.0.0
  port: 8888
  max_model_len: 32768
  max_batch_size: 1
  gpu_memory_utilization: 0.70
  kv_cache_dtype: bf16
  enable_prefix_caching: true
  ssm_cache_slots: 128
  ssm_checkpoint_interval: 32
  speculative: true
  # ★ DETERMINISM PIN. See qwen3.6-35b-a3b-fp8-bf16head for the full
  # rationale. In `auto` the MTP gate switches MTP<->serial at runtime on
  # wall-clock tok/s, and speculation is not output-neutral at temperature 0
  # — so decode depends on box speed. This recipe backs Metrale Engine's BFCL ACCURACY
  # gates, which score at temp 0: an un-pinned arbiter moves the score itself,
  # not merely the wall time.
  mtp_gate: force
  num_drafts: 1
  mtp_quantization: bf16
  tool_call_parser: qwen3_coder
  tool_grammar: off
  disable_thinking: true
  # video-fidelity gate — this recipe is that gate's default serve (added
  # 2026-08-15). The MP4/MOV legs are decoded by the server shelling out to
  # ffmpeg, which stays OFF unless the serve pins it, and the certified
  # self-start refuses --serve-override for keys absent from these defaults —
  # so without this line every MP4 leg 400s and the gate goes red. Inert for
  # bfcl-subset and agentic, which send no video.
  video_allow_ffmpeg: true
  # --- explicit CLI defaults (owner directive 2026-10-05): pinned to today's met-serve
  # clap default so the resolved config is unchanged; see recipe::explicit for the SSOT list.
  block_size: 16
  content_loop_watchdog: auto
  default_min_p: 0.08
  default_top_n_sigma: 1
  dflash_window_size: 4096
  ep_size: 1
  expert_quantization: fp8
  forward: legacy
  fp8_kv_headroom: 2
  high_speed_swap_cache_blocks_per_seq: 64
  high_speed_swap_qd: 8
  high_speed_swap_rank: 32
  kv_high_precision_layers: 0
  lm_head_dtype: default
  marconi_min_tokens: 256
  max_loras: 8
  max_num_seqs: 128
  max_prefill_tokens: 8192
  mtp_vocab: 100000
  oom_guard_mb: 4096
  prompt_lookup_max_drafts: 8
  prompt_lookup_max_seqs: 8
  prompt_lookup_min_match: 8
  prompt_lookup_miss_backoff: 16
  prompt_lookup_ngram: 4
  prompt_lookup_shared_cache_scopes: 4
  request_timeout: 300
  scheduler: fifo
  scheduler_config: sync
  spec_cost_model: off
  ssm_batched_recurrent: auto
  ssm_decode_ring_slots: auto
  ssm_rollback_mode: snapshot
  swap_space_gb: 3
  tbt_deadline_ms: 100
  telemetry: off
  tensor_parallel: 1
  tool_max_tokens: 8192
  video_decode_timeout_s: 120
  video_ffmpeg_path: ffmpeg
  video_fps: 2
  video_max_frames: 768
  vision_max_pixels: 0
  vision_remote_image_max_mb: 20
  vision_remote_image_timeout_s: 10
  # --- explicit `met serve` state (owner directive 2026-10-05, extended): presence-only
  # flags pinned true/false, and no-clap-default flags pinned to the value they resolve to
  # today (MODEL.toml behavior / engine built-in constant / env-unset) -- see
  # recipe::explicit for the SSOT list, exclusions and the byte-identical resolution proof.
  adaptive_sampling: false
  auto_compact: 0
  auto_swap: false
  check_kernels: false
  content_loop_min_repeats: 3
  dangerously_allow_unresolved_kernel_lookups: false
  dflash: false
  disable_template_overrides: false
  exact_verify: false
  fast_load_prefetch_shards: false
  # 0 (not the checkpoint's declared value): this recipe's kv_cache_dtype is
  # not fp8, and calibration only feeds an FP8 KV cache -- validate_serve_args
  # refuses a non-zero value otherwise.
  fp8_kv_calibration_tokens: 0
  gdn_fused_norm: false
  hermetic: false
  high_speed_swap: false
  max_inter_tool_prose: 3072
  model_name: unsloth/Qwen3.6-27B-NVFP4
  mtp_experts_nvfp4: false
  mtp_max_seqs: 32
  nemotron_shared_expert_e4m3: false
  ngram_speculative: false
  no_canonical_tiers: false
  no_fast_load: false
  no_high_speed_swap_graph: false
  no_ssm_tail_midchunk: false
  no_tui: false
  prefill_codispatch: false
  prefill_varlen_batch: false
  profile: false
  prompt_lookup_decoding: false
  require_auth: false
  self_speculative: false
  # Unread for this model_type (serve_load/adapters.rs::resolve_nllb_lang
  # branches on model_type in m2m_100|nllb only); placeholder, confirmed inert.
  src_lang: not-applicable-non-nllb-checkpoint
  ssm_h_dtype: f32
  tgt_lang: not-applicable-non-nllb-checkpoint
  vision_allow_remote_images: false
  vision_remote_image_allow_private: false
  w4a4_downcast: false
  w4a4_downcast_wide: false
