recipe_version: "2"
model: Qwen/Qwen3.6-35B-A3B-FP8
runtime: metrale
container: metrale/metrale-inference-gb10:latest
max_nodes: 1

metadata:
  description: |
    Qwen3.6-35B-A3B (qwen3_5_moe) native FP8 on Metrale Engine, served with an NVFP4
    lm-head — the LOWER-VRAM, near-neutral-wall sibling of the bf16 flagship.
    Identical to qwen3.6-35b-a3b-fp8-bf16head-metrale except the 248K-vocab logit
    projection is packed to NVFP4 (4-bit), roughly quartering the single largest
    per-token weight read.

    Measured 2026-06-07 (opencode webserver_ok, N=10, same flags as bf16):
      nvfp4 lm-head : ws_ok 10/10  followed_dirs 10/10  Σwall 1380s / mean 138s,
                      min 79 / max 220, zero 360s cap-riders.
    Quality is indistinguishable from bf16 (both 10/10 on outcome AND process
    fidelity); total wall is within ~4% of bf16 (1380 vs 1331s) with a smaller
    weight footprint. WARNING: lowering lm-head precision is model-specific — it
    is SAFE on this checkpoint (verified) but can be catastrophic on others
    (argmax flips compound over long structured generation). Always re-gate with
    a long-generation harness before shipping nvfp4 lm-head on a new model.
  maintainer: metrale
  category: agent
  model_params: 35B
  model_dtype: fp8
  quantization: fp8
  kv_dtype: bf16

defaults:
  # The --activation-quantization mode: `declared`, the checkpoint's own activation format at
  # every row count, so a sequence's tokens do not depend on what shares its batch. Owner rule
  # 2026-10-01, applied 2026-10-02 after accuracy on this checkpoint: full BFCL draw (declared
  # 84.56/86.30 vs adaptive and main 84.36/86.12, N=1004 hermetic) and agentic-webserver 2/2.
  activation_quantization: declared
  # The --weight-quantization tier: `declared`, the checkpoint's own W8A8 (experts and
  # block-scaled attention/GDN decode). Owner decision 2026-09-29 on the full BFCL draw
  # (declared 84.56/86.40 vs nvfp4 85.16/86.15, N=1004 hermetic) and agentic 2/2.
  weight_quantization: declared
  port: 8888
  host: 0.0.0.0
  max_model_len: 32768
  kv_cache_dtype: bf16
  gpu_memory_utilization: 0.85
  scheduler: slai
  speculative: true
  mtp_quantization: bf16
  # 2026-10-03: Two MTP drafts at one or two active sequences, one from three up, D-Cut off.
  # Measured on dgx2 (MoE ladder harness, 3 interleaved fresh serves per arm): two drafts
  # raise tok/s AND lower J/tok at C1-C2 (+2.4%/-1.2%, +3.9%/-1.8%); at C4-C8 they trade
  # energy for speed (+1.9%/+1.0%, +1.6%/+2.8%), so those widths keep one draft until the
  # verify cost per row comes down. MODEL.toml has no ladder key, so it stays at one draft
  # (a bare serve runs one draft at every width) and these three keys carry the shape.
  num_drafts: 2
  mtp_k_ladder: "2:2,32:1"
  mtp_dcut_ratio: 1.0
  enable_prefix_caching: true
  # NVFP4 lm-head: 4-bit-packed 248K-vocab projection, in-register E2M1-LUT
  # dequant. ~1/4 the bf16 head's per-token read. Verified 10/10 on this model;
  # quality-gate per-model before reuse (see metadata warning).
  lm_head_dtype: nvfp4
  kv_high_precision_layers: auto
  # --- explicit CLI defaults (owner directive 2026-10-05): pinned to today's met-serve
  # clap default so the resolved config is unchanged; see recipe::explicit for the SSOT list.
  block_size: 16
  content_loop_watchdog: auto
  default_min_p: 0.08
  default_top_n_sigma: 1
  dflash_window_size: 4096
  ep_size: 1
  expert_quantization: fp8
  forward: legacy
  fp8_kv_headroom: 2
  high_speed_swap_cache_blocks_per_seq: 64
  high_speed_swap_qd: 8
  high_speed_swap_rank: 32
  marconi_min_tokens: 256
  max_batch_size: 8
  max_loras: 8
  max_num_seqs: 128
  max_prefill_tokens: 8192
  mtp_vocab: 100000
  oom_guard_mb: 4096
  prompt_lookup_max_drafts: 8
  prompt_lookup_max_seqs: 8
  prompt_lookup_min_match: 8
  prompt_lookup_miss_backoff: 16
  prompt_lookup_ngram: 4
  prompt_lookup_shared_cache_scopes: 4
  request_timeout: 300
  scheduler_config: sync
  spec_cost_model: off
  ssm_batched_recurrent: auto
  ssm_cache_slots: 16
  ssm_checkpoint_interval: 256
  ssm_decode_ring_slots: auto
  ssm_rollback_mode: snapshot
  swap_space_gb: 3
  tbt_deadline_ms: 100
  telemetry: off
  tensor_parallel: 1
  tool_grammar: auto
  tool_max_tokens: 8192
  video_decode_timeout_s: 120
  video_ffmpeg_path: ffmpeg
  video_fps: 2
  video_max_frames: 768
  vision_max_pixels: 0
  vision_remote_image_max_mb: 20
  vision_remote_image_timeout_s: 10
