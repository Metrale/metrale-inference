recipe_version: "2"
model: Qwen/Qwen3.6-35B-A3B-FP8
runtime: metrale
container: metrale/metrale-inference-gb10:latest
max_nodes: 1

metadata:
  description: |
    THE FLAGSHIP. Qwen3.6-35B-A3B (qwen3_5_moe architecture) at native FP8
    on the Metrale Engine runtime: bf16 lm-head (full-precision 248K-vocab logit
    projection), bf16 KV cache, 256K context, MTP K=2 speculative decoding,
    live-streamed tool-call argument deltas. Single GB10 (~105 of 119.7 GB).

    Config rationale (gate-measured, opencode webserver_ok harness, N=10):
      - bf16 lm-head: ws_ok 10/10, tightest wall distribution of the
        lm-head dtype A/B (vs nvfp4/fp8 heads, 2026-06-07).
      - bf16 KV: faster (~2-3%) AND higher quality than calibrated fp8 KV
        at agentic lengths; fp8 KV is a memory-only lever for ~128K.
      - Re-verified post --lm-head-dtype merge 2026-06-09: 10/10 ws_ok,
        10/10 followed_directions.
      - 256K context live-validated 2026-07-18 on a single GB10: bf16 KV
        pool sizes to 37.4 GB across the 10 attention layers (122595
        blocks), ~105 GB steady-state inside the 107.1 GB budget at 0.88
        util; serve ready in ~35 s (fast-load), coherence + tool-call
        smokes green cross-node.
      - 2026-10-02: util lowered to the GB10 ceiling 0.85 (kernels/gb10/
        HARDWARE.toml). `met circuit memory` puts the bf16 KV pool at
        about 123k blocks there; 2 x 256K needs 32,771.
  maintainer: metrale
  category: agent
  model_params: 35B
  model_dtype: fp8
  quantization: fp8
  kv_dtype: bf16

defaults:
  # The --activation-quantization routing this recipe was measured under: each projection
  # picks its activation precision by row count, as before the flag existed. The
  # row-invariant modes (declared, bf16, fp8, nvfp4) are opt-in until evaluated.
  activation_quantization: adaptive
  # The --weight-quantization tier: `declared`, the checkpoint's own W8A8 (experts and
  # block-scaled attention/GDN decode). Owner decision 2026-09-29 on the full BFCL draw
  # (declared 84.56/86.40 vs nvfp4 85.16/86.15, N=1004 hermetic) and agentic 2/2.
  weight_quantization: declared
  port: 8888
  host: 0.0.0.0
  # 256K with bf16 KV fits next to the FP8 weights on one GB10: the KV
  # pool is only 37.4 GB because just 10 of the 40 layers are attention
  # (~105 GB steady of the 107.1 GB budget at 0.88 util). Live-validated
  # 2026-07-18 incl. tool calls. (Old 64K profile: ~109/119.7 GB,
  # 2026-06-09.)
  max_model_len: 262144
  # max_batch_size 2: REQUIRED until the deep-context concurrency fix lands —
  # an uncapped batch hits the concurrency>=4 + deep-context CUDA-700 crash
  # (re-confirmed live 2026-06-11 at n_decode=2 + n_prefill=2, ~8.5K ctx).
  # The old warning here against capping (SSM slot-leak on aborted deep
  # prefill) is obsolete: that slot leak was fixed (slot-release-first
  # ordering in free_sequence). The cap also matches the gate-measured
  # fast path (mixed-batch scheduling overhead avoided).
  max_batch_size: 2
  # Single-chunk prefill up to 32K: chunked (4096) prefill is slower and
  # was the surface of the (since fixed) warm-turn suffix-token bug.
  # Prompts >32K still chunk safely.
  max_prefill_tokens: 32768
  kv_cache_dtype: bf16
  kv_high_precision_layers: auto
  gpu_memory_utilization: 0.85
  scheduler: slai
  speculative: true
  mtp_quantization: bf16
  # 2026-10-03: Two MTP drafts at one or two active sequences, one from three up, D-Cut off.
  # Measured on dgx2 (MoE ladder harness, 3 interleaved fresh serves per arm): two drafts
  # raise tok/s AND lower J/tok at C1-C2 (+2.4%/-1.2%, +3.9%/-1.8%); at C4-C8 they trade
  # energy for speed (+1.9%/+1.0%, +1.6%/+2.8%), so those widths keep one draft until the
  # verify cost per row comes down. MODEL.toml has no ladder key, so it stays at one draft
  # (a bare serve runs one draft at every width) and these three keys carry the shape.
  num_drafts: 2
  mtp_k_ladder: "2:2,32:1"
  mtp_dcut_ratio: 1.0
  # Prefix caching: the warm-restore corruption is fixed in the engine
  # (warm-turn suffix tokens, decode-ckpt registration
  # off-by-one, snapshot eviction inversion, finish-leaf commit race).
  # Gate 2026-06-11: webserver_ok 10/10, zero path-drift, median run
  # ~125s with caching ON + MTP K=2 (image digest 637e7b32).
  enable_prefix_caching: true
  # ssm_cache_slots MUST be pinned: the Marconi slot pool is an LRU region and
  # the built-in default (16) churns under multi-turn agentic load (~4-6 snapshot
  # saves/turn at 17k ctx) — the fresh tail/leaf checkpoint gets evicted before the
  # next turn's lookup ("Prefix cache hit: N tokens but no SSM snapshot" → full SSM
  # recompute, warm TTFT 15s+). Diagnosed 2026-07-02 (webserver_ok gate, snapshot-id
  # recycling 10/13/13/10 in the serve log). 256 holds a full session comfortably.
  ssm_cache_slots: 256
  # bf16 lm-head: the 248K-vocab projection stays full-precision (the
  # single largest per-token weight read). Argmax over the vocab is exact.
  lm_head_dtype: bf16
  oom_guard_mb: 1024
  # --- explicit CLI defaults (owner directive 2026-10-05): pinned to today's met-serve
  # clap default so the resolved config is unchanged; see recipe::explicit for the SSOT list.
  block_size: 16
  content_loop_watchdog: auto
  default_min_p: 0.08
  default_top_n_sigma: 1
  dflash_window_size: 4096
  ep_size: 1
  expert_quantization: fp8
  forward: legacy
  fp8_kv_headroom: 2
  high_speed_swap_cache_blocks_per_seq: 64
  high_speed_swap_qd: 8
  high_speed_swap_rank: 32
  marconi_min_tokens: 256
  max_loras: 8
  max_num_seqs: 128
  mtp_vocab: 100000
  prompt_lookup_max_drafts: 8
  prompt_lookup_max_seqs: 8
  prompt_lookup_min_match: 8
  prompt_lookup_miss_backoff: 16
  prompt_lookup_ngram: 4
  prompt_lookup_shared_cache_scopes: 4
  request_timeout: 300
  scheduler_config: sync
  spec_cost_model: off
  ssm_batched_recurrent: auto
  ssm_checkpoint_interval: 256
  ssm_decode_ring_slots: auto
  ssm_rollback_mode: snapshot
  swap_space_gb: 3
  tbt_deadline_ms: 100
  telemetry: off
  tensor_parallel: 1
  tool_grammar: auto
  tool_max_tokens: 8192
  video_decode_timeout_s: 120
  video_ffmpeg_path: ffmpeg
  video_fps: 2
  video_max_frames: 768
  vision_max_pixels: 0
  vision_remote_image_max_mb: 20
  vision_remote_image_timeout_s: 10
  # --- explicit `met serve` state (owner directive 2026-10-05, extended): presence-only
  # flags pinned true/false, and no-clap-default flags pinned to the value they resolve to
  # today (MODEL.toml behavior / engine built-in constant / env-unset) -- see
  # recipe::explicit for the SSOT list, exclusions and the byte-identical resolution proof.
  adaptive_sampling: false
  auto_compact: 0
  auto_swap: false
  check_kernels: false
  content_loop_min_repeats: 3
  dangerously_allow_unresolved_kernel_lookups: false
  dflash: false
  disable_template_overrides: false
  disable_thinking: false
  exact_verify: false
  fast_load_prefetch_shards: false
  # 0 (not the checkpoint's declared value): this recipe's kv_cache_dtype is
  # not fp8, and calibration only feeds an FP8 KV cache -- validate_serve_args
  # refuses a non-zero value otherwise.
  fp8_kv_calibration_tokens: 0
  gdn_fused_norm: false
  hermetic: false
  high_speed_swap: false
  max_inter_tool_prose: 3072
  model_name: Qwen/Qwen3.6-35B-A3B-FP8
  mtp_experts_nvfp4: false
  mtp_gate: auto
  mtp_max_seqs: 128
  nemotron_shared_expert_e4m3: false
  ngram_speculative: false
  no_canonical_tiers: false
  no_fast_load: false
  no_high_speed_swap_graph: false
  no_ssm_tail_midchunk: false
  no_tui: false
  prefill_codispatch: false
  prefill_varlen_batch: false
  profile: false
  prompt_lookup_decoding: false
  require_auth: false
  self_speculative: false
  # Unread for this model_type (serve_load/adapters.rs::resolve_nllb_lang
  # branches on model_type in m2m_100|nllb only); placeholder, confirmed inert.
  src_lang: not-applicable-non-nllb-checkpoint
  ssm_h_dtype: f32
  tgt_lang: not-applicable-non-nllb-checkpoint
  video_allow_ffmpeg: false
  vision_allow_remote_images: false
  vision_remote_image_allow_private: false
  w4a4_downcast: false
  w4a4_downcast_wide: false
