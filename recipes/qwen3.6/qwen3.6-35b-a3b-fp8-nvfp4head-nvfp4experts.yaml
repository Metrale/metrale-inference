recipe_version: "2"
model: Qwen/Qwen3.6-35B-A3B-FP8
runtime: metrale
container: metrale/metrale-inference-gb10:latest
max_nodes: 1

metadata:
  description: |
    Qwen3.6-35B-A3B (qwen3_5_moe) native FP8 on Metrale Engine with an NVFP4 lm-head
    and the MoE experts requantized to NVFP4 at load (--moe-nvfp4-experts): the
    faster, lower-accuracy sibling of qwen3.6-35b-a3b-fp8-nvfp4head. Every other
    setting is that recipe's, except gpu_memory_utilization at the GB10 ceiling of 0.85.

    ACCURACY TRADE-OFF: the flag adds a 4-bit NVFP4 copy of the routed experts and
    decodes with it; the shared expert and prefill stay FP8. Decode reads half the
    routed-expert bytes and runs faster, but the model's answers change. Measured
    2026-09-27 on GB10 with canonical tiers, BFCL echolp shard 1/4 (N=253),
    overall/normalized: FP8 experts 85.38/87.72, NVFP4 experts 86.56/88.86.
    agentic-webserver passed 10/10 but ran 168 turns and 774 s summed wall
    (FP8 experts: 128 turns, 545 s), over that gate's 700 s ceiling.
    Use qwen3.6-35b-a3b-fp8-nvfp4head where accuracy matters.
  maintainer: metrale
  category: agent
  model_params: 35B
  model_dtype: fp8
  quantization: fp8
  kv_dtype: bf16

defaults:
  port: 8888
  host: 0.0.0.0
  max_model_len: 32768
  kv_cache_dtype: bf16
  gpu_memory_utilization: 0.85
  scheduler: slai
  speculative: true
  mtp_quantization: bf16
  enable_prefix_caching: true
  # NVFP4 lm-head: 4-bit-packed 248K-vocab projection, in-register E2M1-LUT
  # dequant. ~1/4 the bf16 head's per-token read. Verified 10/10 on this model;
  # quality-gate per-model before reuse (see metadata warning).
  lm_head_dtype: nvfp4
  kv_high_precision_layers: auto
  # NVFP4 experts: requantized from FP8 at load; lower expert precision, answers
  # change (BFCL per shard in the metadata).
  moe_nvfp4_experts: true
