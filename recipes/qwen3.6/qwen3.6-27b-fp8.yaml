recipe_version: "2"
model: Qwen/Qwen3.6-27B-FP8
runtime: metrale
container: metrale/metrale-inference-gb10:latest
max_nodes: 1

metadata:
  description: |
    Qwen3.6-27B (dense, native FP8) on the Metrale Engine runtime, at the
    full 262,144-token context, two sequences, BF16 KV cache. No MTP.

    Precision (`weight_quantization: declared`, the checkpoint's own FP8):
    the GDN projections serve their block-scaled FP8 weights (W8A16, prefill
    and decode), and attention prefill reads the FP8 weights (W8A16).
    Attention decode and every dense-FFN projection run from NVFP4 copies
    requantized at load, with 16-bit activations: those paths have no
    per-row FP8 decode arm yet. That is below the declared FP8 weights, and
    the load log says so.

    KV cache: BF16. The checkpoint ships no K/V scales, so an FP8 KV cache
    would run at scale 1.0 (uncalibrated) unless calibrated online. On a
    GB10 boot (2026-09-30) BF16 still holds 733,664 KV tokens at util 0.85,
    above the 524,288 two full-length sequences need; it answered a 98k-token
    three-needle passkey probe 3/3 with a prefill 19% faster than FP8 KV
    (117 s vs 145 s); decode speed was unchanged.
  maintainer: metrale
  category: chat
  model_params: 27B
  model_dtype: fp8
  quantization: fp8
  kv_dtype: bf16

defaults:
  # The --activation-quantization routing this recipe was measured under: each projection
  # picks its activation precision by row count, as before the flag existed. The
  # row-invariant modes (declared, bf16, fp8, nvfp4) are opt-in until evaluated.
  activation_quantization: adaptive
  # 2026-09-30: The checkpoint's declared FP8, the engine default, which states the precision
  # the checkpoint declares. Booted on GB10 under both tiers: the same load paths (the NVFP4
  # requantization above happens under both) and the same greedy replies and tool call.
  # Single-stream decode read 8-10% slower than `nvfp4` there (11.5-22.2 vs 12.8-24.5 tok/s over
  # five short greedy replies each, one box; not a benchmark, cause not yet isolated).
  weight_quantization: declared
  port: 8888
  host: 0.0.0.0
  max_model_len: 262144
  max_batch_size: 2
  max_num_seqs: 2
  # 2026-09-30: BF16, not FP8. This checkpoint ships no K/V scales, so FP8 KV ran uncalibrated
  # at scale 1.0. Measured on GB10 (plain recipe, declared, util 0.85): BF16, FP8 with
  # `--fp8-kv-calibration-tokens 256`, and uncalibrated FP8 all passed 32k and 98k three-needle
  # passkey probes 3/3. Of four short greedy replies, uncalibrated FP8 diverged from BF16 on
  # one, and calibrated FP8 matched BF16 on all four. BF16 prefilled the 98k prompt in 117 s
  # against 145 s for either FP8 KV, decode was unchanged, and its 733,664-token KV pool
  # covers two full 262,144-token sequences.
  kv_cache_dtype: bf16
  gpu_memory_utilization: 0.85
  scheduler: slai
  mtp_quantization: bf16
  enable_prefix_caching: true
  oom_guard_mb: 1024
  # --- explicit CLI defaults (owner directive 2026-10-05): pinned to today's met-serve
  # clap default so the resolved config is unchanged; see recipe::explicit for the SSOT list.
  block_size: 16
  content_loop_watchdog: auto
  default_min_p: 0.08
  default_top_n_sigma: 1
  dflash_window_size: 4096
  ep_size: 1
  expert_quantization: fp8
  forward: legacy
  fp8_kv_headroom: 2
  high_speed_swap_cache_blocks_per_seq: 64
  high_speed_swap_qd: 8
  high_speed_swap_rank: 32
  kv_high_precision_layers: 0
  lm_head_dtype: default
  marconi_min_tokens: 256
  max_loras: 8
  max_prefill_tokens: 8192
  mtp_vocab: 100000
  prompt_lookup_max_drafts: 8
  prompt_lookup_max_seqs: 8
  prompt_lookup_min_match: 8
  prompt_lookup_miss_backoff: 16
  prompt_lookup_ngram: 4
  prompt_lookup_shared_cache_scopes: 4
  request_timeout: 300
  scheduler_config: sync
  spec_cost_model: off
  ssm_batched_recurrent: auto
  ssm_cache_slots: 16
  ssm_checkpoint_interval: 256
  ssm_decode_ring_slots: auto
  ssm_rollback_mode: snapshot
  swap_space_gb: 3
  tbt_deadline_ms: 100
  telemetry: off
  tensor_parallel: 1
  tool_grammar: auto
  tool_max_tokens: 8192
  video_decode_timeout_s: 120
  video_ffmpeg_path: ffmpeg
  video_fps: 2
  video_max_frames: 768
  vision_max_pixels: 0
  vision_remote_image_max_mb: 20
  vision_remote_image_timeout_s: 10
