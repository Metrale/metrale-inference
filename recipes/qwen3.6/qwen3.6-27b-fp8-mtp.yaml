recipe_version: "2"
model: Qwen/Qwen3.6-27B-FP8
runtime: metrale
# :dev, NOT :latest — load-bearing, see description. On :latest this model
# serves at 5 tok/s no matter what num_drafts says (MTP buys nothing there).
container: metrale/metrale-inference-gb10:dev
max_nodes: 1

metadata:
  description: |
    Qwen3.6-27B (dense, native FP8) on the Metrale Engine runtime, with the
    upstream-bundled MTP draft head (mtp.safetensors, FP8 e4m3 linear +
    BF16 norms) enabled at K=1. KV stays BF16 (FP8/NVFP4 KV breaks dense
    attention — request timeouts + CUDA graph thrash). max_model_len
    capped at 60_000 so the full spark-arena-v2 concurrency=10 sweep fits
    in the KV pool on a single GB10; cells at depth=65535/100000 in
    spark-arena-v2 will be skipped because they exceed max_model_len. Use
    --tp 2 / EP=2 to get the full long-context sweep.

    TWO settings here are load-bearing and BOTH are required to get more
    than 5 tok/s: `num_drafts: 1` and `container: :dev`. Either one alone
    gives you 5. Measured on a GB10, N=10, single sequence, 400-token
    greedy generation (2026-07-12):

      image      no-spec    K=1      K=2
      :dev        5.0      15.6      5.0     <-- use this, at K=1
      :latest     4.9       5.0       -

    So the earlier "too slow to complete the benchmark" report had two
    causes stacked: this recipe implied K=2, AND it pinned :latest. At
    5 tok/s a long spark-arena sweep never finishes.

    Note what the table says: on :latest, MTP buys NOTHING (5.0 with or
    without it) — the speculative machinery is present but the win is not.
    The 3x lives entirely in :dev.

    And the 3x is NOT ordinary speculation — K=1 accepts at most 2 tokens
    per step, a 2x ceiling. Dense-FP8 DECODE is the real bottleneck: it
    runs the unfused per-projection `w8a16_gemv` path and is badly
    memory-bound. At K=1 each step verifies 2 tokens and so routes through
    the batched tensor-core `w8a16_gemm` instead — the step yields ~2
    tokens AND costs less per token, which is how it clears the 2x
    ceiling. K=2's deeper verify overhead outweighs its acceptance and
    collapses back to the GEMV-bound rate.

    Implication: 15.6 tok/s is a kernel artifact, not a model ceiling. A
    fused FP8 dual-GEMV decode kernel would raise the no-spec floor and
    change every number in that table. Do not read 15.6 as "this model's
    speed".

    Precision (`weight_quantization: declared`, the checkpoint's own FP8):
    the GDN projections serve their block-scaled FP8 weights (W8A16, prefill
    and decode), and attention prefill reads the FP8 weights (W8A16).
    Attention decode and every dense-FFN projection run from NVFP4 copies
    requantized at load, with 16-bit activations: those paths have no
    per-row FP8 decode arm yet. That is below the declared FP8 weights, and
    the load log says so. The MTP head's projections are FP8 e4m3, and the
    draft-only LM head is NVFP4. The table above predates the tiers.
  maintainer: metrale
  category: chat
  model_params: 27B
  model_dtype: fp8
  quantization: fp8
  kv_dtype: bf16

defaults:
  # The --activation-quantization routing this recipe was measured under: each projection
  # picks its activation precision by row count, as before the flag existed. The
  # row-invariant modes (declared, bf16, fp8, nvfp4) are opt-in until evaluated.
  activation_quantization: adaptive
  # 2026-09-30: The checkpoint's declared FP8, the engine default, which states the precision
  # the checkpoint declares. Booted on GB10 under both tiers with MTP at K=1: the same load
  # paths (the NVFP4 requantization in the description happens under both) and the same greedy
  # replies and tool call.
  # Single-stream decode read 8-10% slower than `nvfp4` there (19.0-20.4 vs 21.2-23.1 tok/s over
  # five short greedy replies each, one box; not a benchmark, cause not yet isolated).
  weight_quantization: declared
  port: 8888
  host: 0.0.0.0
  # 60k, not 262144: the full spark-arena-v2 concurrency=10 sweep has to
  # fit in the KV pool on a single GB10. At 262144 the pool is oversized,
  # the sweep never completes, and the benchmark stalls out.
  max_model_len: 60000
  max_batch_size: 2
  max_num_seqs: 2
  # bf16, NOT fp8: FP8/NVFP4 KV breaks dense attention on this model —
  # request timeouts + CUDA-graph thrash. (`kv_high_precision_layers` is
  # an fp8-KV knob and is intentionally absent.)
  kv_cache_dtype: bf16
  gpu_memory_utilization: 0.85
  scheduler: slai
  speculative: true
  # K=1, MEASURED (see description): 15.6 tok/s vs 5.0 at K=2 vs 4.9
  # no-spec, N=10. K=2 is a 3x REGRESSION here — do not raise it.
  # `speculative: true` alone does not pin a depth; it falls back to
  # MODEL.toml's default_num_drafts.
  num_drafts: 1
  mtp_quantization: bf16
  enable_prefix_caching: true
  oom_guard_mb: 1024
  # --- explicit CLI defaults (owner directive 2026-10-05): pinned to today's met-serve
  # clap default so the resolved config is unchanged; see recipe::explicit for the SSOT list.
  block_size: 16
  content_loop_watchdog: auto
  default_min_p: 0.08
  default_top_n_sigma: 1
  dflash_window_size: 4096
  ep_size: 1
  expert_quantization: fp8
  forward: legacy
  fp8_kv_headroom: 2
  high_speed_swap_cache_blocks_per_seq: 64
  high_speed_swap_qd: 8
  high_speed_swap_rank: 32
  kv_high_precision_layers: 0
  lm_head_dtype: default
  marconi_min_tokens: 256
  max_loras: 8
  max_prefill_tokens: 8192
  mtp_vocab: 100000
  prompt_lookup_max_drafts: 8
  prompt_lookup_max_seqs: 8
  prompt_lookup_min_match: 8
  prompt_lookup_miss_backoff: 16
  prompt_lookup_ngram: 4
  prompt_lookup_shared_cache_scopes: 4
  request_timeout: 300
  scheduler_config: sync
  spec_cost_model: off
  ssm_batched_recurrent: auto
  ssm_cache_slots: 16
  ssm_checkpoint_interval: 256
  ssm_decode_ring_slots: auto
  ssm_rollback_mode: snapshot
  swap_space_gb: 3
  tbt_deadline_ms: 100
  telemetry: off
  tensor_parallel: 1
  tool_grammar: auto
  tool_max_tokens: 8192
  video_decode_timeout_s: 120
  video_ffmpeg_path: ffmpeg
  video_fps: 2
  video_max_frames: 768
  vision_max_pixels: 0
  vision_remote_image_max_mb: 20
  vision_remote_image_timeout_s: 10
  # --- explicit `met serve` state (owner directive 2026-10-05, extended): presence-only
  # flags pinned true/false, and no-clap-default flags pinned to the value they resolve to
  # today (MODEL.toml behavior / engine built-in constant / env-unset) -- see
  # recipe::explicit for the SSOT list, exclusions and the byte-identical resolution proof.
  adaptive_sampling: false
  auto_compact: 0
  auto_swap: false
  check_kernels: false
  content_loop_min_repeats: 3
  dangerously_allow_unresolved_kernel_lookups: false
  dflash: false
  disable_template_overrides: false
  disable_thinking: false
  exact_verify: false
  fast_load_prefetch_shards: false
  # 0 (not the checkpoint's declared value): this recipe's kv_cache_dtype is
  # not fp8, and calibration only feeds an FP8 KV cache -- validate_serve_args
  # refuses a non-zero value otherwise.
  fp8_kv_calibration_tokens: 0
  gdn_fused_norm: false
  hermetic: false
  high_speed_swap: false
  max_inter_tool_prose: 3072
  model_name: Qwen/Qwen3.6-27B-FP8
  mtp_experts_nvfp4: false
  mtp_gate: auto
  mtp_max_seqs: 32
  nemotron_shared_expert_e4m3: false
  ngram_speculative: false
  no_canonical_tiers: false
  no_fast_load: false
  no_high_speed_swap_graph: false
  no_ssm_tail_midchunk: false
  no_tui: false
  prefill_codispatch: false
  prefill_varlen_batch: false
  profile: false
  prompt_lookup_decoding: false
  require_auth: false
  self_speculative: false
  # Unread for this model_type (serve_load/adapters.rs::resolve_nllb_lang
  # branches on model_type in m2m_100|nllb only); placeholder, confirmed inert.
  src_lang: not-applicable-non-nllb-checkpoint
  ssm_h_dtype: f32
  tgt_lang: not-applicable-non-nllb-checkpoint
  video_allow_ffmpeg: false
  vision_allow_remote_images: false
  vision_remote_image_allow_private: false
  w4a4_downcast: false
  w4a4_downcast_wide: false
