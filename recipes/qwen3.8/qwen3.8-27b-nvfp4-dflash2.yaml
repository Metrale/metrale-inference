recipe_version: "2"
model: unsloth/Qwen3.8-27B-NVFP4
runtime: metrale
container: metrale/metrale-inference-gb10:latest
max_nodes: 1

metadata:
  description: |
    Qwen3.8-27B (unsloth NVFP4) served with the DFlash2 block-diffusion
    drafter — the config the `concurrency-sweep-dflash2` gate is measured
    under, and the only recipe in this repo that speculates with DFlash
    rather than MTP.

    DFlash2 (inco.ai, 2026-08-18) adds two things to the DFlash drafter:
    grouped dynamic two-tap causal convolutions around every attention and
    MLP sublayer, and a candidate-selector tail that replaces per-row argmax
    with a coherent path walk over top-16 candidates. Metrale Engine arms it
    automatically when the drafter checkpoint ships the components and the
    kernels are compiled for the target; there is no `--dflash2` flag.

    ⚠ THE DRAFTER IS NOT INTERCHANGEABLE. A DFlash drafter is trained against
    one target's hidden states — incoai/Qwen3.8-27B-DFlash2 consumes
    Qwen3.8-27B layers [5, 19, 33, 47, 61]. Pointed at other weights it does
    not fail; it degrades to near-zero acceptance and decodes SLOWER than no
    speculation at all. That is why `draft_model` is pinned here by full id
    instead of relying on the target MODEL.toml fallback.

    ⚠ dflash_gamma IS NOT OPTIONAL. `--dflash-gamma` has a CLI default of 16,
    which shadows the drafter's own `dflash_config.block_size` of 8. Serving
    this drafter at gamma 16 measured 0% accept on every verify step and
    sized its per-sequence pools for twice the block it can ever use. The 8
    below is the drafter's trained value, not a tuning choice.

    ⚠ MTP AND DFLASH ARE MUTUALLY EXCLUSIVE. `--dflash` is declared
    `conflicts_with = "speculative"`, so this recipe deliberately carries no
    `speculative:` / `num_drafts:` / `mtp_quantization:` keys. Its sibling
    qwen3.8-27b-nvfp4-unsloth.yaml is the MTP profile; the two are the two
    speculation lanes for the same weights and are not comparable to each
    other on throughput.

    ★ CONCURRENCY: expect this to stop speculating at the wide rungs. The
    batched verify path is bounded by the verify row cap over gamma-sized
    rows per sequence, so above that width the served engine is the base
    engine. The gate records that convergence rather than hiding it.
  maintainer: metrale
  category: interactive
  quantization: NVFP4 (compressed-tensors, mixed precision)
  updated: "2026-09-30"
  tags:
    - qwen3.8
    - nvfp4
    - dflash2
    - speculative
    - gate

defaults:
  # The --activation-quantization routing this recipe was measured under: each projection
  # picks its activation precision by row count, as before the flag existed. The
  # row-invariant modes (declared, bf16, fp8, nvfp4) are opt-in until evaluated.
  activation_quantization: adaptive
  # The --weight-quantization tier this recipe was measured under: FP8-declared layers
  # requantized to NVFP4, the engine as it ran before the tiers. `declared` (the
  # engine default) is not measured on this recipe.
  weight_quantization: nvfp4
  host: 0.0.0.0
  port: 8888
  # The concurrency instrument's operating point, matched to the plain
  # concurrency gate's serve pin so the two ladders differ in ONE axis.
  # 4096 leaves >4x headroom over the fixture's ~832-token sequences.
  max_model_len: 4096
  # 16, the concurrency-sweep-dflash2 gate's pin and the widest rung it
  # measures. 128 does not boot on GB10: the DFlash verify pools are
  # gamma-sized, and at 128 preflight refuses with "No memory left for KV
  # cache" (GB10, 2026-09-30: 57.8 GB consumed + a 67.1 GB inference reserve
  # against the 103.4 GB budget at util 0.85).
  max_batch_size: 16
  # 0.85 is the ceiling on GB10 — 0.90 has frozen a box and needed a
  # powercycle. Do not raise it to buy drafter headroom; lower the batch.
  gpu_memory_utilization: 0.85
  # fp8 KV halves the per-sequence KV bytes, which is what this profile
  # spends on concurrent sequences. The bf16 pin in the agentic sibling is a
  # <=32K single-stream reproduction pin and does not apply here.
  kv_cache_dtype: fp8
  # Correctness pin inherited from the agentic profile: exact argmax over the
  # 248K vocab. It is not a throughput knob and must not be lowered to make
  # room for the drafter.
  lm_head_dtype: bf16
  kv_high_precision_layers: auto
  scheduler: slai
  enable_prefix_caching: true
  # 32, the gate's pin: it covers every sequence of the 16-wide batch twice
  # over. Each slot holds one full per-sequence SSM blob.
  ssm_cache_slots: 32
  ssm_checkpoint_interval: 16
  # ── DFlash2 ──
  dflash: true
  draft_model: incoai/Qwen3.8-27B-DFlash2
  # The drafter's own trained block size. See the warning above.
  dflash_gamma: 8
  # --- explicit CLI defaults (owner directive 2026-10-05): pinned to today's met-serve
  # clap default so the resolved config is unchanged; see recipe::explicit for the SSOT list.
  block_size: 16
  content_loop_watchdog: auto
  default_min_p: 0.08
  default_top_n_sigma: 1
  dflash_window_size: 4096
  ep_size: 1
  expert_quantization: fp8
  forward: legacy
  fp8_kv_headroom: 2
  high_speed_swap_cache_blocks_per_seq: 64
  high_speed_swap_qd: 8
  high_speed_swap_rank: 32
  marconi_min_tokens: 256
  max_loras: 8
  max_num_seqs: 128
  max_prefill_tokens: 8192
  mtp_quantization: bf16
  mtp_vocab: 100000
  oom_guard_mb: 4096
  prompt_lookup_max_drafts: 8
  prompt_lookup_max_seqs: 8
  prompt_lookup_min_match: 8
  prompt_lookup_miss_backoff: 16
  prompt_lookup_ngram: 4
  prompt_lookup_shared_cache_scopes: 4
  request_timeout: 300
  scheduler_config: sync
  spec_cost_model: off
  ssm_batched_recurrent: auto
  ssm_decode_ring_slots: auto
  ssm_rollback_mode: snapshot
  swap_space_gb: 3
  tbt_deadline_ms: 100
  telemetry: off
  tensor_parallel: 1
  tool_grammar: auto
  tool_max_tokens: 8192
  video_decode_timeout_s: 120
  video_ffmpeg_path: ffmpeg
  video_fps: 2
  video_max_frames: 768
  vision_max_pixels: 0
  vision_remote_image_max_mb: 20
  vision_remote_image_timeout_s: 10
  # --- explicit `met serve` state (owner directive 2026-10-05, extended): presence-only
  # flags pinned true/false, and no-clap-default flags pinned to the value they resolve to
  # today (MODEL.toml behavior / engine built-in constant / env-unset) -- see
  # recipe::explicit for the SSOT list, exclusions and the byte-identical resolution proof.
  adaptive_sampling: false
  auto_compact: 0
  auto_swap: false
  check_kernels: false
  content_loop_min_repeats: 3
  dangerously_allow_unresolved_kernel_lookups: false
  disable_template_overrides: false
  disable_thinking: false
  exact_verify: false
  fast_load_prefetch_shards: false
  fp8_kv_calibration_tokens: 0
  gdn_fused_norm: false
  hermetic: false
  high_speed_swap: false
  max_inter_tool_prose: 3072
  model_name: unsloth/Qwen3.8-27B-NVFP4
  mtp_experts_nvfp4: false
  mtp_gate: auto
  mtp_max_seqs: 32
  nemotron_shared_expert_e4m3: false
  ngram_speculative: false
  no_canonical_tiers: false
  no_fast_load: false
  no_high_speed_swap_graph: false
  no_ssm_tail_midchunk: false
  no_tui: false
  # 1 (not the checkpoint's declared value): no speculative method is
  # enabled on this recipe, so num_drafts is unread, and validate_serve_args
  # refuses a value above 1 without one enabled regardless.
  num_drafts: 1
  prefill_codispatch: false
  prefill_varlen_batch: false
  profile: false
  prompt_lookup_decoding: false
  require_auth: false
  self_speculative: false
  speculative: false
  # Unread for this model_type (serve_load/adapters.rs::resolve_nllb_lang
  # branches on model_type in m2m_100|nllb only); placeholder, confirmed inert.
  src_lang: not-applicable-non-nllb-checkpoint
  ssm_h_dtype: f32
  tgt_lang: not-applicable-non-nllb-checkpoint
  video_allow_ffmpeg: false
  vision_allow_remote_images: false
  vision_remote_image_allow_private: false
  w4a4_downcast: false
  w4a4_downcast_wide: false
