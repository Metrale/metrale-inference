# W7: the `[patch.crates-io] xgrammar-rs` entry was removed — Metrale Engine now
# depends on the pure-Rust `crates/grammar` crate directly (no FFI,
# no C++ toolchain). The vendored C++ `vendor/xgrammar-rs/` tree has
# been deleted; the grammar stack is 100% Rust.

# Workspace-wide lint policy. Each crate also adds `#![deny(warnings)]` /
# `#![deny(clippy::all)]` to its `lib.rs`/`main.rs`; this section extends
# the same policy to integration tests, benches, and examples (which are
# compiled as separate targets and would otherwise inherit nothing).
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
too_many_arguments = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
type_complexity = "allow"
ptr_arg = "allow"
if_same_then_else = "allow"

# 2026-10-17: Line tables keep backtraces readable at a fraction of full debug info's
# compile and link cost. `release` is untouched: it is the parity reference.
[profile.dev]
debug = "line-tables-only"

# 2026-10-22: kzx is a bit-level context-mixing coder: unoptimized it decodes a full kernel
# payload in minutes, not seconds, so dev and test builds (met's blueprint tests open GLM's
# 71 MB full file) optimize it. Codegen only: its output is identical at every opt level.
[profile.dev.package.kzx]
opt-level = 3

# 2026-10-17: Release codegen for the edit-run loop: incremental, many codegen units.
# Opt-in by name (`--profile iter`); never used for gate, certify or release builds.
[profile.iter]
inherits = "release"
incremental = true
codegen-units = 256
