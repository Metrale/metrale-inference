#
# Measured per-kernel time against the roofline floor (schema and method: KERNEL-PERF.md,
# "Methodology" section 6). One [[m]] row per (kernel, hardware, model, regime[, shape]).
# scripts/kernel_perf.py validates every row against the tree and re-derives pct_of_floor.
#
# floor_us = max(bytes / 249.0 GB/s, flops / PEAK[class]) with the GB10 peaks of KERNEL-PERF.md.
# When one kernel runs at several shapes in one regime, each shape is its own row and `regime`
# carries a suffix " · <shape>"; the text before " · " is the regime. `notes` starts with the
# shape, the call count and the row's share of the regime's GPU kernel time.
# `kernel` is "<model directory>::<function>" as captured; the join key is `file` + function.

