[book]
title = "The Metrale Engine Book"
authors = ["Metrale Engine contributors"]
description = "A comprehensive guide to Metrale Engine — pure-Rust LLM inference for hyperoptimized (Hardware, Model, Quantization) kernel targets."
language = "en"
multilingual = false
src = "src"

[build]
build-dir = "output"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
site-url = "/"
git-repository-url = "https://github.com/Metrale/metrale-inference"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/Metrale/metrale-inference/edit/main/book/{path}"
no-section-label = false
# The kit's colours first (metrale-brand.css, generated by assets/brand/derive.mjs
# from the vendored brand kit), then the tokens that name them, then the skin that
# consumes those, then the Metrale layer that puts the logo in the menu bar.
additional-css = ["theme/css/metrale-brand.css", "theme/css/metrale-tokens.css", "theme/css/metrale.css", "theme/css/wordmark.css"]
# The menu-bar logo, generated by assets/brand/derive.mjs.
additional-js = ["theme/metrale.js"]
# The brand faces (Manrope, IBM Plex Mono) come from theme/fonts/fonts.css and
# the font files linked beside it, which mdBook copies to fonts/. mdBook's own
# Open Sans and Source Code Pro would be ~100 KB of unused payload.
copy-fonts = false

[output.html.print]
enable = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.redirect]
"/api.html" = "https://docs.metrale.ai/api/"
"/api/index.html" = "https://docs.metrale.ai/api/"
