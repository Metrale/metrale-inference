# ---- mHC (hyper-connections) ------------------------------------------------
[[rule]]
family = "mhc_pre_norm_tok4"
group = "mhc"
class = "compute"
name_regex = "_hc_pre_norm_tok4$"

[[rule]]
family = "mhc_pre_norm"
group = "mhc"
class = "compute"
name_regex = "_hc_pre_norm$"

[[rule]]
family = "mhc_post_rank_sum"
group = "mhc"
class = "compute"
name_regex = "_hc_post_rank_sum$"

[[rule]]
family = "mhc_post"
group = "mhc"
class = "compute"
name_regex = "_hc_post$"

[[rule]]
family = "mhc_other"
group = "mhc"
class = "compute"
name_regex = "_hc_(head|expand|mix)"

[[rule]]
family = "rank_sum_add"
group = "mhc"
class = "compute"
name_regex = "^bf16_add_rank_sum$"

# ---- everything else --------------------------------------------------------
[[rule]]
family = "norm"
group = "misc"
class = "compute"
name_regex = "^(rms_norm|nllb_layernorm)"

[[rule]]
family = "elementwise"
group = "misc"
class = "compute"
name_regex = "^bf16_add_inplace$"

[[rule]]
family = "embed"
group = "misc"
class = "compute"
name_regex = "^batched_embed$"

[[rule]]
family = "sampling"
group = "misc"
class = "compute"
name_regex = "^argmax_"

[[rule]]
family = "kv_slots"
group = "misc"
class = "compute"
name_regex = "^fill_slots_from_block_table$"

# ---- kernel tree (`metprof tree`) ------------------------------------------
# The tree's own gate: the share of summed kernel time that must sit under a
# node (the rest is listed as unattributed by full name). It is separate from
# the union coverage_min above, which gates busy time.
[tree]
coverage_min = 0.99

# Structure over the families for one model. A node claims families by
# pattern (over family names, never kernel names: matching kernels stays in
# the rules above); an unclaimed family sits under its group. `fuses` states
# what a kernel absorbed; it is never given a time of its own.
[tree.model.glm]
fuses = { moe_grouped_gu = ["gate_gemm", "up_gemm"] }

[[tree.model.glm.node]]
path = "moe"
families = ["^router_", "^moe_", "^swiglu$"]

[[tree.model.glm.node]]
path = "attention"
families = ["^mla_", "^dsa_"]

[[tree.model.glm.node]]
path = "mhc"
families = ["^mhc_", "^rank_sum_add$"]

# ---- per-row cost (`metprof slope`) ----------------------------------------
# A change in marginal ms per added row (between consecutive widths) within
# +/- flat_band_ms_per_row, inclusive, is FLAT; above it RISING, below it
# FALLING. 2026-10-16: 0.002 ms per row is below the time of one short kernel
# launch, so one added launch per row registers as a change, and well above
# the rounding of ns kernel durations to ms. It is NOT calibrated against
# run-to-run spread: re-capture each width twice and widen the band if a
# repeat flips a class.
[slope]
flat_band_ms_per_row = 0.002

# What a family's per-row cost is declared to come from, one of weight_bytes,
# state_bytes, launches_per_row, host_sync. A family not listed reports
# "undeclared": a driver is declared from a measurement, never guessed.
[slope.cost_driver]
