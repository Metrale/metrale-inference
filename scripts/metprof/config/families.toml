[[rule]]
family = "conv1d_window"
group = "kda"
class = "compute"
name_regex = "^causal_conv1d_window_advance$"

[[rule]]
family = "kda_pack_qkv"
group = "kda"
class = "compute"
name_regex = "^kda_pack_qkv"

[[rule]]
family = "kda_o_norm_gated"
group = "kda"
class = "compute"
name_regex = "^kda_o_norm_gated"

[[rule]]
family = "kda_gate"
group = "kda"
class = "compute"
name_regex = "^kda_gate_"

[[rule]]
family = "kda_sigmoid"
group = "kda"
class = "compute"
name_regex = "^kda_sigmoid_"

[[rule]]
family = "ssm_state_clamp"
group = "kda"
class = "compute"
