# SPDX-License-Identifier: MIT OR Apache-2.0

# 2026-10-15: the kernel knowledge base sink of metprof: record types, natural-key
# ids, canonical JSON, the embedding port, the pure derivation of kernel samples
# from a kernel tree, and (native) the LatticeDB store behind a spool and a lease.
# Pure Rust only. It does not depend on metprof (metprof depends on it).
[package]
name = "metprof-kb"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Kernel knowledge base records, ids, embeddings and the metprof run sink"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11"
toml = "1.1"
unicode-normalization = "0.1"

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
