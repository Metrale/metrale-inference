# SPDX-License-Identifier: MIT OR Apache-2.0

# 2026-10-15: the KKB1 sealed-bundle envelope (AES-256-GCM per file under an
# HKDF-derived key, plus a hybrid X25519 + ML-KEM-768 wrap of the data key).
# Pure-Rust RustCrypto crates only; builds for wasm32-unknown-unknown. The
# versions of the crates metrale-auth also uses (aes-gcm, hkdf, sha2,
# getrandom, base64, serde_json, thiserror, zeroize) match its Cargo.lock.
[package]
name = "metprof-envelope"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "KKB1 sealed-bundle envelope: AES-256-GCM, HKDF-SHA256 per-file keys, hybrid X25519 + ML-KEM-768 key wrap"

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
getrandom = "0.2.17"
hkdf = "0.12.4"
ml-kem = { version = "0.3.2", default-features = false, features = ["hazmat", "zeroize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.21"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = "1.9.0"

# 2026-10-15: in a browser or a Worker the OS entropy source is the Web
# Crypto API, which getrandom 0.2 reaches only through its `js` feature.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
