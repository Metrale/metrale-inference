#
# 2026-10-22: Launch shape -> plan site for GLM-5.3-Flash NVFP4 served TP=3 on GB10 (recipe
# glm-5.3/glm-5.3-flash-nvfp4-tp3-512k), rank 0, decode C=1 with the MTP verify at 2 rows and
# the one-row draft head, the serve flags of profiles glm53-tp3-512k-fast11/12/13. Read by
# scripts/headroom_trace.py; the sites are `block.local` of `met circuit headroom --recipe
# glm-5.3/glm-5.3-flash-nvfp4-tp3-512k --hardware gb10 --mode verify --rows 2 --also draft:1`.
#
# The launch shapes (grid, dynamic smem, same-stream predecessor) are the rank-0 shapes derived
# from the launchers in the GLM nsys row generator (claude-state glm/lkb/nsys_to_rows.py RULES,
# whose comments cite each launcher's grid formula). A launch not listed here is exported with
# no site: the headroom matches it by kernel name when exactly one launch site runs that name,
# else reports it outside the plan. Kernels listed nowhere on purpose:
# - glm5next_hc_pre_norm_c1 (grid 2,24,1) and glm5next_hc_post_rank_sum: the same launch at the
#   kda/dsa/mlp/moe mix (and post) sites; the shape does not tell them apart.
# - w4a4_gemv_mx8 (256,1,1): the dense FFN's gate, up and down share one shape.
# - screen_head_scan/resolve/rescore (the verify LM head) and dense_gemv_fp8w (the draft head):
#   INT8 / FP8 heads where the plan's lm_head is BF16; another precision is not that site's floor.
# - w4a16_gemv_sw_moe (the draft head's routed experts): NVFP4 weights where the plan's draft
#   experts are BF16; another precision is not that site's floor.
# - NCCL, argmax, sampling and MTP exchange kernels: not plan sites.
#
# `note` states where the serve's lowering puts work the plan puts at another site; the floor
# stays the plan's.

[plan]
# One rank's shard: KDA and DSA heads 64 -> 22 (glm5next_kda/tp.rs head split 22/22/20),
# shared expert 2048 -> 768 (256-unit split), routed 2048 -> 704 (64-unit split, expert layout
# tp), dense FFN 12288 -> 4096, LM head vocab 154880 -> 51648 (807 units of 64,
# lm_head_vocab_tp.rs). The router (288 experts), mHC, the indexer and the MLA ranks are
# replicated on every rank.
dims = { q_heads = 22, lin_k_heads = 22, lin_v_heads = 22, shared_inter = 768, moe_inter = 704, inter = 4096, vocab = 51648 }
dims_basis = "rank 0 of TP=3: head split 22/22/20 (glm5next_kda/tp.rs), shared 768 and routed 704 (glm5next_mlp/expert_tp.rs), dense 4096, vocab shard 51648 (lm_head_vocab_tp.rs); router, mHC, indexer, MLA ranks replicated"

# --- KDA layers (34)
[[launch]]
kernel = "w4a16_gemv_pipe_m2"
grid = [1091, 1, 1]
smem = 16448
site = "kda.q"
label = "KDA in-proj q|k|v|f_a|b|g_a M=2 N=8726 K=4096"

[[launch]]
kernel = "w4a16_gemv_pipe_m2"
grid = [192, 1, 1]
smem = 16448
pred = "kda_o_norm_gated_bf16"
site = "kda.o"
label = "KDA o_proj M=2 N=4096 K=2816"

[[launch]]
kernel = "kda_o_norm_gated_bf16"
grid = [44, 1, 1]
site = "kda.out_norm"
label = "rows=2x22 head_dim=128"

[[launch]]
kernel = "kda_pack_qkv_bf16"
grid = [11, 2, 1]
site = "kda.qkv"
label = "T=2 qkv=2816"

[[launch]]
kernel = "kda_gates_w8a8_k128_rows"
grid = [44, 1, 1]
site = "kda.f_b"
label = "f_b|g_b M=2 N=2816+2816 K=128"

[[launch]]
kernel = "causal_conv1d_window_advance_to"
grid = [33, 1, 1]
site = "kda.short_conv"
label = "snapshot T=1 dim=8448 d_conv=4"

[[launch]]
kernel = "causal_conv1d_update_l2norm_tokens"
grid = [33, 2, 1]
site = "kda.short_conv"
label = "T=2 dim=8448 d_conv=4"

[[launch]]
kernel = "causal_conv1d_window_advance"
grid = [33, 1, 1]
site = "kda.short_conv"
label = "T=2 dim=8448 d_conv=4"

[[launch]]
kernel = "kda_recurrent_decode_bf16_seq_reg_snap"
grid = [22, 4, 1]
site = "kda.recur"
label = "T=2 heads=22 dk=dv=128 1 snapshot"

