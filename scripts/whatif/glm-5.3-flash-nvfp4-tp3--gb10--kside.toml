# SPDX-License-Identifier: MIT OR Apache-2.0
#
# 2026-10-23: `met circuit whatif --spec`: the SM budget of the verify shared-expert side
# stream (GRAPH-THEORY-MAP E2 input, k_side). Each set confines the shared expert's three
# kernels (gate|up, clamp SwiGLU, down: 192 CTAs at 4/SM want all 48 SMs) to k SMs, their
# SM-time unchanged (work x 48/k), so the routed sweep they co-run with gets the rest. No
# measurement: a prediction sweep, not a backtest.

schema = "whatif-spec/v1"


[[set]]
id = "kside-2"
depends_on = ["dense-seg-inserve"]
rewrite = [
  { kind = "confine", select = [{ site = "moe.shared_gate_up" }, { site = "moe.shared_clamp" }, { site = "moe.shared_down" }], sms = 2.0, basis = "side-stream SM budget k=2; linear in SMs" },
]
measured = []

