# 2026-10-07: AMD gfx1201 (RDNA4: RX 9070 XT 16 GB, Radeon AI PRO R9700 32 GB), native HIP.
# Ships no kernels of its own: the whole strix-hip tree, through `inherits` (docs/HARDWARE.md),
# whose WMMA kernels go through common/wmma_rdna.cuh for the gfx12 fragment layout.
[hardware]
name = "gfx1201"
vendor = "hip"
inherits = "strix-hip"
arch = "gfx1201"
compute_capability = "12.0.1"
# 2026-10-07: descriptive, as on strix-hip; the RX 9070 XT's figures. Not measured here.
memory_bandwidth_gbps = 640
memory_type = "GDDR6"
memory_gb = 16
