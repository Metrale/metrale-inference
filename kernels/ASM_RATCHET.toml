# 2026-10-07: The "no bare asm" ratchet (#148): the per-file count of inline `asm` statements that
# do not yet go through the ISA router. Checked by crates/kernels/tests/no_bare_asm.rs.
#
# Owner: metrale-kernels.
# Invariants:
# - A count may only go down. A change that routes asm through the ISA router lowers its file's
#   entry in the same commit (the test refuses a stale entry, so the slack cannot be refilled).
# - A file not listed here may contain no bare asm. An entry whose file has none is removed.
# - `exempt` lists the directories that ARE the router (their asm is the per-target
#   implementation). Empty until the router's location is decided (#148, open question 1).
# - When [files] is empty the ratchet is done and the rule is absolute.

