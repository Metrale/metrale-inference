# 2026-09-30: The device registry: every GPU SKU a circuit can be planned for, the kernel CLASS
# (`kernels/<class>/`) its build targets, its roofline and the tensor-core instructions it runs
# natively (schema: crates/circuit/src/hardware/device.rs; used by `met circuit plan --hardware`).
#
# Why one file here and not `[[device]]` rows in each HARDWARE.toml:
# - A device is a SKU and a class is a compiled kernel set; the mapping is many-to-one (H100 and
#   H200 both build `hopper`) and the SKUs differ exactly where a class cannot (H200 has 141 GB
#   at 4.8 TB/s, H100 80 GB at 3.35 TB/s), so a class file cannot hold both without a table of
#   its own.
# - HARDWARE.toml is a closure input of every target of its class
#   (crates/bench/src/gate/taxon.rs) and is read by the build (build_defaults.rs, which refuses
#   unknown keys), the closure layout and the bench hardware policies. A roofline correction must
#   not re-open every certified gate of the class, and a spec sheet must not reach the build.
# - Nothing in the build or the gate reads this file. The circuit planner is its only reader, and
#   its consistency test (crates/circuit/tests/hardware.rs) holds it to the classes' build flags.
#
# Owner: metrale-circuit (hardware axis).
# Invariants:
# - The device profiles below the guards are the hardware-specs research of 2026-09-29
#   (/workspace/claude-state/roadmap/devices.toml and hardware-specs.md), copied verbatim with
#   its conventions and [sources]; only the planner keys are added, after each `sources` line:
#   `usable_fraction` / `usable_why` (the share of the visible memory weights, KV and state may
#   use) and, on gb10, `measured` (where the measured achievable roofline lives; the planner
#   then uses it in place of the datasheet ceiling).
# - `class` names a `kernels/<class>/HARDWARE.toml`; `arch` equals that file's `[hardware] arch`.
# - The planner reads `mma_family`, `native_mma`, `peak_tflops` (0.0 = no tensor path),
#   `memory_bandwidth_gbps`, `memory_gib_visible` (else `memory_gb_datasheet`, which tracks the
#   visible GiB), `derived` and `sources`; the other spec keys are carried for the roadmap.

# 2026-09-30: From here the research file follows verbatim (planner keys added per device; the
# [[guard]] tables sit between its [sources] and its first [[device]]).

# Device profiles for the model + hardware -> fused-kernel-circuit planner.
# Compiled 2026-09-29. Companion document: hardware-specs.md (same numbers, with prose).
#
# Conventions
#   * peak_tflops           = DENSE peak (no 2:4 sparsity). INT8 values are TOPS.
#   * peak_tflops_sparse    = 2:4 structured-sparsity peak, exactly as NVIDIA publishes it.
#   * 0.0 in peak_tflops    = no tensor-core path for that dtype on this device.
#   * Keys listed in `derived` are computed by us, not published by NVIDIA. hardware-specs.md
#     states how each was derived.
#   * Keys listed in `unknown` are not published. They are omitted from the table (TOML has
#     no null).
#   * memory_gb_datasheet   = the number on NVIDIA's datasheet. In practice it tracks the
#     CUDA-visible size in GiB, not in decimal GB.
#   * memory_gib_visible    = what nvidia-smi or cuDeviceTotalMem reports, converted to GiB.
#   * memory_bandwidth_gbps = decimal GB/s.
#   * ridge_flop_per_byte   = dense peak / memory bandwidth (derived).
#   * native_mma            = a single hardware MMA instruction takes this operand pair
#     (and its scales) directly. `false` means software conversion or emulation is needed.
#   * `class` names the existing kernel tree under kernels/<class> in the engine repo.

schema_version = 1
compiled = "2026-09-29"

