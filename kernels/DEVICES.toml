# 2026-09-30: Source guards that compile a kernel only where an instruction kind exists. A
# kernel defined inside such a region needs `requires` natively; a class whose HARDWARE.toml
# `[build] extra_nvcc_flags` defines an `ifndef` macro compiles the region out.
# - METRALE_NO_WARP_BLOCKSCALE_MMA: crates/kernels/tests/blockscale_mma_guard.rs holds every
#   `mma.sync kind::mxf4nvf4.block_scale` and `cvt.rn.satfinite.e2m1x2` inside it.
# - BLACKWELL_MMA_AVAILABLE: the vendor macro nvfp4_mmq.cu tests, defined for compute
#   capability 12.x only (kernels/hopper/qwen3.8-27b/MODEL.toml [expected_absent.nvfp4_mmq]).
[[guard]]
macro = "METRALE_NO_WARP_BLOCKSCALE_MMA"
polarity = "ifndef"
requires = "mma_sync.fp4_block_scale"

[[guard]]
macro = "BLACKWELL_MMA_AVAILABLE"
polarity = "ifdef"
requires = "mma_sync.fp4_block_scale"

