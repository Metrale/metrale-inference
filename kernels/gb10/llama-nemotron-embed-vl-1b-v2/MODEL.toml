[model]
name = "llama-nemotron-embed-vl-1b-v2"
hf_id = "nvidia/llama-nemotron-embed-vl-1b-v2"
params = "1.7B (1.24B text tower served)"
active_params = "1.24B"
architecture = "Bidirectional Llama-3.2 text tower, mean-pooled embedding model (SigLIP vision tower not served)"

layers_total = 16
hidden_dim = 2048
head_dim = 64
q_heads = 32
kv_heads = 8
intermediate_size = 8192
vocab_size = 128266
max_position_embeddings = 131072
rope_theta = 500000
rope_scaling = "llama3"
attention_mask = "bidirectional"
pooling = "mean"
embedding_dim = 2048
generates = false
vision = false

[[model_types]]
model_type = "llama_nemotron_vl"
hidden_size = 2048

# 2026-10-24: An embedding model samples nothing; these presets satisfy the MODEL.toml schema
# and are never read (the serve refuses generation on a model whose capabilities say
# `generates = false`).
[sampling.non_thinking]
temperature = 0.0
top_p = 1.0
top_k = 0
presence_penalty = 0.0
repetition_penalty = 1.0

[behavior]
default_kv_dtype = "bf16"
thinking_default = false
thinking_in_tools = false
