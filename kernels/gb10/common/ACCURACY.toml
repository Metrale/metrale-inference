# 2026-10-09: GB10 kernel accuracy contracts, one per family entry point set (`met accuracy`;
# schema and rules: crates/accuracy/src/contract.rs; design: book and the crate docs).
#
# Owner: gb10 kernels.
# Invariants:
# - A contract never restates a format: the reference reads the family's `pipeline.<op>` in
#   KERNEL_FAMILIES.toml. It states only what that pipeline does not: the reduction tree of
#   each reduced dimension (`reduction.<dim>`, innermost level first; `sequential` adds its
#   width to the depth, `tree` ceil(log2 width)), flush-to-zero, approximate-function errors,
#   and where block scales fold (`element`: decoded with the value; `group`: on each group's
#   partial sum; `none`).
# - `derived`: every compared output must be a correct rounding of a value inside the bound
#   derived from those declarations. `bit_identical`: the output equals `against`'s byte for
#   byte on the same operands (one-row siblings run once per row).
# - Every contract lists mutations that must fail; a mutation that passes fails the run.
# - Each reduction is read from the kernel source; the comment above it cites the lines.

schema = 1
hardware = "gb10"
seed = 20261009

# 2026-10-09: w4a16_gemv.cu w4a16_gemv_partial + w4a16_gemv_sw: per 16-value chunk a fmaf chain
# (`part`, 16 terms), folded by `acc_c = fmaf(scale, part, acc_c)` with scale = e4m3 * scale2;
# chunks kk = 2*lane + c + 128j give each of two accumulators ceil(K/2048) chunks; acc0 + acc1;
# a 32-lane shuffle tree on each of the two partials; acc_a + acc_b.
[[contract]]
family = "w4a16_gemv"
kernels = ["w4a16_gemv::w4a16_gemv_sw"]
op = "linear"
reference = "linear"
class = "derived"
reduction.group = [{ level = "thread", width = "16", order = "sequential" }]
reduction.k = [
  { level = "thread", width = "k/2048", order = "sequential" },
  { level = "accumulators", width = "2", order = "tree" },
  { level = "warp", width = "32", order = "tree" },
  { level = "partials", width = "2", order = "tree" },
]
ftz = false
approx = {}
scale_fold = "group"
inputs = ["gaussian", "outliers", "near_overflow", "denormal", "all_equal", "zero_rows"]
mutations = ["corrupt_block_scale", "swap_scale_granularity", "accumulate:bf16", "symbol:w4a16_gemv::w4a16_gemv"]

# 2026-10-09: The two- and three-row GEMVs promise each row's bytes equal the one-row
# w4a16_gemv's (w4a16_gemv.cu: one pass over the weight, the same K order per row).
[[contract]]
family = "w4a16_gemv"
kernels = ["w4a16_gemv::w4a16_gemv_batch2", "w4a16_gemv::w4a16_gemv_batch3"]
op = "linear"
reference = "linear"
class = "bit_identical"
against = "w4a16_gemv::w4a16_gemv"
inputs = ["gaussian", "outliers", "zero_rows"]
mutations = ["corrupt_block_scale", "swap_scale_granularity"]

# 2026-10-09: dense_gemv_bf16.cu: 64 threads per output, each a sequential chain over its
# K/64 values (8 per uint4, kv = lane + 64j), a 32-lane shuffle tree, then the two warps' sums.
# dense_gemv_bf16_batchm follows the same order per row (ops/gemm_quant_gemv.rs).
[[contract]]
family = "dense_bf16"
kernels = ["gemv::dense_gemv_bf16"]
op = "linear"
reference = "linear"
class = "derived"
reduction.k = [
  { level = "thread", width = "k/64", order = "sequential" },
  { level = "warp", width = "32", order = "tree" },
  { level = "warps", width = "2", order = "tree" },
]
ftz = false
approx = {}
scale_fold = "none"
inputs = ["gaussian", "outliers", "near_overflow", "denormal", "all_equal", "zero_rows"]
mutations = ["accumulate:bf16", "symbol:gemv::dense_gemv_bf16_fp32out"]

# 2026-10-09: The vocabulary-parallel head: the lm_head rows split over three ranks at
# 64-aligned edges (GLM's capped vocabulary is not a multiple of 64), each shard written at
# its own output columns. The split mutation places every later shard one column off.
[[contract]]
family = "dense_bf16"
kernels = ["dense_gemv_bf16_batchm::dense_gemv_bf16_batchm"]
op = "lm_head"
reference = "linear"
class = "derived"
reduction.k = [
  { level = "thread", width = "k/64", order = "sequential" },
  { level = "warp", width = "32", order = "tree" },
  { level = "warps", width = "2", order = "tree" },
]
ftz = false
approx = {}
scale_fold = "none"
split = { world = 3, align = 64 }
inputs = ["gaussian", "zero_rows"]
mutations = ["split_off_by_one", "accumulate:bf16"]

[[contract]]
family = "dense_bf16"
kernels = ["dense_gemv_bf16_batchm::dense_gemv_bf16_batchm"]
op = "router"
reference = "linear"
class = "bit_identical"
against = "gemv::dense_gemv_bf16"
inputs = ["gaussian", "outliers", "all_equal"]
mutations = ["symbol:gemv::dense_gemv_bf16_fp32out"]

# 2026-10-09: w8a8_gemv.cu on wxay_engine.cuh mma_gemv: per 128-value chunk four
# mma.sync.m16n8k32.e4m3 into the running FP32 accumulator (the atom's internal order over its
# 32 products is not documented: declared as a 32-term chain, the worst case); chunk c belongs
# to warp c mod 8, ascending c, so each warp chains K/256 MMAs; the 8 warp partials are summed
# in warp order (wxay_engine.cuh:108-127). rowscale folds (w_scale[n] * a_scale[m]) after the
# sum (w8a8_gemv.cu:4).
[[contract]]
family = "wxay"
kernels = [
  "w8a8_gemv::w8a8_gemv_rowscale_mb1_ku8", "w8a8_gemv::w8a8_gemv_rowscale_mb2",
  "w8a8_gemv::w8a8_gemv_rowscale_mb4", "w8a8_gemv::w8a8_gemv_rowscale_mb8",
  "w8a8_gemv::w8a8_gemv_rowscale_mb16",
]
op = "linear"
reference = "linear"
class = "derived"
reduction.k = [
  { level = "mma", width = "32", order = "sequential" },
  { level = "warp", width = "k/256", order = "sequential" },
  { level = "cta", width = "8", order = "sequential" },
]
ftz = false
approx = {}
scale_fold = "none"
inputs = ["gaussian", "outliers", "near_overflow", "zero_rows"]
mutations = ["corrupt_block_scale", "accumulate:bf16"]

# 2026-10-09: blk128: each chunk's four MMAs start from zero and fold into the accumulator by
# acc = fmaf(w_scale * a_scale, chunk, acc) (w8a8_gemv.cu:118-128); a warp chains K/1024 chunks.
[[contract]]
family = "wxay"
kernels = [
  "w8a8_gemv::w8a8_gemv_blk128_mb1_ku8", "w8a8_gemv::w8a8_gemv_blk128_mb2",
  "w8a8_gemv::w8a8_gemv_blk128_mb4", "w8a8_gemv::w8a8_gemv_blk128_mb8",
  "w8a8_gemv::w8a8_gemv_blk128_mb16",
]
op = "linear"
reference = "linear"
class = "derived"
reduction.group = [
  { level = "mma", width = "32", order = "sequential" },
  { level = "chunk", width = "4", order = "sequential" },
]
reduction.k = [
  { level = "warp", width = "k/1024", order = "sequential" },
  { level = "cta", width = "8", order = "sequential" },
]
ftz = false
approx = {}
scale_fold = "group"
inputs = ["gaussian", "outliers", "near_overflow", "zero_rows"]
mutations = ["corrupt_block_scale", "swap_scale_granularity", "accumulate:bf16"]

# 2026-10-09: dense_gemv_bf16_tc.cu: BF16 MMA m16n8k16 (the atom's internal order over its 16
# products is not documented: declared as a 16-term chain, the worst case) into the running
# FP32 accumulator (:63-71); per 64-K block four MMAs (:175-186); warp w takes blocks w, w + 8,
# ... in ascending order (:138-142, :158-161), so it chains ceil(K / 512) * 4 MMAs, at most
# k/128 + 3 (the `tail` level covers a K that is not a multiple of 512); the 8 warps' partials
# summed in warp order through shared memory (:205-216); one BF16 rounding (:225).
# Inputs: MMA subnormal handling is not documented, so the denormal class is left out, as the
# W8A8 MMA contracts do.
[[contract]]
family = "dense_bf16_tc"
kernels = [
  "dense_gemv_bf16_tc::dense_gemv_bf16_tc8", "dense_gemv_bf16_tc::dense_gemv_bf16_tc16",
  "dense_gemv_bf16_tc::dense_gemv_bf16_tc32",
]
op = "linear"
reference = "linear"
class = "derived"
reduction.k = [
  { level = "mma", width = "16", order = "sequential" },
  { level = "warp", width = "k/128", order = "sequential" },
  { level = "tail", width = "3", order = "sequential" },
  { level = "cta", width = "8", order = "sequential" },
]
ftz = false
approx = {}
scale_fold = "none"
inputs = ["gaussian", "outliers", "near_overflow", "all_equal", "zero_rows"]
mutations = ["accumulate:bf16", "symbol:dense_gemv_bf16_batchm::dense_gemv_bf16_batchm"]

# 2026-10-09: w4a16_gemv_tc.cu: each weight enters the MMA as BF16(E2M1 * E4M3 * 2^-26), exact
# (:23-28, :199-204), so the block scale folds per element; BF16 MMA m16n8k16 (declared as a
# 16-term chain) into the running FP32 accumulator (:65-73, :205-206); per 128-K block eight
# MMAs (:183-207); warp w takes blocks w, w + 8, ... ascending (:153-158, :171-173), so it chains
# ceil(K / 1024) * 8 MMAs, at most k/128 + 7 (`tail`); the 8 warps' partials summed in warp order
# (:227-229), times scale2 * 2^26 in FP32 (:221, :230); one BF16 rounding (:98-106).
# Inputs: besides the undocumented MMA subnormal handling, the 2^-26 operand pre-scale moves FP32
# underflow 26 binades into the range the reference treats as normal; no denormal class.
# No symbol mutation: the engine launcher (ops::w4a16_gemv_batchm) resolves its own tensor-core
# entry from the row count (gemv_tc::tc_kernel) and takes no entry point.
[[contract]]
family = "w4a16_tc"
kernels = ["w4a16_gemv_tc::w4a16_gemv_tc8", "w4a16_gemv_tc::w4a16_gemv_tc16"]
op = "linear"
reference = "linear"
class = "derived"
reduction.k = [
  { level = "mma", width = "16", order = "sequential" },
  { level = "warp", width = "k/128", order = "sequential" },
  { level = "tail", width = "7", order = "sequential" },
  { level = "cta", width = "8", order = "sequential" },
]
ftz = false
approx = {}
scale_fold = "element"
inputs = ["gaussian", "outliers", "near_overflow", "all_equal", "zero_rows"]
mutations = ["corrupt_block_scale", "swap_scale_granularity", "accumulate:bf16"]

# 2026-10-09: The same kernels as the 27B's NVFP4 head (the reduction above).
[[contract]]
family = "w4a16_tc"
kernels = ["w4a16_gemv_tc::w4a16_gemv_tc8", "w4a16_gemv_tc::w4a16_gemv_tc16"]
op = "lm_head"
reference = "linear"
class = "derived"
reduction.k = [
  { level = "mma", width = "16", order = "sequential" },
  { level = "warp", width = "k/128", order = "sequential" },
  { level = "tail", width = "7", order = "sequential" },
  { level = "cta", width = "8", order = "sequential" },
]
ftz = false
approx = {}
scale_fold = "element"
inputs = ["gaussian", "outliers", "near_overflow", "all_equal", "zero_rows"]
mutations = ["corrupt_block_scale", "swap_scale_granularity", "accumulate:bf16"]

# 2026-10-09: tc_rows.cuh at the NVFP4 point (Nvfp4G16): each weight enters as BF16(E2M1 * E4M3),
# exact (tc_weight_formats.cuh:124-136), so the block scale folds per element; one warp owns 16
# columns over the whole K: 128-K chunks in ascending order (tc_rows.cuh:114-132), eight BF16
# MMA m16n8k16 per chunk (declared as 16-term chains) into one FP32 accumulator (FOLDS = false,
# :147), K / 16 MMAs in all; no cross-warp sum; times s2 in FP32 (tc_weight_formats.cuh:139);
# one BF16 rounding (tc_rows.cuh:171). Rows, NT and G never change a row's order (:14-16, :40).
# No symbol mutation: ops::w4a16_tc_rows resolves its entry (_16/_32/_64) from the row count.
[[contract]]
family = "tc_rows"
kernels = ["w4a16_tc_rows::w4a16_tc_rows_64"]
op = "lm_head"
reference = "linear"
class = "derived"
reduction.k = [
  { level = "mma", width = "16", order = "sequential" },
  { level = "warp", width = "k/16", order = "sequential" },
]
ftz = false
approx = {}
scale_fold = "element"
inputs = ["gaussian", "outliers", "near_overflow", "all_equal", "zero_rows"]
mutations = ["corrupt_block_scale", "swap_scale_granularity", "accumulate:bf16"]

# 2026-10-09: w8a16_gemm_pipelined_m32.cu: E4M3 to BF16 exactly (the LUT, :243-249; the skinny
# body's bit move, w8a16_gemm_pipelined_m16.cuh:50-56; m64's pm64_b_pair, :310); each 128-K step runs
# eight BF16 MMA m16n8k16 (declared as 16-term chains) into a zeroed FP32 inner sum (:116-155,
# :399-429; m16.cuh:115-138); the step's sum times its FP32 block scale is added to the outer
# sum in ascending step order (:275-281, :431-438; m16.cuh:140, :154-160); one BF16 rounding
# (:288-291). The 32-row, 64-row and skinny bodies share that order per output.
# The symbol arm runs the 16-row scalar GEMV (same arguments) on this launcher's grid: it covers
# a fraction of the columns and only 16 rows.
[[contract]]
family = "w8a16_gemm"
kernels = [
  "w8a16_gemm_pipelined_m32::w8a16_gemm_pipelined_m32",
  "w8a16_gemm_pipelined_m32::w8a16_gemm_pipelined_m64",
]
op = "linear"
reference = "linear"
class = "derived"
reduction.group = [
  { level = "mma", width = "16", order = "sequential" },
  { level = "step", width = "8", order = "sequential" },
]
reduction.k = [{ level = "steps", width = "k/128", order = "sequential" }]
ftz = false
approx = {}
scale_fold = "group"
inputs = ["gaussian", "outliers", "near_overflow", "all_equal", "zero_rows"]
mutations = ["corrupt_block_scale", "swap_scale_granularity", "accumulate:bf16", "symbol:w8a16_gemv_batch4::w8a16_gemv_batch16_strided"]

# 2026-10-09: w8a16_gemm_pipelined.cu: the same order with 32-K steps: E4M3 to BF16 exactly
# (:302-310); two BF16 MMA m16n8k16 per step (:133-169), four steps per 128-K block (:233-234)
# into a zeroed FP32 inner sum; at each block boundary outer += inner * block scale in ascending
# block order (:354-369); one BF16 rounding (:394-397).
[[contract]]
family = "w8a16_gemm"
kernels = ["w8a16_gemm_pipelined::w8a16_gemm_pipelined"]
op = "linear"
reference = "linear"
class = "derived"
reduction.group = [
  { level = "mma", width = "16", order = "sequential" },
  { level = "step", width = "8", order = "sequential" },
]
reduction.k = [{ level = "steps", width = "k/128", order = "sequential" }]
ftz = false
approx = {}
scale_fold = "group"
inputs = ["gaussian", "outliers", "near_overflow", "all_equal", "zero_rows"]
mutations = ["corrupt_block_scale", "swap_scale_granularity", "accumulate:bf16", "symbol:w8a16_gemv_batch4::w8a16_gemv_batch16"]
