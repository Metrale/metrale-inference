# 2026-10-09: GB10 kernel accuracy contracts, one per family entry point set (`met accuracy`;
# schema and rules: crates/accuracy/src/contract.rs; design: book and the crate docs).
#
# Owner: gb10 kernels.
# Invariants:
# - A contract never restates a format: the reference reads the family's `pipeline.<op>` in
#   KERNEL_FAMILIES.toml. It states only what that pipeline does not: the reduction tree of
#   each reduced dimension (`reduction.<dim>`, innermost level first; `sequential` adds its
#   width to the depth, `tree` ceil(log2 width)), flush-to-zero, approximate-function errors,
#   and where block scales fold (`element`: decoded with the value; `group`: on each group's
#   partial sum; `none`).
# - `derived`: every compared output must be a correct rounding of a value inside the bound
#   derived from those declarations. `bit_identical`: the output equals `against`'s byte for
#   byte on the same operands (one-row siblings run once per row).
# - Every contract lists mutations that must fail; a mutation that passes fails the run.
# - Each reduction is read from the kernel source; the comment above it cites the lines.

schema = 1
hardware = "gb10"
seed = 20261009

# 2026-10-09: w4a16_gemv.cu w4a16_gemv_partial + w4a16_gemv_sw: per 16-value chunk a fmaf chain
# (`part`, 16 terms), folded by `acc_c = fmaf(scale, part, acc_c)` with scale = e4m3 * scale2;
# chunks kk = 2*lane + c + 128j give each of two accumulators ceil(K/2048) chunks; acc0 + acc1;
# a 32-lane shuffle tree on each of the two partials; acc_a + acc_b.
[[contract]]
family = "w4a16_gemv"
kernels = ["w4a16_gemv::w4a16_gemv_sw"]
op = "linear"
reference = "linear"
class = "derived"
reduction.group = [{ level = "thread", width = "16", order = "sequential" }]
reduction.k = [
  { level = "thread", width = "k/2048", order = "sequential" },
  { level = "accumulators", width = "2", order = "tree" },
  { level = "warp", width = "32", order = "tree" },
  { level = "partials", width = "2", order = "tree" },
]
ftz = false
approx = {}
scale_fold = "group"
inputs = ["gaussian", "outliers", "near_overflow", "denormal", "all_equal", "zero_rows"]
mutations = ["corrupt_block_scale", "swap_scale_granularity", "accumulate:bf16", "symbol:w4a16_gemv::w4a16_gemv"]

# 2026-10-09: The two- and three-row GEMVs promise each row's bytes equal the one-row
# w4a16_gemv's (w4a16_gemv.cu: one pass over the weight, the same K order per row).
[[contract]]
family = "w4a16_gemv"
kernels = ["w4a16_gemv::w4a16_gemv_batch2", "w4a16_gemv::w4a16_gemv_batch3"]
op = "linear"
reference = "linear"
class = "bit_identical"
against = "w4a16_gemv::w4a16_gemv"
inputs = ["gaussian", "outliers", "zero_rows"]
mutations = ["corrupt_block_scale", "swap_scale_granularity"]

# 2026-10-09: dense_gemv_bf16.cu: 64 threads per output, each a sequential chain over its
# K/64 values (8 per uint4, kv = lane + 64j), a 32-lane shuffle tree, then the two warps' sums.
# dense_gemv_bf16_batchm follows the same order per row (ops/gemm_quant_gemv.rs).
[[contract]]
family = "dense_bf16"
kernels = ["gemv::dense_gemv_bf16"]
op = "linear"
reference = "linear"
class = "derived"
reduction.k = [
  { level = "thread", width = "k/64", order = "sequential" },
  { level = "warp", width = "32", order = "tree" },
  { level = "warps", width = "2", order = "tree" },
]
ftz = false
approx = {}
scale_fold = "none"
inputs = ["gaussian", "outliers", "near_overflow", "denormal", "all_equal", "zero_rows"]
mutations = ["accumulate:bf16", "symbol:gemv::dense_gemv_bf16_fp32out"]

# 2026-10-09: The vocabulary-parallel head: the lm_head rows split over three ranks at
# 64-aligned edges (GLM's capped vocabulary is not a multiple of 64), each shard written at
# its own output columns. The split mutation places every later shard one column off.
[[contract]]
family = "dense_bf16"
kernels = ["dense_gemv_bf16_batchm::dense_gemv_bf16_batchm"]
op = "lm_head"
reference = "linear"
class = "derived"
reduction.k = [
  { level = "thread", width = "k/64", order = "sequential" },
  { level = "warp", width = "32", order = "tree" },
  { level = "warps", width = "2", order = "tree" },
]
ftz = false
approx = {}
scale_fold = "none"
split = { world = 3, align = 64 }
inputs = ["gaussian", "zero_rows"]
mutations = ["split_off_by_one", "accumulate:bf16"]

[[contract]]
family = "dense_bf16"
kernels = ["dense_gemv_bf16_batchm::dense_gemv_bf16_batchm"]
op = "router"
reference = "linear"
class = "bit_identical"
against = "gemv::dense_gemv_bf16"
inputs = ["gaussian", "outliers", "all_equal"]
mutations = ["symbol:gemv::dense_gemv_bf16_fp32out"]

# 2026-10-09: gated_delta_rule.cu gated_delta_rule_decode_f32_strided (:696-813), compiled with
# --fmad=false (common/KERNEL.toml), so every product and sum below rounds in f32. Per value
# column (one thread): hk_dot (:743-751) and q_dot (:773) add each step's four products as
# ((p0 + p1) + p2) + p3 and then into the running sum, k_dim/4 steps; the clamp's sum of squares
# runs k_dim terms in a thread (:780-783), a 32-lane shfl_down tree (:790-791) and the four
# warps' partials in sequence (:797), so v_dim must be 128 (the reference refuses others).
# rsqrtf at :803 and :811 is rsqrt.approx.f32, at most 2 ulp (CUDA math API), i.e. 2^-22
# relative. The output compared is each row's o followed by the new (clamped) state.
[[contract]]
family = "gdn_recurrence_strided"
kernels = ["gated_delta_rule::gated_delta_rule_decode_f32_strided"]
op = "gdn_recurrence"
reference = "gdn_recurrence"
class = "derived"
reduction.k = [
  { level = "quad", width = "4", order = "sequential" },
  { level = "thread", width = "k/4", order = "sequential" },
]
reduction.state_k = [{ level = "thread", width = "k/1", order = "sequential" }]
reduction.state_v = [
  { level = "warp", width = "32", order = "tree" },
  { level = "warps", width = "k/32", order = "sequential" },
]
ftz = false
approx = { rsqrt = "2^-22" }
scale_fold = "none"
inputs = ["gaussian", "outliers", "near_overflow", "denormal", "all_equal", "zero_rows"]
mutations = ["state_stale", "accumulate:bf16"]

# 2026-10-09: gated_delta_rule_decode_f32 (:233-346) is the same text as the strided kernel
# with contiguous rows; the reduction is the strided contract's (:283, :306, :313-316, :324,
# :330; rsqrtf at :336 and :344).
[[contract]]
family = "gdn_recurrence"
kernels = ["gated_delta_rule::gated_delta_rule_decode_f32"]
op = "gdn_recurrence"
reference = "gdn_recurrence"
class = "derived"
reduction.k = [
  { level = "quad", width = "4", order = "sequential" },
  { level = "thread", width = "k/4", order = "sequential" },
]
reduction.state_k = [{ level = "thread", width = "k/1", order = "sequential" }]
reduction.state_v = [
  { level = "warp", width = "32", order = "tree" },
  { level = "warps", width = "k/32", order = "sequential" },
]
ftz = false
approx = { rsqrt = "2^-22" }
scale_fold = "none"
inputs = ["gaussian", "outliers", "near_overflow", "denormal", "all_equal", "zero_rows"]
mutations = ["state_stale", "accumulate:bf16"]

# 2026-10-09: The batched decode arm promises the per-sequence kernel's output and state byte
# for byte (one text, one order per thread); near_overflow drives the state-norm clamp.
[[contract]]
family = "gdn_recurrence_strided"
kernels = ["gated_delta_rule::gated_delta_rule_decode_f32_strided"]
op = "gdn_recurrence"
reference = "gdn_recurrence"
class = "bit_identical"
against = "gated_delta_rule::gated_delta_rule_decode_f32"
inputs = ["gaussian", "outliers", "near_overflow"]
mutations = ["state_stale"]

# 2026-10-09: causal_conv1d.cu causal_conv1d_update_l2norm_f32_strided (:496-557), compiled with
# --fmad=false: per channel the window shifts and takes the input (:521-523), `acc += state[k] *
# w[k]` runs the d_conv taps in order from 0 (:526-527, no bias on the GDN path), the sigmoid is
# rcp.rn(1 + ex2.approx(acc * -log2 e)) (:528, the PTX of __expf and 1/x), and the q/k heads'
# L2 norm sums squares in a 32-lane shfl_down tree (:536-537) and the head's four warps in
# sequence (:544-545) before rsqrtf (:546). ex2.approx.f32 and rsqrt.approx.f32 are at most
# 2 ulp (PTX ISA, CUDA math API), i.e. 2^-22 relative. The output compared is each row's conv
# output followed by its updated window.
[[contract]]
family = "causal_conv1d_l2norm"
kernels = ["causal_conv1d::causal_conv1d_update_l2norm_f32_strided"]
op = "conv1d_update"
reference = "conv1d_l2norm"
class = "derived"
reduction.conv = [{ level = "thread", width = "k/1", order = "sequential" }]
reduction.head = [
  { level = "warp", width = "32", order = "tree" },
  { level = "warps", width = "k/32", order = "sequential" },
]
ftz = false
approx = { ex2 = "2^-22", rsqrt = "2^-22" }
scale_fold = "none"
inputs = ["gaussian", "outliers", "near_overflow", "denormal", "all_equal", "zero_rows"]
mutations = ["state_stale", "accumulate:bf16"]

# 2026-10-09: causal_conv1d_update_l2norm_f32 (:413-472) is the strided kernel's text with
# rows `dim` apart (:437-438, :442, :443, :451-452, :459-461, :465).
[[contract]]
family = "causal_conv1d_l2norm"
kernels = ["causal_conv1d::causal_conv1d_update_l2norm_f32"]
op = "conv1d_update"
reference = "conv1d_l2norm"
class = "derived"
reduction.conv = [{ level = "thread", width = "k/1", order = "sequential" }]
reduction.head = [
  { level = "warp", width = "32", order = "tree" },
  { level = "warps", width = "k/32", order = "sequential" },
]
ftz = false
approx = { ex2 = "2^-22", rsqrt = "2^-22" }
scale_fold = "none"
inputs = ["gaussian", "outliers", "near_overflow", "denormal", "all_equal", "zero_rows"]
mutations = ["state_stale", "accumulate:bf16"]

# 2026-10-09: The batched conv promises the per-sequence kernel's output and window byte for byte.
[[contract]]
family = "causal_conv1d_l2norm"
kernels = ["causal_conv1d::causal_conv1d_update_l2norm_f32_strided"]
op = "conv1d_update"
reference = "conv1d_l2norm"
class = "bit_identical"
against = "causal_conv1d::causal_conv1d_update_l2norm_f32"
inputs = ["gaussian", "outliers", "near_overflow"]
mutations = ["state_stale"]
