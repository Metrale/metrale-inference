# 2026-10-22: The recipe arm of glm_moe_w4a4_grouped with glm_moe_expert_layout tp
# (METRALE_GLM_MOE_W4A4_GROUPED=1, `moe_expert_layout: tp`). The grouped GEMM itself takes only
# launches above 16 rows, but the lever lifts the routed W4A4 row cap (mlp_precision.rs:43-52), so
# every row count runs W4A4 and, under the sliced (tp) layout with METRALE_GLM_MOE_SCALE_DICT on
# (default), the scale-dict plan is Compact (glm5next_mlp/scale_dict.rs:149-161): each routed sweep
# launches its `_cs` twin (glm5next_mlp/scale_dict_kernels.rs:105-120, picked at w4a4.rs:94,257).
# The quantizers are not twinned. The circuit's moe_inter (2048) is a multiple of 128, so down runs
# the plain `_cs` entries; the measured TP=3 slice (704) takes the `_k64_cs` twins.

[[rule]]
id = "glm_moe_w4a4_cs_gate_up_1_kda"
pattern = [
  { op = "act_quant", format = "nvfp4/g16", layer_kind = "linear_attention" },
  { op = "expert_gate_up", weight = "nvfp4/g16", input = "nvfp4/g16", layer_kind = "linear_attention" },
