# 2026-10-03: The exact MTP verify chain (`gdn_verify_exact`: `--exact-verify`, or a fixed GDN
# activation format, ml/qwen3_ssm/gdn_flags.rs `verify_exact_enabled`). The verify's GDN conv,
# recurrence and output norm run the single-token decode's FP32 arithmetic per row, so each row
# is the bits a decode step computes. One sequence's K rows take three launches
# (`trait_decode_batched_conv_gdn_exact_chain.rs`): the FP32 conv chain with the windows written
# inline, the exact recurrence chain with the h states written inline, and one FP32-input
# gated norm over the rows. Where the chain declines (a kernel missing, the fused norm, too few
# rollback slots) legacy runs a per-row arm the circuit does not model; the emitters refuse it.
[[rule]]
id = "gdn_exact_conv_chain_verify"
pattern = [{ op = "conv1d_update" }, { op = "state_snapshot" }, { op = "l2_norm" }]
kernels = [{ module = "gated_delta_rule_carry", func = "gdn_conv_chain_f32" }]
repeat = "once"
emitter = "gdn_exact_conv_chain"
rows = [2, 4]
modes = ["verify"]
when = { ssm_h_dtype = "f32", gdn_verify_exact = "on" }
numerics = "reference"
priority = 100
cite = "ml/qwen3_ssm/trait_decode_batched_conv_gdn_exact_chain.rs:36-96 (one FP32 conv launch for every row, the windows after rows 0..K-2 written inline)"

[[rule]]
id = "gdn_exact_chain_k2_verify"
pattern = [{ op = "gdn_recurrence", input = "f32" }]
kernels = [{ module = "gdn_exact_carry", func = "gdn_exact_chain2" }]
repeat = "once"
emitter = "gdn_exact_chain"
rows = [2, 2]
modes = ["verify"]
when = { ssm_h_dtype = "f32", gdn_verify_exact = "on" }
numerics = "reference"
priority = 10
cite = "ml/qwen3_ssm/trait_decode_batched_conv_gdn_exact_chain.rs:97-117 (the strided decode's chain, the state read once, h after rows 0..K-2 written inline)"

[[rule]]
