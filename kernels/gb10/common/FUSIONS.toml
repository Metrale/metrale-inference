# 2026-10-08: GLM-5 (`glm5_next`, kernels/circuits/glm5_next.toml): the engine's single-sequence
# decode (`Glm5NextLayer::forward_one`, crates/model-arch/src/glm5next_layer/steps/forward.rs).
# Not a golden instance yet: these rules cover the GLM-specific kernels and the BF16 projections
# at one row; the routed experts and the dense MLP (declared W4A4, run by the engine W4A16 and as
# load-time BF16 dequantisations), the draft head, the multi-sequence decode (vetoed; the
# `[[legacy_path]]` of KERNEL_FAMILIES.toml) and the K-row verify have no rule.
# 2026-10-22: They now also cover the K-row verify and the batched decode up to 16 rows (one
# `glm_row_group`), each naming what runs at the default levers: the kernels that take every row
# in one launch are widened to 1..=16 rows; the per-row walks (KDA conv and recurrence, the DSA
# indexer, latent write in a verify, the router GEMV) are `per_row`; the BF16 projections take
# the batched entries in sibling rules. Recipe-only levers (METRALE_GLM_MHC_FUSED, _KDA_SEQ_ROWS,
# _KDA_VERIFY_TOKENS, _DSA_VERIFY_ROWS, _DSA_INDEXER_ROWS, _ROUTER_ROWS, _DSA_DECODE_HB) have no
# rule. Every pattern
# names a GLM-only op, role, local id or param, or a GLM layer kind, so no rule here matches a
# node of another circuit. The engine keeps the hyper-connection highway FP32 (`writes`).

[[rule]]
id = "glm_hc_expand"
pattern = [{ op = "hc_expand", writes = "f32" }]
kernels = [{ module = "glm5next_mhc", func = "glm5next_hc_expand" }]
repeat = "once"
emitter = "glm_hc"
rows = [1, 16]
modes = ["decode", "multi_seq", "verify"]
numerics = "reference"
priority = 10
cite = "crates/model-arch/src/glm5next_mhc.rs:68-87; crates/model-arch/src/glm5next_layer/steps/forward.rs:75; 2026-10-22: one launch over the k rows of a verify (forward_k -> forward_rows_with, crates/model-arch/src/glm5next_layer/steps/forward.rs:232,326) and the 2..=16 rows of a batched decode group (crates/model-arch/src/glm5next_layer/steps/multi_seq.rs:95,197; glm_row_group 16, crates/settings/src/groups/scheduler.rs:48); crates/model-arch/src/glm5next_layer/steps/forward.rs:359-368 (grid = rows)"

[[rule]]
id = "glm_hc_pre"
pattern = [{ op = "linear", role = "hc_mix", input = "f32" }, { op = "hc_pre" }]
kernels = [
  { module = "glm5next_mhc", func = "glm5next_hc_mix_bf16" },
  { module = "glm5next_mhc", func = "glm5next_hc_finish" },
]
repeat = "once"
emitter = "glm_hc"
rows = [1, 16]
modes = ["decode", "multi_seq", "verify"]
numerics = "reference"
priority = 100
cite = "crates/model-arch/src/glm5next_mhc.rs:153-214 (hc_mix_bf16 for the BF16 hc_fn the loader uploads, then hc_finish); crates/model-arch/src/glm5next_layer/steps/forward.rs:87,144; 2026-10-22: one launch over the k rows of a verify (forward_k -> forward_rows_with, crates/model-arch/src/glm5next_layer/steps/forward.rs:232,326) and the 2..=16 rows of a batched decode group (crates/model-arch/src/glm5next_layer/steps/multi_seq.rs:95,197; glm_row_group 16, crates/settings/src/groups/scheduler.rs:48); glm_mhc_fused off (crates/settings/src/groups/kernels.rs:134; crates/model-arch/src/glm5next_layer/steps/mhc_site.rs:161), so the unfused site at crates/model-arch/src/glm5next_layer/steps/forward.rs:,409 (crates/model-arch/src/glm5next_mhc.rs:308-337: hc_mix_bf16 grid [rows, 24]; the `_rows` mix only from 32 tokens, :316-318)"

# 2026-10-22: The recipe arm of glm_mhc_fused (METRALE_GLM_MHC_FUSED=1, the served recipe): each
# mHC site's pre-mix and the RMSNorm after it as one launch. At 1..=2 tokens the decode-step entry
# `glm5next_hc_pre_norm_c1` (glm_mhc_pre_c1, default on); above, `glm5next_hc_pre_norm`; the tok4 and
# tile4 entries (METRALE_GLM_MHC_PRE_TOK / _PRE_TILE) take only 64+ tokens, a prefill sub-chunk. The
# norm's local id (`input_norm`, `post_norm`) keeps these to GLM's sites (DeepSeek-V4.1's are
# `attn_norm` / `ffn_norm`).

[[rule]]
id = "glm_hc_pre_norm_c1_input"
pattern = [
  { op = "linear", role = "hc_mix", input = "f32" },
  { op = "hc_pre", keep = true },
  { op = "rms_norm", local = "input_norm", params = { weight_form = "plain" } },
]
kernels = [{ module = "glm5next_mhc_c1", func = "glm5next_hc_pre_norm_c1" }]
repeat = "once"
emitter = "glm_hc"
rows = [1, 2]
modes = ["decode", "multi_seq", "verify"]
when = { glm_mhc_fused = "on" }
numerics = "reference"
priority = 105
cite = "glm_mhc_fused on (METRALE_GLM_MHC_FUSED=1; crates/settings/src/groups/kernels.rs:134): crates/model-arch/src/glm5next_layer/steps/mhc_site.rs:173 runs glm_hc_pre_norm, the mix, Sinkhorn, collapse and the site's norm (input_layernorm, post_attention_layernorm: crates/model-arch/src/glm5next_layer/steps/forward.rs:90,167) in one launch over the rows; crates/model-arch/src/glm5next_mhc_fused.rs:280-287 (splitk off, then c1, then pre_norm_kernel); crates/model-arch/src/glm5next_mhc_c1.rs:21,27-36 (c1_kernel: 1..=HC_PRE_C1_MAX_TOKENS tokens at hc 4, H 4096; glm_mhc_pre_c1 default on, crates/settings/src/groups/kernels.rs:139); ROUTING-AUDIT.md `glm_hc_pre` (the unfused default arm)"

