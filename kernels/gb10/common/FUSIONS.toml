# 2026-10-23 (P0-prereq): The vocab-sharded LM head's gather. Decode sums the zero-padded
# logits rows (309,760 bytes a row: one-shot up to three rows, `tp_all_gather_as_sum`) before the
# argmax; the screened
# K=2 verify head (METRALE_SCREEN_HEAD) instead scans its INT8 copy, rescores the rows a bound
# cannot rule out, exchanges each row's 16-byte best key and keeps the largest, the same tokens as
# the full head.

[[rule]]
id = "glm_screen_head_k2"
pattern = [
  { op = "lm_head", block = "head" },
  { op = "all_gather", block = "head", elides = true },
