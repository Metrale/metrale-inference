# 2026-09-28: GB10 fusion rules: which kernel covers which op chain, per mode and padded row
# count. These rules encode the decode, multi-sequence, verify and draft routing the engine
# makes today for the dense Qwen3.8-27B and the Qwen3.6-35B-A3B MoE, so the golden plans in
# kernels/circuits/plans/ reproduce it exactly. kernels/circuits/ROUTING-AUDIT.md cites every
# rule's dispatch site and lists what the rules cannot express yet.
#
# Owner: gb10 kernels (schema: crates/circuit/src/rules.rs).
# Invariants:
# - `numerics = "reference"` marks today's default, grandfathered as the reference even where
#   it rounds differently from the unfused chain. `bit_identical` needs a `microtest`;
#   `differs` needs the opt-in `lever` and is never selected without it.
# - A `when` key must be stated by every policy (kernels/circuits/INSTANCES.toml); a rule is
#   never selected under a setting it does not name.
# - Priorities: 200 opt-in (`differs`) rules, 110 multi-row multi-op arms over their per-row
#   twins (the batched GDN recurrence), 100 multi-op fused rules, 50 row-tier overrides, 20
#   narrow single-op overrides, 10 single-op defaults, 5 fallbacks.
# - `[[runtime]]` routes (schema: crates/circuit/src/runtime.rs) name a condition the engine
#   checks per step and the settings its other arm plans as; plans, reports and the executor
#   carry both arms.
# - 2026-10-02: A pattern element's `holds = "<format>"` is the format the kernel hands its outputs
#   to later members of the group in, where that is not the stored format; `steps = { <step> =
#   "<value>" }` are the steps the routing runs at another value than the reference requirement
#   (an activation quantized inside the group, a sum rounded to BF16). Both are departures the
#   plan prints `(rule)` and the kernel family must declare (crates/circuit/src/pipeline).
# - `cite` abbreviations: ml/ = crates/model-layers/src/layers/, me/ =
#   crates/model-engine/src/model/trait_impl/, mm/ = crates/model-engine/src/model/,
#   k/ = kernels/gb10/common/. crates/circuit/tests/circuits.rs checks every cited file exists
#   and holds the cited line.

schema = 1

# 2026-09-28: Embedding, norms, residuals.

[[rule]]
id = "embed_row_copy"
pattern = [{ op = "embed" }]
kernels = []
repeat = "once"
emitter = "embed_copy"
rows = [1, 128]
modes = ["decode", "multi_seq", "verify", "draft", "verify_batch"]
numerics = "reference"
priority = 10
cite = "me/decode_a2.rs:241-254 (one D2D copy per row, padding rows memset); ml/mtp_head/forward.rs:82-83"

[[rule]]
id = "input_norm_residual"
pattern = [{ op = "rms_norm", local = "input_norm" }]
kernels = [{ module = "norm", func = "rms_norm_residual" }]
repeat = "once"
emitter = "rms_norm_residual"
rows = [1, 128]
modes = ["decode", "multi_seq", "verify", "verify_batch"]
numerics = "reference"
priority = 10
cite = "ml/qwen3_ssm/trait_decode.rs:38-49; ml/qwen3_attention/trait_impl/decode_inner.rs:76-87; ml/qwen3_attention/trait_impl/multi_seq/mod.rs:58-69; ml/qwen3_ssm/trait_decode_multi_seq/ssm_batched.rs:170-183; ml/qwen3_ssm/trait_decode_batched.rs:193"

[[rule]]
id = "draft_rms_norm"
pattern = [{ op = "rms_norm" }]
kernels = [{ module = "norm", func = "rms_norm" }]
repeat = "once"
emitter = "rms_norm"
rows = [1, 128]
modes = ["draft"]
numerics = "reference"
priority = 5
cite = "ml/mtp_head/forward.rs:86-96,103-113,152-162 (the residual copy is a D2D copy at :148); ml/mtp_head/forward_batch/position.rs:61-70,140-150 (n rows; the target hiddens at :84-94 are normed one row per launch there and in one n-row launch here, stacked by the host, ml/mtp_head/forward_batch/position/circuit.rs; rms_norm is one block per row)"

# 2026-10-02: The norm takes its sum of squares from the FP32 sum before the BF16 rounding
# (rms_norm.cu:409-412): `y` is stored BF16 and held as f32.
[[rule]]
id = "residual_add_post_norm"
pattern = [
  { op = "residual_add", local = "add", keep = true, holds = "f32" },
  { op = "rms_norm", local = "post_norm" },
]
kernels = [{ module = "norm", func = "residual_add_rms_norm" }]
repeat = "once"
emitter = "residual_add_rms_norm"
rows = [1, 128]
modes = ["decode", "multi_seq", "verify", "draft", "verify_batch"]
numerics = "reference"
priority = 100
cite = "k/rms_norm.cu:379-382 (FP32 sum of squares before the BF16 rounding: not the unfused chain); ml/qwen3_ssm/trait_decode.rs:117-129; ml/qwen3_attention/trait_impl/decode_inner.rs:241-253; ml/qwen3_ssm/trait_decode_multi_seq/ssm_batched.rs:247-261; ml/qwen3_attention/trait_impl/multi_seq/ffn.rs:131-143; ml/qwen3_ssm/trait_decode_batched.rs:284; ml/mtp_head/forward.rs:306-318"

[[rule]]
id = "ffn_residual_add"
pattern = [{ op = "residual_add", local = "add" }]
kernels = [{ module = "residual_add", func = "bf16_residual_add" }]
repeat = "once"
emitter = "residual_add"
rows = [1, 128]
modes = ["decode", "multi_seq", "verify", "draft", "verify_batch"]
numerics = "reference"
priority = 10
cite = "ml/qwen3_ssm/trait_decode.rs:143-150; ml/qwen3_attention/trait_impl/decode_inner.rs:384-391; ml/qwen3_attention/trait_impl/multi_seq/ffn.rs:147-154; ml/qwen3_ssm/trait_decode_multi_seq.rs:212,235 (after the prefill and km arms); ml/qwen3_ssm/trait_decode_batched.rs:323-334; ml/mtp_head/forward.rs:337"

[[rule]]
id = "ffn_residual_add_per_row_gdn_k2k3"
pattern = [{ op = "residual_add", local = "add", layer_kind = "linear_attention" }]
kernels = [{ module = "residual_add", func = "bf16_residual_add" }]
repeat = "per_row"
emitter = "residual_add"
rows = [2, 3]
modes = ["multi_seq"]
when = { row_tiers = "by_rows" }
numerics = "reference"
priority = 20
cite = "ml/qwen3_ssm/trait_decode_multi_seq.rs:178-196 (the n == 2 | 3 arm adds each row's FFN output in a loop, :192)"

[[rule]]
id = "final_norm"
pattern = [{ op = "final_norm" }]
kernels = [{ module = "norm", func = "rms_norm" }]
repeat = "once"
emitter = "rms_norm"
rows = [1, 128]
modes = ["decode", "multi_seq", "verify", "draft", "verify_batch"]
numerics = "reference"
priority = 10
cite = "me/decode_a3.rs:108-111; mm/impl_a3_norm.rs:23-51; me/verify_c2.rs:341; ml/mtp_head/forward.rs:340-350"

# 2026-09-28: GatedDeltaNet mixer. 2026-09-30: One row (decode) runs the per-row kernels whatever
# `ssm_batched_recurrent` says: the single-sequence path does not read it. A multi-sequence step
# runs the batched arm under `on` (the `*_batched` rules below outrank the per-row ones) and the
# per-row loop under `off`, or under `on` when the state slots are not contiguous (the
# `gdn_state_slots_fragmented` route).

# 2026-10-02: The b|a projection hands its FP32 sums to the gates in registers
# (ssm_preprocess.cu:430-459): `ba` is held as f32 (crates/circuit/src/pipeline).
[[rule]]
id = "gdn_ba_gates_gemv_per_row"
pattern = [{ op = "linear", role = "ba", holds = "f32" }, { op = "gdn_gates" }]
kernels = [{ module = "ssm_preprocess", func = "dense_gemv_ba_gates" }]
repeat = "per_row"
emitter = "dense_gemv_ba_gates"
rows = [1, 128]
modes = ["decode", "multi_seq"]
numerics = "reference"
priority = 100
cite = "ml/qwen3_ssm/ssm_forward.rs:181-196; ml/qwen3_ssm/trait_decode_multi_seq/ssm_batched_recurrent/per_seq.rs:65-78 (the per-sequence loop: one row, the `off` arm, or the fragmented-slots route)"

# 2026-10-02: The b|a projection hands its FP32 sums to the gates in registers
# (ssm_preprocess.cu:430-459): `ba` is held as f32 (crates/circuit/src/pipeline).
[[rule]]
id = "gdn_ba_gates_gemm_verify"
pattern = [{ op = "linear", role = "ba", holds = "f32" }, { op = "gdn_gates" }]
kernels = [{ module = "ssm_preprocess", func = "dense_gemm_ba_gates_prefill" }]
repeat = "once"
emitter = "dense_gemm_ba_gates"
rows = [2, 128]
modes = ["verify", "verify_batch"]
numerics = "reference"
priority = 100
cite = "ml/qwen3_ssm/trait_decode_batched/gates_norm.rs:37-59 (kill switch METRALE_NO_BATCHED_BA_GATES)"

[[rule]]
id = "gdn_conv_l2_f32_per_row"
pattern = [{ op = "conv1d_update" }, { op = "state_snapshot" }, { op = "l2_norm" }]
kernels = [{ module = "causal_conv1d", func = "causal_conv1d_update_l2norm_f32" }]
repeat = "per_row"
emitter = "conv1d_update_l2norm"
rows = [1, 128]
modes = ["decode", "multi_seq"]
numerics = "reference"
priority = 100
cite = "ml/qwen3_ssm/ssm_forward.rs:213-233; ml/qwen3_ssm/trait_decode_multi_seq/ssm_batched_recurrent/per_seq.rs:99-113"

[[rule]]
id = "gdn_conv_l2_bf16_verify"
pattern = [
  { op = "conv1d_update" },
  { op = "state_snapshot" },
  { op = "l2_norm", writes = "bf16" },
]
kernels = [{ module = "causal_conv1d", func = "causal_conv1d_update_l2norm" }]
repeat = "per_row"
copies = "per_row_but_last"
emitter = "conv1d_update_l2norm"
rows = [2, 4]
modes = ["verify"]
numerics = "reference"
priority = 100
cite = "ml/qwen3_ssm/trait_decode_batched_conv_gdn.rs:105-110 (BF16 conv rows, not bitwise equal to decode's FP32 conv), :114-331 (the conv window copied to conv_state_intermediates[t] after each row but the last)"

[[rule]]
id = "gdn_recurrence_f32_per_row"
pattern = [{ op = "gdn_recurrence", input = "f32" }]
kernels = [{ module = "gated_delta_rule", func = "gated_delta_rule_decode_f32" }]
repeat = "per_row"
emitter = "gdn_decode"
rows = [1, 128]
modes = ["decode", "multi_seq"]
when = { ssm_h_dtype = "f32" }
numerics = "reference"
priority = 10
cite = "ml/qwen3_ssm/ssm_forward.rs:266,330-347; ml/qwen3_ssm/trait_decode_multi_seq/ssm_batched_recurrent/per_seq.rs:195-212"

[[rule]]
id = "gdn_recurrence_f32_fused_norm"
pattern = [{ op = "gdn_recurrence", input = "f32" }, { op = "gated_rms_norm" }]
kernels = [{ module = "gated_delta_rule", func = "gated_delta_rule_decode_f32_norm" }]
repeat = "per_row"
emitter = "gdn_decode_f32_norm"
rows = [1, 1]
modes = ["decode"]
when = { ssm_h_dtype = "f32" }
numerics = "differs"
lever = "gdn_fused_norm"
priority = 200
cite = "ml/qwen3_ssm/ssm_forward.rs:284-307 (--gdn-fused-norm, default off: crates/server/src/cli/serve_args.rs:197-206); k/gated_delta_rule.cu:940-942,1051 (the fused kernel clamps the state norm, the unfused one does not)"

# 2026-09-30: The same lever on the per-sequence multi-sequence arm. Under `on` the batched arm
