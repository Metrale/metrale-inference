# 2026-10-03: MoE FFN (owner: the MoE circuit workstream, LIFECYCLE-DESIGN.md 15.11).
# Every decode, multi-sequence, verify and batched-verify width of the FP8 MoE runs one path:
# the grouped decode `forward_fp8_grouped_decode_routed` with the per-row router (`PerRow`).
# One row through `MoeLayer::forward` (ml/moe/forward.rs:39, the tensor-core delegation of
# ml/moe/fp8_grouped_tc.rs); many rows under the row-invariant canonical tiers
# (ml/qwen3_attention/trait_impl/multi_seq/ffn.rs:98-109, ml/qwen3_ssm/trait_decode_multi_seq.rs:173-174,
# ml/qwen3_ssm/trait_decode_batched.rs:300-311), up to FP8_GROUPED_DECODE_TC_MAX_ROWS = 256
# (ml/moe/forward_fp8_grouped_decode.rs:35). The tensor-core expert kernels are the gb10 default
# (ml/moe/fp8_grouped_tc.rs:74). Their kill switch, METRALE_NO_MOE_FP8_TC, is the policy setting
# `moe_fp8_tc` (on unless it is present); no rule plans it off, so the executor refuses it: the
# scalar arms it selects (path A at one row, the scalar grouped decode at 2..=64, forward_prefill
# above) are a debugging fallback the flip deletes with the legacy loops. The expert step is W8A8 exactly when the serve publishes FP8 expert activations
# (ml/moe/forward_fp8_grouped_decode.rs:340, ml/moe/fp8_grouped_tc_w8a8.rs:100-126): the plan
# then carries the act_quant nodes the declared precision inserts. The MTP drafter's one-row step
# is `MoeLayer::forward` too (ml/mtp_head/forward.rs:332); its n-row propose routes batched
# (ml/mtp_head/forward_batch_ffn.rs:132, `forward_fp8_grouped_decode`).

# 2026-10-02: A BF16 MoE drafter (the MTP head of nvidia/Qwen3.6-35B-A3B-NVFP4, excluded from
# quantization) at one row: `MoeLayer::forward`'s BF16-expert arm (`set_bf16_experts`, built by
# mtp_head/new_bf16_moe.rs). Above one row the batched propose runs the grouped BF16 point.
[[rule]]
id = "moe_gate_up_shared_bf16"
pattern = [
  { op = "expert_gate_up", weight = "bf16", keep = true },
  { op = "linear", role = "shared_gate_up", sibling = true },
]
