kernels = [{ module = "w4a16", func = "w4a16_gemm_t" }]
repeat = "once"
emitter = "lm_head_nvfp4_tile"
rows = [1, 256]
modes = ["multi_seq", "verify", "verify_batch"]
when = { lm_head_dtype = "nvfp4", row_tiers = "canonical", lm_head_nvfp4_rows = "off" }
numerics = "reference"
priority = 20
cite = "me/lm_head_batched.rs:270-309 (row_invariant: the tile GEMM at every padded_n); mm/impl_a3_lm_head.rs:57-101,140-146 (the verify heads' wide arm under row_invariant)"

