# 2026-09-28: GB10 fusion rules: which kernel covers which op chain, per mode and padded row
# count. These rules encode the decode, multi-sequence, verify and draft routing the engine
# makes today for the dense Qwen3.8-27B and the Qwen3.6-35B-A3B MoE, so the golden plans in
# kernels/circuits/plans/ reproduce it exactly. kernels/circuits/ROUTING-AUDIT.md cites every
# rule's dispatch site and lists what the rules cannot express yet.
#
# Owner: gb10 kernels (schema: crates/circuit/src/rules.rs).
# Invariants:
# - `numerics = "reference"` marks today's default, grandfathered as the reference even where
#   it rounds differently from the unfused chain. `bit_identical` needs a `microtest`;
#   `differs` needs the opt-in `lever` and is never selected without it.
# - 2026-10-05: Each rule is a lowering clause (book/src/architecture/circuit-compiler.md).
#   Only `bit_identical` rules are relations of the LKB; `reference` rules define the reference
#   numerics; `differs` rules are another numerics point. A `bit_identical` rule may become the
#   default (its `when` setting on in every policy that can use it) on byte identity plus a
#   same-box A/B with no speed and no energy regression, with no accuracy gate
#   (docs/adr/0018-relations-become-defaults-on-bytes-speed-and-energy.md). A `when` key that
#   gates only `bit_identical` rules is the compiler's choice, never a recipe's (ADR-0019).
# - 2026-10-05: A pattern element's `params = { <key> = "<value>" }` requires the node's circuit
#   params to equal them: a kernel written for one architecture variant (a softmax router top-k)
#   never lowers another (a sigmoid-with-bias router), whatever its formats.
# - A `when` key must be stated by every policy (kernels/circuits/INSTANCES.toml); a rule is
#   never selected under a setting it does not name.
# - Priorities: 200 opt-in (`differs`) rules, 110 multi-row multi-op arms over their per-row
#   twins (the batched GDN recurrence), 100 multi-op fused rules, 50 row-tier overrides, 20
#   narrow single-op overrides, 10 single-op defaults, 5 fallbacks.
# - `[[runtime]]` routes (schema: crates/circuit/src/runtime.rs) name a condition the engine
#   checks per step and the settings its other arm plans as; plans, reports and the executor
#   carry both arms.
# - 2026-10-02: A pattern element's `holds = "<format>"` is the format the kernel hands its outputs
#   to later members of the group in, where that is not the stored format; `steps = { <step> =
#   "<value>" }` are the steps the routing runs at another value than the reference requirement
#   (an activation quantized inside the group, a sum rounded to BF16). Both are departures the
#   plan prints `(rule)` and the kernel family must declare (crates/circuit/src/pipeline).
# - `cite` abbreviations: ml/ = crates/model-layers/src/layers/, me/ =
#   crates/model-engine/src/model/trait_impl/, mm/ = crates/model-engine/src/model/,
#   k/ = kernels/gb10/common/. crates/circuit/tests/circuits.rs checks every cited file exists
#   and holds the cited line.

schema = 1

# 2026-09-28: Embedding, norms, residuals.

[[rule]]
id = "embed_row_copy"
pattern = [{ op = "embed" }]
kernels = []
repeat = "once"
emitter = "embed_copy"
rows = [1, 128]
modes = ["decode", "multi_seq", "verify", "draft", "verify_batch"]
numerics = "reference"
priority = 10
cite = "me/decode_a2.rs:241-254 (one D2D copy per row, padding rows memset); ml/mtp_head/forward.rs:82-83"

[[rule]]
id = "input_norm_residual"
pattern = [{ op = "rms_norm", local = "input_norm" }]
kernels = [{ module = "norm", func = "rms_norm_residual" }]
repeat = "once"
emitter = "rms_norm_residual"
rows = [1, 128]
modes = ["decode", "multi_seq", "verify", "verify_batch"]
numerics = "reference"
priority = 10
cite = "ml/qwen3_ssm/trait_decode.rs:38-49; ml/qwen3_attention/trait_impl/decode_inner.rs:76-87; ml/qwen3_attention/trait_impl/multi_seq/mod.rs:58-69; ml/qwen3_ssm/trait_decode_multi_seq/ssm_batched.rs:170-183; ml/qwen3_ssm/trait_decode_batched.rs:193"

[[rule]]
id = "draft_rms_norm"
pattern = [{ op = "rms_norm" }]
kernels = [{ module = "norm", func = "rms_norm" }]
repeat = "once"
emitter = "rms_norm"
rows = [1, 128]
modes = ["draft"]
numerics = "reference"
priority = 5
cite = "ml/mtp_head/forward.rs:86-96,103-113,152-162 (the residual copy is a D2D copy at :148); ml/mtp_head/forward_batch/position.rs:61-70,140-150 (n rows; the target hiddens at :84-94 are normed one row per launch there and in one n-row launch here, stacked by the host, ml/mtp_head/forward_batch/position/circuit.rs; rms_norm is one block per row)"

# 2026-10-02: The norm takes its sum of squares from the FP32 sum before the BF16 rounding
# (rms_norm.cu:409-412): `y` is stored BF16 and held as f32.
[[rule]]
id = "residual_add_post_norm"
pattern = [
  { op = "residual_add", local = "add", keep = true, holds = "f32" },
  { op = "rms_norm", local = "post_norm" },
]
kernels = [{ module = "norm", func = "residual_add_rms_norm" }]
repeat = "once"
emitter = "residual_add_rms_norm"
rows = [1, 128]
modes = ["decode", "multi_seq", "verify", "draft", "verify_batch"]
numerics = "reference"
priority = 100
cite = "k/rms_norm.cu:379-382 (FP32 sum of squares before the BF16 rounding: not the unfused chain); ml/qwen3_ssm/trait_decode.rs:117-129; ml/qwen3_attention/trait_impl/decode_inner.rs:241-253; ml/qwen3_ssm/trait_decode_multi_seq/ssm_batched.rs:247-261; ml/qwen3_attention/trait_impl/multi_seq/ffn.rs:131-143; ml/qwen3_ssm/trait_decode_batched.rs:284; ml/mtp_head/forward.rs:306-318"

[[rule]]
