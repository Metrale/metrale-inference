# 2026-09-30: The declared W8A8 decode projections (`--weight-quantization declared`, FP8 weights
# with per-channel scales and FP8 per-token activations: unsloth/Qwen3.8-27B's attention, GDN and
# the FFN of layers 56-63). Every decode, verify and multi-sequence path tries the W8A8 arm first
# at 1..=ops::W8A8_MAX_ROWS rows (ml/w8a8_layer.rs; ml/qwen3_attention/w8a8_decode_arm.rs;
# ml/qwen3_ssm/w8a8_decode.rs; ml/dense_ffn_w8a8.rs). One quantize launch into the per-token E4M3
# activation, then one GEMV per projection; the GEMV entry is chosen by the launch's rows
# (ml/ops/w8a8_decode.rs `entry_index`: every entry sums in the same order).

[[rule]]
id = "w8a8_act_quant_row"
pattern = [{ op = "act_quant", format = "fp8/token" }]
kernels = [{ module = "w8a8_act_quant", func = "w8a8_act_quant_row" }]
repeat = "once"
emitter = "w8a8_act_quant"
rows = [1, 128]
modes = ["decode", "multi_seq", "verify", "verify_batch"]
numerics = "reference"
priority = 10
cite = "ml/ops/w8a8_decode.rs:283-327 (w8a8_act_quant: one launch, one scale per row); ml/w8a8_layer.rs:50-80 (proj: quantize, then the GEMV)"

[[rule]]
id = "w8a8_act_quant_silu_row"
pattern = [{ op = "silu_mul", local = "act" }, { op = "act_quant", format = "fp8/token" }]
kernels = [{ module = "w8a8_act_quant", func = "w8a8_act_quant_silu_row" }]
repeat = "once"
emitter = "w8a8_act_quant"
rows = [1, 128]
modes = ["decode", "multi_seq", "verify", "verify_batch"]
numerics = "reference"
priority = 60
cite = "ml/dense_ffn_w8a8.rs:72-74; ml/w8a8_layer.rs:82-116 (silu_proj: bf16(silu(gate) * up) quantized in one launch)"

