# 2026-10-22: GLM-5's routed experts at declared W4A4 (`w4a4_experts`): the rows quantized once
# under the checkpoint's static input scale (`w4a4_quant_rows_static`), then the persistent sweep
# `sweep_kernel` picks by rows: at one row over the row's own slots, at 2..=8 and 9..=16 rows the
# 8- and 16-row union sweep over the union of the rows' experts (`glm5next_moe_row_union`, built
# once before gate/up and read again by down). Gate/up take the stream-ordered `_sl` entries;
# down keeps its PDL entries. The circuit's moe_inter (2048) is a multiple of 128, so down runs
# the plain entries, not the `_k64` twins a TP=3 slice (704) takes. Each rule chains through the
# act_quant node at 110 so the static quantizer, not `w4a4_act_quant`'s dynamic one, covers it;
# one rule per GLM layer kind, as no expert node names a GLM-only op or param. Above 16 rows the
# grouped W4A4 GEMM runs (`takes_grouped`), which no rule here covers.

[[rule]]
id = "glm_moe_w4a4_gate_up_1_kda"
pattern = [
  { op = "act_quant", format = "nvfp4/g16", layer_kind = "linear_attention" },
  { op = "expert_gate_up", weight = "nvfp4/g16", input = "nvfp4/g16", layer_kind = "linear_attention" },
]
kernels = [
  { module = "w4a4_gemv_mx_moe", func = "w4a4_quant_rows_static" },
  { module = "w4a4_gemv_mx_moe", func = "w4a4_gemv_mx8_moe_slots_sweep" },
]
repeat = "once"
emitter = "glm_moe_w4a4"
rows = [1, 1]
modes = ["decode"]
numerics = "reference"
priority = 110
cite = "crates/model-arch/src/glm5next_mlp/forward/w4a4.rs:394-407,430-438 (quant_static, then the own-slots sweep `sweep_kernel` picks at one row, :170-188); crates/model-arch/src/glm5next_mlp/mod.rs:354-370"

