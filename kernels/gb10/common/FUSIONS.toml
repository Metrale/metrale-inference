# 2026-10-05: The checkpoint's own NVFP4 experts under `--weight-quantization declared`
# (nvidia/Qwen3.6-35B-A3B-NVFP4): every decode, multi-sequence, verify and batched-verify width
# takes the grouped NVFP4 decode (moe/forward_nvfp4_grouped_decode.rs, admitted to 256 rows when
# the experts are declared) with the per-row router, top-k, sort and blend above. Its expert step
# is one group: gate+up writes each SiLU product as a BF16 hi + lo pair in the FP32 row space
# of the arena's `expert_gate_out` (routed, by sorted position) and `logits` (shared, by
# token), which only the down kernel reads, as legacy lays them out; no edge carries them.
# The pair is the one the layer's own dispatch picks (`Nvfp4GroupedKernels::select`): the lean
# pair once the loader repacked the tables in place (moe/nvfp4_lean.rs, byte-identical outputs),
# else the row-major tensor-core pair. `moe_nvfp4_kernels` states which, read from the bound
# layers; `cuda_core` (METRALE_NO_MOE_NVFP4_TC) has no rule and is refused.
[[rule]]
id = "moe_experts_grouped_nvfp4_lean"
pattern = [
  { op = "expert_gate_up", weight = "nvfp4/g16" },
  { op = "silu_mul", local = "experts_act" },
  { op = "expert_down", weight = "nvfp4/g16", keep = true },
  { op = "linear", role = "shared_gate_up", sibling = true },
  { op = "silu_mul", local = "shared_act" },
  { op = "linear", role = "shared_down" },
]
kernels = [
  { module = "moe_nvfp4_grouped_tc", func = "moe_expert_gate_up_act_nvfp4_grouped_tc_lean" },
  { module = "moe_nvfp4_grouped_tc", func = "moe_expert_down_act_nvfp4_grouped_tc_lean" },
]
repeat = "once"
emitter = "moe_grouped_experts"
rows = [1, 256]
modes = ["decode", "multi_seq", "verify", "verify_batch"]
when = { moe_nvfp4_kernels = "lean" }
numerics = "reference"
priority = 100
cite = "ml/moe/forward_nvfp4_grouped_decode.rs:410-474 (gate+up, then down; the shared expert's rows in the same launches); ml/moe/nvfp4_lean.rs:28-39 (the lean pair once repacked)"

