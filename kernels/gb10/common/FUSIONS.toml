# 2026-09-30: The declared W4A4 dense FFN (NVFP4 weights with FP4 activations: unsloth/Qwen3.8-27B's
# FFN of layers 0-55) at the rows `forward_km` serves, 1..=32 (the FFN edge,
# ml/w4a16_gemv_tiers.rs:177-179): the single row (ml/dense_ffn_decode.rs:252-261), 2 and 3 rows
# (forward_k2/k3 under `small_batch_w4a4`), and 4..=32 (ml/qwen3_attention/trait_impl/multi_seq/
# ffn.rs:191-222). Each projection quantizes its input per row to NVFP4 (`w4a4_quant_rows`, the up
# projection reuses gate's) and runs the FP4 MMA entry `mx_plan` picks for its rows and N at the
# default levers (ml/ops/w4a4_proj/mx_plan.rs:96-127); the executor refuses a plan whose entry is
# not that pick.

[[rule]]
id = "w4a4_act_quant"
pattern = [{ op = "act_quant", format = "nvfp4/g16" }]
kernels = [{ module = "w4a4_gemv_mx", func = "w4a4_quant_rows" }]
repeat = "once"
emitter = "w4a4_act_quant"
rows = [1, 32]
modes = ["decode", "multi_seq", "verify", "verify_batch"]
numerics = "reference"
priority = 10
cite = "ml/ops/w4a4_proj.rs:331-347 (the quantize launch of nvfp4_proj_small_m, skipped for up's same input)"

