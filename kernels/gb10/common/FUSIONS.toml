# 2026-09-30: The batched arm's run-time fallback. The per-sequence loop it falls back to is the
# code the `off` arm runs (per_seq.rs, `decode_ms_ssm_recurrent_per_seq`), so the route plans as
# `off`.
[[runtime]]
id = "gdn_state_slots_fragmented"
