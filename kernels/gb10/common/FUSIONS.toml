# which no rule models; the executor refuses the lever.
[[rule]]
id = "gdn_recurrence_f32_fused_norm_per_row"
pattern = [{ op = "gdn_recurrence", input = "f32" }, { op = "gated_rms_norm" }]
kernels = [{ module = "gated_delta_rule", func = "gated_delta_rule_decode_f32_norm" }]
repeat = "per_row"
emitter = "gdn_decode_f32_norm"
rows = [2, 128]
modes = ["multi_seq"]
when = { ssm_h_dtype = "f32", ssm_batched_recurrent = "off" }
numerics = "differs"
lever = "gdn_fused_norm"
priority = 200
cite = "ml/qwen3_ssm/trait_decode_multi_seq/ssm_batched_recurrent/per_seq.rs:160-190 (the per-sequence arm's fused norm); ml/qwen3_ssm/trait_decode_multi_seq/ssm_batched_recurrent.rs:221-262 (the batched arm's strided fused norm, not modelled)"

[[rule]]
