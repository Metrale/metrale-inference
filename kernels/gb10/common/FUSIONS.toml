# 2026-10-08: The absorbed latent attention on load-time products: `q_absorb` is q_b_proj times
# kv_b_proj's key half and `o_absorb` o_proj times its value half (glm5next_dsa/layer.rs:67-78),
# each a BF16 GEMV with a wider weight than the checkpoint's (32768 x 1536 for q, 4096 x 32768 for
# o, against 16384 x 1536 and 4096 x 16384), then the latent decode between them.
[[rule]]
id = "glm_mla_absorbed"
pattern = [
  { op = "linear", role = "mla_q_b", weight = "bf16" },
  { op = "mla_attention" },
  { op = "linear", role = "o", weight = "bf16", layer_kind = "deepseek_sparse_attention" },
]
kernels = [
  { module = "gemv", func = "dense_gemv_bf16" },
  { module = "glm5next_dsa_mla_decode", func = "glm5next_dsa_mla_decode_fp8" },
  { module = "gemv", func = "dense_gemv_bf16" },
]
repeat = "once"
emitter = "dsa"
rows = [1, 1]
modes = ["decode"]
when = { kv_cache_dtype = "fp8" }
numerics = "reference"
priority = 100
cite = "crates/model-arch/src/glm5next_dsa/layer/row_ops.rs:54-66,142-154; crates/model-arch/src/glm5next_dsa/layer.rs:295-365 (attend_rows); crates/model-arch/src/glm5next_dsa/attend.rs:154-181"

