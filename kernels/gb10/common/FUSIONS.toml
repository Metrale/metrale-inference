  { op = "linear", role = "kda_g_a", weight = "nvfp4/g16", input = "bf16", layer_kind = "linear_attention", sibling = true },
]
kernels = [
  { module = "w4a16_gemv_pipe", func = "w4a16_gemv_pipe_m1" },
]
repeat = "once"
emitter = "glm_w4a16"
rows = [1, 1]
modes = ["decode"]
when = { glm_w4a16_gemv_seg = "on" }
numerics = "reference"
priority = 130
cite = "crates/model-arch/src/glm5next_w4a16_seg.rs:246-256 (seg_gemv: one row, or 2..=gemv_rows rows; pipe_rows: glm_w4a16_gemv_pipe default on, crates/settings/src/groups/kernels.rs:164); crates/model-arch/src/glm5next_w4a16_dense.rs:446-495 (group_of_six, proj_group_registered); crates/model-layers/src/layers/ops/w4a16_gemv_pipe.rs:47-53 (w4a16_gemv_pipe_m1, _m2); crates/model-arch/src/glm5next_kda/mod.rs:291-292, crates/model-arch/src/glm5next_kda/plan.rs:105-154 (the six projections of one row as one group)"

