# 2026-10-23: The FP8 copy of the rank's vocab shard (each row FP8 E4M3 with one F32 scale), then
# the shard's argmax, packed with the rank's id and value into its lanes of a 24-byte row that the
# all-reduce concatenates (the lanes are disjoint), and the global pick.
[[rule]]
id = "glm_mtp_head_fp8_xchg"
pattern = [
  { op = "lm_head", block = "glm_mtp_out", steps = { weight = "fp8/channel->f32", mma = "bf16*f32", scale = "f32" } },
  { op = "all_gather", block = "glm_mtp_out", elides = true },
  { op = "argmax", block = "glm_mtp_out" },
]
comm = [{ api = "exchange", kernel = "ncclDevKernel_SendRecv", at = 3 }]
kernels = [
  { module = "gemv_fp8w", func = "dense_gemv_fp8w" },
  { module = "argmax", func = "argmax_bf16" },
  { module = "glm5next_mtp_xchg", func = "glm5next_mtp_xchg_pack" },
  { module = "bf16_add", func = "bf16_add_rank_sum" },
  { module = "glm5next_mtp_xchg", func = "glm5next_mtp_xchg_pick" },
]
repeat = "once"
emitter = "glm_mtp_head"
rows = [1, 1]
modes = ["draft"]
numerics = "reference"
priority = 30
cite = "crates/model-arch/src/glm5next_mtp_head/head_sweep.rs:148-158,184 (the FP8 shard GEMV, then argmax_bf16); crates/model-arch/src/glm5next_mtp_head.rs:376-414 (xchg_pack, all_reduce_async of xchg_bytes(3) = 24 bytes, crates/model-arch/src/glm5next_mtp_head/head_xchg.rs:28-36, then xchg_pick)"

