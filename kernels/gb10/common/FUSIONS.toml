# 2026-10-03: The batched MTP verify under the exact chain (`gdn_verify_exact`), one launch
# schedule per run (`trait_decode_batched_conv_gdn_multi.rs:89-154`): a carried run whose
# sequences sit on consecutive conv slots is `gdn_carry_conv_f32` then `gdn_exact_carry{k}`
# (`_lazy` from 8 sequences) over the run, the accepted rows left pending in the stash
# (`decode_batched_conv_gdn_multi_exact_carry`); any other carried run folds its pending rows with
# the model directory's exact fold and runs each sequence's chain alone, as the single-sequence
# exact verify does; a verify that does not carry runs each sequence's chain alone. The rows are
# FP32 (`stored`: the conv rows the recurrence reads, the recurrence rows the norm reads).
[[rule]]
