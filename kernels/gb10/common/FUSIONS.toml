# =================================================================================================
# 2026-10-03: The prefill modes (LIFECYCLE-DESIGN.md 15.4). A pass at offset 0 is `prefill`
# (contiguous attention), any other `prefill_chunk` (paged attention). Rows are the pass's rows T;
# the row edges of these rules are the bucket ladder (crates/circuit/src/buckets.rs). The GDN arm
# is the policy setting `gdn_exact_replay` (off: chunked FLA; on: the exact-replay arm after a
# prefix-cache restore). An open-ended top bucket is written `[lo, 1048576]`: the build clips
# the ladder at the arena's rows (`BufferArena::max_batch_tokens`).

# 2026-10-03: A prefill pass after a prefix-cache restore replays the recomputed tokens exactly:
# its GatedDeltaNet layers take the exact-replay recurrence, never the chunked FLA one. The prefill
# driver decides it per pass (the legacy `gdn_exact_replay`, set from `marconi_skip`).
[[runtime]]
id = "gdn_prefix_restored"
when = { gdn_exact_replay = "off" }
modes = ["prefill", "prefill_chunk"]
rows = [1, 1048576]
plans_as = { gdn_exact_replay = "on" }
why = "the pass recomputes tokens after a prefix-cache (Marconi) restore, and its GatedDeltaNet layers replay them exactly"
cite = "me/prefill_b/forward_layers.rs:120-122 (gdn_exact_replay: marconi_skip); ml/qwen3_ssm/trait_prefill_recur.rs:157-168"

# ---- prefill: GatedDeltaNet layer ---------------------------------------------------------------

# 2026-10-03: A GatedDeltaNet layer's input norm over the pass's rows, copying the stream into
# `residual`; it synchronizes before and after it above 4096 rows. The attention layer's is
# `prefill_attn_input_norm` (no synchronize).
[[rule]]
id = "prefill_input_norm_residual"
pattern = [{ op = "rms_norm", local = "input_norm", layer_kind = "linear_attention" }]
kernels = [{ module = "norm", func = "rms_norm_residual" }]
repeat = "once"
emitter = "prefill_rms_norm_residual"
rows = [1, 1048576]
modes = ["prefill", "prefill_chunk"]
numerics = "reference"
priority = 10
cite = "ml/qwen3_ssm/trait_prefill.rs:63-112; ml/qwen3_attention/trait_impl/prefill_inner.rs:86"

