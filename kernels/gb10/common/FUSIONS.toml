# 2026-10-03: The dense FFN under a fixed `--activation-quantization` for the `ffn` family
# (`ffn_act_fixed`; the serve then publishes the canonical row tiers, so no by-rows rule
# applies). Legacy runs `DenseFfnLayer::forward_fixed` (ml/dense_ffn_fixed.rs:61-114) at every row
# count: gate, then up, then down through `nvfp4_proj_mx` (ml/ops/w4a4_proj/fixed.rs:22-51),
# which quantizes each projection's input and runs the MX GEMV per chunk of the widest prepared
# entry (64 rows under a fixed format, ml/ops/w4a4_proj.rs:182-193); the SiLU product goes
# through memory in BF16 between them. Each chunk's entry is `mx_plan`'s
# (ml/ops/w4a4_proj/mx_plan.rs:97-127): the persistent entries for gate|up at 9..=32 rows
# (N = 17408 has enough tiles), the activation-reuse twins for down (N = 5120 does not), and
# `mx64_nt2` above 32 rows. The emitter checks each launch against `mx_plan` at build.

[[rule]]
id = "ffn_fixed_gate_up_1_8"
pattern = [
  { op = "act_quant", format = "nvfp4/g16" },
  { op = "linear", role = "gate_up", weight = "nvfp4/g16", input = "nvfp4/g16" },
]
kernels = [
  { module = "w4a4_gemv_mx", func = "w4a4_quant_rows" },
  { module = "w4a4_gemv_mx", func = "w4a4_gemv_mx8" },
  { module = "w4a4_gemv_mx", func = "w4a4_quant_rows" },
  { module = "w4a4_gemv_mx", func = "w4a4_gemv_mx8" },
]
repeat = "once"
emitter = "w4a4_fixed"
rows = [1, 8]
modes = ["decode", "multi_seq", "verify", "verify_batch"]
when = { ffn_act_fixed = "declared" }
numerics = "reference"
priority = 60
cite = "ml/dense_ffn_fixed.rs:76-111; ml/ops/w4a4_proj/fixed.rs:22-51; ml/ops/w4a4_proj/mx_plan.rs:97-127"

[[rule]]
