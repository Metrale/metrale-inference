  { op = "silu_mul", local = "shared_act", holds = "fp8/g128", steps = { compute = "bf16" } },
  { op = "linear", role = "shared_down" },
  { op = "linear", role = "shared_gate", sibling = true, holds = "f32" },
  { op = "blend", steps = { scatter = "bf16" } },
]
kernels = [
  { module = "per_token_group_quant_fp8", func = "per_token_group_quant_fp8" },
  { module = "fp8_gemm_t_blockscaled", func = "fp8_gemm_t_blockscaled" },
