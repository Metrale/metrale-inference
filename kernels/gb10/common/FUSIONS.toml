# 2026-10-03: The NVFP4 head (`--lm-head-dtype nvfp4`, the Qwen3.6 FP8 nvfp4head recipes): the
# tile GEMM over the transposed twin at every row count under the row-invariant tiers (owner: the
# MoE circuit workstream). One decode row takes it only under a fixed head format; under
# `adaptive` it takes the GEMV, which no rule plans yet. On the qwen3.6-35b-a3b kernel target
# this kernel casts the head's BF16 activations to unscaled saturating E4M3 and runs an E4M3 MMA
# (qwen3.6-35b-a3b/nvfp4/w4a16_gemm.cu:505-515), below the BF16 activations a `declared` head
# format routes to (the checkpoint's head is BF16): the rule states that departure
