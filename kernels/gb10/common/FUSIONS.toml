# 2026-09-30: The declared W4A4 FFN where `forward_prefill` serves it: a GDN layer's FFN from
# METRALE_SSM_FFN_PREFILL_MIN_N (5) rows (ml/qwen3_ssm/trait_decode_multi_seq.rs:201-220), every
# layer's above the 32-row FFN edge (ml/qwen3_attention/trait_impl/multi_seq/ffn.rs:191-222). A
# weight stamped A4 takes the NVFP4 MMQ arm there as an unstamped one does under `nvfp4`
# (crates/config/src/weight_quantization.rs:167-181), so these are the MMQ rules above with the
# act_quant the declared circuit places before the projection inside the group: the MMQ quantizer
# writes its own block layout, which no other kernel reads.

# 2026-10-02: gate|up is written without the weight's global scale, which the SiLU kernel applies
# (nvfp4_mmq.cu:266-268).
[[rule]]
id = "ffn_mmq16_a4_gate_up_gdn"
pattern = [
  { op = "act_quant", format = "nvfp4/g16", layer_kind = "linear_attention" },
  { op = "linear", role = "gate_up", weight = "nvfp4/g16", input = "nvfp4/g16", steps = { scale = "none" } },
]
kernels = [
  { module = "nvfp4_mmq", func = "metrale_nvfp4_quantize_bf16" },
  { module = "nvfp4_mmq", func = "metrale_nvfp4_mmq16_nc" },
  { module = "nvfp4_mmq", func = "metrale_nvfp4_mmq16_nc" },
]
repeat = "once"
emitter = "dense_ffn_mmq"
rows = [5, 16]
modes = ["multi_seq"]
when = { row_tiers = "by_rows" }
numerics = "reference"
priority = 50
cite = "ml/dense_ffn_prefill_nvfp4.rs:51-68 (the M tile by rows)"

# 2026-10-02: The SiLU product reaches the quantizer in FP32 registers (nvfp4_mmq.cu:266-313):
# `act` is held as f32; down rounds its FP32 sum to BF16 before the global scale
# (nvfp4_mmq.cu:218, 469-470).
[[rule]]
id = "ffn_mmq16_a4_act_down_gdn"
pattern = [
  { op = "silu_mul", local = "act", layer_kind = "linear_attention", holds = "f32" },
  { op = "act_quant", format = "nvfp4/g16" },
  { op = "linear", role = "down", weight = "nvfp4/g16", input = "nvfp4/g16", steps = { scale = "bf16" } },
]
kernels = [
  { module = "nvfp4_mmq", func = "metrale_nvfp4_silu_mul_quant" },
  { module = "nvfp4_mmq", func = "metrale_nvfp4_mmq16_nc" },
  { module = "nvfp4_mmq", func = "metrale_nvfp4_scale_bf16" },
]
repeat = "once"
emitter = "dense_ffn_mmq"
rows = [5, 16]
modes = ["multi_seq"]
when = { row_tiers = "by_rows" }
