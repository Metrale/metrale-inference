pattern = [{ op = "residual_add", local = "add" }]
kernels = [{ module = "residual_add", func = "bf16_residual_add" }]
repeat = "once"
emitter = "residual_add"
rows = [1, 128]
modes = ["decode", "multi_seq", "verify", "draft", "verify_batch"]
numerics = "reference"
priority = 10
cite = "ml/qwen3_ssm/trait_decode.rs:143-150; ml/qwen3_attention/trait_impl/decode_inner.rs:384-391; ml/qwen3_attention/trait_impl/multi_seq/ffn.rs:147-154; ml/qwen3_ssm/trait_decode_multi_seq.rs:212,235 (after the prefill and km arms); ml/qwen3_ssm/trait_decode_batched.rs:323-334; ml/mtp_head/forward.rs:337"

[[rule]]
