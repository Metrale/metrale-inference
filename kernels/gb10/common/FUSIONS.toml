# 2026-10-22: The recipe arms of glm_router_rows and glm_router_topk_rank (METRALE_GLM_ROUTER_ROWS=1,
# METRALE_GLM_ROUTER_TOPK_RANK=1). With router rows the 2..=16-row router logits are one batched
# FP32-out GEMV (`glm_mm`'s few entry at 2..=8, the wide one at 9..=16) instead of one M = 1 GEMV per
# row; one row keeps `glm_router_f32`. The rank top-k replaces `glm5next_router_topk` at every row
# count, one launch over the rows. The router rules span the top-k: its `sigmoid_bias` scoring and the
# GLM layer kind keep them off DeepSeek-V4.1's (sqrtsoftplus) and Nemotron-H's (`moe` layers) routers.

[[rule]]
id = "glm_router_rows_few_rank_kda"
pattern = [
  { op = "router", local = "gate", weight = "bf16", layer_kind = "linear_attention" },
  { op = "top_k", layer_kind = "linear_attention", params = { scoring = "sigmoid_bias" } },
]
kernels = [
  { module = "dense_gemv_bf16_batchm_few", func = "dense_gemv_bf16_batchm_few_fp32out" },
  { module = "glm5next_ffn", func = "glm5next_router_topk_rank" },
]
repeat = "once"
emitter = "moe_router"
rows = [2, 8]
modes = ["multi_seq", "verify"]
when = { glm_router_rows = "on", glm_router_topk_rank = "on" }
numerics = "reference"
priority = 30
cite = "crates/model-arch/src/glm5next_mlp/forward/router.rs:56-62 (batched: 2..=16 rows through glm_mm, one launch; glm_router_rows read at crates/model-arch/src/glm5next_layer/levers.rs:181); crates/model-arch/src/glm5next_layer/wide_gemv.rs:105-115 (fixed_entry: batchm_few 2..=8, batchm_wide 9..=16; glm_batchm_few and glm_batchm_wide default on, crates/settings/src/groups/kernels.rs:89-90); crates/model-arch/src/glm5next_mlp/forward/topk_combine.rs:32-59 (topk_launch: the rank kernel under glm_router_topk_rank, crates/model-arch/src/glm5next_layer/levers.rs:182), :65-86 (grid [rows])"

