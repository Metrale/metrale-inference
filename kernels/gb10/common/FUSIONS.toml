# 2026-10-02: The L2 norm writes BF16 q/k/v (gdn_verify_fused_k2.cu:131) and the WY2 recurrence a
# BF16 `core` (gated_delta_rule_wy.cu:170-171), which the norm kernel reads
# (gdn_verify_fused_k2.cu:190-191).
[[rule]]
id = "gdn_fused_conv_norm_k2_verify"
pattern = [
  { op = "conv1d_update" },
  { op = "state_snapshot" },
  { op = "l2_norm", holds = "bf16" },
  { op = "gdn_recurrence", holds = "bf16" },
  { op = "gated_rms_norm" },
]
kernels = [
  { module = "gdn_verify_fused_k2", func = "gdn_verify_fused_conv_k2" },
  { module = "gdn_verify_fused_k2", func = "gdn_verify_fused_norm_k2" },
]
repeat = "once"
emitter = "gdn_verify_fused_k2"
rows = [2, 2]
modes = ["verify"]
numerics = "differs"
lever = "gdn_fused_verify"
priority = 200
cite = "ml/qwen3_ssm/trait_decode_batched_conv_gdn.rs:57-67 (METRALE_GDN_FUSED_VERIFY=1; checked at cos >= 0.99999, not bitwise)"

