# 2026-10-22: The shared expert under W4A16: gate, up and down each a W4A16 projection (proj_group
# declines with glm_w4a16_seg unset), the clamp + SiLU between them one launch. The rule spans the
# whole expert because its `swiglu_clamp` is what tells it apart from another model's W4A16 shared
# expert (Qwen3.6's GDN layers are `linear_attention` too).
[[rule]]
id = "glm_w4a16_shared_1row"
pattern = [
  { op = "linear", role = "shared_gate_up", weight = "nvfp4/g16", input = "bf16" },
  { op = "swiglu_clamp", local = "shared_clamp", holds = "f32" },
  { op = "silu_mul", local = "shared_act" },
  { op = "linear", role = "shared_down", weight = "nvfp4/g16" },
]
kernels = [
  { module = "w4a16_gemv", func = "w4a16_gemv" },
  { module = "w4a16_gemv", func = "w4a16_gemv" },
  { module = "glm5next_ffn", func = "glm5next_swiglu_clamp" },
  { module = "w4a16_gemv", func = "w4a16_gemv" },
]
repeat = "once"
emitter = "glm_w4a16"
rows = [1, 1]
modes = ["decode"]
numerics = "reference"
priority = 120
cite = "crates/model-arch/src/glm5next_mlp/forward/dense.rs:62-125 (gate, up, the clamp + SiLU, down; proj_group declines with glm_w4a16_seg unset); crates/model-arch/src/glm5next_w4a16_dense.rs:350-362"

[[rule]]
