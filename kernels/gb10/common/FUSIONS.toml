# 2026-09-28: NVFP4 projections (W4A16).
# The dense checkpoint's FP8 per-channel projections are requantized to NVFP4 at load
# (crates/model-arch/src/weight_loader/qwen35_dense.rs:81-103), so every dense projection
# below reads NVFP4 weights and BF16 activations.

[[rule]]
id = "w4a16_gemv_sw_1row"
pattern = [{ op = "linear", roles = ["qkvz", "gdn_out", "o", "down"], weight = "nvfp4/g16" }]
kernels = [{ module = "w4a16_gemv", func = "w4a16_gemv_sw" }]
repeat = "once"
emitter = "w4a16_decode_gemv"
rows = [1, 1]
modes = ["decode"]
when = { gemv_sw = "on" }
numerics = "reference"
priority = 10
cite = "ml/qwen3_ssm/ssm_forward.rs:90-105,389-422; ml/qwen3_attention/decode/attention_forward_oproj.rs:82-93; ml/dense_ffn_decode.rs:386-397 (gemv_sw on unless METRALE_NO_GEMV_SW=1, ml/ops/model_levers_resolve.rs:53; bit-identical to w4a16_gemv, k/w4a16_gemv_fused.cu:305-307)"

[[rule]]
