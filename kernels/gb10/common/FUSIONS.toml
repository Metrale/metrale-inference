# 2026-10-23 (P0-prereq): The collectives a rank circuit derives (crates/circuit/src/parallel.rs:
# an `all_reduce` where a partial meets a consumer not linear in it, an `all_gather` where a slice
# meets one that needs the whole tensor). At three ranks every payload of a C=1 step
# fits `all_reduce_oneshot_max_kb` (1024 in the recipe), so each takes the one-shot path: one NCCL
# group of a send and a receive per peer, one `ncclDevKernel_SendRecv` (crates/comm/src/
# nccl_backend/ar_path.rs:29-42, sendrecv.rs:61,231-240), then the rank-order sum. The `comm` entry
# is that library launch; `at` is how many of the rule's kernels precede it.

[[rule]]
id = "glm_ar_fused_post"
pattern = [{ op = "all_reduce" }, { op = "hc_post", writes = "f32" }]
comm = [{ api = "exchange", kernel = "ncclDevKernel_SendRecv", at = 0 }]
kernels = [{ module = "glm5next_hc_post_sum", func = "glm5next_hc_post_rank_sum" }]
repeat = "once"
emitter = "glm_hc"
rows = [1, 128]
modes = ["decode", "multi_seq", "verify"]
when = { glm_ar_fused_post = "on" }
numerics = "reference"
priority = 100
cite = "crates/model-arch/src/glm5next_layer/steps/mhc_site.rs:243-255,113-141 (fused_post, then exchange_partials alone for one row piece), :77-120 (hc_post_reduced: glm5next_hc_post_rank_sum sums the peers' partials into x, then the post-mix, the same bits as the all-reduce then glm_hc_post at three ranks); crates/model-arch/src/glm5next_layer/steps/forward.rs:391-402,424-428 (the mixer and FFN sites of a verify); crates/comm/src/nccl_backend/comm_impl.rs:108 (exchange_partials: the exchange only)"

[[rule]]
id = "tp_all_reduce_oneshot"
pattern = [{ op = "all_reduce" }]
comm = [{ api = "exchange", kernel = "ncclDevKernel_SendRecv", at = 0 }]
kernels = [{ module = "bf16_add", func = "bf16_add_rank_sum" }]
repeat = "once"
emitter = "tp_all_reduce"
rows = [1, 128]
modes = ["decode", "multi_seq", "verify", "draft"]
numerics = "reference"
priority = 10
cite = "crates/comm/src/nccl_backend/sendrecv.rs:178-221 (all_reduce_oneshot: the exchange, then bf16_add_rank_sum over ceil(count/256) blocks), comm_impl.rs:25-31,52-72 (all_reduce / all_reduce_async take it at three ranks); crates/model-arch/src/glm5next_layer/steps/mhc_site.rs:77-95, crates/model-arch/src/glm5next_layer/steps.rs:212-221 (reduce_partial / reduce_pieces: the MTP layer's attention and MoE outputs, and an mHC site without glm_ar_fused_post)"

# 2026-10-23: An all-gather the engine runs as the one-shot all-reduce of zero-padded slices: each
# rank writes its rows into a zeroed full row and the sum assembles it (the MTP eh_proj rows under
# METRALE_GLM_MTP_EH_TP; the vocab shard's logits before a plain argmax).
[[rule]]
id = "tp_all_gather_as_sum"
pattern = [{ op = "all_gather" }]
