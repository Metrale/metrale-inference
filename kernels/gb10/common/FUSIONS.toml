# 2026-09-30: The batched MTP verify's conv and recurrence, one launch schedule per run of equal
# k (`batched_conv_gdn_route`), carried (`carry.rs`): the scheduler asks every batched verify for
# write-on-accept (`verify_k4_batch_step.rs`), so the layers run the carry kernels. A contiguous run
# (the layer's own `multi_run_arm` says Batched) is the carried conv and WY over the run's table
# slice, lazy from `GDN_CARRY_LAZY_MIN_SEQS` (8) sequences; any other run folds its pending rows and
# runs each sequence as the single-sequence verify does.
[[rule]]
id = "gdn_verify_batch_runs"
pattern = [
  { op = "conv1d_update" },
  { op = "state_snapshot" },
  { op = "l2_norm", writes = "bf16", stored = true },
  { op = "gdn_recurrence", input = "bf16", writes = "bf16" },
]
kernels = [
  { module = "gated_delta_rule_carry", func = "gdn_carry_conv" },
  { module = "gated_delta_rule_carry", func = "gdn_carry_wy2" },
  { module = "gated_delta_rule_carry", func = "gdn_carry_wy3" },
  { module = "gated_delta_rule_carry", func = "gdn_carry_wy4" },
  { module = "gated_delta_rule_carry", func = "gdn_carry_wy2_lazy" },
  { module = "gated_delta_rule_carry", func = "gdn_carry_wy3_lazy" },
  { module = "gated_delta_rule_carry", func = "gdn_carry_wy4_lazy" },
  { module = "gated_delta_rule_carry", func = "gdn_carry_flush" },
  { module = "gated_delta_rule_carry", func = "gdn_carry_conv_flush" },
  { module = "causal_conv1d", func = "causal_conv1d_update_l2norm" },
  { module = "gated_delta_rule_wy", func = "gated_delta_rule_wy2" },
  { module = "gated_delta_rule_wy3", func = "gated_delta_rule_wy3" },
  { module = "gated_delta_rule_wy4", func = "gated_delta_rule_wy4" },
]
repeat = "per_run"
emitter = "gdn_verify_runs"
rows = [4, 128]
modes = ["verify_batch"]
when = { ssm_h_dtype = "f32", gdn_verify_exact = "off" }
numerics = "reference"
priority = 150
cite = "ml/qwen3_ssm/trait_decode_batched/conv_gdn_route.rs:100-219 (the runs); ml/qwen3_ssm/trait_decode_batched_conv_gdn_multi.rs:89-117 (carry and its decline), :394-470 (multi_run_arm); ml/qwen3_ssm/carry.rs:59-62 (lazy from 8), :164-301 (the launches); ml/qwen3_ssm/trait_decode_batched_conv_gdn.rs:114-331 (a sequence alone)"

