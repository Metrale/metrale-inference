# 2026-10-22: At 2..=16 routed rows the SwiGLU also writes +0.0 over `expert_out` (the memset the
# down sweep needs, folded in; METRALE_GLM_MOE_ZERO_IN_SWIGLU default on). One row keeps the
# plain kernel: the own-slots down sweep writes every row itself.
[[rule]]
id = "glm_swiglu_clamp_zero"
pattern = [
  { op = "swiglu_clamp", local = "experts_clamp", holds = "f32" },
  { op = "silu_mul", local = "experts_act" },
]
kernels = [{ module = "glm5next_ffn", func = "glm5next_swiglu_clamp_zero" }]
repeat = "once"
emitter = "glm_swiglu"
rows = [2, 16]
modes = ["multi_seq", "verify"]
numerics = "reference"
priority = 120
cite = "crates/model-arch/src/glm5next_mlp/forward/w4a4.rs:445-455,215-225 (zeroes_in_swiglu: rows 2..=16, not the own-slots arm); crates/model-arch/src/glm5next_mlp/forward/launch.rs:147-171"

# 2026-10-22: The served recipe's re-quantized projections (glm-5.3/glm-5.3-flash-nvfp4-tp3-512k:
# `--dense-quantization w4a16`, `--dsa-quantization w8a8`; kernels/circuits/precision/
# glm-5.3-flash-nvfp4-tp3.toml), each rule naming what `glm_mm` launches at the default levers
# (the recipe's METRALE_GLM_W4A16_SEG, _W4A16_GEMV_SEG, _W4A16_GEMV_ROWS and _DSA_DECODE_HB are
# env levers, off by default: crates/settings/src/groups/kernels.rs:94,165-167). Under the
# declared formats no node matches them (their weights are NVFP4 W4A16 or FP8 W8A8 only here).
# W4A16: `glm5next_w4a16_dense::proj` (crates/model-arch/src/glm5next_w4a16_dense.rs:315-404)
# runs `w4a16_gemv` at one row and the tensor-core row tile `w4a16_tc_rows_16` at 2..=16 (the
# segmented tiers and the GEMV tiers above one row need those levers); `proj_group` declines
# with the segmented mode off (:418-440), so each projection is its own launch.
[[rule]]
id = "glm_w4a16_gemv_1row"
pattern = [{ op = "linear", roles = ["q", "k", "v", "o", "kda_b", "kda_f_a", "kda_g_a"], weight = "nvfp4/g16", input = "bf16", layer_kind = "linear_attention" }]
kernels = [{ module = "w4a16_gemv", func = "w4a16_gemv" }]
repeat = "once"
emitter = "glm_w4a16"
rows = [1, 1]
modes = ["decode"]
numerics = "reference"
priority = 120
cite = "crates/model-arch/src/glm5next_w4a16_dense.rs:350-362 (one row: w4a16_gemv::w4a16_gemv; glm_w4a16_gemv_seg off, :332); crates/model-arch/src/glm5next_layer/wide_gemv.rs:205-207 (glm_mm asks the W4A16 registry first); crates/model-arch/src/glm5next_w4a16_dense.rs:110-131 (tier_of: these are W4A16)"

[[rule]]
id = "glm_w4a16_tc_rows"
pattern = [{ op = "linear", roles = ["q", "k", "v", "o", "kda_b", "kda_f_a", "kda_g_a"], weight = "nvfp4/g16", input = "bf16", layer_kind = "linear_attention" }]
kernels = [{ module = "w4a16_tc_rows", func = "w4a16_tc_rows_16" }]
repeat = "once"
emitter = "glm_w4a16"
rows = [2, 16]
modes = ["multi_seq", "verify"]
numerics = "reference"
priority = 120
