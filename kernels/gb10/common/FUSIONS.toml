# 2026-10-22: The recipe arms of the GLM W4A16 levers (METRALE_GLM_W4A16_GEMV_SEG=1,
# _GEMV_ROWS=2, _SEG=fuse; `--dense-quantization w4a16`). One row (glm_w4a16_gemv_seg) and two rows
# (with glm_w4a16_gemv_rows 2) run `w4a16_gemv_pipe` (glm_w4a16_gemv_pipe, default on): the KDA
# q|k|v|f_a|b|g_a as one launch (`group_of_six`), the shared expert's gate|up as one; KDA o and the
# shared down alone (o keeps `w4a16_gemv` at one row, K 2816 >= 2048). From 3 rows (2 without the
# GEMV tier) `glm_w4a16_seg = fuse` runs the segmented row tile `w4a16_tc_rows_seg_16_k1`
