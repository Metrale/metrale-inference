[[family]]
id = "causal_conv1d_l2norm"
description = "Causal conv1d update + SiLU + L2 norm of the q/k heads (GDN)"
explain.about = '''The Gated DeltaNet and KDA decode convolution: the causal depthwise conv plus SiLU of causal_conv1d over the packed q|k|v channels, followed by an L2 normalisation of each q and k head of $d_k = 128$ channels; the value channels (from qk_channels on) get SiLU only. Blocks of 256 threads hold two heads each, one thread per channel, and the head norm is a warp shuffle plus a sum of four warp partials. causal_conv1d::causal_conv1d_update_l2norm writes BF16 and is the verify-path kernel, the _f32 and _f32_strided twins write FP32 (the strided one runs every sequence's row with arbitrary row strides), and _rows takes up to 16 rows of different sequences, each with its own window. kda_conv_tokens::causal_conv1d_update_l2norm_tokens runs $T$ consecutive tokens of one sequence in one launch, building each token's window in registers from the stored window and the earlier inputs so that the stored window is only read; causal_conv1d_window_advance then moves the window past the $T$ tokens, and causal_conv1d_window_advance_to writes the advanced window to a separate snapshot buffer.'''
explain.numerics = '''FP32 window, exact BF16 widening of inputs and taps, FP32 conv sum from bias then taps oldest to newest, sigmoid via __expf; the squared norm is a shuffle-down tree within each warp then four warp partials summed in order, and the scale is rsqrtf of (sum of squares + eps), so eps is added to the sum and not to a mean. The fused verify, rows and tokens kernels round to BF16 (RNE) once at the store; the f32 twins store FP32. Built without FMA contraction.'''
explain.math = [
  '''\begin{aligned} s_c &\leftarrow \big(s_{c,2}, \dots, s_{c,w},\, x_{t,c}\big), \qquad u_{t,c} = \operatorname{silu}\Big(b_c + \textstyle\sum_{i=1}^{w} W_{c,i}\, s_{c,i}\Big) \\ y_{t,c} &= \begin{cases} u_{t,c}\,\Big(\sum_{j \in \mathcal{H}(c)} u_{t,j}^2 + \epsilon\Big)^{-1/2} & c < c_{qk} \\ u_{t,c} & c \ge c_{qk} \end{cases} \end{aligned}''',
  '''\text{where } \mathcal{H}(c) \text{ is the } d_k\text{-channel q or k head containing } c,\ c_{qk} \text{ the number of q and k channels},\ s_c \in \mathbb{R}^{w} \text{ the window (oldest first)}''',
  '''\text{token form: } s^{(t)}_{c,i} = x_{t-w+i,\,c} \text{ for } i = 1,\dots,w, \text{ with } x_{j,c} \text{ for } j \le 0 \text{ read from the stored window slot } j + w''',
]
compute = "cuda_core"
# 2026-09-30: The strided twin runs every sequence's row in one launch (the batched GDN arm,
# kernels/gb10/common/FUSIONS.toml).
# 2026-10-22: `causal_conv1d_update_l2norm_tokens` runs T consecutive tokens of one sequence in
# one launch, token t's window built in registers (kda_conv_tokens.cu:15-50): per token the
# per-token kernel's body, so its bits; the window is only read (the advance is another kernel).
kernels = [
  "causal_conv1d::causal_conv1d_update_l2norm_f32", "causal_conv1d::causal_conv1d_update_l2norm",
  "causal_conv1d::causal_conv1d_update_l2norm_f32_strided",
  "kda_conv_tokens::causal_conv1d_update_l2norm_tokens",
  # 2026-10-22: The batched decode's conv, one row of each sequence per launch
  # (METRALE_GLM_KDA_SEQ_ROWS=decode; causal_conv1d.cu:355, BF16 out), and the token conv's window
  # steps: `_window_advance_to` writes a verify's conv intermediate (the snapshot) from the live
  # window, `_window_advance` advances the live window after the token conv (kda_conv_tokens.cu).
  "causal_conv1d::causal_conv1d_update_l2norm_rows",
  "kda_conv_tokens::causal_conv1d_window_advance_to", "kda_conv_tokens::causal_conv1d_window_advance",
  # 2026-10-23: The verify's conv, intermediates and advance in one launch (kda_conv_snap.cu, an
  # instantiation of causal_conv1d_l2norm_body.cuh's tokens-snap body; METRALE_GLM_KDA_CONV_ONE).
  "kda_conv_snap::causal_conv1d_update_l2norm_tokens_snap",
]
