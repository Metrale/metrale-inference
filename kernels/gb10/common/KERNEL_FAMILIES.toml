# 2026-09-30: `ssm_ba_gates_hopper` is the byte-identical twin `ops::dense_gemm_ba_gates_prefill`
# picks from two CTAs per SM (96 rows on GB10) when [defaults] ssm_ba_gates_hopper is on.
[[family]]
id = "gdn_ba_gates_gemm"
description = "GDN in_proj_b|a GEMM fused with the gates, all rows"
explain.about = '''The multi-row form of gdn_ba_gates_gemv: the same beta and decay projection with fused gates for $m$ token rows in one launch, writing per token the $n_v$ decays $\alpha_h$ followed by the $n_v$ betas $\beta_h$ into one FP32 row. ssm_preprocess::dense_gemm_ba_gates_prefill uses a grid of (output quads, tokens), each block computing four outputs of one token with 64 lanes each. ssm_ba_gates_hopper::dense_gemm_ba_gates_prefill_hopper runs one block per token over all $N$ outputs, converting each activation vector once and reusing it for eight output groups, while keeping the parent's lane-to-$k$ mapping and reduction tree so its results are bit-identical; it is selected for larger row counts.'''
explain.numerics = '''Identical to gdn_ba_gates_gemv: exact BF16 to FP32 widening, FP32 products and sums without FMA contraction, per-lane sums in index order, shuffle-down tree at offsets 16 to 1, then even plus odd warp partial. Gates use __expf and __logf with inner arguments clamped at 20; outputs are FP32.'''
