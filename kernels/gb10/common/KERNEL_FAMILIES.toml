# 2026-09-29: These quantize BF16 activations to 4 bits inside the rule, so they compute W4A4:
# only a checkpoint that declares A4 may use them by default (the dense 27B MLP does).
[[family]]
id = "nvfp4_mmq"
description = "NVFP4 W4A4 MMQ tiles (activation quantize, mmq16/32/64, pipelined GEMM)"
explain.about = '''W4A4 dense FFN in which both operands are NVFP4. metrale_nvfp4_quantize_bf16 quantizes each BF16 activation row in groups of 16 (one thread per group), choosing each group's E4M3 scale from five candidate codes by squared error; the weights keep their checkpoint E2M1 codes and E4M3 scales, rearranged by a bit shuffle with no requantization. The GEMM runs as MMQ tiles of 128 weight rows by 16, 32 or 64 token columns (metrale_nvfp4_mmq16_nc, mmq32_nc, mmq64_nc; 8 warps) or as metrale_nvfp4_gemm_pipe, a 128-channel by 192-token tile on 8 warps (64 x 48 each) with a two-stage cp.async pipeline over 256-wide K stages; all issue m16n8k64 block-scaled FP4 MMAs. The tensor scales are folded in afterwards: metrale_nvfp4_silu_mul_quant multiplies the gate and up outputs by their tensor scales, applies SiLU-and-multiply and quantizes the product straight to NVFP4 for the down projection, and metrale_nvfp4_scale_bf16 (or the pipelined GEMM's epilogue) scales the down output.'''
explain.numerics = '''Activation scales: $c_0$ is $\max|x|/6$ rounded to nearest even and saturated to an E4M3 code, the codes $c_0, c_0 \mp 1, c_0 \mp 2$ (kept within 0 to 126) are tried in that order and the first with the smallest FP32 squared error wins; E2M1 codes are the nearest table value to $x/s$, ties to the smaller magnitude, saturating at 6, and there is no per-tensor activation scale. The MMA multiplies E2M1 x E2M1 with UE4M3 block scales per 16 values; each k64 MMA starts from zero and is added to an FP32 sum in increasing k, rounded once to BF16, and the down projection's tensor scale is a second BF16 rounding.'''
explain.math = [
  '''\begin{aligned} c_0 &= \mathrm{sat}_{\mathrm{e4m3}}\Big(\tfrac{1}{6}\max_{i<16}|x_{t,16j+i}|\Big), \qquad e_c = \sum_{i=0}^{15}\Big(|x_{t,16j+i}| - \mathrm{e4m3}(c)\,\big|\mathrm{rn}_{\mathrm{e2m1}}\big(x_{t,16j+i}/\mathrm{e4m3}(c)\big)\big|\Big)^2 \\ s^{a}_{tj} &= \mathrm{e4m3}(c^{*}), \quad c^{*} = \operatorname*{arg\,min}_{c \in \{c_0,\,c_0-1,\,c_0+1,\,c_0-2,\,c_0+2\} \cap [0,126]} e_c, \qquad a_{tk} = \mathrm{rn}_{\mathrm{e2m1}}\big(x_{tk}/s^{a}_{t,\lfloor k/16\rfloor}\big) \end{aligned}''',
  '''\begin{aligned} z_{tn} &= \mathrm{rn}_{\mathrm{bf16}}\Big(\sum_{b=0}^{K/64-1}\;\sum_{k=64b}^{64b+63}\big(q_{nk}\,s^{w}_{n,\lfloor k/16\rfloor}\big)\big(a_{tk}\,s^{a}_{t,\lfloor k/16\rfloor}\big)\Big) \\ h_{tk} &= \operatorname{silu}\big(s^{\mathrm{gate}}_{\mathrm{g}}\,z^{\mathrm{gate}}_{tk}\big)\,\big(s^{\mathrm{up}}_{\mathrm{g}}\,z^{\mathrm{up}}_{tk}\big) \quad \text{(FP32, then NVFP4-quantized as above)} \\ y^{\mathrm{down}}_{tn} &= \mathrm{rn}_{\mathrm{bf16}}\big(z^{\mathrm{down}}_{tn}\,s^{\mathrm{down}}_{\mathrm{g}}\big) \end{aligned}''',
  '''\text{where } q, s^{w} \text{ are the weight E2M1 values and E4M3 group scales, } s^{\cdot}_{\mathrm{g}} \text{ the FP32 weight tensor scales, } \mathrm{e4m3}(c) \text{ the value of code } c, \text{ and } \mathrm{rn}_{\mathrm{e2m1}} \text{ rounds to the nearest E2M1 value, ties to the smaller magnitude, saturating at } 6''',
]
compute = "tensor_core"
mma = "mma.sync.m16n8k64.mxf4nvf4.block_scale"
kernel_compute."nvfp4_mmq::metrale_nvfp4_quantize_bf16" = { compute = "memory" }
kernel_compute."nvfp4_mmq::metrale_nvfp4_silu_mul_quant" = { compute = "memory" }
kernel_compute."nvfp4_mmq::metrale_nvfp4_scale_bf16" = { compute = "memory" }
kernels = [
  "nvfp4_mmq::metrale_nvfp4_quantize_bf16", "nvfp4_mmq::metrale_nvfp4_mmq16_nc",
  "nvfp4_mmq::metrale_nvfp4_mmq32_nc", "nvfp4_mmq::metrale_nvfp4_mmq64_nc",
  "nvfp4_mmq::metrale_nvfp4_gemm_pipe", "nvfp4_mmq::metrale_nvfp4_silu_mul_quant",
  "nvfp4_mmq::metrale_nvfp4_scale_bf16",
]
rows = [1, 65536]
# 2026-10-02: W4A4 on the block-scaled FP4 MMA. The activation quantizers write E2M1 with one
# E4M3 scale per 16 and NO F32 global (q4k_vendor/quantize_impl.cuh:126-173), ties to the smaller
# magnitude: the circuit names that `nvfp4/g16`, whose global it cannot drop. gate|up is written
# without the weight's global scale (the SiLU kernel applies it, nvfp4_mmq.cu:266-268): scale
# `none`. down rounds the FP32 sum to BF16 before the global scale (mmq.cuh:3375,
# nvfp4_mmq.cu:218, 469-470): scale `bf16`. The SiLU kernel quantizes straight from FP32.
pipeline.linear = { in = ["bf16"], act = "nvfp4/g16", weight = "nvfp4/g16->e2m1", mma = "e2m1*e2m1", accumulate = "f32", scale = "bf16", out = ["bf16"] }
pipeline."linear:gate_up" = { in = ["bf16"], act = "nvfp4/g16", weight = "nvfp4/g16->e2m1", mma = "e2m1*e2m1", accumulate = "f32", scale = "none", out = ["bf16"] }
pipeline."linear:gate_up after act_quant" = { in = ["nvfp4/g16"], act = "nvfp4/g16", weight = "nvfp4/g16->e2m1", mma = "e2m1*e2m1", accumulate = "f32", scale = "none", out = ["bf16"] }
pipeline."linear:down" = { in = ["nvfp4/g16"], act = "nvfp4/g16", weight = "nvfp4/g16->e2m1", mma = "e2m1*e2m1", accumulate = "f32", scale = "bf16", out = ["bf16"] }
pipeline.silu_mul = { in = ["bf16"], compute = "f32", out = ["nvfp4/g16"] }
pipeline."silu_mul feeds act_quant" = { in = ["bf16"], compute = "f32", out = ["f32"] }
pipeline."act_quant:nvfp4/g16" = { in = ["bf16"], compute = "f32", out = ["nvfp4/g16"] }
pipeline."act_quant:nvfp4/g16 after silu_mul" = { in = ["f32"], compute = "f32", out = ["nvfp4/g16"] }
