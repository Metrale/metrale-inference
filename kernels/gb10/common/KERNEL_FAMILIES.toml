[[family]]
id = "moe_relu2_down_1row"
description = "NVFP4 ReLU² + routed down + shared down, one token"
explain.about = '''For one token, the $\mathrm{relu}^2$ activation of each routed expert up output followed by its NVFP4 down GEMV, with the shared expert optionally as slot $k$. moe_relu2_fused::moe_expert_relu2_down_shared has grid (output tiles, $k$ or $k+1$) and 128-thread blocks of 8 outputs, two per warp: each block first writes $\max(u,0)^2$ for its whole input row into shared memory, then streams 4 packed bytes per lane step. Routed slots use intermediate width $K_r$ and output width $N$; the shared slot uses its own $K_s$ and $N_s$. Each slot writes its own BF16 row for the weighted combine, and a slot whose expert has no weights writes zeros.'''
explain.numerics = '''The BF16 up output is widened to FP32 and squared after the clamp in FP32, unrounded; E2M1 nibbles are decoded by a 16-entry table and multiplied in FP32 by $\mathrm{e4m3}(d)\,s_2$; products accumulate in FP32 per lane, reduce by a warp shuffle tree, and are rounded once to BF16 (RNE).'''
