# 2026-10-08: The KDA gates: the decay
# `linear_lower_bound * sigmoid(exp(A_log[h]) * (g + dt_bias))` per channel from the BF16 `f_b`
# output, FP32 out (kda_gate.cu:3-17, :74-97), and beta, an FP32 sigmoid of the BF16 `b_proj`
# output (kda_layer_ops.cu:114-125). One launch covers every row.
[[family]]
id = "kda_gates"
description = "KDA per-channel bounded-sigmoid decay and beta sigmoid"
explain.about = '''The Kimi Delta Attention gates computed from projections already in memory. kda_gate::kda_gate_bf16 turns the BF16 decay projection $f$ into a per-channel log decay $g_{h,i}$ with a bounded sigmoid (one block per token and head, threads striding over the $d_k$ channels), and kda_layer_ops::kda_sigmoid_bf16_f32 turns the beta projection into $\beta_h = \sigma(b_h)$, one thread per element. Unlike the Gated DeltaNet gate, the decay is a vector over key channels with a per-channel bias, and it stays in the log domain; the recurrence exponentiates it.'''
explain.numerics = '''BF16 inputs widened exactly; FP32 arithmetic. The decay uses accurate expf for both $e^{A_h}$ and the sigmoid; beta uses __expf. Both outputs are stored as FP32.'''
explain.math = [
  '''\begin{aligned} g_{h,i} &= \lambda\, \sigma\!\big(e^{A_h}\,(f_{h,i} + \delta_{h,i})\big), \qquad i = 1, \dots, d_k \\ \beta_h &= \sigma(b_h) \end{aligned}''',
  '''\text{where } A_h \text{ is the per-head learned log rate},\ \delta_{h,i} \text{ the per-channel bias and } \lambda < 0 \text{ the gate lower bound, so } g_{h,i} \in (\lambda, 0)''',
]
compute = "memory"
kernels = ["kda_gate::kda_gate_bf16", "kda_layer_ops::kda_sigmoid_bf16_f32"]
rows = [1, 65536]
pipeline.gdn_gates = { in = ["bf16", "bf16"], compute = "f32", out = ["f32", "f32"] }
op = [{ op = "gdn_gates" }]
[[family.param]]
name = "gate"
kind = "policy"
from = { gdn_gates = "param:gate" }
absent = "softplus"
[[family.param]]
