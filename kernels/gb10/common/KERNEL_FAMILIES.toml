# 2026-10-23: The screened K=2 verify head of a vocab-sharded LM head: an INT8 screen of this rank's
# rows, an exact BF16 rescore of the rows a rigorous bound cannot rule out, a 16-byte best-key
# exchange and the largest key kept. Its argmaxes equal the full BF16 head's (screen_head.cu
# header), which is the pipeline it declares.
[[family]]
id = "screen_head"
description = "Screened vocab-sharded LM head: INT8 scan, exact rescore, cross-rank best key"
explain.about = '''The greedy verify head of a vocabulary-sharded LM head for two rows, which finds exactly the token the full BF16 head and its argmax would pick without reading the whole BF16 head. screen_head_scan reads an INT8 copy of this rank's head rows, with one FP32 scale per 128-weight block, and forms for every row a screen logit $S_i$ and a rigorous bound $\kappa E$ on its distance from the full head's FP32 sum $R_i$. A row whose upper bound falls below the best lower bound $L$ minus a BF16 rounding pad can be neither the argmax nor tied with it; screen_head_rescore recomputes the remaining candidates with the BF16 GEMV's own arithmetic and keys them in the order the BF16 argmax breaks ties, and screen_head_resolve keeps the largest key after the ranks exchange their best 16-byte keys. With mask ids the same test over the unmasked rows keeps the masked argmax as well.'''
explain.numerics = '''The screen sums in FP32 and rounds $E$ up. $\kappa$ covers the INT8 quantization error ($|w - s q| \le \tfrac{s}{2}(1 + 2^{-20})$, checked exactly when the copy is built), the reference's FP32 summation error and the screen's own; the kernel adds $2^{-100}$ for underflow and makes every row a candidate past $2^{100}$. The rescore reproduces the BF16 GEMV's per-row FP32 arithmetic bit for bit (BF16 products exact in FP32, the same add order and shuffle tree, no FMA contraction) and rounds once to BF16, so the chosen token equals the full head's, ties included.'''
explain.math = [
  '''S_i = \sum_{b} s_{ib} \sum_{k \in b} x_k\, q_{ik}, \qquad s_{ib} = \frac{\max_{k \in b} |w_{ik}|}{127}, \qquad q_{ik} = \mathrm{rint}\Big(\frac{w_{ik}}{s_{ib}}\Big), \qquad |R_i - S_i| \le \kappa \sum_{b} s_{ib} \lVert x_b \rVert_1''',
  '''\mathrm{lo}_i \le R_i \le \mathrm{up}_i, \qquad L = \max_j \mathrm{lo}_j, \qquad \mathrm{pad} = 2^{-7}\big(1 + 2^{-7}\big)|L| + 2^{-120}, \qquad \mathcal{C} = \{\, i : \mathrm{up}_i \ge L - \mathrm{pad} \,\}''',
  '''\hat{y} = \operatorname*{arg\,max}_{\text{ranks},\; i \in \mathcal{C}} \mathrm{key}\big(\mathrm{rn}_{\mathrm{bf16}}(R_i),\, i\big) = \operatorname{argmax}_{\mathrm{bf16}}\big(\mathrm{rn}_{\mathrm{bf16}}(R)\big)''',
  '''\text{where } w_i \text{ is head row } i\text{, } x \text{ the BF16 activation row, } R_i \text{ the full head's FP32 sum and key the order in which the BF16 argmax breaks ties}''',
]
compute = "cuda_core"
kernels = ["screen_head::screen_head_scan", "screen_head::screen_head_rescore", "screen_head::screen_head_resolve"]
rows = [2, 2]
pipeline.lm_head = { in = ["bf16"], act = "bf16", weight = "bf16->bf16", mma = "bf16*bf16", accumulate = "f32", scale = "none", out = ["bf16"] }
pipeline.all_gather = { in = ["bf16"], move = "bf16", out = ["bf16"] }
pipeline.argmax = { in = ["bf16"], compare = "bf16", out = ["i32"] }
op = [{ op = "lm_head", weight = ["bf16"], activation = ["bf16"] }, { op = "all_gather" }, { op = "argmax" }]
[[family.point]]
values = {}
how = "instantiation"
files = ["kernels/gb10/common/screen_head.cu"]

# 2026-10-23: The GLM-5.3 MTP draft head's LM head: an FP8 E4M3 copy of the rank's vocab shard with
# one F32 scale a row, the BF16 row times the decoded weights summed in FP32 and scaled
# (dense_gemv_fp8w.cu:3-4), then the shard argmax's lanes packed and the global id picked after the
# exchange (glm5next_mtp_xchg.cu).
[[family]]
id = "glm_mtp_head"
description = "GLM-5.3 MTP draft LM head: FP8 vocab-shard GEMV and the cross-rank argmax exchange"
explain.about = '''The LM head of the GLM-5.3 MTP draft layer under tensor parallelism. Each rank holds an FP8 E4M3 copy of its vocabulary shard, rows $v_0 \le n < v_0 + V_r$, with one FP32 scale per row, and dense_gemv_fp8w computes the shard's BF16 logits from the BF16 hidden row with 64 threads per output and four outputs per block. From the rank's local argmax, glm5next_mtp_xchg_pack writes the winning BF16 logit and the global token id as three base-256 digits into the rank's own lanes of a zeroed exchange buffer; a BF16 sum all-reduce delivers every rank's lanes unchanged, and glm5next_mtp_xchg_pick takes the highest logit, a tie going to the lowest rank, and rebuilds the token id from the winner's digits.'''
explain.numerics = '''E4M3 weights are decoded exactly to FP32, multiplied by the BF16 activations widened to FP32 and summed in FP32, then scaled by the row's FP32 scale and rounded once to BF16. The exchange is exact: the logit lane is the head's BF16 output bit for bit, each digit is an integer $0,\dots,255$ that BF16 holds exactly, and every other rank's lanes are zero, so the BF16 sum changes nothing. The pick compares BF16 logits with a strict greater-than in rank order.'''
explain.math = [
  '''z_n = \mathrm{rn}_{\mathrm{bf16}}\Big(\sigma_n \sum_{k=0}^{K-1} x_k\, \mathrm{e4m3}(B_{nk})\Big), \qquad v_0 \le n < v_0 + V_r, \qquad \sigma_n \in \mathrm{fp32}''',
  '''g^{(r)} = v^{(r)}_0 + \ell^{(r)} = 256^2 d^{(r)}_2 + 256\, d^{(r)}_1 + d^{(r)}_0, \qquad r^\star = \min\Big\{\, r : z^{(r)} = \max_{s} z^{(s)} \,\Big\}, \qquad \hat{y} = g^{(r^\star)}''',
  '''\text{where } \ell^{(r)} \text{ is rank } r\text{'s local argmax, } z^{(r)} \text{ its BF16 logit and } d^{(r)}_j \text{ the base-256 digits of its global id}''',
]
compute = "cuda_core"
kernels = ["gemv_fp8w::dense_gemv_fp8w", "glm5next_mtp_xchg::glm5next_mtp_xchg_pack", "glm5next_mtp_xchg::glm5next_mtp_xchg_pick"]
rows = [1, 1]
pipeline.lm_head = { in = ["bf16"], act = "bf16", weight = "fp8/channel->f32", mma = "bf16*f32", accumulate = "f32", scale = "f32", out = ["bf16"] }
pipeline.all_gather = { in = ["bf16"], move = "bf16", out = ["bf16"] }
pipeline.argmax = { in = ["bf16"], compare = "bf16", out = ["i32"] }
op = [{ op = "lm_head", weight = ["bf16"], activation = ["bf16"] }, { op = "all_gather" }, { op = "argmax" }]
