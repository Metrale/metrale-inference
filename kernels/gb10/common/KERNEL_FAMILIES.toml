[[family]]
id = "dense_bf16_tc"
description = "BF16 tensor-core GEMV row tiers (tc8, tc16, tc32)"
explain.about = '''Small-M BF16 projection on tensor cores for 1 to 32 rows: dense_gemv_bf16_tc8, tc16 and tc32 cover $m \le 8, 16, 32$ with 1, 2 or 4 token tiles of 8. The weights sit on the 16-row side of the m16n8k16 MMA and the tokens on its 8-wide side, so one MMA covers a 16 x 16 weight block for up to 8 tokens and each weight fragment is reused by every token tile. A CTA of 8 warps owns one 16-row weight tile; the warps take interleaved 64-wide K blocks (several blocks of weight loads in flight per thread) and their FP32 partials are summed through shared memory in fixed warp order. Both operands carry the same K permutation, so the checkpoint layout needs no repack; K must be a multiple of 64.'''
explain.numerics = '''Raw BF16 words go straight into the MMA fragments (BF16 x BF16 products, FP32 accumulation inside the MMA chain); the 8 warp partials are added in FP32 in warp order with no atomics, so the result is deterministic, and the sum is rounded once to BF16 with round-to-nearest-even. Results differ from the CUDA-core GEMV only through the grouping of the FP32 sums.'''
explain.math = [
  '''\begin{aligned} y_{tn} &= \mathrm{rn}_{\mathrm{bf16}}\Big(\sum_{w=0}^{7} P^{(w)}_{tn}\Big), \qquad P^{(w)}_{tn} = \sum_{b \equiv w \pmod{8}}\;\sum_{k=64b}^{64b+63} W_{nk}\,x_{tk}, \qquad t < m \end{aligned}''',
  '''\text{where } P^{(w)} \text{ is the FP32 partial of warp } w \text{ over the 64-wide K blocks } b \text{ it owns}''',
]
compute = "tensor_core"
mma = "mma.sync.m16n8k16.bf16"
kernels = [
  "dense_gemv_bf16_tc::dense_gemv_bf16_tc8", "dense_gemv_bf16_tc::dense_gemv_bf16_tc16",
  "dense_gemv_bf16_tc::dense_gemv_bf16_tc32",
]
rows = [1, 32]
pipeline.linear = { in = ["bf16"], act = "bf16", weight = "bf16->bf16", mma = "bf16*bf16", accumulate = "f32", scale = "none", out = ["bf16"] }
pipeline.lm_head = { in = ["bf16"], act = "bf16", weight = "bf16->bf16", mma = "bf16*bf16", accumulate = "f32", scale = "none", out = ["bf16"] }
