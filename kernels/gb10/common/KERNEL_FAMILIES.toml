[[family]]
id = "moe_nvfp4_gemv_1row"
description = "NVFP4 routed-expert up GEMV, one token (no activation)"
explain.about = '''The up projection of the routed experts for one token with NVFP4 weights and no activation, for expert MLPs that have only up and down projections. moe_expert_gemv::moe_expert_gemv has grid (output tiles, $k$): the y index is the expert slot $i$, whose expert is $e_i$, and each 128-thread block computes 4 outputs, one per warp, each lane taking 8 K elements (4 packed bytes and one scale byte) per step. With a zero input stride every slot reads the same token row; otherwise slot $i$ reads its own input row. A slot whose expert has no weights writes zeros.'''
explain.numerics = '''Each E2M1 nibble is decoded through a 16-entry table and multiplied in FP32 by its dequant scale $\mathrm{e4m3}(d)\,s_2^{(e)}$; BF16 activations are widened exactly, products accumulate in FP32 per lane and reduce by a warp shuffle tree, and the output is rounded once to BF16 (RNE).'''
explain.math = [
  '''u^{(i)}_n = \mathrm{rn}_{\mathrm{bf16}}\Big(\sum_{k=1}^{K} x^{(i)}_k\, \mathrm{e2m1}\big(q^{(e_i)}_{nk}\big)\, \mathrm{e4m3}\big(d^{(e_i)}_{n,\lfloor k/16 \rfloor}\big)\, s_2^{(e_i)}\Big), \qquad i = 1, \dots, k''',
]
