# 2026-09-29: Separate entry points per KV dtype in one file; the FP8 writer takes static k/v
# scales by value (reshape_and_cache.cu:135-162).
[[family]]
id = "kv_write"
description = "Append K and V rows to the paged cache"
explain.about = '''Appends each token's key and value rows (all $H_{kv}$ heads of width $d_h$) to the paged KV cache. One block of 256 threads per token reads the token's slot $\pi_t$ from the slot mapping, splits it into a physical block index and an offset within the block of $B$ slots, and writes the rows to that slot of the K and V caches, whose blocks are laid out as [slot, head, channel]; a negative slot writes nothing. reshape_and_cache_flash copies BF16 rows with 8-byte vector moves; reshape_and_cache_flash_fp8 encodes them to FP8 E4M3 with per-tensor dequantization scales $c_K, c_V$.'''
explain.numerics = '''The BF16 cache is a bit-exact copy. The FP8 path widens BF16 to FP32, multiplies by the FP32 reciprocal of the dequantization scale (not a division per element), and converts pairs to E4M3 with round-to-nearest-even and saturation to the finite range of plus or minus 448.'''
explain.math = [
  '''\begin{aligned} b_t &= \lfloor \pi_t / B \rfloor, \qquad o_t = \pi_t \bmod B \qquad (\text{no write if } \pi_t < 0) \\ \mathcal{K}_{b_t,o_t,h,i} &= k_{t,h,i}, \qquad \mathcal{V}_{b_t,o_t,h,i} = v_{t,h,i} \qquad (\text{BF16 cache}) \\ \mathcal{K}_{b_t,o_t,h,i} &= \mathrm{sat}_{\mathrm{e4m3}}\bigl(k_{t,h,i}\cdot \mathrm{fp32}(1/c_K)\bigr), \qquad \mathcal{V}_{b_t,o_t,h,i} = \mathrm{sat}_{\mathrm{e4m3}}\bigl(v_{t,h,i}\cdot \mathrm{fp32}(1/c_V)\bigr) \qquad (\text{FP8 cache}) \end{aligned}''',
]
compute = "memory"
kernels = ["reshape_and_cache::reshape_and_cache_flash", "reshape_and_cache::reshape_and_cache_flash_fp8"]
rows = [1, 65536]
pipeline.kv_write = { in = ["bf16", "bf16"], cache = "bf16", out = [] }
kernel_pipeline."reshape_and_cache::reshape_and_cache_flash_fp8".kv_write = { in = ["bf16", "bf16"], cache = "fp8", out = [] }
op = [{ op = "kv_write" }]
