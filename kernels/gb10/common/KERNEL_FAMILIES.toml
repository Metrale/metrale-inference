# 2026-10-08: W4A4 under a checkpoint's STATIC activation scale (ModelOpt `input_scale`, declared
# `dynamic: false`), over the w4a4_mx core (w4a4_mx_core.cuh, no new MMA code): the static-scale row
# quantizer (w4a4_quant_rows_impl<true>) and the routed-expert slot GEMV (the mx8 body with M = 1,
# one block row per (token, slot), weights and weight_scale_2 from global-id pointer tables).
# GLM-5.3-Flash's declared W4A4 routed experts at 1..=16 rows; its dense MLP pairs the quantizer
# with the w4a4_mx GEMVs (glm5next_mlp/forward/w4a4.rs).
# 2026-10-09: The persistent sweeps over the same body: the union sweeps (2..=16 rows) and the
# one-row own-slots sweep, gate and up in one launch.
[[family]]
id = "w4a4_mx_static"
description = "W4A4 MX with static NVFP4 activation scales: static row quantize and the routed-expert slot GEMV"
explain.about = '''W4A4 on the same block-scaled FP4 MMA core as w4a4_mx, for checkpoints that declare a static NVFP4 activation scale $\gamma$ per projection, and its routed-expert forms. w4a4_quant_rows_static (and the _k64 twin, which pads rows to a multiple of 128) quantizes with the global scale fixed to $\gamma$. w4a4_gemv_mx8_moe_slots runs the one-tile GEMV once per routed slot with that slot's expert weights; the union kernels (w4a4_gemv_mx8_moe_union, mx16_moe_union and their persistent _sweep forms, gate and up in one launch) sweep each expert of the rows' union once for every row that selected it, with w4a16_gemv::glm5next_moe_row_union building the union tables on the device. For prefill, w4a4_grouped_mx_m32, m64 and m128 run every routed slot in one launch over expert-sorted rows (weight tiles of 128 or 64 rows, 3- or 6-stage pipelines, after the tile-offset pass of w4a4_grouped_tiles or w4a4_grouped_one_group), and w4a4_grouped_gu_m32, m64 and m128 fuse gate, up, the clamped SwiGLU and the down input's static quantization into the epilogue. The _k64 variants accept K a multiple of 64, and the _cs variants read block scales stored as 5-bit offsets from a per-tensor base code that rebuild the same E4M3 codes; every variant writes the slot GEMV's bytes.'''
explain.numerics = '''As w4a4_mx, with $g = \gamma$: group scales $\max|x|/(6\gamma)$ rounded to nearest even and saturated to E4M3 (so values beyond $6\cdot 448\,\gamma$ saturate), E2M1 round-to-nearest-even saturating at 6, E2M1 x E2M1 block-scaled MMAs accumulating in FP32 in the slot GEMV's warp-class order, and one BF16 rounding of the sum times $\gamma\,s^{(e)}_{\mathrm{g}}$ (the checkpoint's GEMM alpha). In the fused gate/up epilogue gate and up are first rounded to BF16, the clamped SwiGLU is evaluated in FP32 and rounded to BF16, and that value is quantized under the down projection's $\gamma$.'''
explain.math = [
  '''\begin{aligned} s^{a}_{tj} &= \mathrm{sat}_{\mathrm{e4m3}}\Big(\tfrac{1}{6}\max_{i<16}|x_{t,16j+i}|\cdot\gamma^{-1}\Big), \qquad a_{tk} = \mathrm{rn}_{\mathrm{e2m1}}\Big(\frac{x_{tk}}{s^{a}_{t,\lfloor k/16\rfloor}\,\gamma}\Big) \\ y_{(t,r),n} &= \mathrm{rn}_{\mathrm{bf16}}\Big(\Big[\sum_{w=0}^{7}\;\sum_{c \equiv w \pmod{8}}\;\sum_{k=128c}^{128c+127}\big(q^{(e)}_{nk}\,s^{w,(e)}_{n,\lfloor k/16\rfloor}\big)\big(a_{tk}\,s^{a}_{t,\lfloor k/16\rfloor}\big)\Big]\cdot\big(\gamma\,s^{(e)}_{\mathrm{g}}\big)\Big), \quad e = \mathrm{id}_{t,r} \end{aligned}''',
  '''h_{tk} = \mathrm{rn}_{\mathrm{bf16}}\Big(\operatorname{silu}\big(\min(\tilde g_{tk}, L)\big)\cdot \min\big(\max(\tilde u_{tk}, -L), L\big)\Big), \qquad \tilde g = \mathrm{rn}_{\mathrm{bf16}}(\text{gate}),\; \tilde u = \mathrm{rn}_{\mathrm{bf16}}(\text{up}),\; L = \text{SwiGLU limit}''',
  '''\text{where } (t, r) \text{ is routed slot } r \text{ of token } t, \; q^{(e)}, s^{w,(e)}, s^{(e)}_{\mathrm{g}} \text{ are the E2M1 values of expert } e \text{, its E4M3 group scales and its FP32 tensor scale, and } \gamma \text{ is the static activation scale}''',
]
