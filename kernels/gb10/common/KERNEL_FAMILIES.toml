# 2026-09-29: MoE: routing, experts, blend.

# 2026-09-29: One kernel per scoring function, each a separate file: the scoring is a policy
# realised by copies. top_k, renormalisation and the routed scaling factor are runtime arguments.
[[family]]
id = "moe_topk"
description = "Top-k expert selection (per row, rows, batched) and the grouped-decode sort"
explain.about = '''Expert routing for $m$ rows over $E$ experts: one 256-thread block per row reads the router logits $z \in \mathbb{R}^{E}$ (at most 512), selects the top $k$ experts in $k$ rounds of a block-wide argmax (each round removes the winner), and writes their indices highest first with their routing weights $p_e$. The softmax kernels (moe_topk::moe_topk_softmax for one row, moe_topk_softmax_rows and moe_topk_softmax_batched for $m$ rows) select on the logits, take the softmax over all $E$ logits at each selected expert and optionally renormalise over the selected set; the sigmoid kernels (moe_topk_sig::moe_topk_sigmoid and its batched form) select on $\sigma(z_e)$ plus a per-expert selection bias $b_e$ but weight by the unbiased $\sigma(z_e)$, optionally renormalised, then multiplied by a routed scaling factor $\lambda$; the softmax-plus-bias and $\sqrt{\operatorname{softplus}}$-plus-bias scoring policies follow the same select-biased, weight-unbiased template. On equal values the lower expert index wins, except in moe_topk_softmax_batched, whose warp and cross-warp steps keep the lower lane or warp candidate. moe_fp8_grouped_sort::moe_fp8_grouped_sort then counting-sorts the $mk$ (row, slot) pairs by expert in one 256-thread block, producing per-expert offsets, the sorted row list, the inverse permutation $\pi$ used by the combine, and the ascending list of active experts that the grouped expert kernels launch over.'''
explain.numerics = '''BF16 logits are widened to FP32; scores, the softmax maximum and denominator, and the renormalising sums are FP32, with the exponentials and the sigmoid evaluated by the fast hardware exponential; the softmax denominator is a strided per-thread sum, a warp shuffle tree and a sequential sum of the eight warp totals. Weights are stored as FP32 and indices as 32-bit integers; the sigmoid path skips renormalisation when the selected sum is at most $10^{-20}$.'''
explain.math = [
  '''\begin{aligned} \mathcal{T}(x) &= \operatorname*{arg\,top}_{k}\,\{\, z_e \,\}_{e=1}^{E}, \qquad \tilde p_e = \frac{\exp(z_e - z_{\max})}{\sum_{j=1}^{E} \exp(z_j - z_{\max})}, \\ p_e &= \begin{cases} \tilde p_e \,/\, \sum_{e^\prime \in \mathcal{T}(x)} \tilde p_{e^\prime} & \text{normalise} \\ \tilde p_e & \text{otherwise} \end{cases} \qquad e \in \mathcal{T}(x) \end{aligned}''',
  '''\begin{aligned} s_e &= \sigma(z_e), \qquad \mathcal{T}(x) = \operatorname*{arg\,top}_{k}\,\{\, s_e + b_e \,\}_{e=1}^{E}, \\ p_e &= \lambda \cdot \begin{cases} s_e \,/\, \sum_{e^\prime \in \mathcal{T}(x)} s_{e^\prime} & \text{normalise and } \sum_{e^\prime \in \mathcal{T}(x)} s_{e^\prime} > 10^{-20} \\ s_e & \text{otherwise} \end{cases} \end{aligned}''',
  '''\begin{aligned} c_e &= \#\{(t,i) : e_{t,i} = e\}, \qquad o_e = \sum_{j<e} c_j, \\ \pi(t,i) &\in [\,o_{e_{t,i}},\; o_{e_{t,i}} + c_{e_{t,i}}\,), \qquad \mathcal{A} = (\, e : c_e > 0 \,) \text{ ascending} \end{aligned}''',
]
compute = "memory"
kernels = [
  "moe_topk::moe_topk_softmax", "moe_topk::moe_topk_softmax_rows", "moe_topk::moe_topk_softmax_batched",
  "moe_fp8_grouped_sort::moe_fp8_grouped_sort", "moe_topk_sig::moe_topk_sigmoid",
  "moe_topk_sig::moe_topk_sigmoid_batched",
]
rows = [1, 65536]
