# 2026-09-30: The declared W4A4 dense FFN (1..=32 rows) runs the whole mx ladder the default
# levers pick (ml/ops/w4a4_proj/mx_plan.rs), not just the 8-row entry.
[[family]]
id = "w4a4_mx"
description = "W4A4 MX GEMV (per-row NVFP4 activation quantize; mx8, the activation-reuse twins and the persistent entries)"
explain.about = '''W4A4 GEMV for 1 to 32 rows on the Blackwell block-scaled FP4 MMA (m16n8k64, E2M1 x E2M1 with UE4M3 scales per 16 values): the checkpoint's NVFP4 weight bytes and E4M3 group scales are the MMA operands directly, so the weights are never dequantized. w4a4_quant_rows (one 256-thread CTA per row) quantizes each BF16 activation row to NVFP4 with a dynamic per-row global scale, writing codes and group scales in the MMA fragment order. The GEMVs put weights on the 16-row side and tokens on the 8-wide side; a 256-thread CTA owns a 16-row weight tile, warp $w$ takes the 128-wide K chunks $c \equiv w \pmod 8$ in increasing order with two MMAs per chunk, and the 8 warp partials are summed in warp order. w4a4_gemv_mx8 serves up to 8 rows; w4a4_gemv_mx16_nt2 and w4a4_gemv_mx32_nt4 keep their activation fragments in registers across 2 or 4 weight tiles; w4a4_gemv_mx16_ps and w4a4_gemv_mx32_ps are persistent forms with staged activations. Every variant is bit-identical per row to the one-tile kernel.'''
explain.numerics = '''Activation quantization in FP32: the row global scale is $\max|x|/(6\cdot 448)$ (1 for an all-zero row), each group scale is $\max|x|/6$ times the reciprocal global scale rounded to nearest even and saturated to E4M3, and each value is $x/(s\,g)$ rounded to nearest even onto the E2M1 grid, saturating at 6 (zero when the group scale is zero). The MMA chains its FP32 accumulator across a warp's chunks, the warp partials are added in FP32 in warp order, and the sum is multiplied by $g_t\,s_{\mathrm{g}}$ and rounded once to BF16.'''
explain.math = [
  '''\begin{aligned} g_t &= \begin{cases} \max_k |x_{tk}| \,/\, (6\cdot 448) & \max_k |x_{tk}| > 0 \\ 1 & \text{otherwise} \end{cases} \\ s^{a}_{tj} &= \mathrm{sat}_{\mathrm{e4m3}}\Big(\tfrac{1}{6}\max_{i<16}|x_{t,16j+i}|\cdot g_t^{-1}\Big), \qquad a_{tk} = \mathrm{rn}_{\mathrm{e2m1}}\Big(\frac{x_{tk}}{s^{a}_{t,\lfloor k/16\rfloor}\,g_t}\Big) \end{aligned}''',
  '''y_{tn} = \mathrm{rn}_{\mathrm{bf16}}\Big(\Big[\sum_{w=0}^{7}\;\sum_{c \equiv w \pmod{8}}\;\sum_{k=128c}^{128c+127}\big(q_{nk}\,s^{w}_{n,\lfloor k/16\rfloor}\big)\big(a_{tk}\,s^{a}_{t,\lfloor k/16\rfloor}\big)\Big]\cdot\big(g_t\,s_{\mathrm{g}}\big)\Big)''',
  '''\text{where } q, s^{w} \text{ are the checkpoint E2M1 weight values and E4M3 group scales, } s_{\mathrm{g}} \text{ the FP32 weight tensor scale, and } \mathrm{rn}_{\mathrm{e2m1}} \text{ rounds to nearest even on the E2M1 grid, saturating at } 6''',
]
compute = "tensor_core"
mma = "mma.sync.m16n8k64.mxf4nvf4.block_scale"
kernel_compute."w4a4_gemv_mx::w4a4_quant_rows" = { compute = "memory" }
kernels = [
  "w4a4_gemv_mx::w4a4_quant_rows", "w4a4_gemv_mx::w4a4_gemv_mx8",
  "w4a4_gemv_mx::w4a4_gemv_mx16_nt2", "w4a4_gemv_mx::w4a4_gemv_mx32_nt4",
  "w4a4_gemv_mx::w4a4_gemv_mx16_ps", "w4a4_gemv_mx::w4a4_gemv_mx32_ps",
]
rows = [1, 32]
