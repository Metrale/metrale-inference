[[family]]
id = "w4a16_tc"
description = "NVFP4 W4A16 tensor-core GEMV row tiers (tc8, tc16)"
explain.about = '''NVFP4 W4A16 GEMV for 1 to 16 rows on BF16 tensor cores: w4a16_gemv_tc8 serves $m \le 8$ (the upper 8 activation rows of the fragment are zero) and w4a16_gemv_tc16 serves $m \le 16$ with two 8-column weight tiles per CTA. The token rows sit on the 16-row side of the m16n8k16 MMA and the weight rows on its 8-wide side, so one MMA covers every row and the dequantization work per weight byte does not depend on m. Eight warps take interleaved 128-wide K blocks with all of a trip's weight and scale loads issued before any dequantization, and the warp partials are summed through shared memory in warp order. A K permutation applied identically to both operands lets the kernel read the checkpoint layout directly; K must be a multiple of 128.'''
explain.numerics = '''Each E2M1 nibble is placed into BF16 bits as $q\,2^{-126}$ and each E4M3 group scale is converted exactly to BF16 as $s\,2^{100}$; one BF16x2 multiply forms $q\,s\,2^{-26}$, which is exact (a 2-bit times a 4-bit significand fits BF16 and stays normal), the MMA accumulates in FP32, and the epilogue multiplies the FP32 sum by $s_{\mathrm{g}}\,2^{26}$ before one round-to-nearest-even to BF16.'''
explain.math = [
  '''\begin{aligned} \tilde w_{nk} &= \mathrm{rn}_{\mathrm{bf16}}\big((q_{nk}\,2^{-126})\,(s_{n,\lfloor k/16 \rfloor}\,2^{100})\big) = q_{nk}\,s_{n,\lfloor k/16 \rfloor}\,2^{-26} \\ y_{tn} &= \mathrm{rn}_{\mathrm{bf16}}\Big(\Big[\sum_{w=0}^{7}\;\sum_{b \equiv w \pmod{8}}\;\sum_{k=128b}^{128b+127} x_{tk}\,\tilde w_{nk}\Big]\cdot\big(s_{\mathrm{g}}\,2^{26}\big)\Big), \qquad t < m \le 16 \end{aligned}''',
  '''\text{where } q_{nk} \text{ is the E2M1 weight value, } s_{nj} \text{ the E4M3 group scale and } s_{\mathrm{g}} \text{ the FP32 tensor scale}''',
]
compute = "tensor_core"
mma = "mma.sync.m16n8k16.bf16"
kernels = ["w4a16_gemv_tc::w4a16_gemv_tc8", "w4a16_gemv_tc::w4a16_gemv_tc16"]
rows = [1, 16]
