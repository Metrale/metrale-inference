# 2026-10-08: NoPE latent decode attention over the selected tokens of an FP8 latent cache, one
# CTA per (head, row). Its query is already in latent space and its output stays there: the
# engine folds kv_b_proj's key half into q_b_proj and its value half into o_proj at load
# (glm5next_dsa/layer.rs:111-122), so the absorption runs in those GEMVs, not here.
[[family]]
id = "glm_mla_decode"
description = "GLM-5 sparse NoPE MLA decode over an FP8 latent cache (latent 512)"
explain.about = '''Sparse multi-head latent attention for GLM-5 in its absorbed NoPE form: there is no rotary part, each cached token is its 512-wide latent row $c_s$ (keys and values are the same latent), and each head's query $q_h \in \mathbb{R}^{512}$ already carries the key up-projection, the value up-projection being applied afterwards in the output projection. One CTA of 16 warps runs per (head, row); the warps split the row's selection list (the indexer's token ids, $-1$ or out-of-range entries skipped, duplicates attended twice), gather four selected tokens at a time through the block table from the paged FP8 cache, and keep a per-warp online softmax, merged across warps in a shared-memory tree. A row with no valid token writes zeros.'''
explain.numerics = '''Queries BF16 widened to FP32; cache bytes are E4M3 decoded exactly to FP32 and multiplied by the static per-layer scale $s_k$ (1.0 for this checkpoint). FP32 lane partials reduced by a warp butterfly, softmax scale $512^{-1/2}$, __expf for every exponential, FP32 output accumulation, no FMA contraction; one RNE rounding to BF16 of $o/\ell$ at the store.'''
explain.math = [
  '''\begin{aligned} z_{h,j} &= \frac{1}{\sqrt{512}}\,\big\langle q_h,\; s_k\,\hat c_{j}\big\rangle, \qquad j \in \mathcal{T}_t \\ o_h &= \mathrm{rn}_{\mathrm{bf16}}\Bigg(\frac{\sum_{j \in \mathcal{T}_t} e^{\,z_{h,j} - m_h}\, s_k\, \hat c_j}{\sum_{j \in \mathcal{T}_t} e^{\,z_{h,j} - m_h}}\Bigg), \qquad m_h = \max_{j} z_{h,j} \end{aligned}''',
  '''\begin{aligned} m^\prime &= \max(m, z), \quad \ell^\prime = \ell\, e^{m - m^\prime} + e^{z - m^\prime}, \quad o^\prime = o\, e^{m - m^\prime} + e^{z - m^\prime}\, v \\ (m,\ell,o)_{a \oplus b} &= \Big(m^\ast,\; \ell_a e^{m_a - m^\ast} + \ell_b e^{m_b - m^\ast},\; o_a e^{m_a - m^\ast} + o_b e^{m_b - m^\ast}\Big), \quad m^\ast = \max(m_a, m_b) \end{aligned}''',
  '''\text{where } \hat c_j \in \mathrm{E4M3}^{512} \text{ is cached token } j,\ s_k \text{ the cache scale, } \mathcal{T}_t \text{ the indexer selection of row } t''',
]
compute = "cuda_core"
kernels = ["glm5next_dsa_mla_decode::glm5next_dsa_mla_decode_fp8"]
rows = [1, 4096]
pipeline.mla_attention = { in = ["bf16", "i32"], act = "bf16", weight = "bf16->bf16", cache = "fp8", scores = "f32", softmax = "f32", accumulate = "f32", out = ["bf16"] }
