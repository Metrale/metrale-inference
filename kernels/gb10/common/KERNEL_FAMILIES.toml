# 2026-09-29: Attention and the KV cache.

# 2026-09-29: head_dim sizes the per-lane registers (VEC_BF16 = HDIM/32) and is a macro: HDIM 256
# unless a target builds with -DHDIM=128 (8 targets' KERNEL.toml), or a per-head_dim copy of the
# file (`*_128.cu`, `*_512.cu`, the forced-512 model shadows). Each KV dtype is its own copy of
# the file. GQA ratio and context are runtime. One CTA per (q head, sequence); verify rows run as
# one-token sequences.
[[family]]
id = "paged_decode_attn"
description = "Paged softmax decode attention, one query row per sequence"
compute = "cuda_core"
kernels = ["paged_decode::paged_decode_attn", "paged_decode_fp8::paged_decode_attn_fp8"]
rows = [1, 4096]
# 2026-10-02: Q, K and V widened exactly to FP32, FP32 scores, online softmax (`__expf`) and PV
# sums, one BF16 rounding (paged_decode_attn.cu:96-313). The FP8 kernel reads an E4M3 cache with
# per-layer FP32 k/v scales applied to the FP32 score and output (paged_decode_attn_fp8.cu:132,
# :291-297). The turbo and NVFP4 copies define other entry points, none listed here.
pipeline.paged_attention = { in = ["bf16", "bf16", "bf16"], cache = "bf16", scores = "f32", softmax = "f32", accumulate = "f32", out = ["bf16"] }
kernel_pipeline."paged_decode_fp8::paged_decode_attn_fp8".paged_attention = { in = ["bf16", "bf16", "bf16"], cache = "fp8", scores = "f32", softmax = "f32", accumulate = "f32", out = ["bf16"] }
op = [{ op = "paged_attention" }]
