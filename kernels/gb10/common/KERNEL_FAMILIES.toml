# 2026-10-02: The dense tensor-core row tiles (rows as the MMA's N columns, 1..=64 per launch,
# activations staged in shared memory), one template over the weight-format policy
# (kernels/gb10/common/tc_rows.cuh): FP8 block-128 W8A16 (w8a16_tc_rows.cu, the canonical-tier
# W8A16 projections) and NVFP4 g16 W4A16 (w4a16_tc_rows.cu, the declared NVFP4 lm_head).
# 2026-10-09: w4a16_tc_rows_seg.cu instantiates the NVFP4 point's row tiles again over up to three
# weight segments sharing the input and a K-split S in {1, 2, 4} (tr_block_split, the S blocks
# of a column tile merging FP32 partial sums in one thread-block cluster). S = 1 writes
# w4a16_tc_rows' bytes; S > 1 changes the FP32 summation order (accuracy-gated, opt-in through
# METRALE_GLM_W4A16_SEG). Neither axis changes the pipeline below, so neither is a point here.
# 2026-10-11: The warps per block (NW, default 4) is a third such axis: w4a16_tc_rows_8_w1/_w2 run
# 1..=8 rows on 1- or 2-warp blocks (16 or 32 columns), each output's MMA sequence unchanged.
[[family]]
id = "tc_rows"
description = "Tensor-core row-tile dense projection (FP8 block-128 W8A16, NVFP4 g16 W4A16)"
explain.about = '''Row-invariant tensor-core projection for 1 to 64 decode rows with a weight-format policy: FP8 E4M3 with 128 x 128 FP32 block scales (w8a16_tc_rows_16, 32, 64 and the any-M _64c, which tiles rows in chunks of 64) or NVFP4 g16 (w4a16_tc_rows_16, 32, 64, the narrow-block w4a16_tc_rows_8_w1 and _8_w2, and the prefill GEMM w4a16_tc_gemm_64x128). Weight rows sit on the 16-row side of the m16n8k16 BF16 MMA and token rows on the 8-wide side; each warp owns 16 output columns, weight bytes go from a 16-byte global load straight into BF16 fragment registers, and activations are staged once per block in shared memory, one load group ahead. A row's summation order depends on K alone, so its output bits do not depend on the row count, the other rows, the tile counts or the warps per block, and the prefill GEMM writes decode's bytes. w4a16_tc_rows_seg_16, 32 and 64 with k1, k2 or k4 run up to three weight segments sharing the input and split K over a thread-block cluster of 1, 2 or 4 blocks, merging the FP32 partials in rank order through distributed shared memory.'''
explain.numerics = '''FP8: a weight byte becomes the BF16 value $\mathrm{e4m3}(b)\,2^{-120}$ by bit manipulation and activations are lifted by $2^{60}$ (both exact), MMAs accumulate each 128-K block in FP32, and the block sum is multiplied by $S\,2^{60}$ and added to the FP32 total. NVFP4: the BF16 product of the E2M1 value and its E4M3 scale is exact, the MMAs accumulate in FP32, and the sum (after the in-order split merge for $p>1$) is multiplied by $s_{\mathrm{g}}$. Both round once to BF16 at the store.'''
explain.math = [
  '''\begin{aligned} y_{tn} &= \mathrm{rn}_{\mathrm{bf16}}\Big(\sum_{b=0}^{K/128-1}\Big(\sum_{k=128b}^{128b+127}\big(\mathrm{e4m3}(W_{nk})\,2^{-120}\big)\big(x_{tk}\,2^{60}\big)\Big)\big(S_{\lfloor n/128\rfloor,\,b}\,2^{60}\big)\Big) \quad \text{(FP8 block-128)} \\ y_{tn} &= \mathrm{rn}_{\mathrm{bf16}}\Big(s_{\mathrm{g}}\Big(\big(P^{(0)}_{tn} + P^{(1)}_{tn}\big) + \dots + P^{(p-1)}_{tn}\Big)\Big), \quad P^{(\sigma)}_{tn} = \sum_{k \in \mathcal{K}_\sigma} x_{tk}\;\mathrm{rn}_{\mathrm{bf16}}\big(q_{nk}\,s_{n,\lfloor k/16\rfloor}\big) \quad \text{(NVFP4 g16)} \end{aligned}''',
  '''\text{where } S \text{ is the FP32 } 128 \times 128 \text{ weight block scale, } q, s, s_{\mathrm{g}} \text{ the NVFP4 E2M1 value, E4M3 group scale and tensor scale, and } \mathcal{K}_\sigma \text{ the K range of split } \sigma < p \;(p \in \{1, 2, 4\},\ \text{whole 256-wide units})''',
]
compute = "tensor_core"
mma = "mma.sync.m16n8k16.bf16"
kernels = [
  "w8a16_tc_rows::w8a16_tc_rows_16",
  "w8a16_tc_rows::w8a16_tc_rows_32",
