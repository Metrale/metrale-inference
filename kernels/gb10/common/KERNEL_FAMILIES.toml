# 2026-10-22: The KDA gate chain in one launch (kda_gates_w8a8.cu:3-26): f_b and g_b as two W8A8
# segments of one grid at K = 128 (per-row E4M3 activation quantization in each warp's prologue,
# the rowscale MMA chunk), the decay as f_b's epilogue, the beta sigmoid on block 0; the unfused
# chain's bytes. `_rows` takes 1..=8 rows in the MMA's n8 token columns (METRALE_GLM_KDA_GATES_ROWS,
# default on), and the grouped low-rank launch the recipe's W4A16 levers give.
[[family]]
id = "kda_gates_w8a8"
description = "KDA gate chain: f_b and g_b W8A8 with their activation quantization, the decay and the beta sigmoid, one launch over 1-8 rows"
explain.about = '''The whole KDA decode gate chain in one launch for 1 to 8 token rows. The low-rank decay and output-gate up-projections $f = W_f x_f$ and $o_g = W_g x_g$ (rank $K = 128$, $N = H d_k$ outputs, FP8 E4M3 weights with one scale per output row) run as two segments of one grid, one 16-row output tile per warp. Each warp quantizes the token rows to E4M3 with a per-row scale in its prologue, issues four $16 \times 8 \times 32$ E4M3 MMAs with the tokens in the MMA's 8 columns, and rescales; the bounded-sigmoid decay is the epilogue of the $f$ segment and the beta sigmoid runs on block 0. kda_gates_w8a8_k128 is the one-token entry and kda_gates_w8a8_k128_rows the $1 \le m \le 8$ entry; each row's bytes are independent of the others.'''
explain.numerics = '''Activation scale $s_a = \max(\max_k |x_k| / 448,\ 10^{-12})$ per row (an exact max), each value divided by $s_a$, clamped to $\pm 448$ and converted to E4M3 with round to nearest and saturation. E4M3 by E4M3 products accumulate in FP32 in the tensor core over the full $K = 128$; the result is scaled by $s_w \cdot s_a$ and rounded to BF16 (RNE), which is the stored $f$ and $o_g$. The decay epilogue widens that BF16 value and uses expf; beta uses __expf; decay and beta are FP32. Built without FMA contraction, so the bytes match the unfused chain.'''
explain.math = [
  '''\begin{aligned} s_a &= \max\!\Big(\tfrac{1}{448}\max_k |x_k|,\ 10^{-12}\Big), \qquad \hat x_k = \mathrm{sat}_{\mathrm{e4m3}}\big(x_k / s_a\big) \\ f_n &= \mathrm{rn}_{\mathrm{bf16}}\Big(\big(\textstyle\sum_{k=1}^{128} \hat W_{n,k}\, \hat x_k\big)\,(s_{w,n}\, s_a)\Big) \\ g_n &= \lambda\, \sigma\!\big(e^{A_{h(n)}}\,(f_n + \delta_n)\big), \qquad \beta_h = \sigma(b_h) \end{aligned}''',
  '''\text{where } \hat W \text{ is the E4M3 weight with row scale } s_{w,n},\ h(n) = \lfloor n / d_k \rfloor,\ \delta_n \text{ the per-channel bias},\ \lambda < 0 \text{ the gate lower bound; } o_g \text{ is computed like } f \text{ from } x_g, W_g''',
]
compute = "tensor_core"
mma = "mma.sync.m16n8k32.e4m3"
kernels = ["kda_gates_w8a8::kda_gates_w8a8_k128", "kda_gates_w8a8::kda_gates_w8a8_k128_rows"]
rows = [1, 8]
