# 2026-10-08: The engine keeps the highway FP32 ([T, hc, H]) where the reference keeps the model
# dtype: every kernel reads and writes the streams as f32 (glm5next_mhc.cu:207-215, :353-365,
# :546-554, :608-616, :642-657). hc_mix reads the BF16 `hc_fn` widened exactly and sums in FP32;
# the RMS over the hc*H stream values scales the mix (glm5next_mhc.cu:53-63). `hc_pre` (the fused
