[[family]]
id = "moe_grouped_fp8_scalar"
description = "FP8 block-128 grouped experts + shared expert on CUDA cores (LUT dequant), 4 rows per pass"
explain.about = '''Grouped decode for $m$ rows (up to 64) with FP8 block-128 weights on CUDA cores: rows are first sorted by expert, and each block row of the grid serves one active expert, reading every weight row once per pass and applying it to up to 4 routed rows at a time; the first $\lceil m/4 \rceil$ block rows serve the shared expert over all $m$ tokens, so the grid size does not depend on the routing. moe_shared_expert_fused_fp8_grouped::moe_expert_gate_up_act_fp8_grouped (128 threads, a gate and up column pair per warp) writes the FP32 SiLU product per sorted position; moe_expert_down_act_fp8_grouped (256 threads, 4 output columns per warp, 4 column groups per block, weights prefetched one chunk ahead) writes the BF16 down output per sorted position. Per row the result is bit-identical to the single-row kernels of moe_fp8_1row and independent of which rows share the pass.'''
explain.numerics = '''E4M3 weights are decoded through a 256-entry shared-memory table and multiplied by their FP32 128 x 128 block scale; BF16 activations are widened to FP32 and products summed in fixed groups of four, accumulated in FP32 per lane and reduced by a warp shuffle tree. Gate and up are rounded to BF16 (RNE) before the FP32 SiLU product (fast exponential), which is stored as FP32; the down output is rounded once to BF16.'''
explain.math = [
  '''\begin{aligned} &\text{for each sorted position } \pi \text{ with token } t(\pi) \text{ and expert } e(\pi): \\ g_{\pi} &= \mathrm{rn}_{\mathrm{bf16}}\big(\hat W^{\mathrm{gate}}_{e(\pi)}\, x_{t(\pi)}\big), \qquad u_{\pi} = \mathrm{rn}_{\mathrm{bf16}}\big(\hat W^{\mathrm{up}}_{e(\pi)}\, x_{t(\pi)}\big) \\ h_{\pi} &= \operatorname{silu}(g_{\pi}) \odot u_{\pi} \in \mathbb{R}^{I}, \qquad y_{\pi} = \mathrm{rn}_{\mathrm{bf16}}\big(\hat W^{\mathrm{down}}_{e(\pi)}\, h_{\pi}\big) \\ &\text{where } \hat W_{nk} = \mathrm{e4m3}(W_{nk})\, s_{\lfloor n/128 \rfloor, \lfloor k/128 \rfloor} \text{ and the shared expert is applied to every token} \end{aligned}''',
]
compute = "cuda_core"
kernels = [
  "moe_shared_expert_fused_fp8_grouped::moe_expert_gate_up_act_fp8_grouped",
