# 2026-09-29: The WxAy engine (wxay_engine.cuh): one skinny tensor-core engine, format work in a
# policy (load_w / prep_w / mma / store). Instantiated for W8A8 with per-row or block-128 weight
# scales and dynamic per-token or per-128 activation scales, M <= 128 (16 token tiles of 8).
[[family]]
id = "wxay"
description = "WxAy policy engine: tensor-core GEMV for M <= 128, row-invariant"
explain.about = '''The WxAy skinny tensor-core engine for W8A8 decode projections of 1 to 128 rows: E4M3 weights times E4M3 activations on m16n8k32 FP8 MMAs, with the format handled by a policy. The rowscale policy pairs per-output-channel weight scales with per-token activation scales; the blk128 policy pairs 128 x 128 weight block scales with per-128 activation group scales, folded per chunk. A 256-thread CTA owns 16 weight rows (the MMA's 16-row side) and MB token tiles of 8 (mb1 to mb16 cover up to 8 to 128 rows); K is cut into 128-value chunks, chunk $c$ belongs to warp $c \bmod 8$ for every row count and is multiplied in increasing order, and the 8 warp partials are summed in warp order, so a token's result is independent of how many tokens share the launch. Up to three stacked weight segments (for example Q, K and V) are read in place into one output, and w8a8_gemv_rowscale_mb1_ku8_split4 writes up to four projections of one input to separate outputs with the same bytes.'''
explain.numerics = '''E4M3 x E4M3 products accumulate in FP32 inside the MMA. Rowscale: chunk sums chain in the warp's FP32 accumulator, the warp partials are added, and the sum is multiplied by $w_n\,a_t$ before one BF16 rounding. Blk128: each chunk's FP32 MMA sum is folded with one fused multiply-add by the FP32 product of its weight and activation scales, then the warp partials are added and rounded once to BF16 (round-to-nearest-even).'''
explain.math = [
  '''\begin{aligned} S_{c,tn} &= \sum_{k=128c}^{128c+127} \mathrm{e4m3}(A_{tk})\,\mathrm{e4m3}(W_{nk}) \\ y_{tn} &= \mathrm{rn}_{\mathrm{bf16}}\Big(\Big[\sum_{w=0}^{7}\;\sum_{c \equiv w \pmod{8}} S_{c,tn}\Big]\cdot\big(w_n\,a_t\big)\Big) \quad \text{(rowscale)} \\ y_{tn} &= \mathrm{rn}_{\mathrm{bf16}}\Big(\sum_{w=0}^{7}\;\sum_{c \equiv w \pmod{8}} S_{c,tn}\cdot\big(w_{\lfloor n/128\rfloor,c}\,a_{t,c}\big)\Big) \quad \text{(blk128)} \end{aligned}''',
  '''\text{where } w_n, a_t \text{ are the per-channel weight and per-token activation scales, and } w_{\lfloor n/128\rfloor,c}, a_{t,c} \text{ the block-128 weight and group-128 activation scales (all FP32)}''',
]
compute = "tensor_core"
mma = "mma.sync.m16n8k32.e4m3"
kernels = [
  "w8a8_gemv::w8a8_gemv_rowscale_mb1_ku8", "w8a8_gemv::w8a8_gemv_rowscale_mb2",
  "w8a8_gemv::w8a8_gemv_rowscale_mb4", "w8a8_gemv::w8a8_gemv_rowscale_mb8",
  "w8a8_gemv::w8a8_gemv_rowscale_mb16", "w8a8_gemv::w8a8_gemv_blk128_mb1_ku8",
  "w8a8_gemv::w8a8_gemv_blk128_mb2", "w8a8_gemv::w8a8_gemv_blk128_mb4",
  "w8a8_gemv::w8a8_gemv_blk128_mb8", "w8a8_gemv::w8a8_gemv_blk128_mb16",
  # 2026-10-21: The rowscale mb1 entry over up to four weights, each into its own output
  # (default-on METRALE_GLM_DSA_PROJ_IN_MERGED); the same tiles, so the same bits per output.
  "w8a8_gemv::w8a8_gemv_rowscale_mb1_ku8_split4",
]
rows = [1, 128]
pipeline.linear = { in = ["{activation}"], act = "{activation}", weight = "{weight}->e4m3", mma = "e4m3*e4m3", accumulate = "f32", scale = "f32", out = ["bf16"] }
pipeline.lm_head = { in = ["{activation}"], act = "{activation}", weight = "{weight}->e4m3", mma = "e4m3*e4m3", accumulate = "f32", scale = "f32", out = ["bf16"] }
op = [{ op = "linear" }, { op = "lm_head" }]
