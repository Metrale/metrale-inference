explain.math = [
  '''p_{t} = \big[\, q_t \;\; k_t \;\; v_t \,\big] \in \mathbb{R}^{3n}, \qquad p_{t,j} = q_{t,j},\ p_{t,n+j} = k_{t,j},\ p_{t,2n+j} = v_{t,j}''',
]
