[[family]]
id = "moe_w4a16_grouped_gemm"
description = "NVFP4 W4A16 grouped expert GEMM over expert-sorted tokens (prefill), no epilogue"
explain.about = '''Prefill grouped GEMM of NVFP4 experts against BF16 activations over expert-sorted rows, all experts in one launch, with no epilogue (gate, up or down are separate launches). The grid is (N tiles, M tiles, experts): expert $e$ owns sorted rows $[o_e, o_{e+1})$, a 128-thread block computes a 64 x 64 output tile with each of its 4 warps owning 16 rows and 8 MMA n-tiles of 8 columns, and K advances 16 at a time. Each step stages the 64 x 16 activation tile, gathered through the sorted token ids (or in order when there are none), and the 16 x 64 weight tile dequantized to BF16 in shared memory, then issues mma m16n8k16. moe_w4a16::moe_w4a16_grouped_gemm_ptrtable reads weights stored $[N, K/2]$ through per-expert pointer tables; moe_w4a16_grouped_gemm_ptrtable_t reads them stored $[K/2, N]$ with scales $[K/16, N]$ so adjacent threads read adjacent bytes. An expert without weights writes nothing.'''
explain.numerics = '''Each weight is dequantized in FP32 as E2M1 value times E4M3 scale times the per-expert FP32 scale $s_2$ and rounded to BF16 (RNE) in shared memory; BF16 x BF16 MMAs accumulate in FP32 over the full K, and the output is rounded once to BF16.'''
explain.math = [
  '''\begin{aligned} \tilde W^{(e)}_{nk} &= \mathrm{rn}_{\mathrm{bf16}}\Big(\mathrm{e2m1}\big(q^{(e)}_{nk}\big)\, \mathrm{e4m3}\big(d^{(e)}_{n,\lfloor k/16 \rfloor}\big)\, s_2^{(e)}\Big) \\ C_{\pi,n} &= \mathrm{rn}_{\mathrm{bf16}}\Big(\sum_{k=1}^{K} x_{t(\pi),k}\, \tilde W^{(e)}_{nk}\Big), \qquad \pi \in [o_e, o_{e+1}) \end{aligned}''',
]
