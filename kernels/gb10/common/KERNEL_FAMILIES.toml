[[family]]
id = "rms_norm_act_quant"
description = "RMSNorm with the activation quantizer in its epilogue (FP8 per-row / per-128, NVFP4 g16)"
explain.about = '''RMSNorm with an activation quantizer in its epilogue, one block per row with $\min(K, 1024)$ threads. The normalized row is rounded to BF16 exactly as the standalone RMSNorm stores it and kept in shared memory, then quantized in the same launch: rms_norm_quant_fp8_row to per-token E4M3 with one FP32 scale, rms_norm_quant_fp8_g128 to E4M3 with one FP32 scale per 128-wide group (one thread per group), and rms_norm_quant_nvfp4 to E2M1 values with E4M3 scales per 16 and an FP32 per-row global scale in the W4A4 GEMV's fragment order. Each output is bit-identical to running the norm and the corresponding quantizer as two kernels. The norm weight is applied in the $(1+\gamma_i)$ form.'''
explain.numerics = '''Sum of squares in FP32 (per-thread pair sums, then a block reduction), $\operatorname{rsqrt}$ in FP32, the scaled value $(x_i\,r)(1+\gamma_i)$ rounded to BF16 with round-to-nearest-even. FP8: scale $\max|y|/448$ floored at $10^{-12}$, value divided, clamped to $\pm 448$ and converted with round-to-nearest-even and saturation. NVFP4: $g = \max|y|/(6\cdot 448)$ (1 for a zero row), group scale $\max|y|/6$ times $g^{-1}$ rounded to nearest even and saturated to E4M3, E2M1 round-to-nearest-even saturating at 6.'''
explain.math = [
  '''\begin{aligned} r &= \operatorname{rsqrt}\Big(\frac{1}{d}\sum_{j=1}^{d} x_j^2 + \epsilon\Big), \qquad y_i = \mathrm{rn}_{\mathrm{bf16}}\big((x_i\,r)\,(1+\gamma_i)\big) \\ s_G &= \max\Big(\max_{i \in G}|y_i| \,/\, 448,\; 10^{-12}\Big), \quad q_i = \mathrm{sat}_{\mathrm{e4m3}}\Big(\min\big(\max(y_i/s_G, -448), 448\big)\Big) \quad \text{(FP8, } G = \text{row or 128-group)} \\ g &= \max_i |y_i| \,/\, (6\cdot 448), \quad s_j = \mathrm{sat}_{\mathrm{e4m3}}\Big(\tfrac{1}{6}\max_{i<16}|y_{16j+i}|\cdot g^{-1}\Big), \quad q_i = \mathrm{rn}_{\mathrm{e2m1}}\Big(\frac{y_i}{s_{\lfloor i/16\rfloor}\,g}\Big) \quad \text{(NVFP4)} \end{aligned}''',
]
compute = "memory"
kernels = [
  "rms_norm_act_quant::rms_norm_quant_fp8_row", "rms_norm_act_quant::rms_norm_quant_fp8_g128",
  "rms_norm_act_quant::rms_norm_quant_nvfp4",
]
rows = [1, 65536]
pipeline.rms_norm = { in = ["bf16"], compute = "f32", out = ["bf16"] }
pipeline.act_quant = { in = ["bf16"], compute = "f32", out = ["{format}"] }
op = [{ op = "rms_norm", feeds = ["act_quant"] }, { op = "act_quant", after = ["rms_norm"] }]
