[[family]]
id = "gdn_recurrence_strided"
description = "Gated delta rule decode, all sequences in one launch (strided states)"
explain.about = '''The single-token Gated DeltaNet decode step of gdn_recurrence for every sequence of a batch in one launch: grid (value heads, sequences), one thread per state column, with the q/k, v, gate/beta and output rows of each sequence at caller-given strides so the batched decode needs no repacking. Each sequence's state is the slot of a strided state pool. The arithmetic, the decay clamp and the state-norm clamp are those of the one-sequence decode kernel.'''
explain.numerics = '''FP32 q, k, v, gates, state and output; FP32 arithmetic without FMA contraction, column dot products in groups of four rows in ascending order; read-out scale rsqrtf of $d_k$; the norm clamp sums squares per thread, reduces with a shuffle-down tree and four warp partials, and scales by rsqrtf.'''
explain.math = [
  '''\begin{aligned} \bar\alpha_{b} &= \min\!\big(\max(\alpha_{b}, 10^{-6}),\, 1 - 10^{-6}\big) \\ u_{b} &= \beta_{b}\,\big(v_{b} - \bar\alpha_{b}\, S_{b}^\top k_{b}\big) \\ S_{b}^{+} &= \bar\alpha_{b}\, S_{b} + k_{b}\, u_{b}^\top, \qquad o_{b} = \frac{(S_{b}^{+})^\top q_{b}}{\sqrt{d_k}} \\ S_{b} &\leftarrow S_{b}^{+} \cdot \min\!\Big(1,\ \frac{1000}{\lVert S_{b}^{+} \rVert_F}\Big) \end{aligned}''',
  '''\text{where } b \text{ indexes the sequence (per value head)},\ S_b \in \mathbb{R}^{d_k \times d_v}''',
]
