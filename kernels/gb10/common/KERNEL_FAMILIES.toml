# 2026-10-09: glm_mla_decode's contract on tensor cores, head-batched: one CTA per (split, row,
# group of 24 heads) stages each selected latent token once for all its heads (absorbed NoPE
# MLA: every head reads the same tokens), scores them with an m16n8k16 bf16 MMA (FP8 is exact
# in bf16),
# and accumulates P V with P split into bf16 hi + lo; a merge kernel combines the splits. Opt-in
# through METRALE_GLM_DSA_DECODE_HB (glm5next_dsa/attend.rs); it differs from glm_mla_decode in
# summation order only. 2026-10-12: `_phi` is the same body with P as one bf16 (prefill only,
# METRALE_GLM_DSA_HB_PREFILL_P_HI; accuracy-gated). 2026-10-14: `glm5next_dsa_mla_prefill_pipe_phi`
# is `_phi` rescheduled (double-buffered tile, QK on all eight warps), byte-identical per row
# (METRALE_GLM_DSA_HB_PREFILL_PIPE); both files take their per-tile steps from
# glm5next_dsa_mla_hb_tile.cuh. 2026-10-14: `glm5next_dsa_mla_prefill_tc_phi` is `_phi` at one
# split on one warp-specialized CTA per (row, head group) (producer warps gather + widen, consumer
# warps QK + softmax + PV), byte-identical per row (METRALE_GLM_DSA_HB_PREFILL_TC). 2026-10-15:
# `glm5next_dsa_mla_prefill_tc_phi_nanor` is the same with one NaN-byte test per producer share
# of a tile instead of one per word, same bytes (METRALE_GLM_DSA_TC_NANOR).
[[family]]
id = "glm_mla_decode_hb"
description = "GLM-5 sparse NoPE MLA decode, head-batched on tensor cores, split + merge (latent 512)"
explain.about = '''The same absorbed NoPE latent attention as glm_mla_decode (latent 512, keys equal values), batched over heads on BF16 tensor cores: because every head of a row attends the same selected tokens, one CTA per (split, row, group of 24 heads) gathers each 32-token tile of its slice of the selection once, widens it to BF16 in shared memory, computes $S^{\top} = \hat C\, Q^{\top}$ with m16n8k16 MMAs, runs an online softmax per head, and accumulates $O^{\top} \mathrel{+}= \hat C^{\top} P^{\top}$ with P split into a BF16 high and low part. With several splits each CTA writes its unnormalised FP32 partial $(m, \ell, o)$ and a merge kernel combines them per (head, row) in split order; with one split it writes the normalised output directly. The _phi entries carry P as one BF16 value (prefill), and the two prefill entries are byte-identical reschedules of it: a double-buffered pipeline with QK on all warps, and a warp-specialised producer/consumer kernel with named barriers.'''
explain.numerics = '''E4M3 latent bytes widen exactly to BF16; QK accumulates in FP32 over four interleaved MMA chains combined as $((d_0+d_1)+(d_2+d_3))$, scaled by $s_k$ then by $512^{-1/2}$; softmax in FP32 with __expf; P is $\mathrm{rn}_{\mathrm{bf16}}(p) + \mathrm{rn}_{\mathrm{bf16}}(p - \mathrm{rn}_{\mathrm{bf16}}(p))$ (relative error at most $2^{-16}$; $2^{-9}$ for the _phi entries) into FP32 accumulators; $s_v$ and $1/\ell$ are applied at the store, which rounds once to BF16 (RNE). It differs from glm_mla_decode only in summation order and the P rounding, and a row's result never depends on the rows batched with it.'''
explain.math = [
  '''\begin{aligned} Z_{h,j} &= \Big(\big\langle \mathrm{bf16}(q_h),\, \hat c_j \big\rangle\, s_k\Big)\, \frac{1}{\sqrt{512}}, \qquad j \in \mathcal{T}_t^{(\varsigma)} \\ m^{(\varsigma)}_h &= \max_j Z_{h,j}, \qquad \ell^{(\varsigma)}_h = \sum_j e^{\,Z_{h,j} - m^{(\varsigma)}_h}, \qquad o^{(\varsigma)}_h = \sum_j \big(\pi^{\mathrm{hi}}_{h,j} + \pi^{\mathrm{lo}}_{h,j}\big)\, \hat c_j \\ \pi^{\mathrm{hi}}_{h,j} &= \mathrm{rn}_{\mathrm{bf16}}\big(e^{\,Z_{h,j} - m_h}\big), \qquad \pi^{\mathrm{lo}}_{h,j} = \mathrm{rn}_{\mathrm{bf16}}\big(e^{\,Z_{h,j} - m_h} - \pi^{\mathrm{hi}}_{h,j}\big) \end{aligned}''',
  '''\begin{aligned} m^\ast_h &= \max_{\varsigma :\, \ell^{(\varsigma)}_h > 0} m^{(\varsigma)}_h, \qquad \omega_\varsigma = e^{\,m^{(\varsigma)}_h - m^\ast_h} = \exp\big(\mathrm{lse}^{(\varsigma)}_h - m^\ast_h\big) / \ell^{(\varsigma)}_h \\ o_h &= \mathrm{rn}_{\mathrm{bf16}}\Bigg(\frac{s_v \sum_{\varsigma} \omega_\varsigma\, o^{(\varsigma)}_h}{\sum_{\varsigma} \omega_\varsigma\, \ell^{(\varsigma)}_h}\Bigg), \qquad \mathrm{lse}^{(\varsigma)}_h = m^{(\varsigma)}_h + \ln \ell^{(\varsigma)}_h \end{aligned}''',
  '''\text{where } \varsigma \text{ indexes the splits (contiguous runs of 32-token tiles), } \hat c_j \text{ the cached E4M3 latent widened to BF16, } s_k = s_v \text{ the cache scale}''',
]
compute = "tensor_core"
mma = "mma.sync.m16n8k16.bf16"
kernels = [
  "glm5next_dsa_mla_decode_hb::glm5next_dsa_mla_decode_hb_fp8",
  "glm5next_dsa_mla_decode_hb::glm5next_dsa_mla_decode_hb_fp8_phi",
  "glm5next_dsa_mla_decode_hb::glm5next_dsa_mla_merge",
  "glm5next_dsa_mla_prefill_pipe::glm5next_dsa_mla_prefill_pipe_phi",
  "glm5next_dsa_mla_prefill_tc::glm5next_dsa_mla_prefill_tc_phi",
  "glm5next_dsa_mla_prefill_tc::glm5next_dsa_mla_prefill_tc_phi_nanor",
]
rows = [1, 4096]
pipeline.mla_attention = { in = ["bf16", "i32"], act = "bf16", weight = "bf16->bf16", cache = "fp8", scores = "f32", softmax = "f32", accumulate = "f32", out = ["bf16"] }
op = [{ op = "mla_attention" }]
