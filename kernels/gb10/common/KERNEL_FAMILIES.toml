# 2026-10-22: The KDA recurrence of a batched decode: one token of each of up to 16 sequences in one
# launch (grid.z = rows), each sequence's state its own slot (METRALE_GLM_KDA_SEQ_ROWS=decode): the
# shared-memory kernel's 1R+1W geometry (`_smem_rows`), or the register-resident one under
# METRALE_GLM_KDA_ROWS_REG (`_rows_reg`); per row the one-token kernel's expressions in order
# (kda_recurrent.cu:279, :333).
[[family]]
id = "kda_recurrent_rows"
description = "KDA gated delta rule with per-channel decay, one token of each of up to 16 sequences per launch"
explain.about = '''The KDA recurrence of kda_recurrent for one token of each of up to 16 different sequences in one launch, for batched decode: grid (heads, value-column slices, rows), each row reading its q, k, v, decay and beta at its own workspace row and updating its own state slot (a null state skips the row). kda_recurrent_decode_bf16_smem_rows keeps the decayed column in shared memory between the two passes, so the state is read once and written once; kda_recurrent_decode_bf16_rows_reg keeps it in registers with $D = 128$ fixed at compile time. Per row the expressions and their order are the one-token kernel's.'''
explain.numerics = '''As kda_recurrent: BF16 q, k, v widened exactly, FP32 decay (expf of the log decay), beta, state and output, query pre-multiplied by $1/\sqrt{D}$, column sums over $k$ in order in FP32 without FMA contraction.'''
explain.math = [
  '''\begin{aligned} \tilde S_r &= \operatorname{diag}\!\big(e^{g_r}\big)\, S_r \\ u_r &= \beta_r\,\big(v_r - \tilde S_r^\top k_r\big) \\ S_r &\leftarrow \tilde S_r + k_r\, u_r^\top, \qquad o_r = S_r^\top \Big(\frac{q_r}{\sqrt{D}}\Big), \qquad r = 1, \dots, m \le 16 \end{aligned}''',
  '''\text{where } r \text{ indexes the row (one sequence each) and } g_r \in \mathbb{R}^{D} \text{ is its per-channel log decay}''',
]
compute = "cuda_core"
kernels = [
  "kda_recurrent::kda_recurrent_decode_bf16_smem_rows", "kda_recurrent::kda_recurrent_decode_bf16_rows_reg",
]
rows = [1, 16]
pipeline.gdn_recurrence = { in = ["bf16", "f32", "f32"], state = "f32", compute = "f32", out = ["f32"] }
op = [{ op = "gdn_recurrence" }]
