[[family]]
id = "mamba2_ssm"
description = "Mamba2 selective state update, one row per sequence (grid over the batch)"
explain.about = '''The Mamba2 selective state update for one token per sequence: per head $h$ (in group $g$ of the shared $B$, $C$ projections) the state $H \in \mathbb{R}^{P \times N}$ ($P$ head dim, $N$ state size) decays by a scalar $\bar A$ and accumulates the outer product of $x$ with $\Delta B$; the output contracts the state with $C$ and adds the skip term $D x$. One block per (head, sequence) with one thread per state column; for each head-dim row a thread updates its element and a warp shuffle reduces the row's partial dot product with $C$. Head dim, state size and group count are runtime arguments ($N \le 128$, a multiple of 32, $P \le N$). The state is not clamped.'''
explain.numerics = '''BF16 x, B, C and dt widened exactly, FP32 A_log, D, dt bias and state; FP32 arithmetic with accurate expf and logf, no FMA contraction. The read-out sums each warp's partials with a shuffle-down tree, then the warp sums in order, then adds $D x$; the output is rounded once to BF16 (RNE).'''
explain.math = [
  '''\begin{aligned} \Delta &= \operatorname{clamp}\!\Big(\operatorname{sp}(\delta_{\mathrm{raw}} + \delta_h),\ \Delta_{\min},\ \Delta_{\max}\Big), \qquad \operatorname{sp}(z) = \begin{cases} z & z > 20 \\ \log(1 + e^{z}) & z \le 20 \end{cases} \\ \bar A &= \exp\!\big(-e^{A_h}\,\Delta\big) \\ H_{p,s} &\leftarrow \bar A\, H_{p,s} + x_p\,(\Delta B_{g,s}) \\ y_p &= \mathrm{rn}_{\mathrm{bf16}}\Big(\textstyle\sum_{s=1}^{N} H_{p,s}\, C_{g,s} + D_h\, x_p\Big) \end{aligned}''',
  '''\text{where } A_h \text{ is the learned log decay},\ \delta_h \text{ the dt bias},\ D_h \text{ the skip coefficient},\ \Delta_{\min}, \Delta_{\max} \text{ the configured time-step limits}''',
]
compute = "cuda_core"
kernels = ["mamba2_ssm::mamba2_ssm_decode"]
rows = [1, 4096]
pipeline.ssm_update = { in = ["bf16", "bf16"], state = "f32", compute = "f32", out = ["bf16"] }
op = [{ op = "ssm_update" }]
