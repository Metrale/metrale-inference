[[family]]
id = "moe_prefill_w8a8"
description = "FP8 block-128 W8A8 grouped expert GEMM over a tile work list (the 35B MoE above 64 rows)"
explain.about = '''The FP8 block-128 W8A8 prefill path for expert batches above 64 rows. moe::moe_sort_by_expert counting-sorts the $mk$ (token, slot) pairs by expert in one block (offsets $o_e$, sorted token ids, inverse permutation $\pi$), and moe::moe_build_tile_worklist emits one work item per (expert, 128-row M tile, 64-column N tile) of every expert that has rows and weights. moe_w8a8_grouped_gemm::moe_w8a8_grouped_gemm_pm4 has its 256-thread CTAs stride over the work list: each tile stages raw FP8 activations (rows gathered by token id) and weights through a two-stage asynchronous copy pipeline, converts them to BF16 in shared memory, and runs mma m16n8k16 over 32-K steps, 8 warps of 16 rows by 64 columns, folding the block scales into an outer accumulator every 64 K. Between the gate+up and down GEMMs moe_silu_mul::silu_mul_quant_fp8 forms $\operatorname{silu}(g) \odot u$ per row (one 128-thread block per row) and quantizes it to E4M3 per 128 columns as the down GEMM input; the layer input is quantized the same way per (token, 128 values) before the gate+up GEMM.'''
explain.numerics = '''E4M3 activations and weights are converted to BF16 exactly (NaN codes read as 0), multiplied on BF16 tensor cores and accumulated in FP32 per 64-K chunk; each chunk is folded into an FP32 outer accumulator times activation scale and weight block scale of its 128-K block, and the output is rounded once to BF16 (RNE). The SiLU product is computed in FP32 with the fast exponential, rounded to BF16, then quantized with scale $\max(\mathrm{amax}/448, 10^{-12})$, clamp to $\pm 448$ and a saturating round-to-nearest E4M3 encode.'''
explain.math = [
  '''\begin{aligned} C_{\pi,n} &= \mathrm{rn}_{\mathrm{bf16}}\Big(\sum_{c} \Big(\sum_{k \in c} \bar x_{t(\pi),k}\, \mathrm{e4m3}\big(W^{(e)}_{nk}\big)\Big)\, a_{t(\pi),\lfloor c/2 \rfloor}\; s^{(e)}_{\lfloor n/128 \rfloor,\lfloor c/2 \rfloor}\Big), \qquad c = \text{chunks of 64 along } K,\ \pi \in [o_e, o_{e+1}) \\ h_{\pi,j} &= \mathrm{rn}_{\mathrm{bf16}}\big(g_{\pi,j}\, \sigma(g_{\pi,j})\, u_{\pi,j}\big), \qquad b_{\pi,\kappa} = \max\Big(\tfrac{\max_{j \in \kappa} |h_{\pi,j}|}{448},\, 10^{-12}\Big) \\ \bar h_{\pi,j} &= \mathrm{sat}_{\mathrm{e4m3}}\Big(\mathrm{rn}\big(\operatorname{clamp}(h_{\pi,j} / b_{\pi,\kappa},\, -448,\, 448)\big)\Big), \qquad \kappa = \text{groups of 128 columns} \\ &\text{where } \bar x, a \text{ are the E4M3 input and its per-(token, 128) scales, } s^{(e)} \text{ the weight block scales, and } g, u \text{ the gate and up GEMM outputs} \end{aligned}''',
]
compute = "tensor_core"
mma = "mma.sync.m16n8k16.bf16"
kernel_compute."moe_silu_mul::silu_mul_quant_fp8" = { compute = "memory" }
kernel_compute."moe::moe_sort_by_expert" = { compute = "memory" }
kernel_compute."moe::moe_build_tile_worklist" = { compute = "memory" }
kernels = [
  "moe_silu_mul::silu_mul_quant_fp8", "moe::moe_sort_by_expert", "moe::moe_build_tile_worklist",
  "moe_w8a8_grouped_gemm::moe_w8a8_grouped_gemm_pm4",
]
rows = [1, 65536]
# 2026-10-02: The grouped GEMM converts both E4M3 operands exactly to BF16 for a BF16 MMA
# (moe_w8a8_grouped_gemm.cu:314-380): E4M3 products. The SiLU kernel rounds the FP32 product to
