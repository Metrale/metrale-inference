# 2026-10-08: RMSNorm (plain weight) of the kv_a row, FP8-quantised into its paged slot, one token
# per launch (glm5next_mla_latent_write.cu:1-14).
[[family]]
id = "glm_mla_latent_write"
description = "GLM-5 latent cache write: RMSNorm + FP8 quantisation + paged store"
explain.about = '''Writes one token's MLA latent into the paged FP8 latent cache: the BF16 kv_a projection row $c \in \mathbb{R}^{512}$ is RMS-normalised with GLM's plain weight (no $1+\gamma$ offset), multiplied by the reciprocal cache scale and stored as E4M3 at its slot. One block of exactly 512 threads per token (one thread per latent channel); the sum of squares is a warp butterfly followed by a cross-warp reduction; a slot of $-1$ skips the token. There is no rotary part, since GLM-5 latent attention is NoPE with one latent head.'''
explain.numerics = '''BF16 input widened to FP32; FP32 sum of squares (warp shuffle tree, then a tree over the 16 warp sums), rsqrtf, products $(c_i r)\gamma_i$ then times $1/s_k$ in FP32 without FMA contraction; a single saturating round-to-nearest-even conversion to E4M3 with no intermediate BF16 rounding. The scale is a static per-layer value supplied by the host (1.0 for this checkpoint), not computed from the row.'''
explain.math = [
  '''\begin{aligned} r &= \Big(\frac{1}{512}\sum_{k=1}^{512} c_k^2 + \epsilon\Big)^{-1/2} \\ \hat c_i &= \mathrm{sat}_{\mathrm{e4m3}}\Big(\big(c_i\, r\, \gamma_i\big)\cdot \frac{1}{s_k}\Big), \qquad i = 1,\dots,512 \end{aligned}''',
  '''\text{where } \gamma \text{ is the kv\_a RMSNorm weight, } \epsilon = 10^{-5},\ s_k \text{ the static cache scale read back by the decode kernels}''',
]
compute = "memory"
kernels = ["glm5next_mla_latent_write::glm5next_mla_latent_write_fp8"]
rows = [1, 1]
pipeline.rms_norm = { in = ["bf16"], compute = "f32", out = ["f32"] }
pipeline.kv_write = { in = ["f32"], cache = "fp8", out = [] }
op = [{ op = "rms_norm", feeds = ["kv_write"] }, { op = "kv_write" }]
[[family.param]]
name = "weight_form"
kind = "policy"
from = { rms_norm = "param:weight_form" }
absent = "one_plus"
[[family.param]]
name = "layout"
kind = "policy"
from = { kv_write = "param:layout" }
absent = "kv"
