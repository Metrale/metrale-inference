[[family]]
id = "rope"
description = "Rotary position embedding (plain, strided multi-row, MRoPE interleaved)"
explain.about = '''Rotary position embedding applied in place to BF16 query and key heads, rotate-half style: channel $i$ is paired with channel $i + r/2$ for $i < r/2$, where $r \le d_h$ is the rotary width, and channels from $r$ to $d_h$ are left untouched. The grid has one block of 128 threads per (query or key head, group of positions, batch); each thread rotates one pair at one position, and each block first computes the $r/2$ distinct frequencies once into shared memory. rope_forward takes packed rows, rope_forward_strided takes explicit row strides for Q and K (so several sequences in one interleaved QKV buffer rotate in one launch), and rope_forward_mrope_interleaved is multimodal RoPE, where pair $i$ takes its position from stream $i \bmod 3$ (temporal, height, width).'''
explain.numerics = '''Frequencies are evaluated in FP64 as $1/\theta^{2i/r}$ and rounded to FP32; the angle is the FP32 product of the position (converted to FP32) and that frequency, cosf and sinf are the accurate FP32 versions, and the rotation is computed in FP32 from exactly widened BF16 inputs and rounded once per output to BF16 (RNE). With all three MRoPE positions equal, the MRoPE kernel is bit-identical to rope_forward.'''
explain.math = [
  '''\begin{aligned} \omega_i &= \mathrm{fp32}\bigl(\theta^{-2i/r}\bigr), \qquad \phi_i = p\,\omega_i, \qquad 0 \le i < r/2 \\ y_i &= \mathrm{rn}_{\mathrm{bf16}}\bigl(x_i\cos\phi_i - x_{i+r/2}\sin\phi_i\bigr) \\ y_{i+r/2} &= \mathrm{rn}_{\mathrm{bf16}}\bigl(x_{i+r/2}\cos\phi_i + x_i\sin\phi_i\bigr) \\ y_j &= x_j, \qquad r \le j < d_h \end{aligned}''',
  '''p = \begin{cases} p_t & i \equiv 0 \pmod 3 \\ p_h & i \equiv 1 \pmod 3 \\ p_w & i \equiv 2 \pmod 3 \end{cases} \qquad \text{(MRoPE: the position used for pair } i \text{)}''',
]
compute = "memory"
kernels = [
  "rope::rope_forward", "rope::rope_forward_strided",
  "rope_mrope_interleaved::rope_forward_mrope_interleaved",
]
rows = [1, 65536]
pipeline.rope = { in = ["bf16", "bf16"], compute = "f32", out = ["bf16", "bf16"] }
op = [{ op = "rope" }]
