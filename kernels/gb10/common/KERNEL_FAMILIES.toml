# 2026-10-08: `silu(min(gate, limit)) * clamp(up, -limit, limit)` over separate gate and up rows,
# FP32 arithmetic, BF16 out (glm5next_ffn.cu; 2026-10-14: the element expression is
# glm5next_swiglu.cuh, shared with w4a4_grouped_gu_*); the limit is a runtime argument.
[[family]]
id = "glm_swiglu_clamp"
description = "Clamped SwiGLU (swiglu_limit): clamp, SiLU and multiply in one pass"
explain.about = '''GLM-5's clamped SwiGLU activation for the dense, shared-expert and routed FFNs, one thread per element over separate gate and up rows. The clamp is asymmetric: the gate is bounded above only, by the swiglu_limit $L$ (10.0 for this checkpoint, a runtime argument that must be positive), while up is clamped to $[-L, L]$ on both sides; then SiLU of the clamped gate times the clamped up. Three entries: BF16 output, FP32 output, and a BF16-output variant that also zero-fills the routed down projection's accumulation buffer in the same launch.'''
explain.numerics = '''BF16 gate and up widened to FP32; fminf/fmaxf clamps, SiLU computed as $\hat g/(1+e^{-\hat g})$ with expf and a true division, product in FP32 without FMA contraction; one RNE rounding to BF16 at the store (none for the FP32-output entry). The same element expression is shared with the fused routed gate/up epilogue, so both round identically.'''
explain.math = [
  '''\begin{aligned} \hat g_i &= \min(g_i, L), \qquad \hat u_i = \min\big(\max(u_i, -L), L\big) \\ y_i &= \mathrm{rn}_{\mathrm{bf16}}\Big(\frac{\hat g_i}{1 + e^{-\hat g_i}}\cdot \hat u_i\Big) = \mathrm{rn}_{\mathrm{bf16}}\big(\operatorname{silu}(\hat g_i)\, \hat u_i\big) \end{aligned}''',
  '''\text{where } g, u \text{ are the gate and up projections and } L \text{ the swiglu\_limit}''',
]
compute = "memory"
# 2026-10-21: `_zero` also zeroes the routed down projection's output (a memset folded in).
kernels = [
  "glm5next_ffn::glm5next_swiglu_clamp", "glm5next_ffn::glm5next_swiglu_clamp_f32out",
  "glm5next_ffn::glm5next_swiglu_clamp_zero",
]
rows = [1, 65536]
pipeline.swiglu_clamp = { in = ["bf16"], compute = "f32", out = ["f32"] }
pipeline.silu_mul = { in = ["f32"], compute = "f32", out = ["bf16"] }
kernel_pipeline."glm5next_ffn::glm5next_swiglu_clamp_f32out".silu_mul = { in = ["f32"], compute = "f32", out = ["f32"] }
op = [{ op = "swiglu_clamp" }, { op = "silu_mul", after = ["swiglu_clamp"] }]
