  '''\begin{aligned} r^{(i)}_k &= \max\big(u^{(i)}_k, 0\big)^2 \\ y^{(i)}_n &= \mathrm{rn}_{\mathrm{bf16}}\Big(\sum_{k} r^{(i)}_k\, \mathrm{e2m1}\big(q^{(e_i)}_{nk}\big)\, \mathrm{e4m3}\big(d^{(e_i)}_{n,\lfloor k/16 \rfloor}\big)\, s_2^{(e_i)}\Big), \qquad i \in \{1, \dots, k\} \cup \{\mathrm{sh}\} \end{aligned}''',
]
compute = "cuda_core"
kernels = ["moe_relu2_fused::moe_expert_relu2_down_shared"]
rows = [1, 1]
