description = "BF16 experts + shared expert, one row per launch (gate+up, SiLU + down)"
explain.about = '''Single-token decode of the $k$ routed experts and the shared expert with unscaled BF16 weights $W \in \mathbb{R}^{N \times K}$, as two launches. moe_shared_expert_fused_bf16::moe_expert_gate_up_shared_bf16 has grid (output tiles, $k+1$, 2): the y index is the expert slot (slot $k$ is the shared expert), z selects the gate or up projection, and each 128-thread block computes 8 outputs, two per warp, reading 8 weights per lane step. moe_expert_silu_down_shared_bf16 recomputes $\operatorname{silu}(g) \odot u$ for its slot into shared memory and runs the down GEMV. Each slot writes its own BF16 row for the combine in moe_blend; a slot with no weights, or a missing shared expert, writes zeros.'''
explain.numerics = '''BF16 weights and activations are widened exactly to FP32, multiplied and accumulated in FP32 per lane, reduced by a warp shuffle tree, and rounded once to BF16 (RNE) per output. The SiLU product is computed in FP32 from the stored BF16 gate and up with the fast exponential and feeds the down projection unrounded.'''
explain.math = [
  '''\begin{aligned} g^{(e)} &= \mathrm{rn}_{\mathrm{bf16}}\big(W^{\mathrm{gate}}_{e} x\big), \qquad u^{(e)} = \mathrm{rn}_{\mathrm{bf16}}\big(W^{\mathrm{up}}_{e} x\big) \\ y^{(e)} &= \mathrm{rn}_{\mathrm{bf16}}\Big(W^{\mathrm{down}}_{e} \big(\operatorname{silu}(g^{(e)}) \odot u^{(e)}\big)\Big), \qquad e \in \mathcal{T}(x) \cup \{\mathrm{sh}\} \end{aligned}''',
]
