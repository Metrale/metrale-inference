  '''\begin{aligned} b_{t,h} &= \langle W_{\mathrm{b}(h)}, x_t\rangle, \qquad a_{t,h} = \langle W_{\mathrm{a}(h)}, x_t\rangle, \qquad t = 1,\dots,m \\ \beta_{t,h} &= \sigma(b_{t,h}) \\ \alpha_{t,h} &= \exp\!\Big(-e^{\min(A_h,\,20)}\,\log\!\big(1 + e^{\min(a_{t,h} + \delta_h,\,20)}\big)\Big) \end{aligned}''',
  '''\text{where } A_h \text{ is the learned log decay rate},\ \delta_h \text{ the learned dt bias},\ \mathrm{b}(h), \mathrm{a}(h) \text{ the interleaved weight rows of value head } h''',
]
