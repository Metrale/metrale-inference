# 2026-09-30: The declared W4A4 dense FFN (1..=32 rows) runs the whole mx ladder the default
# levers pick (ml/ops/w4a4_proj/mx_plan.rs), not just the 8-row entry.
[[family]]
id = "w4a4_mx"
description = "W4A4 MX GEMV (per-row NVFP4 activation quantize; mx8, the activation-reuse twins and the persistent entries)"
compute = "tensor_core"
mma = "mma.sync.m16n8k64.mxf4nvf4.block_scale"
kernel_compute."w4a4_gemv_mx::w4a4_quant_rows" = { compute = "memory" }
kernels = [
  "w4a4_gemv_mx::w4a4_quant_rows", "w4a4_gemv_mx::w4a4_gemv_mx8",
  "w4a4_gemv_mx::w4a4_gemv_mx16_nt2", "w4a4_gemv_mx::w4a4_gemv_mx32_nt4",
  "w4a4_gemv_mx::w4a4_gemv_mx16_ps", "w4a4_gemv_mx::w4a4_gemv_mx32_ps",
]
rows = [1, 32]
# 2026-10-02: Per-row F32 global, E4M3 group scale, E2M1 round to nearest even
# (2026-10-08: now w4a4_mx_core.cuh, w4a4_quant_rows_impl<false>); FP32 sums, scales applied to
# the FP32 sum (w4a4_mx_core.cuh w4a4_gemv_mx_impl, w4a4_gemv_mx.cu nt impl). With
# `w4a4_quant_rows` in its group a projection reads BF16 and quantizes it (the downcast).
pipeline.linear = { in = ["nvfp4/g16"], act = "nvfp4/g16", weight = "nvfp4/g16->e2m1", mma = "e2m1*e2m1", accumulate = "f32", scale = "f32", out = ["bf16"] }
pipeline."act_quant:nvfp4/g16" = { in = ["bf16"], compute = "f32", out = ["nvfp4/g16"] }
kernel_pipeline."w4a4_gemv_mx::w4a4_quant_rows".linear = { in = ["bf16"], act = "nvfp4/g16", weight = "nvfp4/g16->e2m1", mma = "e2m1*e2m1", accumulate = "f32", scale = "f32", out = ["bf16"] }
# 2026-10-02: `act_quant`: the A4 rules' `w4a4_quant_rows` launch.
op = [{ op = "linear", weight = ["nvfp4/g16"], activation = ["nvfp4/g16"] }, { op = "act_quant:nvfp4/g16" }]
# 2026-10-02: The W4A4 activation quantizer's NVFP4 rows: max_m x 32768 / 2 values, / 16 scales and
# a F32 global per row, at max_m = 64 (the larger of the two tiers; model-layers
# ops/w4a4_proj.rs:162-166). Its own allocation, outside the legacy arena.
[[family.workspace]]
name = "nvfp4_rows"
bytes = ["64*16384+64*2048+64*4"]
arena = false
why = "w4a4_proj.rs:162-166 at max_m = 64"
