[[family]]
id = "fp8_gemm_blockscaled"
description = "FP8 block-128 W8A8 GEMM with its per-128 activation quantizer (MoE shared expert above 64 rows)"
explain.about = '''FP8 block-128 W8A8 GEMM with its activation quantizer, used for the MoE shared expert above 64 rows. per_token_group_quant_fp8 quantizes each row's BF16 activations in 128-wide K groups (one 128-thread block per row and group), producing E4M3 values and one FP32 scale per group. fp8_gemm_t_blockscaled then runs a 64 x 128 x 32 tile (four warps of 16 rows, cp.async double buffering) of m16n8k32 E4M3 MMAs against E4M3 weights with one FP32 scale per 128 x 128 block, folding the scales once per 128-wide K group.'''
explain.numerics = '''Quantizer: the group scale is $\max|x|/448$ by correctly rounded FP32 division, floored at $10^{-12}$; each value is divided by it, clamped to $\pm 448$ and converted to E4M3 with round-to-nearest-even and saturation. GEMM: four unscaled E4M3 x E4M3 MMAs per 128-K group sum into an inner FP32 accumulator, which is multiplied by $a_{t,b}\,S_{\lfloor n/128\rfloor,b}$ and added to the outer FP32 accumulator (separate multiply and add), and the result is rounded once to BF16.'''
explain.math = [
  '''\begin{aligned} a_{t,b} &= \max\Big(\max_{k \in [128b,\,128b+128)} |x_{tk}| \,/\, 448,\; 10^{-12}\Big), \qquad A_{tk} = \mathrm{sat}_{\mathrm{e4m3}}\Big(\min\big(\max(x_{tk}/a_{t,\lfloor k/128\rfloor}, -448), 448\big)\Big) \\ y_{tn} &= \mathrm{rn}_{\mathrm{bf16}}\Big(\sum_{b=0}^{K/128-1}\Big(\sum_{k=128b}^{128b+127} A_{tk}\,W_{nk}\Big)\big(a_{t,b}\,S_{\lfloor n/128\rfloor,\,b}\big)\Big) \end{aligned}''',
  '''\text{where } W_{nk} \text{ is the E4M3 weight, } S \text{ its FP32 } 128 \times 128 \text{ block scale, and } \mathrm{sat}_{\mathrm{e4m3}} \text{ rounds to nearest even with saturation}''',
]
compute = "tensor_core"
mma = "mma.sync.m16n8k32.e4m3"
kernel_compute."per_token_group_quant_fp8::per_token_group_quant_fp8" = { compute = "memory" }
kernels = ["fp8_gemm_t_blockscaled::fp8_gemm_t_blockscaled", "per_token_group_quant_fp8::per_token_group_quant_fp8"]
rows = [1, 65536]
# 2026-10-02: per_token_group_quant_fp8 quantizes the BF16 input per 128 columns (f32 scale,
# IEEE division, per_token_group_quant_fp8.cu:56-93); after a SiLU the group's SiLU kernel has
# already quantized the product (moe_silu_mul.cu:132-140).
pipeline.linear = { in = ["bf16"], act = "fp8/g128", weight = "fp8/block128x128->e4m3", mma = "e4m3*e4m3", accumulate = "f32", scale = "f32", out = ["bf16"] }
pipeline."linear after silu_mul" = { in = ["fp8/g128"], act = "fp8/g128", weight = "fp8/block128x128->e4m3", mma = "e4m3*e4m3", accumulate = "f32", scale = "f32", out = ["bf16"] }
op = [{ op = "linear", weight = ["fp8/block128x128"], activation = ["fp8/g128"] }]
