# 2026-09-29: Listed before `fp8_gemm_blockscaled` so the shared-expert gate of a fused prefill
# group resolves here.
[[family]]
id = "moe_blend"
description = "Weighted sum of the routed experts plus the sigmoid-gated shared expert"
explain.about = '''The final MoE combine: for each token, the routing-weighted sum of its $k$ routed expert outputs plus the shared expert output scaled by the sigmoid gate $\gamma = \sigma(w_{\mathrm{sg}}^{\top} x)$, where $x$ is the normalised MoE input and $w_{\mathrm{sg}}$ the shared-expert gate vector ($\gamma = 1$ when the model has no shared gate). moe_expert_gemv::moe_weighted_sum_blend serves one token, with routed outputs by slot; moe_fp8_grouped_blend::moe_weighted_sum_blend_fp8_grouped serves $m$ tokens (grid of column tiles by tokens) and reads slot $i$ of token $t$ from sorted row $\pi(t,i)$; in both, 256-thread blocks each recompute the gate dot product and then handle one output column per thread. moe_unpermute_blend::moe_unpermute_blend fuses the unpermuting reduction with the blend, one block per token with 8 adjacent columns per thread, rounding the routed sum to BF16 before adding the gated shared term.'''
explain.numerics = '''BF16 inputs and FP32 routing weights; the gate dot product is FP32 (strided per-thread sums, a warp shuffle tree, then the eight warp sums added in order) followed by the fast-exponential sigmoid; the combine accumulates in FP32 over slots in ascending order, adds the gated shared term last and rounds once to BF16 (RNE), except the unpermute variant, which also rounds the routed sum to BF16 first.'''
explain.math = [
  '''\begin{aligned} \gamma_t &= \sigma\Big(\sum_{j=1}^{d} x_{t,j}\, w_{\mathrm{sg},j}\Big) \\ y_{t,n} &= \mathrm{rn}_{\mathrm{bf16}}\Big(\sum_{i=1}^{k} p_{t,i}\, o_{\pi(t,i),n} + \gamma_t\, y^{\mathrm{sh}}_{t,n}\Big) \\ y_{t,n} &= \mathrm{rn}_{\mathrm{bf16}}\Big(\mathrm{rn}_{\mathrm{bf16}}\Big(\sum_{i=1}^{k} p_{t,i}\, o_{\pi(t,i),n}\Big) + \gamma_t\, y^{\mathrm{sh}}_{t,n}\Big) \quad \text{(unpermute variant)} \\ &\text{where } o_{\pi(t,i)} \text{ is the down output of slot } i \text{ of token } t \text{ (row } i \text{ for one token), } p_{t,i} \text{ its routing weight, } y^{\mathrm{sh}}_t \text{ the shared expert output} \end{aligned}''',
]
compute = "cuda_core"
kernels = [
  "moe_expert_gemv::moe_weighted_sum_blend",
  "moe_fp8_grouped_blend::moe_weighted_sum_blend_fp8_grouped",
  "moe_unpermute_blend::moe_unpermute_blend",
]
rows = [1, 65536]
# 2026-10-02: The shared-expert gate logit is an FP32 dot product handed to the FP32 sigmoid,
# never rounded to BF16 (moe_expert_gemv.cu:224-261): `sg` is held as f32, which the rules state.
# The unpermute blend rounds the routed sum to BF16 before adding the shared expert
# (moe_unpermute_blend.cu:75).
pipeline.blend = { in = ["bf16", "f32", "bf16", "f32"], scatter = "f32", combine = "f32", out = ["bf16"] }
pipeline.linear = { in = ["bf16"], act = "bf16", weight = "bf16->bf16", mma = "bf16*bf16", accumulate = "f32", scale = "none", out = ["f32"] }
kernel_pipeline."moe_unpermute_blend::moe_unpermute_blend".blend = { in = ["bf16", "f32", "bf16", "f32"], scatter = "bf16", combine = "f32", out = ["bf16"] }
op = [{ op = "blend" }, { op = "linear", roles = ["shared_gate"] }]
