explain.about = '''NVFP4-weight, BF16-activation GEMV on CUDA cores for up to 32 rows in one launch (w4a16_gemv_batch32). Each 16-value weight chunk and its E4M3 scale are loaded and unpacked once and applied to every row; 64 threads serve each output, four outputs per 256-thread block, with grid $\lceil N/4 \rceil$. The chunk walk is remapped so a warp reads consecutive activation chunks, but each row reproduces the one-row w4a16_gemv order exactly, so every row is bit-identical to w4a16_gemv on that row alone.'''
explain.numerics = '''Per chunk an FP32 fused multiply-add chain over the 16 E2M1 table values times the widened BF16 activations, folded into the running sum by one FMA with the FP32 scale $s_{\mathrm{g}}\,s_{nj}$; partner threads combine their two accumulators with one shuffle, the 64 lane sums go through the same FP32 shuffle tree and two-warp sum as w4a16_gemv, and the result is rounded once to BF16 (round-to-nearest-even).'''
explain.math = [
  '''y_{tn} = \mathrm{rn}_{\mathrm{bf16}}\Big(\sum_{j=0}^{K/16-1} \big(s_{\mathrm{g}}\,s_{n,j}\big) \sum_{i=0}^{15} q_{n,16j+i}\,x_{t,16j+i}\Big), \qquad t < m \le 32, \quad \hat W_{nk} = s_{\mathrm{g}}\,s_{n,\lfloor k/16 \rfloor}\,q_{nk}''',
]
