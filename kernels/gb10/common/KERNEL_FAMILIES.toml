# 2026-09-29: Causal depthwise conv1d step with SiLU; bias pointer may be null and d_conv is a
# runtime argument (causal_conv1d.cu:48,96). Grid over the batch; the conv state must be
# contiguous across it.
[[family]]
id = "causal_conv1d"
description = "Causal conv1d update + SiLU (Mamba2 xBC, GDN legacy path); writes no per-row window snapshots"
explain.about = '''One decode step of a causal depthwise 1D convolution with SiLU, as used for the Mamba2 xBC stream and the legacy Gated DeltaNet path. Each channel $c$ keeps a window of the last $w$ inputs ($w$ = conv width, a runtime argument); the step shifts the window left by one, appends the new input, convolves it with the channel's $w$ taps plus an optional bias, and applies SiLU. One thread owns one channel and a 2D grid covers channels times sequences; the windows must be contiguous across the batch. No intermediate window snapshot is written.'''
explain.numerics = '''The window is stored in FP32 and the BF16 input and BF16 taps are widened exactly; the sum starts from the FP32 bias (or zero) and adds the taps in order from oldest to newest in FP32 without FMA contraction. The sigmoid uses __expf and the result is rounded once to BF16 (RNE) at the store.'''
explain.math = [
  '''\begin{aligned} s_c &\leftarrow \big(s_{c,2}, \dots, s_{c,w},\, x_{t,c}\big) \\ y_{t,c} &= \mathrm{rn}_{\mathrm{bf16}}\Big(\operatorname{silu}\big(b_c + \textstyle\sum_{i=1}^{w} W_{c,i}\, s_{c,i}\big)\Big) \end{aligned}''',
  '''\text{where } s_c \in \mathbb{R}^{w} \text{ is the window of channel } c \text{ (oldest first)},\ W_{c,i} \text{ the taps and } b_c \text{ the optional bias } (0 \text{ if absent})''',
]
compute = "cuda_core"
kernels = ["causal_conv1d::causal_conv1d_update"]
rows = [1, 4096]
# 2026-10-02: The window is FP32 (causal_conv1d.cu:111-119); the output is rounded to BF16 (:132),
# the Mamba2 `xbc_c` format, not the GatedDeltaNet `conv` (f32).
