# 2026-09-29: Host-side groups, embedding, norms, residuals, elementwise.

[[family]]
id = "embed_copy"
description = "Embedding rows copied device-to-device per row (no kernel)"
explain.about = '''No kernel launches in this family. Before the step's program runs, the engine embeds each token by copying row $\mathrm{tok}_t$ of the BF16 embedding table $E \in \mathbb{R}^{V \times d}$ into row $t$ of the hidden-state buffer, one device-to-device copy per row, so the output of the group is the buffer those copies land in. A model whose configuration declares an embedding scale multiplies the rows afterwards in a separate step that is not part of this family.'''
explain.numerics = '''Pure data movement: the BF16 table row is copied byte for byte, with no widening, arithmetic or rounding.'''
explain.math = [
  '''h_t = E_{\mathrm{tok}_t,\,:} \in \mathbb{R}^{d}, \qquad t = 1,\dots,m, \qquad E \in \mathbb{R}^{V \times d}''',
]
compute = "memory"
emitters = ["embed_copy"]
rows = [1, 65536]
pipeline.embed = { in = [], gather = "bf16", out = ["bf16"] }
op = [{ op = "embed" }]
[[family.point]]
values = {}
how = "instantiation"
files = ["crates/model-engine/src/model/trait_impl/decode_a2.rs"]

# 2026-10-23: An embedding row gathered on the device from an id in device memory (the fed
# decode, a device-drafted verify row).
[[family]]
id = "embed_gather"
description = "Embedding rows gathered by a kernel from device-resident ids"
explain.about = '''Embedding rows gathered on the device from token ids that are already on the device (the previous step's argmax or the draft chain), so no id is read back to the host first. batched_embed runs one block per token; its threads stride over the hidden dimension and copy row $\mathrm{tok}_t$ of the BF16 table $E \in \mathbb{R}^{V \times d}$ into row $t$ of the output. Ids are not range-checked: the caller guarantees $\mathrm{tok}_t < V$.'''
explain.numerics = '''Pure data movement: each BF16 element is copied byte for byte, with no widening, arithmetic or rounding.'''
explain.math = [
  '''h_t = E_{\mathrm{tok}_t,\,:} \in \mathbb{R}^{d}, \qquad t = 0,\dots,m-1, \qquad \mathrm{tok}_t \in \{0,\dots,V-1\}''',
]
compute = "memory"
kernels = ["embed_from_argmax::batched_embed"]
rows = [1, 65536]
pipeline.embed = { in = [], gather = "bf16", out = ["bf16"] }
op = [{ op = "embed" }]
[[family.point]]
values = {}
how = "instantiation"
files = ["kernels/gb10/common/embed_from_argmax.cu"]

# 2026-10-23: The library all-reduce a planned collective takes past the one-shot bound.
[[family]]
id = "all_reduce_nccl"
description = "Collective summed by the library's all-reduce in place (no kernel of ours)"
explain.about = '''No kernel of ours launches in this family. Each rank hands its BF16 partial $x^{(r)} \in \mathbb{R}^{m \times d}$ to `ncclAllReduce` with the sum operator, in place, and every rank gets the full sum back. The plan takes this path where the payload of $m \cdot d \cdot 2$ bytes is past the one-shot bound (`all_reduce_oneshot_max_kb`, or the one-shot disabled at 0) at three or more ranks; an all-gather the engine runs as the sum of zero-padded slices takes the same call.'''
explain.numerics = '''The library chooses the reduction order (its ring or tree algorithm for the message size and topology) and rounds to BF16 along it, so the sum's bits may depend on the payload size and the rank count, unlike the one-shot's FP32 sum in rank order.'''
explain.math = [
  '''y = \sum_{r=0}^{N-1} x^{(r)} \in \mathbb{R}^{m \times d}, \qquad \text{on every rank}''',
]
compute = "memory"
emitters = ["tp_all_reduce"]
rows = [1, 65536]
pipeline.all_reduce = { in = ["bf16"], reduce = "bf16", out = ["bf16"] }
pipeline.all_gather = { in = ["bf16"], move = "bf16", out = ["bf16"] }
op = [{ op = "all_reduce" }, { op = "all_gather" }]
[[family.point]]
values = {}
how = "instantiation"
files = ["crates/comm/src/nccl_backend/comm_impl.rs"]

[[family]]
id = "argmax_host"
description = "Greedy token on the host from copied logits (no kernel)"
explain.about = '''No kernel launches in this family. The step returns its BF16 logits row $z \in \mathbb{R}^{V}$, the caller copies it to host memory, and the greedy token is picked by one sequential scan on the CPU. With greedy sampling parameters the scan reads the raw row, with no penalties or logit bias applied.'''
explain.numerics = '''Each BF16 logit is widened exactly to FP32 and compared with a strict greater-than against the running maximum, so on exact ties the first (lowest) index wins; the result is a 32-bit token index.'''
explain.math = [
  '''\hat{y} = \min\Bigl\{\, i \in \{0,\dots,V-1\} \;:\; z_i = \max_{0 \le j < V} z_j \,\Bigr\}''',
]
compute = "memory"
emitters = ["host_sampling"]
rows = [1, 65536]
pipeline.argmax = { in = ["bf16"], compare = "bf16", out = ["i32"] }
op = [{ op = "argmax" }]
[[family.point]]
values = {}
how = "instantiation"
files = ["crates/model-engine/src/model/trait_impl/decode_a2.rs"]

[[family]]
id = "argmax_device"
description = "Row-wise BF16 argmax over the logits"
explain.about = '''Greedy token selection on the device: one block of $B = 1024$ threads per row of logits $z_r \in \mathbb{R}^{V}$. Each thread scans the vocabulary indices congruent to its thread id modulo $B$ and keeps its first maximum, then a shared-memory halving tree merges the $B$ candidates into the row's winner. argmax_bf16 handles a single row, argmax_bf16_batch runs one block per row over rows a fixed stride apart, and argmax_bf16_batch_lp also returns the log-probability of the chosen token, computed by an online softmax in the same pass (used for per-position draft confidence).'''
explain.numerics = '''BF16 logits are widened exactly to FP32 and compared with strict greater-than from a starting maximum of $-10^{30}$; within a thread the earliest index wins, and between threads the fixed halving tree keeps the lower slot of each pair, so an exact tie resolves to the tied index whose thread id $i \bmod B$ is smallest in 10-bit bit-reversed order (deterministic, but not always the smallest index). In the log-probability variant each thread keeps a running FP32 sum rescaled with the fast exponential __expf whenever its maximum rises, the tree merges the (max, sum) pairs the same way, and the result is $-\log$ of the sum via __logf, stored as FP32.'''
explain.math = [
  '''\begin{aligned} \mathcal{T}_r &= \bigl\{\, i : z_{r,i} = \textstyle\max_{j} z_{r,j} \,\bigr\}, \qquad c_r = \operatorname*{arg\,min}_{c \,\in\, \{ i \bmod B \,:\, i \in \mathcal{T}_r \}} \operatorname{bitrev}_{10}(c) \\ \hat{y}_r &= \min\bigl\{\, i \in \mathcal{T}_r : i \equiv c_r \pmod{B} \,\bigr\} \end{aligned}''',
  '''\log p_r = z_{r,\hat{y}_r} - \log \sum_{i=0}^{V-1} e^{z_{r,i}} = -\log \sum_{i=0}^{V-1} e^{\,z_{r,i} - z_{r,\hat{y}_r}}''',
]
compute = "memory"
# 2026-09-30: `argmax_bf16_batch` is every row in one launch (the batched MTP verify);
# `argmax_bf16_batch_lp` also writes each row's top-1 log-probability (the batched propose).
kernels = ["argmax::argmax_bf16", "argmax::argmax_bf16_batch", "argmax::argmax_bf16_batch_lp"]
rows = [1, 65536]
pipeline.argmax = { in = ["bf16"], compare = "bf16", out = ["i32"] }
op = [{ op = "argmax" }]
[[family.point]]
values = {}
how = "instantiation"
files = ["kernels/gb10/common/argmax_bf16.cu"]
[[family.evidence]]
point = {}
rows = [2]
measurement = "qwen3.6-35b-a3b::argmax_bf16 @ decode C=1 (R=2, MTP k=1)"
[[family.evidence]]
point = {}
rows = [4]
measurement = "qwen3.8-27b::argmax_bf16 @ decode C=1 (R=4, MTP k=3)"

# 2026-09-29: One block per row, so every row count runs in one launch. The `_vanilla` entries are
# in-file copies that scale by the stored weight (Nemotron-H, Gemma); the others scale by
# 1 + weight (Qwen3.5 checkpoints store zero-centred norm weights, rms_norm.cu:4-6).
[[family]]
id = "rms_norm"
description = "RMSNorm, fused residual copy / residual add + RMSNorm, strided per-head norm"
explain.about = '''RMSNorm over rows $x \in \mathbb{R}^{d}$ with one block of up to 1024 threads per row: each thread squares BF16 pairs loaded as 32-bit words, the partial sums are reduced by a warp shuffle tree and then across warps through shared memory, and a second pass scales every element by the reciprocal root and the norm weight. rms_norm, rms_norm_strided (rows grouped along a second grid axis with a group stride, used for per-head q/k norms) and rms_norm_vanilla compute the norm alone; rms_norm_residual also copies the input row into the residual buffer; residual_add_rms_norm and residual_add_rms_norm_exact first add a branch output $s$ into the hidden row $h$ in place, then normalise it and copy it into the residual buffer, fusing one layer's residual add with the next layer's input norm. The weight is applied as $1+\gamma$ (the one_plus point) in every kernel except rms_norm_vanilla, which applies the plain weight $\gamma$.'''
explain.numerics = '''BF16 inputs are widened exactly to FP32; squares are accumulated per thread in FP32, reduced by a butterfly warp shuffle and a second shuffle over the per-warp sums, and the reciprocal root uses rsqrtf; the products are formed in FP32 and rounded once to BF16 (RNE) at the store. In residual_add_rms_norm the sum of squares uses the FP32 sums $h+s$ before their BF16 rounding while the normalised values are the rounded sums, whereas residual_add_rms_norm_exact squares the rounded sums, so it is bit-identical to the unfused add followed by rms_norm_residual.'''
explain.math = [
  '''\begin{aligned} r &= \Bigl(\frac{1}{d}\sum_{j=1}^{d} x_j^2 + \epsilon\Bigr)^{-1/2} \\ y_i &= \mathrm{rn}_{\mathrm{bf16}}\bigl(x_i \, r \, w_i\bigr), \qquad w_i = \begin{cases} 1+\gamma_i & \text{one\_plus} \\ \gamma_i & \text{plain} \end{cases} \end{aligned}''',
  '''\begin{aligned} h_i &\leftarrow \mathrm{rn}_{\mathrm{bf16}}(h_i + s_i), \qquad \rho_i \leftarrow h_i \\ r &= \Bigl(\frac{1}{d}\sum_{j=1}^{d} u_j^2 + \epsilon\Bigr)^{-1/2}, \qquad u_j = \begin{cases} h_j + s_j \ \text{in FP32} & \text{residual\_add\_rms\_norm} \\ \mathrm{rn}_{\mathrm{bf16}}(h_j + s_j) & \text{residual\_add\_rms\_norm\_exact} \end{cases} \\ y_i &= \mathrm{rn}_{\mathrm{bf16}}\bigl(h_i \, r \, (1+\gamma_i)\bigr) \end{aligned}''',
]
compute = "memory"
kernels = [
  "norm::rms_norm", "norm::rms_norm_residual", "norm::residual_add_rms_norm",
  "norm::rms_norm_strided", "residual_add_rms_norm_exact::residual_add_rms_norm_exact",
  "rms_norm_vanilla::rms_norm_vanilla",
]
rows = [1, 65536]
# 2026-10-02: residual_add_rms_norm takes its sum of squares from the FP32 sum before its BF16
# rounding (rms_norm.cu:409-412) and scales the BF16-rounded sum read back (:452-456): the norm
# reads the sum as f32 where the circuit's `y` is bf16, which its rule states (`holds`). The
# `_exact` kernel squares the rounded values (residual_add_rms_norm_exact.cu:56-60), as the
# unfused chain does.
pipeline.rms_norm = { in = ["bf16"], compute = "f32", out = ["bf16"] }
pipeline.final_norm = { in = ["bf16"], compute = "f32", out = ["bf16"] }
pipeline.qk_norm = { in = ["bf16"], compute = "f32", out = ["bf16"] }
pipeline.residual_add = { in = ["bf16", "bf16"], compute = "f32", out = ["bf16"] }
kernel_pipeline."norm::residual_add_rms_norm".rms_norm = { in = ["f32"], compute = "f32", out = ["bf16"] }
op = [{ op = "rms_norm" }, { op = "final_norm" }, { op = "qk_norm" }, { op = "residual_add" }]
[[family.param]]
name = "weight_form"
kind = "policy"
from = { rms_norm = "param:weight_form", final_norm = "param:weight_form", qk_norm = "param:weight_form" }
# 2026-09-29: The Qwen3.5 circuits state no weight_form: their norms scale by 1 + weight.
absent = "one_plus"
[[family.point]]
values = { weight_form = "one_plus" }
how = "instantiation"
files = ["kernels/gb10/common/rms_norm.cu", "kernels/gb10/common/residual_add_rms_norm_exact.cu"]
# 2026-10-08: `rms_norm_vanilla.cu` is a third copy of the plain point (the GLM-5 norms,
# glm5next_layer/steps.rs:16-36).
[[family.point]]
values = { weight_form = "plain" }
how = "copy"
files = ["kernels/gb10/common/rms_norm.cu", "kernels/gb10/common/rms_norm_vanilla.cu"]
[[family.evidence]]
point = { weight_form = "one_plus" }
rows = [2]
measurement = "qwen3.6-35b-a3b::rms_norm_residual @ decode C=1 (R=2, MTP k=1)"
[[family.evidence]]
point = { weight_form = "one_plus" }
rows = [2]
measurement = "qwen3.6-35b-a3b::residual_add_rms_norm @ decode C=1 (R=2, MTP k=1)"
[[family.evidence]]
point = { weight_form = "one_plus" }
rows = [4]
measurement = "qwen3.8-27b::residual_add_rms_norm @ decode C=1 (R=4, MTP k=3)"

[[family]]
id = "residual_add"
description = "BF16 residual add"
explain.about = '''Elementwise residual add of a branch output $s$ into the residual stream $h$, in place, one thread per element over all $m \times d$ elements of the launch. bf16_residual_add adds through FP32 registers; bf16_add_inplace uses the native BF16 add. The same in-place add is the reduce step of the all-reduce at exactly two tensor-parallel ranks: after the partner exchange each rank adds the partner's BF16 partial $p^{(1-r)}$ into its own $p^{(r)}$, so both hold the sum (its all-gather, zero-padded slices summed into the whole row, is the same add).'''
explain.numerics = '''Both kernels produce the correctly rounded BF16 sum: bf16_residual_add widens both operands exactly to FP32, adds (exactly representable for all but extreme exponent gaps, where the result still rounds to the same BF16 value) and rounds once to BF16 (RNE); bf16_add_inplace uses the hardware BF16 add with round-to-nearest-even. As the 2-rank all-reduce's sum the add is commutative, so both ranks write the same bytes; against the one-shot rank sum (`tp_rank_sum`) it differs only in the sign of $(-0) + (-0)$.'''
explain.math = [
  '''h_i \leftarrow \mathrm{rn}_{\mathrm{bf16}}\bigl(h_i + s_i\bigr), \qquad i = 1,\dots,m\,d''',
]
compute = "memory"
# 2026-10-08: `bf16_add_inplace` (bf16_add.cu) is the in-place twin the GLM-5 MTP block's plain
# residual adds with (glm5next_layer/steps.rs:183-206). 2026-10-23: And the 2-rank all-reduce's sum
# (`tp_all_reduce_2rank`, `tp_all_gather_as_sum_2rank`; crates/comm/src/nccl_backend/sendrecv.rs:
# 285-365 after the partner exchange, `ArPath::TwoRank` at crates/comm/src/ar_path.rs:32-45).
kernels = ["residual_add::bf16_residual_add", "bf16_add::bf16_add_inplace"]
rows = [1, 65536]
pipeline.residual_add = { in = ["bf16", "bf16"], compute = "f32", out = ["bf16"] }
pipeline.all_reduce = { in = ["bf16"], reduce = "bf16", out = ["bf16"] }
pipeline.all_gather = { in = ["bf16"], move = "bf16", out = ["bf16"] }
op = [{ op = "residual_add" }, { op = "all_reduce" }, { op = "all_gather" }]
[[family.point]]
values = {}
how = "instantiation"
files = ["kernels/gb10/common/residual_add.cu", "kernels/gb10/common/bf16_add.cu"]

[[family]]
id = "sigmoid_gate_mul"
description = "Attention output gate x * sigmoid(gate)"
explain.about = '''The output gate of gated attention: the attention output $x$ is multiplied elementwise by the sigmoid of a gate projection $g$, one thread per element. sigmoid_gate_mul works on flat arrays of equal shape; sigmoid_gate_mul_batched works on $m$ rows of width $d$ whose gate rows are a fixed stride apart, so the gate can be a slice of a wider projection.'''
explain.numerics = '''BF16 inputs widened exactly to FP32; the sigmoid is $1/(1+e^{-g})$ with the accurate expf and an IEEE division; one RNE rounding to BF16 at the store.'''
explain.math = [
  '''y_{t,i} = \mathrm{rn}_{\mathrm{bf16}}\bigl(x_{t,i}\,\sigma(g_{t,i})\bigr), \qquad \sigma(z) = \frac{1}{1+e^{-z}}, \qquad 1 \le t \le m, \ 1 \le i \le d''',
]
compute = "memory"
kernels = ["residual_add::sigmoid_gate_mul", "residual_add::sigmoid_gate_mul_batched"]
rows = [1, 65536]
pipeline.sigmoid_gate_mul = { in = ["bf16", "bf16"], compute = "f32", out = ["bf16"] }
op = [{ op = "sigmoid_gate_mul" }]
[[family.point]]
values = {}
how = "instantiation"
files = ["kernels/gb10/common/residual_add.cu"]

[[family]]
id = "concat"
description = "BF16 feature-dim concat (MTP embedding | hidden)"
explain.about = '''Feature-dimension concatenation of two BF16 rows of width $d$, used by the multi-token-prediction head to place the normalised token embedding $a$ beside the normalised target hidden state $b$. One thread per element writes both halves; the launch covers one row and is issued once per row.'''
explain.numerics = '''Pure data movement: BF16 values are copied unchanged, with no arithmetic or rounding.'''
explain.math = [
  '''y = \begin{bmatrix} a \\ b \end{bmatrix} \in \mathbb{R}^{2d}, \qquad y_i = a_i, \quad y_{d+i} = b_i, \qquad 1 \le i \le d''',
]
compute = "memory"
kernels = ["residual_add::bf16_concat"]
rows = [1, 65536]
pipeline.concat = { in = ["bf16", "bf16"], move = "bf16", out = ["bf16"] }
op = [{ op = "concat" }]
[[family.point]]
values = {}
how = "instantiation"
files = ["kernels/gb10/common/residual_add.cu"]

[[family]]
id = "silu_mul"
description = "silu(gate) * up over a packed gate|up row"
explain.about = '''The SwiGLU activation of a feed-forward or expert block: for gate and up projections $g, u$ (gate rows followed by up rows in one packed buffer) it computes $\operatorname{silu}(g) \odot u$, one thread per element over the launch's $m \times d_{ff}$ elements. No clamp is applied to either operand.'''
explain.numerics = '''BF16 inputs widened exactly to FP32; the sigmoid uses the fast exponential __expf, the product is formed as $(g\,\sigma(g))\,u$ in FP32, and the result is rounded once to BF16 (RNE).'''
explain.math = [
  '''y_i = \mathrm{rn}_{\mathrm{bf16}}\bigl(\operatorname{silu}(g_i)\,u_i\bigr) = \mathrm{rn}_{\mathrm{bf16}}\Bigl(\frac{g_i}{1+e^{-g_i}}\,u_i\Bigr)''',
