[[family]]
id = "w8a16_gemm"
description = "FP8 block-128 W8A16 pipelined GEMM (m32, m64, full tiles)"
explain.about = '''FP8 block-128 weight, BF16 activation GEMM on BF16 tensor cores: weights are E4M3 with one FP32 scale per 128 x 128 block, and a cp.async pipeline copies BF16 activation tiles and raw E4M3 weight bytes into shared memory while the current step's m16n8k16 MMAs run. w8a16_gemm_pipelined uses a 128-row by 32-column tile with K steps of 32 (8 warps, 2 stages); w8a16_gemm_pipelined_m32 and _m64 use 32- and 64-row tiles with one 128-wide K step per scale block and caller-supplied row pitches (1 to 16 rows with modest K run a skinny form on an N-only grid), keeping the same per-output MMA sequence as the 128-row kernel. The weight bytes are decoded through a 256-entry table in shared memory (the m64 form decodes into its fragment registers directly).'''
explain.numerics = '''E4M3 to BF16 is exact, so the MMA multiplies unscaled BF16 weights by BF16 activations with FP32 accumulation; each 128-wide K block is summed into an inner FP32 accumulator that is multiplied by its FP32 block scale and added to the outer accumulator at the block boundary, so the scale never touches a BF16 value, and the result is rounded once to BF16 (round-to-nearest-even).'''
explain.math = [
  '''y_{tn} = \mathrm{rn}_{\mathrm{bf16}}\Big(\sum_{b=0}^{K/128-1} S_{\lfloor n/128\rfloor,\,b}\;\sum_{k=128b}^{128b+127} x_{tk}\;\mathrm{e4m3}(W_{nk})\Big), \qquad \text{outer} \leftarrow \text{outer} + \text{inner}_b \cdot S_{\lfloor n/128\rfloor,\,b}''',
  '''\text{where } \mathrm{e4m3}(W_{nk}) \text{ is the decoded weight byte and } S \text{ the FP32 scale of each } 128 \times 128 \text{ weight block}''',
]
compute = "tensor_core"
mma = "mma.sync.m16n8k16.bf16"
kernels = [
  "w8a16_gemm_pipelined_m32::w8a16_gemm_pipelined_m32",
  "w8a16_gemm_pipelined_m32::w8a16_gemm_pipelined_m64",
  "w8a16_gemm_pipelined::w8a16_gemm_pipelined",
]
rows = [1, 65536]
# 2026-10-02: E4M3 to BF16 exactly, BF16 MMA, the FP32 block scale on each 128-K FP32 partial
# (w8a16_gemm_pipelined.cu:302-397).
