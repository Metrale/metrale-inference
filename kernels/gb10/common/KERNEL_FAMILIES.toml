# 2026-09-29: GB10 kernel families: which circuit ops each family implements, the parameters it
# varies, the points it instantiates and the points it has microbench evidence for. `met circuit
# venn` classifies a new model's nodes against these (schema and rules:
# crates/circuit/src/venn/families.rs; method: .claude/skills/new-model/SKILL.md).
#
# Owner: gb10 kernels.
# Invariants:
# - A `param` is an axis the family's code is structured to vary (a runtime argument, a template
#   or macro parameter, a policy or a per-point file copy), even when one value is instantiated.
#   `runtime` never sizes registers, shared memory or unrolling and never defines a point;
#   `compile` does; `policy` is a plug-in (weight format, scale layout, activation quantizer,
#   activation epilogue, routing scoring). A format the code cannot vary without a rewrite is a
#   constraint on the op (`[[family.op]]`), not a parameter.
# - `from` reads a value from a node: `dim:<name>`, `weight`, `activation`, `output`, `op`,
#   `consumer_op`, `param:<key>`, `setting:<key>`, `in_dim`, `out_dim`; per op when it is a table.
#   `absent` is the value when a circuit does not state it, and says why in a comment.
# - Every point states every compile-time and policy parameter. `how`: `instantiation` (template,
#   macro or per-target `-D` build of one source), `copy` (a per-point copy of a source: the
#   parameterization target), `branch` (a runtime branch).
# - Evidence sits on an instantiated point and lists the row counts measured (M). "Optimized" is
#   claimed only there; unknown means unmeasured, never optimized. `measurement` keys are
#   `<kernel> @ <regime>` rows of docs/kernel-perf/measurements.toml, which keeps the numbers.
# - `kernels` are `module::function` as FUSIONS.toml names them (module = source stem after the
#   KERNEL.toml [modules] renames); a kernel belongs to one family. Every kernel a FUSIONS.toml
#   rule names is listed (crates/circuit/tests/venn.rs checks it).
# - `discover` rules rediscover points from the sources; a point they find that no entry lists,
#   or an entry at a covered file they do not find, fails crates/circuit/tests/venn.rs.
# - `rows` is the inclusive range of rows ONE launch covers; a family whose range excludes a
#   row count cannot run that count without a per-row loop.
# - `compute` is where the family's arithmetic runs: `tensor_core` (with `mma`, the MMA atom and
#   operand format it issues), `cuda_core`, or `memory` (data movement, element-wise work and
#   reductions). `kernel_compute."<kernel>"` states a kernel that runs elsewhere (an activation
#   quantizer beside an MMA tile, a GEMV beside a GEMM); a point states `compute` where its tier
#   differs, and then every kernel is named (crates/circuit/src/venn/compute.rs). The tensor-core
#   policy of ../HARDWARE.toml reads these.
# - 2026-10-02: `pipeline.<op>` is the numeric pipeline the family runs each op at, read from its
#   sources: `in` (the format each node input is read in), every step of the op's vocabulary
#   (crates/circuit/src/pipeline/vocab.rs: act, weight `<stored>-><precision>`, mma `<a>*<b>`,
#   accumulate, scale, compute, cache, state, ...) and `out` (the format each output is written
#   in, or handed to the next op of a fused group in). Precision is of values: a BF16 value in an
#   FP32 register is bf16, an exactly widened E4M3 or E2M1 weight is the activation's precision.
#   An op key may name a linear role (`linear:shared_down`), a quantizer's format
#   (`act_quant:nvfp4/g16`), and narrow to its producer or consumer (`silu_mul feeds act_quant`);
#   `{param}` reads the node's point; `"uninstantiated"` marks a parameterization target no
#   source implements. `[[family.point]] pipeline` and `kernel_pipeline."<kernel>"` override where
#   they differ. Every plan requires each node's declared pipeline to equal what its formats and
#   policy require (crates/circuit/src/pipeline/check.rs).
# - 2026-10-22: `explain` is what the family computes, published by the blueprint store's kernel
#   modal: `about` (prose: the computation, the launch organisation, the variants), `numerics`
#   (prose: formats read, widening, accumulator, reduction, intrinsics, rounding and saturation at
#   each store, scale rules) and `math` (display equations in KaTeX, written from the kernels'
#   sources in the family's own parameters). Prose takes inline math between `$` pairs. Every
#   family states all three (the loader refuses one without them,
#   crates/circuit/src/venn/families_explain.rs) and every entry renders in KaTeX strict mode
#   (crates/circuit/tests/kernel_math.rs). The text is public: no source paths or code. The math
#   lives here only: the other classes inherit these families, and a class that overrides a
#   family by id states its own `explain`.

schema = 1
hardware = "gb10"

