[[family]]
id = "gdn_verify_fused_k2"
description = "Opt-in fused GDN verify at K = 2: conv + L2 + recurrence + gated norm"
explain.about = '''An opt-in fused form of the two-token ($K = 2$) Gated DeltaNet verify around the WY2 recurrence. gdn_verify_fused_k2::gdn_verify_fused_conv_k2 keeps each channel's conv window in registers across both positions, computes conv plus SiLU plus the per-head L2 norm of q and k for both, snapshots the window after position 0 for rollback and leaves the window after position 1 as the state; it is the per-token causal_conv1d_update_l2norm arithmetic with no bias. gdn_verify_fused_k2::gdn_verify_fused_norm_k2 then applies the SiLU-gated RMS norm to both positions' recurrence outputs, one block per (head, position). The recurrence between them is the WY2 kernel of gdn_recurrence.'''
explain.numerics = '''Conv: FP32 window, exact BF16 widening, FP32 tap sum, __expf sigmoid, L2 scale rsqrtf(sum of squares + eps), BF16 (RNE) store. Norm: BF16 core and gate widened exactly, sum of squares per thread then a shuffle-xor tree and a second warp reduction, rsqrtf(mean + eps), SiLU via expf, BF16 (RNE) store. Built without FMA contraction.'''
explain.math = [
  '''\begin{aligned} s^{(1)} &= \big(s^{(0)}_2, \dots, s^{(0)}_w,\, x_1\big), \qquad s^{(2)} = \big(s^{(1)}_2, \dots, s^{(1)}_w,\, x_2\big) \\ u_{t,c} &= \operatorname{silu}\Big(\textstyle\sum_{i=1}^{w} W_{c,i}\, s^{(t)}_{c,i}\Big), \qquad t = 1, 2 \\ y_{t,c} &= \mathrm{rn}_{\mathrm{bf16}}\Big(u_{t,c}\,\big(\textstyle\sum_{j \in \mathcal{H}(c)} u_{t,j}^2 + \epsilon\big)^{-1/2}\Big) \ \ (c < c_{qk}), \qquad y_{t,c} = \mathrm{rn}_{\mathrm{bf16}}(u_{t,c}) \ \ (c \ge c_{qk}) \end{aligned}''',
  '''\text{recurrence (WY2): } u_t = \beta_t\big(v_t - \bar\alpha_t\, S_{t-1}^\top k_t\big),\quad S_t = \bar\alpha_t S_{t-1} + k_t u_t^\top,\quad o_t = \mathrm{rn}_{\mathrm{bf16}}\big(S_t^\top q_t/\sqrt{d_k}\big)''',
  '''z_t = \mathrm{rn}_{\mathrm{bf16}}\Big(\frac{o_t}{\sqrt{\frac{1}{d_v}\sum_{j=1}^{d_v} o_{t,j}^2 + \epsilon}} \odot \gamma \odot \operatorname{silu}(g_t)\Big)''',
  '''\text{where } s^{(0)} \text{ is the stored window},\ s^{(1)} \text{ the snapshot},\ \mathcal{H}(c) \text{ the q or k head of channel } c,\ \gamma \text{ the norm weight},\ g_t \text{ the output gate}''',
]
compute = "cuda_core"
