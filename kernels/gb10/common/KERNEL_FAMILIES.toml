# 2026-09-29: Dynamic activation quantizers, one CTA per row. A static per-tensor quantizer (read
# the calibrated scale, no amax) is not instantiated anywhere.
[[family]]
id = "w8a8_act_quant"
description = "FP8 activation quantizer, dynamic per-token or per-128 (optionally SiLU * up first)"
explain.about = '''Dynamic FP8 activation quantizer for the W8A8 decode projections, one 256-thread CTA per row. w8a8_act_quant_row produces one FP32 scale per token and w8a8_act_quant_g128 one per 128-wide K group (16 threads per group, reduced by xor shuffles); the per-token variant holds up to 18432 values of the row in registers so the row is read once. The silu variants (w8a8_act_quant_silu_row, w8a8_act_quant_silu_g128) first form $\mathrm{rn}_{\mathrm{bf16}}(\operatorname{silu}(g)\,u)$ from a gate row and an up row, writing the same bytes as SiLU-and-multiply followed by the plain quantizer.'''
explain.numerics = '''BF16 inputs are widened exactly to FP32; the SiLU product is $(g\,\sigma(g))\,u$ with a fast exponential, left to right without FMA contraction, rounded to BF16. The absolute maximum is exact and order-independent; the scale is $\max|x|/448$ by correctly rounded FP32 division, floored at $10^{-12}$ (an all-zero group encodes zeros), and each value is divided by the scale, clamped to $\pm 448$ and converted to E4M3 with round-to-nearest-even and saturation.'''
explain.math = [
  '''\begin{aligned} v_{tk} &= x_{tk} \quad \text{or} \quad v_{tk} = \mathrm{rn}_{\mathrm{bf16}}\big((g_{tk}\,\sigma(g_{tk}))\,u_{tk}\big) \\ s_{t,G} &= \max\Big(\max_{k \in G} |v_{tk}| \,/\, 448,\; 10^{-12}\Big), \qquad G = [0, K) \text{ (row) or } [128b, 128b+128) \text{ (g128)} \\ q_{tk} &= \mathrm{sat}_{\mathrm{e4m3}}\Big(\min\big(\max(v_{tk}/s_{t,G}, -448), 448\big)\Big) \end{aligned}''',
]
compute = "memory"
kernels = [
  "w8a8_act_quant::w8a8_act_quant_row", "w8a8_act_quant::w8a8_act_quant_g128",
  "w8a8_act_quant::w8a8_act_quant_silu_row", "w8a8_act_quant::w8a8_act_quant_silu_g128",
]
rows = [1, 65536]
# 2026-10-02: The `_silu_` kernels compute silu(gate) * up in FP32, round it to BF16 in registers
# (w8a8_act_quant.cu:101-104) and quantize that.
pipeline.act_quant = { in = ["bf16"], compute = "f32", out = ["{format}"] }
pipeline.silu_mul = { in = ["bf16"], compute = "f32", out = ["bf16"] }
# 2026-10-02: `silu_mul`: the `_silu_` kernels' first half (rule w8a8_act_quant_silu_row).
op = [{ op = "act_quant" }, { op = "silu_mul" }]
