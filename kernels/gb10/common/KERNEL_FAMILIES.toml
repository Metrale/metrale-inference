# 2026-10-08: Sigmoid scores, top-k on score + e_score_correction_bias, the selected scores
# renormalised and scaled by `routed_scaling_factor`, from FP32 logits, every row in one launch
# (glm5next_ffn.cu:86-208); top_k and the scale are runtime arguments. 2026-10-10: the _rank
# entry is the same selection and weights byte for byte from per-expert rank counts.
[[family]]
id = "glm_router_topk"
description = "Sigmoid + correction-bias top-k routing over FP32 logits"
explain.about = '''Noaux top-k routing for GLM-5's 288-expert MoE from FP32 router logits, one block per token: each expert's score is the sigmoid of its logit, experts are ranked by score plus the learned correction bias, and the top $k=8$ are taken (exact ties to the lower expert id); the bias is used for selection only, and the weights are the unbiased sigmoid scores, renormalised over the selected experts and multiplied by the routed scaling factor $\gamma_r=2.5$. glm5next_ffn::glm5next_router_topk does $k$ rounds of block-wide argmax; glm5next_ffn::glm5next_router_topk_rank produces the same ids and weights byte for byte by ranking within each run of 32 experts with warp shuffles, keeping at most $k$ per run and counting the kept experts ahead of each one. A slot no expert fills gets id $-1$ and weight 0; grouped routing is not used (one group).'''
explain.numerics = '''FP32 throughout: sigmoid as $1/(1+e^{-z})$ with expf, the selection sum $s_e + b_e$, the renormalising sum in slot order, a true division by $(\sum + 10^{-20})$, then the scale multiply. An optional ladder mode rounds the score, the choice value, the running sum and each weight step to BF16 (RNE) to match a BF16 reference; the default is pure FP32.'''
explain.math = [
  '''\begin{aligned} s_e &= \sigma(z_e), \qquad \chi_e = s_e + b_e, \qquad e = 1,\dots,288 \\ \mathcal{E} &= \operatorname{top}_k(\chi) \;\;\text{(descending, ties to the lower } e\text{)} \\ w_{e} &= \gamma_r\, \frac{s_e}{\sum_{e^\prime \in \mathcal{E}} s_{e^\prime} + 10^{-20}}, \qquad e \in \mathcal{E} \end{aligned}''',
  '''\text{where } z \text{ are the router logits, } b \text{ the correction bias (selection only), } k = 8,\ \gamma_r \text{ the routed scaling factor}''',
]
compute = "memory"
kernels = ["glm5next_ffn::glm5next_router_topk", "glm5next_ffn::glm5next_router_topk_rank"]
rows = [1, 65536]
pipeline.top_k = { in = ["f32"], score = "f32", out = ["f32", "i32"] }
# 2026-10-08: The kernel reads FP32 logits (glm5next_ffn.cu:102-118), so it claims only an FP32
# router's top-k; a BF16-logit top-k is moe_topk's.
