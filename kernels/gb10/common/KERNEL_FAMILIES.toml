# 2026-09-29: Attention and the KV cache.

# 2026-09-29: head_dim sizes the per-lane registers (VEC_BF16 = HDIM/32) and is a macro: HDIM 256
# unless a target builds with -DHDIM=128 (8 targets' KERNEL.toml), or a per-head_dim copy of the
# file (`*_128.cu`, `*_512.cu`, the forced-512 model shadows). Each KV dtype is its own copy of
# the file. GQA ratio and context are runtime. One CTA per (q head, sequence); verify rows run as
# one-token sequences.
[[family]]
id = "paged_decode_attn"
description = "Paged softmax decode attention, one query row per sequence"
explain.about = '''Softmax decode attention for one query row per sequence over a paged KV cache read through the sequence's block table, with grouped-query attention (query head $h$ reads KV head $\lfloor h/G \rfloor$, $G = H_q/H_{kv}$) and an optional sliding window of the last $W$ positions. One block of 8 warps per (query head, sequence): each lane holds $d_h/32$ channels of the query, each warp takes one contiguous eighth of the attended positions and walks them four at a time within each physical cache block, keeping an online-softmax state $(m, \ell, o)$, and the eight warp states are merged through shared memory before the normalised output is stored. paged_decode_attn reads a BF16 cache and paged_decode_attn_fp8 an FP8 E4M3 cache with per-tensor scales $c_K, c_V$; the head width $d_h$ is a compile-time parameter (256 by default, with 128 and 512 builds), and the score scale $c$ is supplied by the host (normally $1/\sqrt{d_h}$).'''
explain.numerics = '''Q is BF16 widened to FP32 and K, V are BF16 (or E4M3 decoded exactly through FP16) widened to FP32; each lane forms an FP32 partial dot product over its channels and a five-step butterfly warp shuffle completes it, exponentials use the fast __expf with no base-2 rescaling, the running maximum starts at $-10^{30}$, and output and normaliser accumulate in FP32. Warp states merge in a fixed pairwise tree (8 to 4 to 2 to 1) that skips warps with $\ell = 0$, the output is multiplied by the FP32 reciprocal of $\ell$ and rounded once to BF16 (RNE); in the FP8 kernel $c_K$ is folded into the score scale and $c_V$ is applied once per channel before the merge.'''
explain.math = [
  '''\begin{aligned} j_0 &= \begin{cases} L - W & W > 0,\ L > W \\ 0 & \text{otherwise} \end{cases}, \qquad k_j = \mathcal{K}_{T[\lfloor j/B \rfloor],\; j \bmod B,\; \lfloor h/G \rfloor,\; :}, \quad v_j \text{ likewise}, \qquad j_0 \le j < L \\ s_j &= c\,\langle q, k_j \rangle, \qquad m = \max_{j} s_j, \qquad \ell = \sum_{j=j_0}^{L-1} e^{\,s_j - m} \\ y &= \mathrm{rn}_{\mathrm{bf16}}\Bigl(\frac{1}{\ell}\sum_{j=j_0}^{L-1} e^{\,s_j - m}\, v_j\Bigr) \end{aligned}''',
  '''s_j = (c\,c_K)\,\langle q, \hat{k}_j \rangle, \qquad y = \mathrm{rn}_{\mathrm{bf16}}\Bigl(\frac{c_V}{\ell}\sum_{j} e^{\,s_j - m}\, \hat{v}_j\Bigr) \qquad \text{(FP8 cache: } \hat{k}_j, \hat{v}_j \text{ are the decoded E4M3 values)}''',
]
compute = "cuda_core"
kernels = ["paged_decode::paged_decode_attn", "paged_decode_fp8::paged_decode_attn_fp8"]
rows = [1, 4096]
# 2026-10-02: Q, K and V widened exactly to FP32, FP32 scores, online softmax (`__expf`) and PV
# sums, one BF16 rounding (paged_decode_attn.cu:96-313). The FP8 kernel reads an E4M3 cache with
# per-layer FP32 k/v scales applied to the FP32 score and output (paged_decode_attn_fp8.cu:132,
# :291-297). The turbo and NVFP4 copies define other entry points, none listed here.
pipeline.paged_attention = { in = ["bf16", "bf16", "bf16"], cache = "bf16", scores = "f32", softmax = "f32", accumulate = "f32", out = ["bf16"] }
kernel_pipeline."paged_decode_fp8::paged_decode_attn_fp8".paged_attention = { in = ["bf16", "bf16", "bf16"], cache = "fp8", scores = "f32", softmax = "f32", accumulate = "f32", out = ["bf16"] }
op = [{ op = "paged_attention" }]
