[[family]]
id = "w4a16_gemm"
description = "NVFP4 W4A16 tile GEMM (p3, k64/n64, m128 variants; the p3 variants are model shadows)"
explain.about = '''NVFP4-weight tile GEMM for any number of rows, $y = \hat W x$ per row with $\hat W_{nk} = s_{\mathrm{g}}\,s_{n,\lfloor k/16\rfloor}\,q_{nk}$, reading the weight in a K-major transposed layout with a row stride that may exceed N (the padded lm_head). The common w4a16::w4a16_gemm_t uses a 64 x 64 CTA tile of four warps with 16 rows each and K steps of 16: every step dequantizes the weight tile into shared memory as BF16 and runs m16n8k16 BF16 MMAs. The model-specific variants w4a16_gemm_t_p3, w4a16_gemm_t_k64_p3, w4a16_gemm_t_k64_n64_p3 and w4a16_gemm_t_m128 use 64-row tiles 128 columns wide (64 for k64_n64; m128 runs two 64-row chunks against one 128-column weight tile) with K steps of 32 or 64 and cp.async pipelines (weights triple-buffered in the p3 forms), dequantizing the weight to E4M3 and converting the activation to E4M3 for m16n8k32 FP8 MMAs.'''
explain.numerics = '''Common kernel: the fully scaled weight $q\,s\,s_{\mathrm{g}}$ is computed in FP32 and rounded to BF16 before a BF16 x BF16 MMA with FP32 accumulation. Shadow variants: the same FP32 weight value is narrowed with round-to-nearest-even saturating to E4M3 and the BF16 activation is narrowed the same way with no scale (an implicit per-tensor scale of 1), then E4M3 x E4M3 MMAs accumulate in FP32. Every variant rounds the FP32 sum once to BF16 at the store.'''
explain.math = [
  '''\begin{aligned} y_{tn} &= \mathrm{rn}_{\mathrm{bf16}}\Big(\sum_{k=0}^{K-1} x_{tk}\;\mathrm{rn}_{\mathrm{bf16}}\big(q_{nk}\,s_{n,\lfloor k/16\rfloor}\,s_{\mathrm{g}}\big)\Big) \quad \text{(w4a16\_gemm\_t)} \\ y_{tn} &= \mathrm{rn}_{\mathrm{bf16}}\Big(\sum_{k=0}^{K-1} \mathrm{sat}_{\mathrm{e4m3}}(x_{tk})\;\mathrm{sat}_{\mathrm{e4m3}}\big(q_{nk}\,s_{n,\lfloor k/16\rfloor}\,s_{\mathrm{g}}\big)\Big) \quad \text{(p3, k64, m128 variants)} \end{aligned}''',
  '''\text{where } q_{nk} \text{ is the E2M1 weight value, } s_{nj} \text{ the E4M3 group scale, } s_{\mathrm{g}} \text{ the FP32 tensor scale, and } \mathrm{sat}_{\mathrm{e4m3}} \text{ rounds to nearest even with saturation at } \pm 448''',
]
compute = "tensor_core"
mma = "mma.sync.m16n8k16.bf16"
