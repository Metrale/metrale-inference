# 2026-10-08: The KDA recurrence for one token of one sequence (grid = heads): BF16 q/k/v from the
# decode conv, FP32 log-decay and beta, the FP32 [H, D, D] state updated in place, FP32 out
# (kda_recurrent.cu:3-22). The `_smem` twin keeps the decayed column in shared memory.
[[family]]
id = "kda_recurrent"
description = "KDA gated delta rule with per-channel decay, one token per launch; up to 4 tokens of one sequence with per-token state snapshots (seq_reg_snap)"
explain.about = '''The Kimi Delta Attention recurrence: the gated delta rule with a per-key-channel decay $\operatorname{diag}(e^{g_t})$ instead of a scalar, for one head with $d_k = d_v = D = 128$ and an FP32 state $S \in \mathbb{R}^{D \times D}$ updated in place. Grid over heads, one thread per value column: pass one decays the column and forms $S^\top k$, pass two adds the delta-rule correction and reads out with the pre-scaled query. kda_recurrent_decode_bf16 reads and writes the column in global memory in both passes, _smem keeps the decayed column in shared memory between passes, and _seq_reg keeps it in registers. kda_recurrent_decode_bf16_seq_reg_snap steps $T \le 4$ tokens of one sequence with the column held in registers across tokens and stores the state after each of the first $T-1$ tokens, the snapshots a $T$-row speculative verify needs to roll back.'''
explain.numerics = '''BF16 q, k, v widened exactly; FP32 log decay, beta, state and output. The decay is applied as expf of the log decay, the query is multiplied by the scale $1/\sqrt{D}$ (computed on the host in FP32) before the dot product, and both column sums run over $k = 1..D$ in order in FP32 without FMA contraction. All variants and the multi-token kernel give the per-token kernel's bits; no state clamp.'''
explain.math = [
  '''\begin{aligned} \tilde S &= \operatorname{diag}\!\big(e^{g_t}\big)\, S_{t-1} \\ u_t &= \beta_t\,\big(v_t - \tilde S^\top k_t\big) \\ S_t &= \tilde S + k_t\, u_t^\top \\ o_t &= S_t^\top \Big(\frac{q_t}{\sqrt{D}}\Big) \end{aligned}''',
  '''\text{where } g_t \in \mathbb{R}^{D} \text{ is the per-channel log decay},\ \beta_t = \sigma(b_t),\ q_t, k_t \text{ L2-normalised by the conv; snapshots } S_1, \dots, S_{T-1} \text{ in the } T\text{-token form}''',
]
compute = "cuda_core"
# 2026-10-22: `kda_recurrent_decode_bf16_seq_reg_snap` steps T <= 4 tokens of one sequence in one
# launch, the state in registers, and stores the state after each of the first T - 1 (a K-row
# verify's snapshots; METRALE_GLM_KDA_VERIFY_TOKENS, opt-in). Per token it is seq_reg's
# arithmetic, and the outputs, snapshots and final state are the per-row walk's bits
# (kda_recurrent.cu:500-511).
kernels = [
  "kda_recurrent::kda_recurrent_decode_bf16", "kda_recurrent::kda_recurrent_decode_bf16_smem",
  "kda_recurrent::kda_recurrent_decode_bf16_seq_reg_snap",
  # 2026-10-22: The register-resident single-token step (METRALE_GLM_KDA_ROW_REG, the recipe's): T = 1
  # of seq_reg's body, the shared-memory kernel's expressions in order (kda_recurrent.cu:447).
  "kda_recurrent::kda_recurrent_decode_bf16_seq_reg",
]
rows = [1, 4]
pipeline.gdn_recurrence = { in = ["bf16", "f32", "f32"], state = "f32", compute = "f32", out = ["f32"] }
op = [{ op = "gdn_recurrence" }]
