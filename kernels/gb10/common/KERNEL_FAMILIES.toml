# 2026-10-08: LayerNorm with a bias, FP32 statistics, BF16 in and out (the DSA indexer's k_norm,
# glm5next_dsa/mod.rs:53-55; written for the NLLB encoder).
[[family]]
id = "layer_norm"
description = "BF16 LayerNorm with weight and bias"
explain.about = '''LayerNorm with weight and bias over BF16 rows $x \in \mathbb{R}^{d}$, written in place. One block per row: a first pass reduces the sum for the mean through a shared-memory halving tree, a second pass reduces the squared deviations from that mean, and a third pass normalises, scales and shifts every element.'''
explain.numerics = '''BF16 widened exactly to FP32; both reductions are FP32 per-thread partials followed by a shared-memory halving tree, the variance is the biased two-pass estimate (divided by $d$), the root uses rsqrtf, and each output is rounded once to BF16 (RNE).'''
explain.math = [
  '''\begin{aligned} \mu &= \frac{1}{d}\sum_{j=1}^{d} x_j, \qquad v = \frac{1}{d}\sum_{j=1}^{d} (x_j - \mu)^2 \\ y_i &= \mathrm{rn}_{\mathrm{bf16}}\Bigl(\frac{x_i - \mu}{\sqrt{v + \epsilon}}\,\gamma_i + \beta_i\Bigr) \end{aligned}''',
]
compute = "memory"
kernels = ["nllb_encoder::nllb_layernorm_bf16"]
rows = [1, 65536]
pipeline.layer_norm = { in = ["bf16"], compute = "f32", out = ["bf16"] }
op = [{ op = "layer_norm" }]
[[family.point]]
values = {}
how = "instantiation"
files = ["kernels/gb10/common/nllb_encoder.cu"]

# 2026-10-08: The DSA indexer on the engine's layout: every token's raw normed key and gate score
# are stored (BF16, a flat per-sequence cache) and the pools are compressed at selection time,
# not at write time (glm5next_dsa/mod.rs:18-25): `dsa_kpool_compress` then the scores, the top
# pools and their token expansion, one query row per launch (glm5next_dsa/select/launch.rs).
# The selector query and head weights arrive FP32 (the f32-out GEMVs).
[[family]]
id = "dsa_indexer"
description = "DSA lightning indexer: key store, pool compression, scores, top pools, token expansion"
explain.about = '''The DeepSeek-sparse-attention lightning indexer, which picks the tokens each query row attends. Stage by stage: a store writes the row's normalised index key $k_s \in \mathbb{R}^{128}$ and per-channel gate $g_s$ into the indexer cache; pool compression folds every $K_P=4$ consecutive tokens into one pool key by a per-channel softmax over the pool's slots of gate plus a learned position term; the scores combine $H_I=32$ index heads as a weighted sum of ReLU dot products against each pool key, with pools that are incomplete or end after the query scored $-\infty$; a deterministic top-k keeps the best $\min(P, 2048/K_P)=512$ pools (score descending, ties to the lower pool index); expansion writes the selected pools' token ids and always appends the up to $K_P-1$ visible tokens of the incomplete tail pool, padding with $-1$. Kernels cover one sequence or many rows per launch with device-side geometry (graph replay safe), block-, warp- and lane-per-head score forms over scratch or persisted pool keys, a BF16 tensor-core score path with a cp.async key pipeline, bitonic, radix and multi-CTA radix top-k, a fused scores-plus-streaming-top-k kernel, a candidacy fold for the sequence-parallel selection, and an FP8 indexer cache that stores each completed pool key Walsh-Hadamard rotated in E4M3 with a power-of-two scale.'''
explain.numerics = '''Keys and gates are BF16 widened to FP32; pool keys, queries, head weights and scores are FP32, with __expf in the pool softmax, FP32 lane-strided dot products reduced by a shuffle tree and the head terms summed in head order, no FMA contraction. The tensor-core score path rounds queries and pool keys to BF16 (RNE) and accumulates in FP32 (a different precision point); the FP8 cache quantises $y=\mathrm{FWHT}_{128}(\bar k)$ with scale $2^{\lceil \log_2(\max|y|/448)\rceil}$ (exponent clamped to $[-126,127]$) and saturating RNE E4M3, and reads back $\mathrm{FWHT}_{128}(\hat y\, s)/128$; all top-k variants implement one total order and emit identical slots for NaN-free scores.'''
explain.math = [
  '''\begin{aligned} \bar k_{p,c} &= \sum_{s=0}^{K_P-1} \frac{\exp\big(g_{pK_P+s,c} + a_{s,c}\big)}{\sum_{s^\prime} \exp\big(g_{pK_P+s^\prime,c} + a_{s^\prime,c}\big)}\; k_{pK_P+s,c} \\ I_{t,p} &= \begin{cases} \displaystyle\sum_{h=1}^{H_I} w_{t,h}\, \operatorname{relu}\!\Big(\tfrac{1}{\sqrt{D_I}}\,\langle q_{t,h}, \bar k_p\rangle\Big) & \text{if } (p+1)K_P \le S \text{ and } pK_P + K_P - 1 \le \tau_t \\ -\infty & \text{otherwise} \end{cases} \end{aligned}''',
  '''\begin{aligned} \mathcal{P}_t &= \operatorname{top}_{k_t}\big(I_{t,\cdot}\big), \qquad k_t = \min\Big(\Big\lfloor \tfrac{\tau_t+1}{K_P} \Big\rfloor,\, \Big\lfloor \tfrac{\min(S, 2048)}{K_P} \Big\rfloor\Big) \\ \mathcal{T}_t &= \{\, pK_P + s : p \in \mathcal{P}_t,\ 0 \le s < K_P \,\} \,\cup\, \{\, K_P \lfloor n_t / K_P \rfloor + s : 0 \le s < n_t \bmod K_P \,\} \end{aligned}''',
  '''\begin{aligned} y &= \mathrm{FWHT}_{128}(\bar k_p), \qquad \sigma_p = 2^{\lceil \log_2(\max_c |y_c| / 448) \rceil}, \qquad \hat y_c = \mathrm{sat}_{\mathrm{e4m3}}\big(y_c / \sigma_p\big) \\ \tilde k_p &= \tfrac{1}{128}\,\mathrm{FWHT}_{128}\big(\sigma_p\, \hat y\big) \end{aligned}''',
  '''\text{where } w_{t,h} = H_I^{-1/2}\,(W_w x_t)_h,\ a \text{ the learned slot term, } D_I = 128,\ S \text{ the cached tokens, } \tau_t \text{ the query position, } n_t \text{ the visible tokens at or before } \tau_t''',
]
compute = "cuda_core"
kernels = [
  "dsa_indexer::dsa_indexer_store", "dsa_indexer::dsa_write_geom",
  "dsa_indexer::dsa_kpool_compress", "dsa_indexer::dsa_index_scores",
  "dsa_indexer::dsa_topk_pools", "dsa_indexer::dsa_expand_selection",
