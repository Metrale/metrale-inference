[[family]]
id = "gdn_recurrence"
description = "Gated delta rule decode (one row per sequence) and the WY verify kernels (K = 2, 3, 4)"
explain.about = '''The Gated DeltaNet recurrence for one head with scalar decay $\alpha_t$ and write strength $\beta_t$, state $S \in \mathbb{R}^{d_k \times d_v}$ in FP32. The decode kernels (one token per sequence) run one block per (value head, sequence) with one thread per state column, read the column twice (once for $S^\top k$, once to update and read out), and clamp the state norm after the step; gated_delta_rule_decode_f32_norm additionally applies the SiLU-gated RMS norm to the head output in the same block. The WY verify kernels gated_delta_rule_wy2, _wy3 and _wy4 run $K = 2, 3, 4$ speculative tokens in two passes over the state: pass one forms $S_0^\top k_t$ for all $K$ keys at once, the key Gram entries $\langle k_t, k_j\rangle$ correct them into the sequential predictions, and pass two applies the $K$ updates in registers, storing the $K-1$ intermediate states for rollback and the final state in place. Value head $h$ reads key head $\lfloor h / r\rfloor$ with $r$ value heads per key head.'''
explain.numerics = '''State and arithmetic FP32 throughout, without FMA contraction; column dot products are accumulated in groups of four rows in ascending order and the Gram entries are 128-thread block reductions (shuffle-down tree then a fixed combination of four warp sums). The decode kernels read FP32 q, k, v and write FP32 (the _norm kernel writes BF16 after the gated norm, its SiLU via expf); the WY kernels read BF16 q, k, v (widened exactly) and round the output to BF16 (RNE). The read-out scale is rsqrtf of $d_k$; the state-norm clamp (decode kernels only) uses rsqrtf of the squared Frobenius norm and leaves that step's output unclamped.'''
explain.math = [
  '''\begin{aligned} \bar\alpha_t &= \min\!\big(\max(\alpha_t, 10^{-6}),\, 1 - 10^{-6}\big) \\ u_t &= \beta_t\,\big(v_t - \bar\alpha_t\, S_{t-1}^\top k_t\big) \\ S_t &= \bar\alpha_t\, S_{t-1} + k_t\, u_t^\top \\ o_t &= \frac{S_t^\top q_t}{\sqrt{d_k}} \end{aligned}''',
  '''\text{decode only, after } o_t\text{: } S_t \leftarrow S_t \cdot \min\!\Big(1,\ \frac{1000}{\lVert S_t \rVert_F}\Big)''',
  '''\begin{aligned} c_t &= \Big(\prod_{l=1}^{t-1} \bar\alpha_l\Big) S_0^\top k_t + \sum_{j=1}^{t-1} \Big(\prod_{l=j+1}^{t-1} \bar\alpha_l\Big) \langle k_t, k_j\rangle\, u_j \;=\; S_{t-1}^\top k_t \\ u_t &= \beta_t\,\big(v_t - \bar\alpha_t\, c_t\big), \qquad t = 1, \dots, K \\ S_t &= \bar\alpha_t S_{t-1} + k_t u_t^\top, \qquad o_t = \mathrm{rn}_{\mathrm{bf16}}\big(S_t^\top q_t / \sqrt{d_k}\big) \end{aligned}''',
  '''y = \frac{o}{\sqrt{\frac{1}{d_v}\sum_{j=1}^{d_v} o_j^2 + \epsilon}} \odot \gamma \odot \operatorname{silu}(z)''',
  '''\text{where } q_t, k_t \in \mathbb{R}^{d_k} \text{ are L2-normalised},\ v_t \in \mathbb{R}^{d_v},\ \gamma \text{ the norm weight and } z \text{ the BF16 output gate (fused norm only)}''',
]
compute = "cuda_core"
kernels = [
  "gated_delta_rule::gated_delta_rule_decode_f32", "gated_delta_rule::gated_delta_rule_decode_f32_norm",
  "gated_delta_rule_wy::gated_delta_rule_wy2", "gated_delta_rule_wy3::gated_delta_rule_wy3",
  "gated_delta_rule_wy4::gated_delta_rule_wy4",
]
rows = [1, 4]
