how = "instantiation"
files = ["kernels/gb10/common/dense_gemv_fp8w.cu", "kernels/gb10/common/glm5next_mtp_xchg.cu"]

# 2026-10-23: The MTP layer's routed experts at W4A16: one launch per projection over the top-k
# slots, the NVFP4 weights decoded to BF16 against the BF16 row, FP32 sums (w4a16_gemv.cu).
[[family]]
id = "w4a16_sw_moe"
description = "W4A16 slot GEMV over a row's top-k routed experts (the GLM-5.3 MTP layer)"
explain.about = '''The routed experts of the GLM-5.3 MTP layer at one row. One launch per projection runs the row's top-$k$ slots on a $(\lceil N/8 \rceil, k)$ grid: slot $s$ applies expert $e_s$, found through the per-expert pointer tables, to input row $s$ (a stride of 0 shares one row) and writes row $s$ of the output. A slot whose expert id is out of range, or names an expert this rank does not own, writes nothing, so the caller's pre-zeroed row stays. Each slot computes the one-warp NVFP4 GEMV: E2M1 weights with an E4M3 scale per 16 values and an FP32 tensor scale, dequantized on the fly against the BF16 activations. No routing weight is applied here.'''
explain.numerics = '''As the one-warp NVFP4 GEMV: the scale $s_{\mathrm{g}}\,s_{nj}$ is formed in FP32, each 16-value chunk is accumulated with a fused multiply-add chain over activations widened from BF16 and folded with one FMA by the chunk scale, the warp's shuffle tree sums in FP32, and the output is rounded once to BF16.'''
explain.math = [
  '''y_{s,n} = \mathrm{rn}_{\mathrm{bf16}}\Big(\sum_{j=0}^{K/16-1} \big(s^{(e_s)}_{\mathrm{g}}\, s^{(e_s)}_{nj}\big) \sum_{i=0}^{15} q^{(e_s)}_{n,16j+i}\, x_{s,16j+i}\Big), \qquad s = 0,\dots,k-1''',
  '''\text{where } e_s \text{ is slot } s\text{'s expert, } q^{(e)} \text{ its E2M1 values, } s^{(e)}_{nj} \text{ its E4M3 group scales and } s^{(e)}_{\mathrm{g}} \text{ its tensor scale}''',
]
compute = "cuda_core"
kernels = ["w4a16_gemv::w4a16_gemv_sw_moe"]
rows = [1, 1]
pipeline.expert_gate_up = { in = ["bf16", "i32"], gather = "bf16", act = "bf16", weight = "nvfp4/g16->bf16", mma = "bf16*bf16", accumulate = "f32", scale = "f32", out = ["bf16"] }
pipeline.expert_down = { in = ["bf16", "i32"], act = "bf16", weight = "nvfp4/g16->bf16", mma = "bf16*bf16", accumulate = "f32", scale = "f32", out = ["bf16"] }
op = [{ op = "expert_gate_up", weight = ["nvfp4/g16"] }, { op = "expert_down", weight = ["nvfp4/g16"] }]
