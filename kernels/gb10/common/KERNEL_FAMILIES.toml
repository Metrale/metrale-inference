[[family]]
id = "moe_fp8_1row"
description = "FP8 block-128 experts + shared expert, one row per launch (gate+up, SiLU + down)"
explain.about = '''Single-token decode of the $k$ routed experts and the shared expert with FP8 block-128 weights, as two launches. The gate+up kernel moe_shared_expert_fused_fp8::moe_expert_gate_up_shared_fp8 has grid (output tiles, $k+1$, 2): the y index is the expert slot (slot $k$ is the shared expert), z selects the gate or the up projection, and each 128-thread block computes 8 outputs, two per warp, with each warp streaming 16 weight bytes per lane step. The down kernel moe_expert_silu_down_shared_fp8 recomputes $\operatorname{silu}(g) \odot u$ for its slot into shared memory and runs the down GEMV the same way. Each slot writes its own BF16 output row; the weighted combine with the routing weights and the shared-expert gate is done by moe_blend, and a slot whose expert has no weights writes zeros.'''
explain.numerics = '''Weights are E4M3 with one FP32 scale per 128 x 128 block; each byte is decoded through a 256-entry shared-memory table (NaN codes read as 0) and multiplied by its block scale in FP32. Activations are BF16 widened to FP32; products accumulate in FP32 per lane, reduce by a warp shuffle tree, and gate, up and down are each rounded once to BF16 (RNE) at the store; the SiLU product is formed in FP32 from the BF16 gate and up with the fast exponential and is not rounded before the down projection.'''
explain.math = [
  '''\begin{aligned} \hat W_{nk} &= \mathrm{e4m3}(W_{nk})\; s_{\lfloor n/128 \rfloor,\, \lfloor k/128 \rfloor} \\ g^{(e)} &= \mathrm{rn}_{\mathrm{bf16}}\big(\hat W^{\mathrm{gate}}_{e} x\big), \qquad u^{(e)} = \mathrm{rn}_{\mathrm{bf16}}\big(\hat W^{\mathrm{up}}_{e} x\big) \\ h^{(e)} &= \operatorname{silu}\big(g^{(e)}\big) \odot u^{(e)} \\ y^{(e)} &= \mathrm{rn}_{\mathrm{bf16}}\big(\hat W^{\mathrm{down}}_{e}\, h^{(e)}\big), \qquad e \in \mathcal{T}(x) \cup \{\mathrm{sh}\} \end{aligned}''',
]
compute = "cuda_core"
kernels = [
  "moe_shared_expert_fused_fp8::moe_expert_gate_up_shared_fp8",
  "moe_shared_expert_fused_fp8::moe_expert_silu_down_shared_fp8",
]
rows = [1, 1]
# 2026-10-02: E4M3 through an FP32 table times the block scale in FP32, FP32 sums
# (moe_shared_expert_fused_fp8.cu:214-249); gate and up written BF16; the SiLU product kept FP32 in
# shared memory and multiplied at FP32 by the down projections (:321-393).
pipeline.expert_gate_up = { in = ["bf16", "i32"], gather = "bf16", act = "bf16", weight = "fp8/block128x128->bf16", mma = "bf16*bf16", accumulate = "f32", scale = "f32", out = ["bf16"] }
pipeline.expert_down = { in = ["f32", "i32"], act = "f32", weight = "fp8/block128x128->f32", mma = "f32*f32", accumulate = "f32", scale = "f32", out = ["bf16"] }
pipeline."linear:shared_gate_up" = { in = ["bf16"], act = "bf16", weight = "fp8/block128x128->bf16", mma = "bf16*bf16", accumulate = "f32", scale = "f32", out = ["bf16"] }
pipeline."linear:shared_down" = { in = ["f32"], act = "f32", weight = "fp8/block128x128->f32", mma = "f32*f32", accumulate = "f32", scale = "f32", out = ["bf16"] }
pipeline.silu_mul = { in = ["bf16"], compute = "f32", out = ["f32"] }
op = [
  { op = "expert_gate_up", weight = ["fp8/block128x128"] },
