# 2026-10-08: GLM-5 (`glm5_next`) kernels: the hyper-connection, KDA, the DSA indexer and latent
# attention, the clamped SwiGLU and the sigmoid router. Each family states the policy point the
# GLM-5 circuit gives its nodes, so the GatedDeltaNet and attention families above show as policy
# variants of the same ops.

# 2026-10-08: The engine keeps the highway FP32 ([T, hc, H]) where the reference keeps the model
# dtype: every kernel reads and writes the streams as f32 (glm5next_mhc.cu:207-215, :353-365,
# :546-554, :608-616, :642-657). hc_mix reads the BF16 `hc_fn` widened exactly and sums in FP32;
# the RMS over the hc*H stream values scales the mix (glm5next_mhc.cu:53-63). `hc_pre` (the fused
# oracle) and `hc_post_ref` are not dispatched (glm5next_mhc.rs:25-28).
[[family]]
id = "glm_mhc"
description = "GLM-5 hyper-connection: mix GEMV, Sinkhorn pre-mix and collapse, post-mix, expand, mean"
explain.about = '''Manifold-constrained hyper-connections: the residual is carried as $n_{hc}=4$ FP32 streams $x_1,\dots,x_{n_{hc}} \in \mathbb{R}^{d}$ ($d=4096$), and every attention or FFN site reads one collapsed BF16 row from them and writes its output back into all of them. The pre-mix takes the RMS of the flattened streams, a GEMV with the site's mixing matrix $\Phi \in \mathbb{R}^{(2+n_{hc})n_{hc} \times n_{hc}d}$ (24 rows: $n_{hc}$ pre gates, $n_{hc}$ post gates and an $n_{hc}\times n_{hc}$ comb matrix), sigmoid gates and a Sinkhorn normalisation of the comb matrix ($T=20$ iterations, ending on a column pass), then collapses the streams with the pre gates; the post-mix writes $\mathrm{post}_j\,u + \sum_i C_{ij}\,x_i$ back into each stream. Variants: the mix as one block per (token, mix row) with FP32 or BF16 weights and a separate finish kernel; fused pre-mix entries (glm5next_mhc_fused::glm5next_hc_pre_norm and its row-grouped, prefetching, split-K, four-token, cp.async-tiled and small-batch forms) that also run the site's RMSNorm on the collapsed row through a last-block-done tail; post-mix entries that first sum the tensor-parallel ranks' partial outputs (one-shot all-reduce reduce step), one of them fused with the next site's pre-mix; the embedding broadcast (expand) and the final unweighted stream mean (head).'''
explain.numerics = '''Streams, mixes, gates and comb are FP32 (BF16 mixing weights are widened exactly); every dot product is a thread-strided FP32 sum followed by a fixed 256-wide tree, built without FMA contraction, so all variants except split-K (which reorders the mix sums) give identical bits. expf (not the fast intrinsic) for sigmoid and softmax, rsqrtf for the RMS, every Sinkhorn step a true division by $(\text{sum}+\varepsilon_{hc})$; the collapsed row and the normed row are each rounded once to BF16 (RNE), the rank sum is an FP32 sum in rank order rounded once to BF16 before the post-mix, and the post-mix output stays FP32.'''
explain.math = [
  '''\begin{aligned} r &= \Big(\tfrac{1}{n_{hc}d}\textstyle\sum_{i,k} x_{i,k}^2 + \varepsilon_n\Big)^{-1/2}, \qquad \mu_m = r\,\langle \Phi_m, [x_1;\dots;x_{n_{hc}}]\rangle,\quad m = 1,\dots,(2+n_{hc})n_{hc} \\ \mathrm{pre}_i &= \sigma(\alpha_0\,\mu_i + \beta_i) + \varepsilon_{hc}, \qquad \mathrm{post}_i = 2\,\sigma(\alpha_1\,\mu_{n_{hc}+i} + \beta_{n_{hc}+i}) \\ C^{(0)}_{ij} &= \operatorname{softmax}_j\big(\alpha_2\,\mu_{2n_{hc}+(i-1)n_{hc}+j} + \beta_{2n_{hc}+(i-1)n_{hc}+j}\big) + \varepsilon_{hc} \end{aligned}''',
  '''\begin{aligned} \mathcal{C}(C)_{ij} &= \frac{C_{ij}}{\varepsilon_{hc} + \sum_{i^\prime} C_{i^\prime j}}, \qquad \mathcal{R}(C)_{ij} = \frac{C_{ij}}{\varepsilon_{hc} + \sum_{j^\prime} C_{ij^\prime}} \\ C &= (\mathcal{C}\circ\mathcal{R})^{T-1}\big(\mathcal{C}(C^{(0)})\big) \\ y &= \mathrm{rn}_{\mathrm{bf16}}\Big(\textstyle\sum_{i=1}^{n_{hc}} \mathrm{pre}_i\, x_i\Big), \qquad \hat y_k = \mathrm{rn}_{\mathrm{bf16}}\Big(y_k \big(\tfrac{1}{d}\textstyle\sum_{k^\prime} y_{k^\prime}^2 + \epsilon\big)^{-1/2} \gamma_k\Big) \end{aligned}''',
  '''\begin{aligned} u &= \mathrm{rn}_{\mathrm{bf16}}\Big(\textstyle\sum_{\rho=0}^{R-1} u^{(\rho)}\Big), \qquad x^\prime_j = \mathrm{post}_j\, u + \textstyle\sum_{i=1}^{n_{hc}} C_{ij}\, x_i \\ x_i &= h \;\; (i = 1,\dots,n_{hc}) \;\;\text{(expand)}, \qquad y = \mathrm{rn}_{\mathrm{bf16}}\Big(\big(\textstyle\sum_{i} x_i\big)\cdot\tfrac{1}{n_{hc}}\Big) \;\;\text{(head)} \end{aligned}''',
  '''\text{where } \alpha_{0,1,2} \text{ are the site scales, } \beta \text{ the mix biases, } \gamma \text{ the plain RMSNorm weight, } u^{(\rho)} \text{ the partial sublayer output of rank } \rho \text{, } h \text{ the BF16 embedding, } \varepsilon_n, \varepsilon_{hc} = 10^{-6}, \epsilon \text{ the stream-norm, hyper-connection and RMSNorm epsilons, } T = 20''',
]
compute = "memory"
kernels = [
  "glm5next_mhc::glm5next_hc_mix", "glm5next_mhc::glm5next_hc_mix_bf16",
  "glm5next_mhc::glm5next_hc_finish", "glm5next_mhc::glm5next_hc_post",
