# 2026-09-29: Recurrent mixers: GatedDeltaNet and Mamba2.

[[family]]
id = "gdn_ba_gates_gemv"
description = "GDN in_proj_b|a GEMV fused with the beta/decay gates, one row per launch"
explain.about = '''Single-token projection of the hidden state $x \in \mathbb{R}^{K}$ onto the Gated DeltaNet beta and decay logits, $z = Wx$ with $W \in \mathbb{R}^{N \times K}$ and $N = 2 n_v$ ($n_v$ value heads), with both gate transforms applied in the same kernel so the logits never leave registers. Each 256-thread block computes four outputs, 64 lanes per output sweeping $K$ in 8-element vectors. The weight rows are interleaved per key-head group: within each group of $2r$ rows ($r$ value heads per key head) the first $r$ give the beta logits $b_h$ and the next $r$ the decay logits $a_h$. A beta row is written as $\beta_h$, a decay row as the multiplicative decay $\alpha_h$, both one scalar per value head.'''
explain.numerics = '''BF16 activations and weights are widened exactly to FP32 and every product and sum is FP32 (built without FMA contraction); each lane sums its strided vectors in index order, then a shuffle-down tree (offsets 16 to 1) and the sum of the two warp partials give the dot product. The transforms use the fast intrinsics __expf and __logf, the arguments of the inner exponentials are clamped at 20, and both outputs are stored as FP32 with no BF16 rounding of the logits.'''
explain.math = [
  '''\begin{aligned} b_h &= \langle W_{\mathrm{b}(h)}, x\rangle, \qquad a_h = \langle W_{\mathrm{a}(h)}, x\rangle \\ \beta_h &= \sigma(b_h) \\ \alpha_h &= \exp\!\Big(-e^{\min(A_h,\,20)}\,\log\!\big(1 + e^{\min(a_h + \delta_h,\,20)}\big)\Big) \end{aligned}''',
  '''\text{where } A_h \text{ is the learned log decay rate},\ \delta_h \text{ the learned dt bias, and } \mathrm{b}(h), \mathrm{a}(h) \text{ the interleaved weight rows of value head } h''',
]
compute = "cuda_core"
kernels = ["ssm_preprocess::dense_gemv_ba_gates"]
rows = [1, 1]
