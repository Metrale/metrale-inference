[[family]]
id = "w4a16_gemv"
description = "NVFP4 W4A16 CUDA-core GEMV: 1 row (sw, fused dual / q|gate / SiLU-input) and 2-3 row copies"
explain.about = '''NVFP4-weight, BF16-activation GEMV on CUDA cores for 1 to 3 rows. The weight is E2M1 codes (two per byte, low nibble first) with one E4M3 scale per 16 values along K and one FP32 tensor scale, dequantized on the fly from a 16-entry E2M1 table staged in shared memory. w4a16_gemv gives each output 64 threads and four outputs per block, w4a16_gemv_sw one warp per output with the same operation order, and w4a16_gemv_batch2 and batch3 read each weight chunk once for 2 or 3 rows with each row bit-identical to the one-row kernel. The fused entries run two projections of one input in one launch (w4a16_gemv_dual, dual_sw, dual_batch2, dual_batch3), deinterleave a head-interleaved query and gate weight into a [Q | gate] output (w4a16_gemv_qg and its batch2 and batch3 forms), or take $\operatorname{silu}(g)\odot u$ as the input, computed per element (w4a16_gemv_silu_input_sw). w4a16_gemv_seg_r1, r2 and r4 run up to six weight segments that share the input row on one persistent grid (R output rows per warp tile, the input staged once per block), and w4a16_gemv_pipe_m1 and m2 do the same with each warp's weight loads issued one step ahead; both reproduce w4a16_gemv's bytes.'''
explain.numerics = '''The scale $s_{\mathrm{g}}\,s_{nj}$ is formed in FP32; the 16-value chunk walk accumulates each chunk with a fused multiply-add chain and folds it with one FMA by the chunk scale, while the 8-value walk (qg, dual, silu-input) multiplies the scale into every weight first; activations are widened BF16, the silu input stays in FP32, the warp shuffle tree and the two-warp sum are FP32, and the output is rounded once to BF16 with round-to-nearest-even.'''
explain.math = [
  '''\hat W_{nk} = s_{\mathrm{g}}\,s_{n,\lfloor k/16 \rfloor}\,q_{nk}, \qquad q_{nk} \in \{0, \pm 0.5, \pm 1, \pm 1.5, \pm 2, \pm 3, \pm 4, \pm 6\}, \quad s_{nj} = \mathrm{e4m3}(\text{scale byte}), \quad s_{\mathrm{g}} \in \mathrm{fp32}, \quad \text{where } q \text{ is the E2M1 value, } s_{nj} \text{ the decoded E4M3 group scale and } s_{\mathrm{g}} \text{ the tensor scale}''',
  '''\begin{aligned} y_n &= \mathrm{rn}_{\mathrm{bf16}}\Big(\sum_{j=0}^{K/16-1} \big(s_{\mathrm{g}}\,s_{nj}\big) \sum_{i=0}^{15} q_{n,16j+i}\,x_{16j+i}\Big) \quad \text{(16-value chunk walk)} \\ y_n &= \mathrm{rn}_{\mathrm{bf16}}\Big(\sum_{k=0}^{K-1} x_k \big(q_{nk}\,(s_{\mathrm{g}}\,s_{n,\lfloor k/16 \rfloor})\big)\Big) \quad \text{(8-value walk)} \\ x_k &= \frac{g_k}{1 + e^{-g_k}}\,u_k \quad \text{(silu input, FP32)} \end{aligned}''',
  '''y^{[Q\,|\,G]}_{\pi(n)} = y_n, \qquad \pi(2dh + i) = \begin{cases} dh + i & i < d \\ Hd + dh + (i - d) & i \ge d \end{cases} \quad \text{(qg: } H \text{ heads of width } d\text{)}''',
]
compute = "cuda_core"
