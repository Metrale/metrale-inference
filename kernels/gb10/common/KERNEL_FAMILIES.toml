# 2026-10-08: The routed outputs weighted and summed with the ungated shared expert, BF16 out,
# from slot order or the expert-sorted order (glm5next_ffn.cu:209-263).
# 2026-10-14: the _vec8 entries are the same bytes at eight elements per thread.
[[family]]
id = "glm_moe_combine"
description = "Weighted routed sum plus the ungated shared expert"
explain.about = '''Combines a token's MoE output: the $k$ routed expert outputs weighted by the router weights (which already include the routed scaling factor) plus the shared expert's output added unscaled, since GLM-5's shared expert has no gate. Grid of (token, column blocks), threads striding the hidden dimension; the indexed variants read routed slot $k$ of token $t$ from its expert-sorted row through a token-to-permutation map instead of from slot order, and the vec8 variants own eight consecutive elements per thread with 16-byte loads, all producing the same bytes.'''
explain.numerics = '''BF16 expert and shared outputs widened to FP32, FP32 weights; one FP32 accumulator starting at zero summed over the slots in slot order with each product rounded before its add (no FMA contraction), then the shared value added, then a single RNE rounding to BF16.'''
explain.math = [
  '''y_{t,i} = \mathrm{rn}_{\mathrm{bf16}}\Big(\Big(\sum_{\kappa=1}^{k} w_{t,\kappa}\, e^{(\kappa)}_{t,i}\Big) + e^{\mathrm{sh}}_{t,i}\Big)''',
  '''\text{where } e^{(\kappa)}_t \text{ is the output of the expert in routed slot } \kappa,\ w_{t,\kappa} \text{ its router weight, } e^{\mathrm{sh}}_t \text{ the shared expert output}''',
]
compute = "memory"
kernels = ["glm5next_ffn::glm5next_moe_combine", "glm5next_ffn::glm5next_moe_combine_indexed", "glm5next_ffn::glm5next_moe_combine_vec8", "glm5next_ffn::glm5next_moe_combine_indexed_vec8"]
rows = [1, 65536]
pipeline.blend = { in = ["bf16", "f32", "bf16"], scatter = "f32", combine = "f32", out = ["bf16"] }
op = [{ op = "blend" }]
