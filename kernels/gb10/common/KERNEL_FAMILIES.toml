pipeline.expert_gate_up = { in = ["bf16", "i32"], gather = "fp8/g128", act = "fp8/g128", weight = "fp8/block128x128->e4m3", mma = "e4m3*e4m3", accumulate = "f32", scale = "f32", out = ["bf16"] }
pipeline.expert_down = { in = ["fp8/g128", "i32"], act = "fp8/g128", weight = "fp8/block128x128->e4m3", mma = "e4m3*e4m3", accumulate = "f32", scale = "f32", out = ["bf16"] }
pipeline.silu_mul = { in = ["bf16"], compute = "bf16", out = ["fp8/g128"] }
op = [
  { op = "expert_gate_up", weight = ["fp8/block128x128"] },
  { op = "expert_down", weight = ["fp8/block128x128"] },
  { op = "silu_mul" },
]
