# 2026-10-08: Interleaves the three BF16 q, k, v projections into one q|k|v row
# (kda_layer_ops.cu:127-149).
[[family]]
id = "kda_pack"
description = "KDA q|k|v pack of three projections"
explain.about = '''Interleaves the three separately projected BF16 rows $q$, $k$, $v$ (each of width $n = H d_k$) into one $[q \,|\, k \,|\, v]$ row of width $3n$ per token, the layout the depthwise conv reads. One thread per channel and one grid row per token; it is a pure copy.'''
