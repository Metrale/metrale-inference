# 2026-09-29: The tensor-core grouped expert kernel (8-row MMA column tiles, shared expert fused
# as the first block rows). Weights are converted by byte permute into a BF16 MMA (W8A16), or run
# an E4M3 MMA on per-128 quantized activations (W8A8, a file twin). Its format, activation and
# epilogue are the policies a new MoE would plug in. 2026-10-02: the W8A16 warp is one template
# over a weight-format policy (kernels/gb10/common/moe_grouped_tc.cuh), instantiated for FP8
# block-128 (moe_fp8_grouped_tc.cu) and NVFP4 g16 W4A16 (moe_nvfp4_grouped_tc.cu, the declared
# path of nvidia/Qwen3.6-35B-A3B-NVFP4); both admit 1..=256 rows (the *_TC_MAX_ROWS constants).
[[family]]
id = "moe_grouped_tc"
description = "Tensor-core grouped experts + shared expert (FP8 block-128 W8A16/W8A8, NVFP4 g16 W4A16, BF16)"
explain.about = '''Tensor-core grouped expert decode for up to 256 rows, with the grid contract of the CUDA-core grouped kernels: one block row per active expert after the expert sort, the first $\lceil m/8 \rceil$ block rows for the shared expert. One weight-format-parameterised warp runs mma m16n8k16 BF16 tiles with the weights as the 16-row A operand and up to 8 token rows as the MMA's N columns (16 rows, two column groups sharing each decoded fragment, when an expert has more than 8); a warp covers 16 output columns for gate+up (its gate and up tiles, so the SiLU product forms in registers) and 32 for down, and keeps two K-chunk load groups in flight. Weight formats: FP8 block-128 (moe_fp8_grouped_tc), NVFP4 with one E4M3 scale per 16 and an FP32 tensor scale in row-major and repacked tile-contiguous lean layouts (moe_nvfp4_grouped_tc, whose lean kernels return the same bytes), and BF16 (moe_bf16_grouped_tc). The W8A8 twin (moe_fp8_grouped_tc_w8a8) quantizes the layer input with moe_act_quant_e4m3, runs mma m16n8k32 E4M3 tiles on the raw FP8 weights, and re-quantizes the SiLU product per 128 intermediate columns inside the gate+up epilogue. A row output does not depend on which rows share its launch, pass or expert.'''
explain.numerics = '''W*A16 points: FP8 bytes become BF16 by a bit shift (exactly $\mathrm{e4m3}(b)\,2^{-120}$) with activations lifted by $2^{60}$ and each 128-K partial sum folded in FP32 by its block scale times $2^{60}$; NVFP4 values enter as the exact BF16 product $q \cdot d$ of the E2M1 value and its E4M3 scale and the FP32 sum is multiplied once by the tensor scale $s_2$; MMAs accumulate in FP32, gate and up are rounded to BF16 before the FP32 SiLU product, which is stored as a BF16 hi plus lo pair (about 16 mantissa bits) and fed to the down MMAs as two operands, and outputs are rounded once to BF16 (RNE). W8A8 point: activation scales $a = \max(\mathrm{amax}/448, 10^{-12})$ per (row, 128 values), values $\mathrm{sat}_{\mathrm{e4m3}}(\mathrm{rn}(x/a))$, E4M3 x E4M3 MMAs into FP32, each 128-K block folded by weight scale times activation scale.'''
explain.math = [
  '''\begin{aligned} &\text{FP8 block-128 (W8A16):} \\ g_{\pi,n} &= \mathrm{rn}_{\mathrm{bf16}}\Big(\textstyle\sum_{\kappa} s_{\lfloor n/128 \rfloor,\kappa} \sum_{k \in \kappa} \mathrm{e4m3}(W^{\mathrm{gate}}_{nk})\, x_{t(\pi),k}\Big), \quad u_{\pi,n} \text{ likewise} \\ h_{\pi} &= \operatorname{silu}(g_{\pi}) \odot u_{\pi}, \qquad h^{\mathrm{hi}}_{\pi} = \mathrm{rn}_{\mathrm{bf16}}(h_{\pi}), \qquad h^{\mathrm{lo}}_{\pi} = \mathrm{rn}_{\mathrm{bf16}}\big(h_{\pi} - h^{\mathrm{hi}}_{\pi}\big) \\ y_{\pi,n} &= \mathrm{rn}_{\mathrm{bf16}}\Big(\textstyle\sum_{\kappa} s_{\lfloor n/128 \rfloor,\kappa} \sum_{k \in \kappa} \mathrm{e4m3}(W^{\mathrm{down}}_{nk})\,\big(h^{\mathrm{hi}}_{\pi,k} + h^{\mathrm{lo}}_{\pi,k}\big)\Big) \\ &\text{where } W = W_{e(\pi)} \text{ with block scales } s,\ t(\pi) \text{ is the token of sorted position } \pi,\ \kappa \text{ runs over 128-wide K blocks} \end{aligned}''',
  '''\begin{aligned} &\text{NVFP4 (W4A16), BF16 (W16A16):} \\ g_{\pi,n} &= \mathrm{rn}_{\mathrm{bf16}}\Big(s_2 \textstyle\sum_{k} q_{nk}\, d_{n,\lfloor k/16 \rfloor}\, x_{t(\pi),k}\Big), \qquad y_{\pi,n} = \mathrm{rn}_{\mathrm{bf16}}\Big(s_2 \textstyle\sum_{k} q_{nk}\, d_{n,\lfloor k/16 \rfloor}\,\big(h^{\mathrm{hi}}_{\pi,k} + h^{\mathrm{lo}}_{\pi,k}\big)\Big) \\ &\text{with } q = \mathrm{e2m1}(W),\ d = \mathrm{e4m3}(\text{block scale}); \text{ for BF16 weights } q_{nk} d_{n,\lfloor k/16 \rfloor} s_2 \to W_{nk} \end{aligned}''',
  '''\begin{aligned} &\text{FP8 W8A8:} \quad a_{t,\kappa} = \max\Big(\tfrac{\max_{k \in \kappa} |x_{t,k}|}{448},\, 10^{-12}\Big), \qquad \bar x_{t,k} = \mathrm{sat}_{\mathrm{e4m3}}\big(\mathrm{rn}(x_{t,k} / a_{t,\kappa})\big) \\ g_{\pi,n} &= \mathrm{rn}_{\mathrm{bf16}}\Big(\textstyle\sum_{\kappa} s_{\lfloor n/128 \rfloor,\kappa}\, a_{t(\pi),\kappa} \sum_{k \in \kappa} \mathrm{e4m3}(W^{\mathrm{gate}}_{nk})\, \bar x_{t(\pi),k}\Big), \quad u_{\pi,n} \text{ likewise} \\ h_{\pi} &= \operatorname{silu}(g_{\pi}) \odot u_{\pi}, \qquad b_{\pi,\kappa} = \max\Big(\tfrac{\max_{j \in \kappa} |h_{\pi,j}|}{448},\, 10^{-12}\Big), \qquad \bar h_{\pi,j} = \mathrm{sat}_{\mathrm{e4m3}}\big(\mathrm{rn}(h_{\pi,j} / b_{\pi,\kappa})\big) \\ y_{\pi,n} &= \mathrm{rn}_{\mathrm{bf16}}\Big(\textstyle\sum_{\kappa} s_{\lfloor n/128 \rfloor,\kappa}\, b_{\pi,\kappa} \sum_{j \in \kappa} \mathrm{e4m3}(W^{\mathrm{down}}_{nj})\, \bar h_{\pi,j}\Big) \end{aligned}''',
]
