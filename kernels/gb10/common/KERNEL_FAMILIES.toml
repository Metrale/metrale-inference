# 2026-09-30: The carried-state GDN verify (qwen3_ssm/carry.rs): the conv and the WY over a run
# of sequences with their pending rows folded in, and the folds a declining run runs first.
[[family]]
id = "gdn_carry_verify"
description = "Carried-state batched GDN verify: conv, WY (eager and lazy) and the pending-row folds"
explain.about = '''A carried-state form of the batched Gated DeltaNet verify that avoids writing the state on every verify. The stored state of a sequence lags it by $p$ accepted rows held in a per-slot stash (at most 8 rows of $u$, clamped $\bar\alpha$ and $k$); a verify kernel first folds those rows into its copy of the state with the decode update, in row order, then runs the WY chain of gdn_recurrence for its $K = 2, 3, 4$ rows and stashes them behind the pending ones. The eager kernels (gdn_carry_wy2/3/4) write the folded state back on every verify and fold at most four rows; the lazy kernels (_lazy) write back only when $p + K$ would exceed the stash capacity and keep half the column in registers between the two passes. gdn_carry_conv applies the same scheme to the conv window (folding stashed inputs, then conv plus SiLU plus L2 norm per position), and gdn_carry_flush and gdn_carry_conv_flush fold the pending rows without a verify. Grid (value heads, sequences) with 128 threads for the WY kernels, $d_k = d_v = 128$.'''
explain.numerics = '''All state, stash and arithmetic FP32 with the parents' expressions and accumulation order (column dot products in groups of four rows, Gram entries by separate 128-thread block reductions, read-out scale rsqrtf of the runtime $d_k$), so outputs and states are bitwise those of the uncarried kernels; q, k, v are BF16 widened exactly and outputs are rounded to BF16 (RNE). The conv stash holds the BF16 inputs; conv numerics are those of causal_conv1d_l2norm with no bias. No state-norm clamp.'''
explain.math = [
  '''\text{fold: } S \leftarrow \bar\alpha_r\, S + k_r\, u_r^\top, \quad r = 1, \dots, p \quad \text{(stashed } \bar\alpha_r, k_r, u_r\text{)}''',
  '''\begin{aligned} c_t &= \Big(\prod_{l=1}^{t-1} \bar\alpha_l\Big) S_0^\top k_t + \sum_{j=1}^{t-1} \Big(\prod_{l=j+1}^{t-1} \bar\alpha_l\Big) \langle k_t, k_j\rangle\, u_j \\ u_t &= \beta_t\,\big(v_t - \bar\alpha_t\, c_t\big), \qquad \bar\alpha_t = \min\!\big(\max(\alpha_t, 10^{-6}),\, 1 - 10^{-6}\big) \\ S_t &= \bar\alpha_t S_{t-1} + k_t u_t^\top, \qquad o_t = \mathrm{rn}_{\mathrm{bf16}}\big(S_t^\top q_t / \sqrt{d_k}\big), \qquad t = 1, \dots, K \end{aligned}''',
  '''\text{where } S_0 \text{ is the folded state; the verify writes no } S_t \text{ and stashes } (\bar\alpha_t, k_t, u_t)_{t=1}^{K}''',
]
compute = "cuda_core"
kernels = [
  "gated_delta_rule_carry::gdn_carry_conv", "gated_delta_rule_carry::gdn_carry_wy2",
  "gated_delta_rule_carry::gdn_carry_wy3", "gated_delta_rule_carry::gdn_carry_wy4",
  "gated_delta_rule_carry::gdn_carry_wy2_lazy", "gated_delta_rule_carry::gdn_carry_wy3_lazy",
  "gated_delta_rule_carry::gdn_carry_wy4_lazy", "gated_delta_rule_carry::gdn_carry_flush",
  "gated_delta_rule_carry::gdn_carry_conv_flush",
]
