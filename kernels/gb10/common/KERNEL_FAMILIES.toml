# 2026-10-08: The KDA output norm: RMSNorm over each head of the FP32 core, times the BF16 weight,
# times sigmoid of the BF16 gate, BF16 out (kda_layer_ops.cu:40-63). One block per (row, head).
[[family]]
id = "kda_o_norm"
description = "KDA output norm: per-head RMSNorm gated by a sigmoid"
explain.about = '''The KDA output norm: an RMS norm over each head of the FP32 recurrence output, multiplied by the norm weight and by a sigmoid of the BF16 output gate (Gated DeltaNet uses SiLU here). One block per (row, head) of $D = 128$ threads; the sum of squares is a two-level warp shuffle reduction.'''
explain.numerics = '''FP32 input; BF16 gate and weight widened exactly; sum of squares in FP32 by a shuffle-down tree then a second warp reduction; scale rsqrtf(mean + eps); sigmoid via __expf; one BF16 (RNE) rounding at the store.'''
explain.math = [
  '''y_i = \mathrm{rn}_{\mathrm{bf16}}\Big(\frac{o_i}{\sqrt{\frac{1}{D}\sum_{j=1}^{D} o_j^2 + \epsilon}}\, \gamma_i\, \sigma(z_i)\Big)''',
  '''\text{where } o \in \mathbb{R}^{D} \text{ is one head of the recurrence output},\ \gamma \text{ the norm weight and } z \text{ the output gate}''',
]
compute = "memory"
kernels = ["kda_layer_ops::kda_o_norm_gated_bf16"]
rows = [1, 65536]
pipeline.gated_rms_norm = { in = ["f32", "bf16"], compute = "f32", out = ["bf16"] }
op = [{ op = "gated_rms_norm" }]
