# 2026-09-29: The common gated norms normalise first and gate after, over the whole row (the
# group_size argument is unused, rms_norm.cu:1013). The gate-first, per-group norm Mamba2 needs
# (y = rmsnorm_group(x * silu(z))) exists only in two model shadows of rms_norm.cu.
[[family]]
id = "gated_rms_norm"
description = "Gated RMSNorm: rmsnorm(x) * silu(z) (GDN output norm)"
explain.about = '''Gated RMSNorm, the output norm of a gated delta-net (linear-attention) layer: each head row $x \in \mathbb{R}^{d}$ is normalised and multiplied by the plain norm weight and by $\operatorname{silu}$ of a gate row $z$. One block per row; the sum of squares is reduced by warp shuffles and shared memory. gated_rms_norm_f32_input reads an FP32 input with one row per block and gate rows a fixed stride apart, gated_rms_norm_f32_input_strided does the same over a (head, sequence) grid with separate sequence strides, and gated_rms_norm_prefill reads BF16 input over a (head, token) grid and keeps each thread's elements in registers between the two passes. These implement the norm_first point; the gate_first point (per-model copies) applies the gate first and normalises each group of $g$ channels separately.'''
explain.numerics = '''The input is read as FP32 (or BF16 widened exactly in the prefill kernel), the gate and weight as BF16; the sum of squares is accumulated and reduced in FP32, the root uses rsqrtf, $\operatorname{silu}(z) = z/(1+e^{-z})$ uses the accurate expf (the fast __expf in the gate_first copies), the product $x\,r\,\gamma\,\operatorname{silu}(z)$ is formed in FP32 left to right, and one RNE rounding to BF16 happens at the store.'''
explain.math = [
  '''\begin{aligned} r &= \Bigl(\frac{1}{d}\sum_{j=1}^{d} x_j^2 + \epsilon\Bigr)^{-1/2} \\ y_i &= \mathrm{rn}_{\mathrm{bf16}}\bigl(x_i\, r\, \gamma_i \operatorname{silu}(z_i)\bigr), \qquad \operatorname{silu}(z) = \frac{z}{1+e^{-z}} \end{aligned}''',
  '''\begin{aligned} u_i &= x_i \operatorname{silu}(z_i), \qquad r_G = \Bigl(\frac{1}{g}\sum_{j \in G} u_j^2 + \epsilon\Bigr)^{-1/2} \\ y_i &= \mathrm{rn}_{\mathrm{bf16}}\bigl(u_i\, r_{G(i)}\, \gamma_i\bigr) \qquad \text{(gate\_first: } G(i) \text{ is the group of } g \text{ channels holding } i \text{)} \end{aligned}''',
]
compute = "memory"
# 2026-09-30: `_strided` is the one-launch multi-sequence twin (the batched GDN arm).
kernels = [
  "norm::gated_rms_norm_f32_input", "norm::gated_rms_norm_prefill",
  "norm::gated_rms_norm_f32_input_strided",
]
