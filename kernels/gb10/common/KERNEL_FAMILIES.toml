# 2026-09-29: Projections (GEMV / GEMM). Single-format kernels constrain the op's formats; the WxAy engine
# takes the formats as policies.

[[family]]
id = "dense_bf16"
description = "BF16 GEMV (1 row), batched GEMV (M <= 16 per block row) and GEMM (any M)"
explain.about = '''Dense BF16 projection on CUDA cores, $y_{tn}=\sum_k W_{nk}x_{tk}$ for $t<m$ rows, with $W\in\mathbb{R}^{N\times K}$ row-major. The one-row GEMV dense_gemv_bf16 gives every output 64 threads (two warps) and packs four outputs into a 256-thread block; each thread walks K in 8-element vectors $v = l, l+64, \dots$, the warps reduce by shuffle and the two warp partials are added. The batched GEMVs (dense_gemv_bf16_batchm for up to 16 rows per block row with the rows staged in shared memory, its unrolled _wide entries for 9 to 16 rows, and dense_gemv_bf16_batchm_few for 2 to 8 rows with up to eight K slabs of weight loads in flight, the _pair entry running two projections in one launch) read each weight vector once for all rows and repeat the one-row operation order, so every row is bit-identical to dense_gemv_bf16. For larger M, dense_gemm_bf16 is a 16 x 16 shared-memory tile with one thread per output and dense_gemm_bf16_router a 16 x 64 register-blocked tile (four columns per thread) used for the MoE router; the fp32out and f32out variants store the FP32 sum without rounding.'''
explain.numerics = '''BF16 weights and activations are widened exactly to FP32 and multiplied and added as separate correctly rounded FP32 operations (the build disables FMA contraction), in the fixed order shown; the only narrowing is one round-to-nearest-even to BF16 at the store, which the FP32-output variants skip.'''
explain.math = [
  '''\begin{aligned} y_{tn} &= \mathrm{rn}_{\mathrm{bf16}}\big(P^{(0)}_{tn} + P^{(1)}_{tn}\big), \qquad P^{(w)}_{tn} = \sum_{l=32w}^{32w+31}\;\sum_{v \equiv l \pmod{64}}\;\sum_{i=0}^{7} x_{t,8v+i}\,W_{n,8v+i} \quad \text{(GEMV)} \\ y_{tn} &= \mathrm{rn}_{\mathrm{bf16}}\Big(\sum_{k=0}^{K-1} x_{tk}\,W_{nk}\Big) \quad \text{(tiled GEMM, sequential in } k\text{)} \end{aligned}''',
]
# 2026-10-02: Every kernel here is CUDA-core FMA: the GEMM and the router GEMM tile in shared
# memory with FP32 accumulators (dense_gemm_bf16.cu); the file's mma.sync path is
# `dense_gemm_bf16_pipelined`, which this family does not list.
compute = "cuda_core"
kernels = [
  "gemv::dense_gemv_bf16", "dense_gemv_bf16_batchm::dense_gemv_bf16_batchm",
  "gemm::dense_gemm_bf16", "gemm::dense_gemm_bf16_router",
  "gemv::dense_gemv_bf16_fp32out", "gemm::dense_gemm_bf16_f32out",
  "dense_gemv_bf16_batchm_few::dense_gemv_bf16_batchm_few",
  "dense_gemv_bf16_batchm_few::dense_gemv_bf16_batchm_few_fp32out",
  "dense_gemv_bf16_batchm_few::dense_gemv_bf16_batchm_few_fp32out_pair",
  "glm5next_router_gemv::glm5next_router_gemv_npb1",
  "dense_gemv_bf16_batchm::dense_gemv_bf16_batchm_wide",
  "dense_gemv_bf16_batchm::dense_gemv_bf16_batchm_wide_fp32out",
]
rows = [1, 65536]
# 2026-10-02: Every kernel widens BF16 exactly and sums in FP32 (no 16-bit partials), one BF16
# rounding; the router GEMV and GEMM write BF16 logits (dense_gemv_bf16.cu:105,
# dense_gemm_bf16.cu:281). 2026-10-08: The `fp32out` / `f32out` twins write the FP32 sums
# unrounded (dense_gemv_bf16.cu:120, dense_gemm_bf16.cu:85): the GLM-5 router logits and DSA
