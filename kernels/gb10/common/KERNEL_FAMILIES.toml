[[family]]
id = "moe_nvfp4_grouped"
description = "NVFP4 W4A16 grouped experts + NVFP4 shared expert on CUDA cores, 4 rows per pass"
explain.about = '''Grouped decode for $m$ rows (up to 64) with NVFP4 routed and shared experts (W4A16) on CUDA cores. Rows are sorted by expert; each block row serves one active expert and reads each weight row once per pass of up to 4 rows, and the first block rows serve the shared expert over all tokens. moe_nvfp4_grouped::moe_expert_gate_up_act_nvfp4_grouped (128 threads, two column pairs of gate and up per warp, 32 K elements per lane step loaded one step ahead) writes the FP32 SiLU product per sorted position; moe_expert_down_act_nvfp4_grouped (256 threads, 4 columns per warp in 4 column groups, one 16-element scale block per lane step) writes the BF16 down output per sorted position. A row result is the same at every row count and pass.'''
explain.numerics = '''E2M1 values are decoded through a 16-entry shared-memory table; each 16-element block is summed against the BF16 activations (widened exactly to FP32) in fixed groups of four products, then multiplied once by its dequant scale $\mathrm{e4m3}(d)\,s_2$ in FP32 and accumulated, and the warp reduces with a fixed shuffle tree. Gate and up are rounded to BF16 (RNE) before the FP32 SiLU product (fast exponential), which the down kernel reads as FP32; the down output is rounded once to BF16.'''
explain.math = [
  '''\begin{aligned} [\hat W v]_n &= \textstyle\sum_{\beta} \big(\mathrm{e4m3}(d_{n\beta})\, s_2\big) \sum_{k \in \beta} \mathrm{e2m1}(q_{nk})\, v_k, \qquad \beta = \text{blocks of 16 along } K \\ g_{\pi} &= \mathrm{rn}_{\mathrm{bf16}}\big(\hat W^{\mathrm{gate}}_{e(\pi)} x_{t(\pi)}\big), \qquad u_{\pi} = \mathrm{rn}_{\mathrm{bf16}}\big(\hat W^{\mathrm{up}}_{e(\pi)} x_{t(\pi)}\big) \\ y_{\pi} &= \mathrm{rn}_{\mathrm{bf16}}\Big(\hat W^{\mathrm{down}}_{e(\pi)} \big(\operatorname{silu}(g_{\pi}) \odot u_{\pi}\big)\Big) \end{aligned}''',
]
compute = "cuda_core"
kernels = [
  "moe_nvfp4_grouped::moe_expert_gate_up_act_nvfp4_grouped",
  "moe_nvfp4_grouped::moe_expert_down_act_nvfp4_grouped",
]
rows = [1, 64]
# 2026-10-02: E2M1 through a table, E4M3 x global on each 16-value FP32 block sum
# (moe_nvfp4_grouped.cu:197-212); gate|up rounded to BF16 before the SiLU, the FP32 product written
# and read at FP32 by the down kernel (:233-383). ReLU² and the ungated shared up are
# parameterization targets.
pipeline.expert_gate_up = { in = ["bf16", "i32"], gather = "bf16", act = "bf16", weight = "nvfp4/g16->bf16", mma = "bf16*bf16", accumulate = "f32", scale = "f32", out = ["bf16"] }
pipeline.expert_down = { in = ["f32", "i32"], act = "f32", weight = "nvfp4/g16->f32", mma = "f32*f32", accumulate = "f32", scale = "f32", out = ["bf16"] }
pipeline.silu_mul = { in = ["bf16"], compute = "f32", out = ["f32"] }
pipeline.relu2 = "uninstantiated"
pipeline."linear:shared_gate_up" = { in = ["bf16"], act = "bf16", weight = "nvfp4/g16->bf16", mma = "bf16*bf16", accumulate = "f32", scale = "f32", out = ["bf16"] }
pipeline."linear:shared_down" = { in = ["f32"], act = "f32", weight = "nvfp4/g16->f32", mma = "f32*f32", accumulate = "f32", scale = "f32", out = ["bf16"] }
pipeline."linear:shared_up" = "uninstantiated"
op = [
  { op = "expert_gate_up", weight = ["nvfp4/g16"] }, { op = "expert_down", weight = ["nvfp4/g16"] },
  { op = "silu_mul" }, { op = "relu2" },
