# 2026-10-23: The one-shot all-reduce's sum: each element of the ranks' partials added in rank order
# into an FP32 accumulator from +0, rounded once to BF16 (crates/comm/src/nccl_backend/sendrecv.rs:
# 178-221 launches it after the exchange).
[[family]]
id = "tp_rank_sum"
description = "Rank-order FP32 sum of the TP ranks' BF16 partials after the one-shot exchange"
explain.about = '''The reduce step of the one-shot all-reduce that sums tensor-parallel partial outputs over $n \ge 2$ ranks. After the exchange every rank holds its own BF16 partial and the other ranks' partials in peer slots; one thread per element sums all $n$ partials in rank order $0,\dots,n-1$ and rounds once, so every rank writes the same bytes. The family's all-gather (the vocabulary-sharded head's logits) is the collective's byte copy of each rank's BF16 slice into its rank-order place, with no arithmetic.'''
explain.numerics = '''Each BF16 partial is widened exactly to FP32 and added in rank order as separate correctly rounded FP32 additions starting from 0, then rounded once to BF16 (round to nearest even). The order is fixed by rank, not by arrival, so the result is identical on every rank; with two ranks the bytes equal a single BF16 add except for the sign of $(-0) + (-0)$. The all-gather moves bytes unchanged.'''
explain.math = [
  '''y_i = \mathrm{rn}_{\mathrm{bf16}}\Big(\big(\cdots\big((0 + p^{(0)}_i) + p^{(1)}_i\big) + \cdots\big) + p^{(n-1)}_i\Big)''',
  '''g = \big[\, x^{(0)} \;\big\|\; x^{(1)} \;\big\|\; \cdots \;\big\|\; x^{(n-1)} \,\big] \quad \text{(all-gather, bytes unchanged)}''',
  '''\text{where } p^{(r)} \text{ is rank } r\text{'s BF16 partial and } x^{(r)} \text{ its slice of the gathered tensor}''',
]
compute = "memory"
kernels = ["bf16_add::bf16_add_rank_sum"]
rows = [1, 65536]
pipeline.all_reduce = { in = ["bf16"], reduce = "f32", out = ["bf16"] }
pipeline.all_gather = { in = ["bf16"], move = "bf16", out = ["bf16"] }
op = [{ op = "all_reduce" }, { op = "all_gather" }]
[[family.point]]
values = {}
how = "instantiation"
files = ["kernels/gb10/common/bf16_add.cu"]

# 2026-10-23: The MTP head's eh_proj input written as two halves in place (embed_half,
# hidden_half), so the concat launches nothing.
[[family]]
id = "concat_in_place"
description = "A feature-dim concat the producers write in place (no kernel)"
explain.about = '''No kernel launches in this family. The GLM-5.3 MTP draft layer's projection input is the concatenation of the normalised token embedding and the normalised target hidden state, $[\,e \,\|\, h\,] \in \mathbb{R}^{2d}$. Each producer writes its half directly into its place in one $2d$-wide buffer, the embedding half in columns $0,\dots,d-1$ and the hidden half in columns $d,\dots,2d-1$, so the concat costs nothing beyond those writes.'''
explain.numerics = '''No arithmetic: the two BF16 halves are written by their producers and read as one row, byte for byte.'''
explain.math = [
  '''c_t = \big[\, e_t \;\big\|\; h_t \,\big] \in \mathbb{R}^{2d}, \qquad c_{t,j} = e_{t,j}, \quad c_{t,d+j} = h_{t,j}, \qquad 0 \le j < d''',
]
compute = "memory"
emitters = ["glm_mtp_halves"]
rows = [1, 65536]
pipeline.concat = { in = ["bf16", "bf16"], move = "bf16", out = ["bf16"] }
op = [{ op = "concat" }]
