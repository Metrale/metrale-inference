# 2026-10-07: Experimental native packaging; served only under --experimental-gpt-oss, numerical qualification remains open.
[model]
name = "gpt-oss-20b"
hf_id = "openai/gpt-oss-20b"
architecture = "GPT-OSS alternating full/sliding attention with interleaved MXFP4 experts"
supported_quants = ["mxfp4"]
