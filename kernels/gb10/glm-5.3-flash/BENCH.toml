# 2026-10-15: Gate benchmarks for GLM-5.3-Flash on GB10 (three nodes, tensor parallel 3), and the
# bounds their records must meet.
#
# Owner: gb10 kernels.
# Read by gate::bench (crates/bench/src/gate/bench.rs) and scripts/check_bench_threshold_prose.py.
#
# Invariants:
# - A [benchmarks.*] sub-table belongs to the [[benchmarks]] entry above it.
# - Every entry is its own gate id (crates/bench/src/benchmarks/ttft/glm.rs and the
#   agentic-webserver-glm and concurrency-sweep-glm descriptors), so GLM's bounds and
#   baselines never share an id with another model's.
# - Every bound is a regression ratchet from measured cells: the median of three reps on one
#   boot plus the measured noise. No entry names a recipe yet: the GLM recipe is not on main,
#   so a --pull-request-gate self-start refuses these entries until it lands.
# - `targets` carries the vLLM reference per metric; no verdict reads it.
# - `target_caveats` flags a target that is not a clean bar, pointing at the entry's note; no
#   verdict reads it either.
# - Cells not measured are not here: the 128k context, the 256k agentic tier and the 64k
#   agentic tier. The one unmeasured entry, concurrency-sweep-glm (2026-10-16), has no bounds:
#   it carries the gate definition and its vLLM targets until a measured ladder cuts them.

[[benchmarks]]
quant = "nvfp4"
checkpoint = "nvidia/GLM-5.3-Flash-NVFP4"
gate = "ttft-cold-glm-64k"
label = "GLM-5.3-Flash, 64k context"
default = true
status = "measured"
note = """\
Uncached prefill TTFT over the synthetic 256, 1024 and 4096-token prompts, one median per \
length. Measured on one boot per context length, n=3 reps per cell (separate invocations, \
each with its own warm-up), binary sha256 prefix a96c8bac54bfb4d0 (engine e8fd77cef, the \
nearest measured build to the one the GLM recipe of PR #161 pins), serve env sha256 prefix \
c3d2e963efa6. Each ceiling is a regression ratchet: the median of the three reps plus their \
range. The targets field holds the vLLM client p50 (n=5) on the same prompts, so a known loss \
to vLLM is on the page without failing the gate.\
"""
# 2026-10-15: The vLLM client p50 per metric (n=5, same prompts); no verdict reads it.
targets = { median_ms_256 = 488.0, median_ms_1024 = 679.0, median_ms_4096 = 1705.0 }

[benchmarks.serve_overrides]
# 2026-10-15: The context length this gate id names.
max_model_len = "65536"

[benchmarks.param_overrides]
# 2026-10-15: Three samples per length, the n behind each ceiling.
repeats = "3"

[benchmarks.metrics.median_ms_256]
# 2026-10-15: The ceiling of 449.0. Three reps on one boot read 404.2 / 420.7 / 432.5 ms
# (median 420.7); the noise added is their range, 28.3 ms.
max = 449.0

[benchmarks.metrics.median_ms_1024]
# 2026-10-15: The ceiling of 684.9. Three reps on one boot read 677.2 / 659.5 / 667.2 ms
# (median 667.2); the noise added is their range, 17.7 ms.
max = 684.9

[benchmarks.metrics.median_ms_4096]
# 2026-10-15: The ceiling of 1608.1. Three reps on one boot read 1578.6 / 1587.2 / 1599.5 ms
# (median 1587.2); the noise added is their range, 20.9 ms.
max = 1608.1

