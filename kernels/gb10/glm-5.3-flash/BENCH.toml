# 0.117 s spread across four same-day tiers. Under --pull-request-gate this max is passed to the
# driver as s_per_turn_budget.
max = 4.274

[benchmarks.metrics.sum_wall_s]
# 2026-10-15: The ceiling of 437.74. The tier read 425.14 s; the noise added is the 12.6 s
# spread across four same-day tiers. Under --pull-request-gate this max is passed to the driver
# as wall_budget_s.
max = 437.74

[benchmarks.metrics.sum_turns]
# 2026-10-15: The ceiling of 100. Every measured tier of this model took 100 turns, so there is
# no measured noise to add; an agent that needs more turns for the same ten tasks fails here.
max = 100.0

[[benchmarks]]
quant = "nvfp4"
checkpoint = "nvidia/GLM-5.3-Flash-NVFP4"
gate = "concurrency-sweep-glm"
label = "GLM-5.3-Flash decode ladder, 64k context"
default = true
status = "unmeasured"
note = """\
The decode ladder on GLM-5.3-Flash: aggregate tok/s at C=1, 2, 4, 8, 12 and 16 on the \
published instrument (ISL 128, OSL 1024, the essay request), served at 64k context with MTP \
as the GLM recipe of PR #161 sets it. UNMEASURED: no ladder of a current build exists, so \
the entry carries no bounds and baseline_for drops it from enforcement. Its floors come only \
from a measured run (two or more reps on one build, the noise measured), never from an older \
build's ladder. The targets field holds the vLLM reference per rung; no verdict reads it. \
J/tok is not a target: the vLLM run summed energy over three hosts, which no local rail \
reading matches. The C=16 target, 115.73, is a single sample of that run and most likely a \
stalled vLLM rep. vLLM's own three-rep ladder of the same build, run on a different instrument, \
read that rung as 159.1, 101.0 and 158.5 tok/s: one rep in three stalls. Those reps come from \
another instrument, are not comparable with this one and are not a target. A win at C=16 against \
115.73 is not a clean win. Against a non-stalled vLLM C=16 (~159 tok/s), the internal target is \
>= 164 tok/s (+3%).\
"""
# 2026-10-16: The vLLM aggregate tok/s per rung on the same instrument (ISL 128, OSL 1024,
# essay request, one warm-up, one sample per rung; vLLM 0.30.1rc1.dev193+gddd6fbca1, served
# at max_model_len 262144, fp8_e4m3 KV, prefix caching on, gpu util 0.88; recorded
# 2026-10-10T18:16:41Z). C=16 is a single sample of that run and most likely a stalled vLLM rep.
# vLLM's own three-rep ladder of the same build, run on a different instrument, read that rung
# as 159.1, 101.0 and 158.5 tok/s: one rep in three stalls. Those reps come from another
# instrument, are not comparable with this one and are not a target. A win at C=16 against 115.73
# is not a clean win. Against a non-stalled vLLM C=16 (~159 tok/s), the internal target is
# >= 164 tok/s (+3%).
targets = { c1_aggregate_tok_s = 40.11, c2_aggregate_tok_s = 62.24, c4_aggregate_tok_s = 83.42, c8_aggregate_tok_s = 114.56, c12_aggregate_tok_s = 131.74, c16_aggregate_tok_s = 115.73 }
# 2026-10-16: The C=16 target is flagged where it is published; the note above gives the account.
target_caveats = { c16_aggregate_tok_s = "likely vLLM stall" }

[benchmarks.serve_overrides]
# 2026-10-16: The context length the ladder is measured at.
max_model_len = "65536"

[benchmarks.param_overrides]
# 2026-10-16: The published instrument, as on concurrency-sweep-moe, with the C=12 rung.
concurrencies = "1,2,4,8,12,16"
isls = "128"
osl = "1024"
prompt_mode = "essay"
