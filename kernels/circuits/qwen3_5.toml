# SPDX-License-Identifier: MIT OR Apache-2.0
#
# 2026-09-28: The dense Qwen3.5-architecture circuit (Qwen3.8-27B, `qwen3_5_text`): GatedDeltaNet
# and full-attention blocks, a dense SwiGLU FFN on every layer, the final norm and lm_head,
# and the one-layer MTP draft head.
#
# Owner: metrale-circuit (crates/circuit/src/circuit_toml.rs is the schema).
# Invariants:
# - Every edge states its format and `rows x dim` shape. Linear inputs carry the format the
#   precision table says the projection reads; the loader refuses a mismatch.
# - The nodes of a block are in execution order. The layer stream threads through
#   `stream_in` / `stream_out`, so layer i's output edge is layer i+1's input edge.
# - `{L}` in a binding is the layer's module path (`layer_module` with `{i}` filled in, or
#   `draft_module` in the draft head).

schema = 1
arch = "qwen3_5"
description = "Dense hybrid: 3 GatedDeltaNet layers then 1 gated full-attention layer, SwiGLU FFN, MTP draft head"
layer_module = "model.language_model.layers.{i}"
draft_module = "mtp.layers.0"
dims = [
  "hidden", "inter", "vocab", "q_heads", "kv_heads", "head_dim",
  "lin_k_heads", "lin_k_dim", "lin_v_heads", "lin_v_dim",
]
prologue = ["embed"]
epilogue = ["head"]
draft = ["mtp_in", "attn", "dense_ffn", "mtp_out"]

[layout]
kind = "interval"
period = 4

[layout.blocks]
linear_attention = ["gdn", "dense_ffn"]
full_attention = ["attn", "dense_ffn"]

[block.embed]
stream_out = "h"

[[block.embed.node]]
id = "embed"
op = "embed"
out = [{ edge = "h", format = "bf16", shape = "n x hidden" }]
binding = ["model.language_model.embed_tokens"]

[block.gdn]
stream_in = "x"
stream_out = "y"

[[block.gdn.node]]
id = "input_norm"
op = "rms_norm"
in = ["x"]
out = [{ edge = "xn", format = "bf16", shape = "n x hidden" }]
binding = ["{L}.input_layernorm"]

[[block.gdn.node]]
id = "qkvz"
op = "linear"
role = "qkvz"
in = ["xn"]
out = [{ edge = "qkvz", format = "bf16", shape = "n x lin_k_heads*lin_k_dim*2+lin_v_heads*lin_v_dim*2" }]
binding = ["{L}.linear_attn.in_proj_qkv", "{L}.linear_attn.in_proj_z"]

[[block.gdn.node]]
id = "ba"
op = "linear"
role = "ba"
in = ["xn"]
out = [{ edge = "ba", format = "bf16", shape = "n x lin_v_heads*2" }]
binding = ["{L}.linear_attn.in_proj_b", "{L}.linear_attn.in_proj_a"]

[[block.gdn.node]]
id = "gates"
op = "gdn_gates"
in = ["ba"]
out = [
  { edge = "decay", format = "f32", shape = "n x lin_v_heads" },
  { edge = "beta", format = "f32", shape = "n x lin_v_heads" },
]
binding = ["{L}.linear_attn.A_log", "{L}.linear_attn.dt_bias"]

[[block.gdn.node]]
id = "conv"
op = "conv1d_update"
in = ["qkvz"]
out = [{ edge = "conv", format = "f32", shape = "n x lin_k_heads*lin_k_dim*2+lin_v_heads*lin_v_dim" }]
binding = ["{L}.linear_attn.conv1d"]

[[block.gdn.node]]
id = "l2"
op = "l2_norm"
in = ["conv"]
out = [{ edge = "qkv", format = "f32", shape = "n x lin_k_heads*lin_k_dim*2+lin_v_heads*lin_v_dim" }]

[[block.gdn.node]]
id = "recur"
op = "gdn_recurrence"
in = ["qkv", "decay", "beta"]
out = [{ edge = "core", format = "f32", shape = "n x lin_v_heads*lin_v_dim" }]

[[block.gdn.node]]
id = "out_norm"
op = "gated_rms_norm"
in = ["core", "qkvz"]
out = [{ edge = "gated", format = "bf16", shape = "n x lin_v_heads*lin_v_dim" }]
binding = ["{L}.linear_attn.norm"]

[[block.gdn.node]]
id = "out"
op = "linear"
role = "gdn_out"
in = ["gated"]
out = [{ edge = "o", format = "bf16", shape = "n x hidden" }]
binding = ["{L}.linear_attn.out_proj"]

[[block.gdn.node]]
id = "add"
op = "residual_add"
in = ["x", "o"]
out = [{ edge = "y", format = "bf16", shape = "n x hidden" }]

[block.attn]
stream_in = "x"
stream_out = "y"

[[block.attn.node]]
id = "input_norm"
op = "rms_norm"
in = ["x"]
out = [{ edge = "xn", format = "bf16", shape = "n x hidden" }]
binding = ["{L}.input_layernorm"]

[[block.attn.node]]
id = "q"
op = "linear"
role = "q"
in = ["xn"]
out = [{ edge = "qg", format = "bf16", shape = "n x q_heads*head_dim*2" }]
binding = ["{L}.self_attn.q_proj"]

[[block.attn.node]]
id = "q_split"
op = "split"
in = ["qg"]
out = [
  { edge = "q", format = "bf16", shape = "n x q_heads*head_dim" },
  { edge = "gate", format = "bf16", shape = "n x q_heads*head_dim" },
]

[[block.attn.node]]
id = "k"
op = "linear"
role = "k"
in = ["xn"]
out = [{ edge = "k", format = "bf16", shape = "n x kv_heads*head_dim" }]
binding = ["{L}.self_attn.k_proj"]

[[block.attn.node]]
id = "v"
op = "linear"
role = "v"
in = ["xn"]
out = [{ edge = "v", format = "bf16", shape = "n x kv_heads*head_dim" }]
binding = ["{L}.self_attn.v_proj"]

[[block.attn.node]]
id = "q_norm"
op = "qk_norm"
in = ["q"]
out = [{ edge = "qn", format = "bf16", shape = "n x q_heads*head_dim" }]
binding = ["{L}.self_attn.q_norm"]

[[block.attn.node]]
id = "k_norm"
op = "qk_norm"
in = ["k"]
out = [{ edge = "kn", format = "bf16", shape = "n x kv_heads*head_dim" }]
binding = ["{L}.self_attn.k_norm"]

[[block.attn.node]]
id = "rope"
op = "rope"
in = ["qn", "kn"]
out = [
  { edge = "qr", format = "bf16", shape = "n x q_heads*head_dim" },
  { edge = "kr", format = "bf16", shape = "n x kv_heads*head_dim" },
]

[[block.attn.node]]
id = "kv_write"
op = "kv_write"
in = ["kr", "v"]
out = []

[[block.attn.node]]
id = "attend"
op = "paged_attention"
in = ["qr", "kr", "v"]
out = [{ edge = "a", format = "bf16", shape = "n x q_heads*head_dim" }]

[[block.attn.node]]
id = "gate_mul"
op = "sigmoid_gate_mul"
in = ["a", "gate"]
out = [{ edge = "ag", format = "bf16", shape = "n x q_heads*head_dim" }]

[[block.attn.node]]
id = "o"
op = "linear"
role = "o"
in = ["ag"]
out = [{ edge = "o", format = "bf16", shape = "n x hidden" }]
binding = ["{L}.self_attn.o_proj"]

[[block.attn.node]]
id = "add"
op = "residual_add"
in = ["x", "o"]
out = [{ edge = "y", format = "bf16", shape = "n x hidden" }]

[block.dense_ffn]
stream_in = "x"
stream_out = "y"

[[block.dense_ffn.node]]
id = "post_norm"
op = "rms_norm"
in = ["x"]
out = [{ edge = "xn", format = "bf16", shape = "n x hidden" }]
binding = ["{L}.post_attention_layernorm"]

[[block.dense_ffn.node]]
id = "gate_up"
op = "linear"
role = "gate_up"
in = ["xn"]
out = [{ edge = "gu", format = "bf16", shape = "n x inter*2" }]
binding = ["{L}.mlp.gate_proj", "{L}.mlp.up_proj"]

[[block.dense_ffn.node]]
id = "act"
op = "silu_mul"
in = ["gu"]
out = [{ edge = "act", format = "bf16", shape = "n x inter" }]

[[block.dense_ffn.node]]
id = "down"
op = "linear"
role = "down"
in = ["act"]
out = [{ edge = "d", format = "bf16", shape = "n x hidden" }]
binding = ["{L}.mlp.down_proj"]

[[block.dense_ffn.node]]
id = "add"
op = "residual_add"
in = ["x", "d"]
out = [{ edge = "y", format = "bf16", shape = "n x hidden" }]

[block.head]
stream_in = "x"
outputs = ["logits"]

[[block.head.node]]
id = "final_norm"
op = "final_norm"
in = ["x"]
out = [{ edge = "xn", format = "bf16", shape = "n x hidden" }]
binding = ["model.language_model.norm"]

[[block.head.node]]
id = "lm_head"
op = "lm_head"
in = ["xn"]
out = [{ edge = "logits", format = "bf16", shape = "n x vocab" }]
binding = ["lm_head"]

[block.mtp_in]
stream_in = "hidden"
stream_out = "h0"

[[block.mtp_in.node]]
id = "embed"
op = "embed"
out = [{ edge = "e", format = "bf16", shape = "n x hidden" }]
binding = ["model.language_model.embed_tokens"]

[[block.mtp_in.node]]
id = "embed_norm"
op = "rms_norm"
in = ["e"]
out = [{ edge = "en", format = "bf16", shape = "n x hidden" }]
binding = ["mtp.pre_fc_norm_embedding"]

[[block.mtp_in.node]]
id = "hidden_norm"
op = "rms_norm"
in = ["hidden"]
out = [{ edge = "hn", format = "bf16", shape = "n x hidden" }]
binding = ["mtp.pre_fc_norm_hidden"]

[[block.mtp_in.node]]
id = "concat"
op = "concat"
in = ["en", "hn"]
out = [{ edge = "cat", format = "bf16", shape = "n x hidden*2" }]

[[block.mtp_in.node]]
id = "fc"
op = "linear"
role = "mtp_fc"
in = ["cat"]
out = [{ edge = "h0", format = "bf16", shape = "n x hidden" }]
binding = ["mtp.fc"]

[block.mtp_out]
stream_in = "x"
outputs = ["token"]

[[block.mtp_out.node]]
id = "final_norm"
op = "final_norm"
in = ["x"]
out = [{ edge = "xn", format = "bf16", shape = "n x hidden" }]
binding = ["mtp.norm"]

[[block.mtp_out.node]]
id = "lm_head"
op = "lm_head"
in = ["xn"]
out = [{ edge = "logits", format = "bf16", shape = "n x vocab" }]
binding = ["mtp.lm_head"]

[[block.mtp_out.node]]
id = "argmax"
op = "argmax"
in = ["logits"]
out = [{ edge = "token", format = "i32", shape = "n x 1" }]
