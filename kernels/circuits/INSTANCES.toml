# 2026-10-10: lukealonso/MiniMax-M2.7-NVFP4 (`minimax_m2`) on the generic GQA + routed-MoE
# circuit (`gqa_moe`). The recipe serves it with expert parallelism over two GB10 nodes; the
# circuit is one replica's unsharded math and not an executor target (`golden = false`: no
# FUSIONS.toml rules cover its layer-wide Q/K norm; `met circuit venn` reads it).
# - Shape: config.json (verified 2026-10-10): `attn_type_list` (A = 1, full attention, on all 62
#   layers), hidden_size, vocab_size, num_attention_heads, num_key_value_heads, head_dim,
#   num_local_experts, num_experts_per_tok, intermediate_size (the experts' width); kernels/
#   circuits/gqa_moe.config.toml maps each.
# - Plans: decode and multi_seq only. No draft head: the checkpoint ships no MTP tensors (its
#   safetensors index stops at layer 61, read 2026-10-10) although config.json declares 3 MTP
#   modules, and the recipe runs without `--speculative`, so there are no verify or draft rows.
# - Precision: the declared tier (precision/minimax-m2.7-nvfp4-ep2.toml: W4A4 NVFP4 experts,
#   BF16 attention, router and head). The recipe pins `weight_quantization: nvfp4`, under which
#   the engine also requantizes the attention projections and the router to NVFP4 at load
#   (model-arch weight_loader/minimax.rs); an instance under that policy is not written here.
# - kv_cache_dtype: bf16, pinned by the recipe, and the checkpoint declares no KV scheme.
#   lm_head_dtype: bf16, the declared head (the precision table's tier).
# - row_tiers: by_rows, the default for a checkpoint that is not an FP8 MoE (ml/row_tiers.rs:64-78).
# - activation_quantization: adaptive, pinned by the recipe. The other settings are the flag
#   defaults cited for the entries above; this model has no recurrent layers that read the ssm_*
#   settings.
