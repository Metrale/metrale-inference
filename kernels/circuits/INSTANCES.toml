# 2026-09-28: The recipes that have a circuit, with the arch shape, precision table, policy and
# plan matrix each one is rendered and checked under (schema: crates/circuit/src/instances.rs).
#
# Owner: metrale-circuit.
# Invariants:
# - Every policy setting a FUSIONS.toml `when` reads is stated here; nothing falls back to an
#   engine default. Each value cites where the recipe or the engine sets it.
# - The shapes restate the checkpoints' config.json (verified 2026-09-28 against the local
#   snapshots); `met circuit show` re-checks them whenever the checkpoint is cached.
# - `multi_seq` rows are the padded batch ladder of `padded_batch_n`
#   (crates/model-engine/src/traits/model.rs:52-58); verify rows are K = 1 + drafts; draft rows
#   past 1 are the batched propose's widths (2026-09-30: the edges of its tensor-core tiers).
# - `golden = true` instances have every plan checked in under kernels/circuits/plans/.
# - `verify_batch` lists the batched MTP verify's row tables with a golden plan (crates/circuit
#   src/runs.rs); the executor serves a batched verify only to an instance that lists some.

schema = 1

# 2026-09-28: The dense agentic recipe (the decode-floor gate's default entry,
# kernels/gb10/qwen3.8-27b/BENCH.toml). Settings:
# - row_tiers: by_rows, the default for a dense checkpoint (ml/row_tiers.rs:64-78).
# - kv_cache_dtype, lm_head_dtype: bf16, pinned by the recipe.
# - ssm_h_dtype f32 and gdn_fused_norm off: flag defaults
#   (crates/server/src/cli/serve_args.rs:145-206).
# - ssm_batched_recurrent: on, kernels/gb10/HARDWARE.toml:122 (the default since #51). The
#   per-sequence fallback is the `gdn_state_slots_fragmented` runtime route of gb10's
#   FUSIONS.toml.
# - ssm_ba_gates_hopper: on, kernels/gb10/HARDWARE.toml:157.
# - gemv_sw: on unless METRALE_NO_GEMV_SW=1 (ml/ops/model_levers_resolve.rs:53).
# - w4a16_tc: on unless METRALE_NO_W4A16_TC (ml/ops/gemv_tc.rs:79-82).
# - decode_split_silu: on, kernels/gb10/HARDWARE.toml:168.
# - rms_norm_act_quant: off, the engine has no fused norm-quantize launch (2026-09-30).
# - activation_quantization: adaptive, today's per-row-count routing that FUSIONS.toml encodes;
#   every committed recipe pins it (--activation-quantization, crates/config/src/
#   activation_quantization.rs). The node pipelines' `act` requirement reads it (2026-10-02).
[[instance]]
recipe = "qwen3.8/qwen3.8-27b-nvfp4-unsloth"
checkpoint = "unsloth/Qwen3.8-27B-NVFP4"
arch = "qwen3_5"
target = "gb10/qwen3.8-27b/nvfp4"
golden = true
layer_kinds = "GGGA GGGA GGGA GGGA GGGA GGGA GGGA GGGA GGGA GGGA GGGA GGGA GGGA GGGA GGGA GGGA"
dims = { hidden = 5120, inter = 17408, vocab = 248320, q_heads = 24, kv_heads = 4, head_dim = 256, lin_k_heads = 16, lin_k_dim = 128, lin_v_heads = 48, lin_v_dim = 128, mtp = 1 }
plans = { decode = [1], multi_seq = [2, 4, 8, 12, 16, 24, 32, 48, 64, 96, 128], verify = [2, 3, 4], draft = [1, 2, 5, 8, 9, 16, 17, 32] }
verify_batch = ["2x2", "4x2", "3x3", "4x4", "2x8", "3x8", "4x8", "4x3 3x2 2x3", "4x2! 2x2", "4x8 2x24", "uncarried: 4x8! 2x8!", "uncarried: 4x8! 2x24!", "2x48", "4x32"]

# 2026-09-28: Formats from the engine's own policy (metrale_circuit::PolicyPrecision) over the
# checkpoint's declared plan (checkpoints/unsloth--Qwen3.8-27B-NVFP4.toml) at the tier the
# recipe's gates pin (kernels/gb10/qwen3.8-27b/BENCH.toml). The checkpoint declares FP8 W8A8
# for attention, the GDN projections, lm_head and the MLP of layers 56-63, and NVFP4 W4A4 for
# the other MLPs; under `nvfp4` all of them run NVFP4 weights with BF16 activations.
[instance.precision]
checkpoint_plan = "unsloth--Qwen3.8-27B-NVFP4"
tier = "nvfp4"
caps = []
engine = [
  { match = "lm_head", weight = "bf16", activation = "bf16", why = "--lm-head-dtype bf16, pinned by the recipe (the checkpoint declares an FP8 head)" },
  { match = "mtp.lm_head", weight = "nvfp4/g16", activation = "bf16", why = "the draft head's runtime NVFP4 copy of the BF16 lm_head (crates/model-engine/src/factory/lm_head_setup.rs:116-133)" },
  { match = "mtp.*", weight = "bf16", activation = "bf16", why = "--mtp-quantization bf16, pinned by the recipe" },
]

[instance.policy]
opt_in_levers = []
settings = { row_tiers = "by_rows", kv_cache_dtype = "bf16", lm_head_dtype = "bf16", ssm_h_dtype = "f32", ssm_batched_recurrent = "on", ssm_ba_gates_hopper = "on", gemv_sw = "on", w4a16_tc = "on", decode_split_silu = "on", rms_norm_act_quant = "off", activation_quantization = "adaptive" }

