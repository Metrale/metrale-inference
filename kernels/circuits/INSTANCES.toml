# precision, FP8 W8A8 attention, GDN projections and layers 56-63's MLP, and NVFP4 W4A4 for the
# other MLPs. Everything else is the instance above; `variant` names its golden plans.
[[instance]]
recipe = "qwen3.8/qwen3.8-27b-nvfp4-unsloth-declared"
