# 2026-10-22: The served GLM recipe, glm-5.3/glm-5.3-flash-nvfp4-tp3-512k (recipes/glm-5.3/): the
# instance below at the recipe's formats (`dense_quantization: w4a16`, `dsa_quantization: w8a8`,
# `weight_quantization: declared`; precision/glm-5.3-flash-nvfp4-tp3.toml). Listed first, so the
# checkpoint id resolves to it under `--precision recipe` (venn::repo::resolve takes the first
# match); `--precision declared` reads the checkpoint itself. Shape, plans and policy are the
# instance below's (the recipe's `kv_cache_dtype: fp8`). 2026-10-23: TP=3 is planned per rank
# (`[instance.parallel]` below). Not golden, not an executor target.
# - The glm_* settings are the recipe's `env:` levers that pick another kernel for a planned node
#   (kernels/gb10/common/FUSIONS.toml `when`): glm_mhc_fused (METRALE_GLM_MHC_FUSED=1),
#   glm_router_rows (METRALE_GLM_ROUTER_ROWS=1), glm_router_topk_rank (METRALE_GLM_ROUTER_TOPK_RANK=1),
#   glm_moe_combine_split (METRALE_GLM_MOE_COMBINE_SPLIT=1, 2026-10-23: the combine's grid),
#   glm_moe_w4a4_grouped (METRALE_GLM_MOE_W4A4_GROUPED=1) and glm_moe_expert_layout (the recipe's
#   `moe_expert_layout: tp`), glm_kda_row_reg, glm_kda_rows_reg, glm_kda_seq_rows (`decode`) and
#   glm_kda_verify_tokens (METRALE_GLM_KDA_ROW_REG, _ROWS_REG, _SEQ_ROWS, _VERIFY_TOKENS), glm_w4a16_gemv_seg,
#   glm_w4a16_gemv_rows (`2`) and glm_w4a16_seg (`fuse`) (METRALE_GLM_W4A16_GEMV_SEG, _GEMV_ROWS, _SEG),
#   glm_dsa_decode_hb (`8`), glm_dsa_verify_rows and glm_dsa_indexer_rows (METRALE_GLM_DSA_DECODE_HB,
#   _VERIFY_ROWS, _INDEXER_ROWS). Their code defaults are kernels/circuits/glm5_next.config.toml [policy].
# - 2026-10-23: glm_ar_fused_post (METRALE_GLM_AR_FUSED_POST=1) lowers each rank's mHC-site all-reduce
#   into glm5next_hc_post_rank_sum; screen_head (METRALE_SCREEN_HEAD, code default on:
#   crates/settings/src/groups/speculative.rs:129) lowers the verify head's vocab all-reduce into the
#   screened key exchange. Both read only by rules over a rank circuit's derived collectives.
# - 2026-10-23: glm_mtp_device_step (recipe :159 METRALE_GLM_MTP_DEVICE_STEP=1): a K=2 verify gathers
#   the device draft's embedding row (batched_embed). final_norm_vanilla: the arch config's value
#   (glm5_next ships plain RMSNorm weights), pinned like the other settings.
[[instance]]
recipe = "glm-5.3/glm-5.3-flash-nvfp4-tp3-512k"
checkpoint = "nvidia/GLM-5.3-Flash-NVFP4"
arch = "glm5_next"
precision = "glm-5.3-flash-nvfp4-tp3"
target = "gb10/glm-5.3-flash/nvfp4"
golden = false
layer_kinds = "GGGS GGGS GGGS GGGS GGGS GGGS GGGS GGGS GGGS GGGS GGGS G"
dims = { hidden = 4096, vocab = 154880, inter = 12288, first_dense = 3, hc = 4, lin_k_heads = 64, lin_k_dim = 128, lin_v_heads = 64, lin_v_dim = 128, conv_kernel = 4, q_heads = 64, q_lora = 1536, kv_lora = 512, mla_qk = 256, mla_v = 256, index_heads = 32, index_head_dim = 128, index_kpool = 4, index_topk = 2048, experts = 288, top_k = 8, moe_inter = 2048, shared_inter = 2048, mtp = 1 }
plans = { decode = [1], multi_seq = [2, 4, 8, 12, 16, 24, 32, 48, 64, 96, 128], verify = [2, 3, 4, 8], draft = [1] }

[instance.policy]
opt_in_levers = []
settings = { row_tiers = "by_rows", kv_cache_dtype = "fp8", lm_head_dtype = "bf16", ssm_h_dtype = "f32", ssm_batched_recurrent = "on", ssm_ba_gates_hopper = "on", gemv_sw = "on", w4a16_tc = "on", decode_split_silu = "on", rms_norm_act_quant = "off", activation_quantization = "adaptive", glm_mhc_fused = "on", glm_router_rows = "on", glm_router_topk_rank = "on", glm_moe_combine_split = "on", glm_moe_w4a4_grouped = "on", glm_moe_expert_layout = "tp", glm_kda_row_reg = "on", glm_kda_rows_reg = "on", glm_kda_seq_rows = "decode", glm_kda_verify_tokens = "on", glm_w4a16_gemv_seg = "on", glm_w4a16_gemv_rows = "2", glm_w4a16_seg = "fuse", glm_dsa_decode_hb = "8", glm_dsa_verify_rows = "on", glm_dsa_indexer_rows = "on", glm_ar_fused_post = "on", screen_head = "on", glm_mtp_device_step = "on", final_norm_vanilla = "on" }

# 2026-10-23: The recipe serves --tp-size 3 (one GB10 per rank) with every split part of the
