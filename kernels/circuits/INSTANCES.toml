# 2026-09-28: The recipes that have a circuit, with the arch shape, precision table, policy and
# plan matrix each one is rendered and checked under (schema: crates/circuit/src/instances.rs).
#
# Owner: metrale-circuit.
# Invariants:
# - Every policy setting a FUSIONS.toml `when` reads is stated here; nothing falls back to an
#   engine default. Each value cites where the recipe or the engine sets it.
# - The shapes restate the checkpoints' config.json (verified 2026-09-28 against the local
#   snapshots); `met circuit show` re-checks them whenever the checkpoint is cached.
# - `multi_seq` rows are the padded batch ladder of `padded_batch_n`
#   (crates/model-engine/src/traits/model.rs:52-58); verify rows are K = 1 + drafts.
# - `golden = true` instances have every plan checked in under kernels/circuits/plans/.

schema = 1

# 2026-09-28: The dense agentic recipe (the decode-floor gate's default entry,
# kernels/gb10/qwen3.8-27b/BENCH.toml). Settings:
# - row_tiers: by_rows, the default for a dense checkpoint (ml/row_tiers.rs:64-78).
# - kv_cache_dtype, lm_head_dtype: bf16, pinned by the recipe.
# - ssm_h_dtype f32 and gdn_fused_norm off: flag defaults
#   (crates/server/src/cli/serve_args.rs:145-206).
# - ssm_batched_recurrent: off, HARDWARE.toml:118 under the flag's `auto`.
# - gemv_sw: on unless METRALE_NO_GEMV_SW=1 (ml/ops/model_levers_resolve.rs:53).
# - w4a16_tc: on unless METRALE_NO_W4A16_TC (ml/ops/gemv_tc.rs:79-82).
# - decode_split_silu: on, HARDWARE.toml:164.
[[instance]]
recipe = "qwen3.8/qwen3.8-27b-nvfp4-unsloth"
checkpoint = "unsloth/Qwen3.8-27B-NVFP4"
arch = "qwen3_5"
precision = "qwen3.8-27b-nvfp4-unsloth"
target = "gb10/qwen3.8-27b/nvfp4"
golden = true
layer_kinds = "GGGA GGGA GGGA GGGA GGGA GGGA GGGA GGGA GGGA GGGA GGGA GGGA GGGA GGGA GGGA GGGA"
dims = { hidden = 5120, inter = 17408, vocab = 248320, q_heads = 24, kv_heads = 4, head_dim = 256, lin_k_heads = 16, lin_k_dim = 128, lin_v_heads = 48, lin_v_dim = 128 }
plans = { decode = [1], multi_seq = [2, 4, 8, 12, 16, 24, 32, 48, 64, 96, 128], verify = [2, 3, 4], draft = [1] }

[instance.policy]
opt_in_levers = []
settings = { row_tiers = "by_rows", kv_cache_dtype = "bf16", lm_head_dtype = "bf16", ssm_h_dtype = "f32", ssm_batched_recurrent = "off", gemv_sw = "on", w4a16_tc = "on", decode_split_silu = "on" }

# 2026-09-28: The MoE flagship recipe (the agentic-webserver gate's default entry,
# kernels/gb10/qwen3.6-35b-a3b/BENCH.toml). As above, except:
# - row_tiers: canonical, the default for an FP8 MoE checkpoint (ml/row_tiers.rs:64-78,
#   published at crates/server/src/main_modules/serve_load/model_setup.rs:282-290).
[[instance]]
recipe = "qwen3.6/qwen3.6-35b-a3b-fp8-bf16head"
checkpoint = "Qwen/Qwen3.6-35B-A3B-FP8"
arch = "qwen3_6_moe"
precision = "qwen3.6-35b-a3b-fp8-bf16head"
target = "gb10/qwen3.6-35b-a3b/nvfp4"
golden = true
layer_kinds = "GGGA GGGA GGGA GGGA GGGA GGGA GGGA GGGA GGGA GGGA"
dims = { hidden = 2048, vocab = 248320, q_heads = 16, kv_heads = 2, head_dim = 256, lin_k_heads = 16, lin_k_dim = 128, lin_v_heads = 32, lin_v_dim = 128, experts = 256, top_k = 8, moe_inter = 512, shared_inter = 512 }
plans = { decode = [1], multi_seq = [2, 4, 8, 12, 16, 24, 32, 48, 64, 96, 128], verify = [2, 3, 4], draft = [1] }

[instance.policy]
opt_in_levers = []
settings = { row_tiers = "canonical", kv_cache_dtype = "bf16", lm_head_dtype = "bf16", ssm_h_dtype = "f32", ssm_batched_recurrent = "off", gemv_sw = "on", w4a16_tc = "on", decode_split_silu = "on" }
