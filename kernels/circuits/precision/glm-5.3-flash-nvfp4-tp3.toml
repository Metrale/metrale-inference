activation = "bf16"

[[linear]]
match = "*.self_attn.k_proj"
weight = "nvfp4/g16"
activation = "bf16"

[[linear]]
match = "*.self_attn.v_proj"
weight = "nvfp4/g16"
activation = "bf16"

[[linear]]
match = "*.self_attn.f_a_proj"
weight = "nvfp4/g16"
activation = "bf16"

[[linear]]
match = "*.self_attn.b_proj"
weight = "nvfp4/g16"
activation = "bf16"

[[linear]]
match = "*.self_attn.g_a_proj"
weight = "nvfp4/g16"
