activation = "fp8/token"

[[linear]]
match = "model.language_model.layers.35.self_attn.o_proj"
weight = "fp8/channel"
activation = "fp8/token"

[[linear]]
match = "model.language_model.layers.39.self_attn.o_proj"
weight = "fp8/channel"
activation = "fp8/token"

[[linear]]
match = "model.language_model.layers.43.self_attn.o_proj"
weight = "fp8/channel"
activation = "fp8/token"

[[linear]]
match = "*.self_attn.q_proj"
