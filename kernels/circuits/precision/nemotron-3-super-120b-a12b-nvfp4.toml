# 2026-10-10: The formats each linear module of nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4 runs
# at under the declared tier: the checkpoint's own quantization (ModelOpt MIXED_PRECISION,
# config.json `quantization_config` = hf_quant_config.json `quantization`), module by module.
#
# Owner: metrale-circuit (schema: crates/circuit/src/precision.rs).
# Invariants:
# - First match wins; the last entry is the catch-all.
# - `quantized_layers` is per module: NVFP4 W4A4 (group 16) for every routed expert, FP8 W8A8
#   (static per-tensor scales) for most Mamba2 in_proj/out_proj, shared-expert projections and a
#   few latent projections and attention o_proj, and one NVFP4 shared-expert down_proj; a module it
#   does not list is BF16 (the exact exceptions are the per-layer entries below). The MTP layer,
#   the routers, lm_head and the other attention projections are BF16. The KV cache is FP8.
# - crates/circuit/tests/nemotron_h.rs checks every node against the checkpoint's declared plan.
# - The recipe pins `weight_quantization: nvfp4` and `activation_quantization: adaptive`; this
#   table is the declared tier (the engine default), the basis every model is compared on.

schema = 1
checkpoint = "nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4"
tier = "declared"

[[linear]]
match = "mtp.*"
weight = "bf16"
activation = "bf16"

[[linear]]
match = "backbone.layers.22.mixer.in_proj"
weight = "bf16"
activation = "bf16"

[[linear]]
match = "backbone.layers.24.mixer.in_proj"
weight = "bf16"
activation = "bf16"

