# 2026-10-08: The GLM-5 circuit (`glm5_next`, GLM-5.3-Flash): 45 layers, each a mixer site and an
# FFN site under manifold-constrained hyper-connections (mHC, `hc_mult` residual streams). The
# mixer is KDA (Kimi delta attention) on `linear_attention` layers and DSA (NoPE latent attention
# over the tokens a lightning indexer selects) on `deepseek_sparse_attention` layers; the FFN is a
# dense SwiGLU on the first `first_k_dense_replace` layers and a 288-expert top-8 MoE with one
# shared expert after. Then the streams' mean, the final norm and lm_head, and a one-layer MTP
# draft head (DSA + MoE on a plain residual).
#
# Owner: metrale-circuit (crates/circuit/src/circuit_toml.rs is the schema).
# Invariants:
# - Follows the reference modelling code (transformers 5.16 `modeling_glm5_next`): every RMSNorm
#   scales by its weight as stored (`weight_form = "plain"`); the embedding is broadcast into the
#   streams before layer 0 and the streams averaged before the final norm; each site is
#   hc_mix -> hc_pre -> norm -> sublayer -> hc_post, so no layer has a residual add.
# - The block templates are in blocks/glm5_next_{kda,dsa,ffn}.toml, split for length; their
#   headers state the math and the declared precision of each site.
# - The MTP head reads the final-normed hidden row (the reference's draft input) and binds
#   `layers.45`, the layer after the 45 text layers; a checkpoint with another layer count is
#   refused by its bindings, not silently mis-bound.
# - It is not an executor target: the engine runs GLM-5 through its own layer code
#   (crates/model-arch/src/glm5next_layer/), and FUSIONS.toml covers only part of it
#   (`golden = false` in INSTANCES.toml). `met circuit venn` and `met circuit plan` read it.

schema = 1
arch = "glm5_next"
description = "GLM-5 hybrid: KDA and DSA sparse latent attention under 4-stream hyper-connections, dense SwiGLU then 288-expert MoE, MTP draft head"
layer_module = "model.language_model.layers.{i}"
draft_module = "model.language_model.layers.45"
include = ["glm5_next_kda", "glm5_next_dsa", "glm5_next_ffn"]
dims = [
  "hidden", "vocab", "inter", "first_dense", "hc",
  "lin_k_heads", "lin_k_dim", "lin_v_heads", "lin_v_dim", "conv_kernel",
  "q_heads", "q_lora", "kv_lora", "mla_qk", "mla_v",
  "index_heads", "index_head_dim", "index_kpool", "index_topk",
  "experts", "top_k", "moe_inter", "shared_inter", "mtp",
]
prologue = ["embed"]
epilogue = ["head"]
draft = ["mtp_in", "mtp_dsa", "mtp_moe", "mtp_out"]
draft_when = "mtp"

[layout]
kind = "list"

[layout.blocks]
linear_attention = ["kda", "moe"]
deepseek_sparse_attention = ["dsa", "moe"]

# 2026-10-08: `first_k_dense_replace` (3): those layers run the dense SwiGLU, not the MoE. They
# are all KDA layers on GLM-5.3-Flash; a DSA layer inside the prefix is refused.
[layout.prefix]
count = "first_dense"
blocks = { linear_attention = ["kda", "mlp"] }

[block.embed]
stream_out = "streams"

# 2026-10-08: The speculative caches over tokens (crates/circuit/src/memory/caches.rs; as in
# blocks/qwen3_hybrid.toml): the prompt-lookup index (host), a token tree's mask, the drafted ids.
[[block.embed.state]]
id = "lookup_index"
kind = "prompt_lookup_index"
lifetime = "sequence"
format = "u64"
shape = "2"

[[block.embed.state]]
id = "tree_mask"
kind = "token_tree_mask"
lifetime = "verify"
format = "u8"
shape = "1"

[[block.embed.state]]
id = "draft_ids"
kind = "draft_tokens"
lifetime = "verify"
format = "i32"
shape = "1"

[[block.embed.node]]
id = "embed"
op = "embed"
out = [{ edge = "h", format = "bf16", shape = "n x hidden" }]
binding = ["model.language_model.embed_tokens"]

[[block.embed.node]]
id = "expand"
op = "hc_expand"
in = ["h"]
out = [{ edge = "streams", format = "bf16", shape = "n x hc*hidden" }]

[block.head]
stream_in = "x"
stream_out = "xn"
outputs = [{ edge = "logits", buffer = "logits" }, { edge = "token", buffer = "tokens" }]

[[block.head.node]]
id = "contract"
op = "hc_contract"
in = ["x"]
out = [{ edge = "h", format = "bf16", shape = "n x hidden" }]

[[block.head.node]]
id = "final_norm"
op = "final_norm"
in = ["h"]
out = [{ edge = "xn", format = "bf16", shape = "n x hidden" }]
binding = ["model.language_model.norm"]
params = { weight_form = "plain" }

[[block.head.node]]
id = "lm_head"
op = "lm_head"
in = ["xn"]
out = [{ edge = "logits", format = "bf16", shape = "n x vocab" }]
binding = ["lm_head"]

[[block.head.node]]
id = "argmax"
op = "argmax"
in = ["logits"]
out = [{ edge = "token", format = "i32", shape = "n x 1" }]

# 2026-10-08: MTP input: the embedding of the last token and the target's final-normed hidden
# row, each normalised, concatenated (embedding first) and projected (`eh_proj`).
[block.mtp_in]
stream_in = "hidden"
stream_out = "h0"
outputs = [{ edge = "e", buffer = "draft_embed" }]

[[block.mtp_in.node]]
id = "embed"
op = "embed"
out = [{ edge = "e", format = "bf16", shape = "n x hidden" }]
binding = ["model.language_model.embed_tokens"]

[[block.mtp_in.node]]
id = "embed_norm"
op = "rms_norm"
in = ["e"]
out = [{ edge = "en", format = "bf16", shape = "n x hidden" }]
binding = ["{L}.enorm"]
params = { weight_form = "plain" }

[[block.mtp_in.node]]
id = "hidden_norm"
op = "rms_norm"
in = ["hidden"]
out = [{ edge = "hn", format = "bf16", shape = "n x hidden" }]
binding = ["{L}.hnorm"]
params = { weight_form = "plain" }

[[block.mtp_in.node]]
id = "concat"
op = "concat"
in = ["en", "hn"]
out = [{ edge = "cat", format = "bf16", shape = "n x hidden*2" }]

[[block.mtp_in.node]]
id = "fc"
op = "linear"
role = "mtp_fc"
in = ["cat"]
out = [{ edge = "h0", format = "bf16", shape = "n x hidden" }]
binding = ["{L}.eh_proj"]

[block.mtp_out]
stream_in = "x"
outputs = [{ edge = "logits", buffer = "logits" }, { edge = "token", buffer = "tokens" }]

[[block.mtp_out.node]]
id = "final_norm"
op = "final_norm"
in = ["x"]
out = [{ edge = "xn", format = "bf16", shape = "n x hidden" }]
binding = ["{L}.shared_head.norm"]
params = { weight_form = "plain" }

[[block.mtp_out.node]]
id = "lm_head"
op = "lm_head"
in = ["xn"]
out = [{ edge = "logits", format = "bf16", shape = "n x vocab" }]
binding = ["lm_head"]

[[block.mtp_out.node]]
id = "argmax"
op = "argmax"
in = ["logits"]
out = [{ edge = "token", format = "i32", shape = "n x 1" }]
