# 2026-10-08: config.json -> the `glm5_next` circuit's arch shape (GLM-5.3-Flash): KDA linear
# attention and DSA sparse latent attention layers under manifold-constrained hyper-connections,
# a dense SwiGLU prefix then a 288-expert MoE, and one MTP layer.
#
# Owner: metrale-circuit (schema: crates/circuit/src/config_map.rs).
# Invariants:
# - Every key the checkpoint carries is classified: a dim, a param, a required value, a nested
#   object, or ignorable with its reason. Any other key is refused.
# - The model reads `text_config` (Glm5NextConfig nests the text stack); the top level holds the
#   multimodal wrapper and the quantization block.
# - The layer kinds come from `layer_types`; the dense-FFN prefix from `first_k_dense_replace`
#   (the circuit's `[layout.prefix]`), and `mlp_layer_types` must agree with it.
# - Refused until modelled: grouped routing, a RoPE section (`qk_rope_head_dim` > 0), a dense
#   MLA without the indexer, softmax routing, tied embeddings, biases.

schema = 1
arch = "glm5_next"
model_types = ["glm5_next"]
nest = "text_config"

[root]
model_type = "ignore"
architectures = { ignore = "the HF class name; model_type selects the circuit" }
transformers_version = "ignore"
dtype = { ignore = "the storage dtype of unquantized tensors; the load plan reads each tensor's own" }
quantization_config = { ignore = "read by the precision plan (DeclaredPrecisionPlan)" }
vision_config = { ignore = "the vision tower is outside the text circuit (LIFECYCLE-DESIGN.md 13)" }
image_token_id = { ignore = "multimodal token ids; outside the text circuit" }
image_start_token_id = { ignore = "multimodal token ids; outside the text circuit" }
image_end_token_id = { ignore = "multimodal token ids; outside the text circuit" }
video_token_id = { ignore = "multimodal token ids; outside the text circuit" }
video_start_token_id = { ignore = "multimodal token ids; outside the text circuit" }
video_end_token_id = { ignore = "multimodal token ids; outside the text circuit" }
tie_word_embeddings = { require = false, why = "the head is not tied to the embedding" }

[layers]
count = "num_hidden_layers"
sources = [
  { key = "layer_types", values = { linear_attention = "linear_attention", deepseek_sparse_attention = "deepseek_sparse_attention" } },
]

[dims]
hidden = "hidden_size"
vocab = "vocab_size"
# 2026-10-08: The dense SwiGLU FFN of the first `first_k_dense_replace` layers.
inter = "intermediate_size"
first_dense = "first_k_dense_replace"
hc = "hc_mult"
# 2026-10-08: KDA reads the GatedDeltaNet dim names: one head count and one head width for q, k
# and v (`linear_num_heads`, `linear_head_dim`).
lin_k_heads = "linear_num_heads"
lin_v_heads = "linear_num_heads"
lin_k_dim = "linear_head_dim"
lin_v_dim = "linear_head_dim"
conv_kernel = "linear_conv_kernel_dim"
q_heads = "num_attention_heads"
q_lora = "q_lora_rank"
kv_lora = "kv_lora_rank"
mla_qk = "qk_nope_head_dim"
mla_v = "v_head_dim"
index_heads = "index_n_heads"
index_head_dim = "index_head_dim"
index_kpool = "index_kpool"
index_topk = "index_topk"
experts = "n_routed_experts"
top_k = "num_experts_per_tok"
moe_inter = "moe_intermediate_size"
# 2026-10-08: One shared expert of the routed width (`n_shared_experts` is required to be 1).
shared_inter = "moe_intermediate_size"
mtp = { key = "num_nextn_predict_layers", default = 0, allowed = [0, 1] }

[keys]
model_type = "ignore"
dtype = { ignore = "the storage dtype of unquantized tensors" }
bos_token_id = { ignore = "tokenizer ids" }
eos_token_id = { ignore = "tokenizer ids; the serving metadata reads them" }
pad_token_id = { ignore = "tokenizer ids" }
initializer_range = { ignore = "training initialisation" }
attention_dropout = { ignore = "training only" }
router_aux_loss_coef = { ignore = "a training loss weight" }
output_router_logits = { ignore = "an HF output flag" }
use_cache = { ignore = "an HF generate flag" }
base_model_ep_plan = { ignore = "an HF expert-parallel sharding plan, same math" }
max_position_embeddings = { ignore = "the context limit; neither attention applies a positional encoding" }
num_key_value_heads = { ignore = "not read by MLA: one latent KV row per token serves every head" }
qk_head_dim = { ignore = "qk_nope_head_dim + qk_rope_head_dim, both mapped" }
indexer_rope_interleave = { ignore = "the indexer's RoPE layout; qk_rope_head_dim is 0, so no RoPE is applied" }
rms_norm_eps = { param = true }
hc_eps = { param = true }
hc_sinkhorn_iters = { param = true }
routed_scaling_factor = { param = true }
swiglu_limit = { param = true }
linear_lower_bound = { param = true }
# 2026-10-08: Whether a multi-step MTP draft reuses the first step's indexer selection; the
# circuit's draft head is one step.
index_share_for_mtp_iteration = { param = true }
head_dim = { require = 0, why = "the MLA head widths are qk_nope_head_dim and v_head_dim" }
qk_rope_head_dim = { require = 0, why = "the circuit's latent attention is NoPE (no RoPE section)" }
mla_use_nope = { require = true, why = "the circuit's latent attention is NoPE" }
mhc = { require = true, why = "every text layer of the circuit runs under hyper-connections" }
hidden_act = { require = "silu", why = "the circuit's FFNs are SiLU-gated" }
attention_bias = { require = false, why = "the circuit's projections have no bias" }
tie_word_embeddings = { require = false, why = "the head is not tied to the embedding" }
scoring_func = { require = "sigmoid", why = "the circuit's routing scores with a sigmoid and a correction bias" }
topk_method = { require = "noaux_tc", why = "the circuit's top-k ranks score + e_score_correction_bias" }
norm_topk_prob = { param = true, require = true, why = "the circuit's top-k renormalises the selected weights" }
n_group = { require = 1, why = "grouped (n_group) routing is not modelled" }
topk_group = { require = 1, why = "grouped (topk_group) routing is not modelled" }
n_shared_experts = { require = 1, why = "the circuit has one shared expert of moe_intermediate_size" }
moe_router_dtype = { require = "float32", why = "the circuit's router logits are FP32" }
index_kpool_compress = { require = true, why = "the circuit's indexer pools its keys (kpool_compress)" }
index_kpool_always_select_tail = { require = true, why = "the circuit's latent attention always attends the incomplete pool tail" }
mlp_layer_types = { require = [["dense", "dense", "dense", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse", "sparse"]], why = "the circuit takes the dense prefix from first_k_dense_replace; this list must agree with it" }
indexer_types = { require = [["full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full", "full"]], why = "every sparse-attention layer runs its own full indexer" }
linear_attn_config = { param = "linear_attn_config", object = { full_attn_layers = { ignore = "restates layer_types, which the layer kinds read" }, kda_layers = { ignore = "restates layer_types, which the layer kinds read" }, head_dim = { ignore = "a copy of linear_head_dim" }, num_heads = { ignore = "a copy of linear_num_heads" }, short_conv_kernel_size = { ignore = "a copy of linear_conv_kernel_dim" }, gate_lower_bound = "param" } }

# 2026-10-22: The engine's code defaults of the GLM layer levers that pick which kernel a planned
# node runs (crates/settings/src/groups/kernels.rs; the recipe glm-5.3/glm-5.3-flash-nvfp4-tp3-512k
# sets other values in kernels/circuits/INSTANCES.toml). A checkpoint planned at its declared formats
# runs these. Each `why` is the setting's line.
[policy]
glm_mhc_fused = { value = "off", why = "METRALE_GLM_MHC_FUSED unset: crates/settings/src/groups/kernels.rs:134, read at crates/model-arch/src/glm5next_layer/steps.rs:127" }
glm_router_rows = { value = "off", why = "METRALE_GLM_ROUTER_ROWS unset: crates/settings/src/groups/kernels.rs:157, read at crates/model-arch/src/glm5next_mlp/forward/router.rs:56" }
glm_router_topk_rank = { value = "off", why = "METRALE_GLM_ROUTER_TOPK_RANK unset: crates/settings/src/groups/kernels.rs:158, read at crates/model-arch/src/glm5next_mlp/forward/topk_combine.rs:32-50" }
glm_moe_w4a4_grouped = { value = "off", why = "METRALE_GLM_MOE_W4A4_GROUPED unset: crates/settings/src/groups/kernels.rs:151; the routed W4A4 row cap stays 16 (crates/model-arch/src/weight_loader/glm5_next_load/mlp_precision.rs:43-52)" }
glm_moe_expert_layout = { value = "ep", why = "--moe-expert-layout default ep: crates/server/src/cli/serve_args/service.rs:176" }
glm_kda_row_reg = { value = "off", why = "METRALE_GLM_KDA_ROW_REG unset: crates/settings/src/groups/kernels.rs:130, read at crates/model-arch/src/glm5next_kda/decode.rs:148" }
glm_kda_rows_reg = { value = "off", why = "METRALE_GLM_KDA_ROWS_REG unset: crates/settings/src/groups/kernels.rs:129, read at crates/model-arch/src/glm5next_kda/rows.rs:193-215" }
glm_kda_seq_rows = { value = "off", why = "METRALE_GLM_KDA_SEQ_ROWS unset = KdaSeqRows::Off: crates/settings/src/groups/kernels.rs:131, crates/model-arch/src/glm5next_kda/levers.rs:89-93" }
glm_kda_verify_tokens = { value = "off", why = "METRALE_GLM_KDA_VERIFY_TOKENS unset: crates/settings/src/groups/kernels.rs:133, read at crates/model-arch/src/glm5next_kda/decode.rs:302-306" }
glm_w4a16_gemv_seg = { value = "off", why = "METRALE_GLM_W4A16_GEMV_SEG unset: crates/settings/src/groups/kernels.rs:166, read at crates/model-arch/src/glm5next_dense_levers.rs:116 (SegPlan::seg_gemv, crates/model-arch/src/glm5next_w4a16_seg.rs:246-248)" }
glm_w4a16_gemv_rows = { value = "off", why = "METRALE_GLM_W4A16_GEMV_ROWS unset: crates/settings/src/groups/kernels.rs:165, read at crates/model-arch/src/glm5next_dense_levers.rs:85-90 (SegPlan::gemv_tier, crates/model-arch/src/glm5next_w4a16_seg.rs:259-261)" }
glm_w4a16_seg = { value = "off", why = "METRALE_GLM_W4A16_SEG unset = SegMode::Off: crates/settings/src/groups/kernels.rs:167, read at crates/model-arch/src/glm5next_dense_levers.rs:59-68,114" }
glm_dsa_decode_hb = { value = "off", why = "METRALE_GLM_DSA_DECODE_HB unset = the per-head decode kernel: crates/settings/src/groups/kernels.rs:94, read at crates/model-arch/src/glm5next_dsa/levers.rs:121-133,153 (attend.rs:118-120)" }
glm_dsa_verify_rows = { value = "off", why = "METRALE_GLM_DSA_VERIFY_ROWS unset: crates/settings/src/groups/kernels.rs:115, read at crates/model-arch/src/glm5next_layer/levers.rs:187 (verify_rows_apply, crates/model-arch/src/glm5next_dsa/layer/decode_k.rs:168-175,397-411)" }
glm_dsa_indexer_rows = { value = "off", why = "METRALE_GLM_DSA_INDEXER_ROWS unset: crates/settings/src/groups/kernels.rs:100, read at crates/model-arch/src/glm5next_layer/levers.rs:185 (staged, crates/model-arch/src/glm5next_dsa/layer/decode_rows.rs:259-293)" }
