# 2026-09-28: The Qwen3.6 MoE circuit (Qwen3.6-35B-A3B, `qwen3_5_moe_text`): the shared
# GatedDeltaNet and gated full-attention blocks, a 256-expert top-8 MoE FFN with a gated
# shared expert on every layer, the final norm and lm_head, and the one-layer MTP draft head
# whose FFN is the same MoE.
#
# Owner: metrale-circuit (crates/circuit/src/circuit_toml.rs is the schema).
# Invariants: as in qwen3_5.toml. The embedding, mixer, head and MTP in/out blocks come from
# blocks/qwen3_hybrid.toml, which both circuits include; this file adds the MoE FFN.

schema = 1
arch = "qwen3_6_moe"
description = "MoE hybrid: 3 GatedDeltaNet layers then 1 gated full-attention layer, 256-expert top-8 MoE with a shared expert, MTP draft head"
layer_module = "model.language_model.layers.{i}"
draft_module = "mtp.layers.0"
include = ["qwen3_hybrid"]
dims = [
  "hidden", "vocab", "q_heads", "kv_heads", "head_dim",
  "lin_k_heads", "lin_k_dim", "lin_v_heads", "lin_v_dim", "mtp",
  "experts", "top_k", "moe_inter", "shared_inter",
]
prologue = ["embed"]
epilogue = ["head"]
draft = ["mtp_in", "attn", "moe_ffn", "mtp_out"]
# 2026-09-30: The draft head exists only in a checkpoint with an MTP layer (`mtp`).
draft_when = "mtp"

# 2026-10-23: How each dim may split over ranks (crates/circuit/src/parallel.rs). The Qwen3.5/3.6
# loaders shard attention and linear attention by head and refuse a count that does not divide
# (`TpSupport::Even`); the MoE (router, routed and shared experts) is loaded whole on every rank,
# so it is replicated (no entry), as are the norms. A deployment states N and each part's degree.
[parallel.kv_heads]
unit = 1
pad = false
remainder = "exact"
scope = "every"
degree = { min = 1, max = 8 }
why = "crates/config/src/tp_split.rs:196-213 (TpSupport::Even: num_key_value_heads / tp_size, refused unless it divides); crates/model-arch/src/weight_loader/qwen35.rs:62-67"

[parallel.q_heads]
unit = 8
pad = false
remainder = "exact"
scope = "every"
degree = { min = 1, max = 8 }
tie = "kv_heads"
why = "the query heads with their KV head (GQA groups of q_heads / kv_heads): crates/config/src/tp_split.rs:196-213"

[parallel.lin_k_heads]
unit = 1
pad = false
remainder = "exact"
scope = "every"
degree = { min = 1, max = 16 }
why = "crates/config/src/tp_split.rs:200-208 (linear_num_key_heads / tp_size under TpSupport::Even); the NVFP4 linear-attention builders shard by head, crates/model-arch/src/weight_loader/qwen35.rs:62-67"

[parallel.lin_v_heads]
unit = 2
pad = false
remainder = "exact"
scope = "every"
degree = { min = 1, max = 16 }
tie = "lin_k_heads"
why = "the value heads with their key head (lin_v_heads / lin_k_heads per key head): crates/config/src/tp_split.rs:200-208"

[parallel.vocab]
unit = 64
pad = true
remainder = "front"
scope = "every"
degree = { min = 1, max = 8 }
why = "the vocab-sharded LM head: crates/model-engine/src/model/lm_head_vocab_tp.rs:68,84-85 (tp_split of the vocab padded to LMHEAD_VOCAB_SPLIT_ALIGN 64)"

[layout]
kind = "interval"
period = 4

[layout.blocks]
linear_attention = ["gdn", "moe_ffn"]
full_attention = ["attn", "moe_ffn"]

[block.moe_ffn]
stream_in = "x"
stream_out = "y"

[[block.moe_ffn.node]]
id = "post_norm"
op = "rms_norm"
in = ["x"]
out = [{ edge = "xn", format = "bf16", shape = "n x hidden" }]
binding = ["{L}.post_attention_layernorm"]

[[block.moe_ffn.node]]
id = "router"
op = "router"
in = ["xn"]
out = [{ edge = "router_logits", format = "bf16", shape = "n x experts" }]
binding = ["{L}.mlp.gate"]

[[block.moe_ffn.node]]
id = "top_k"
op = "top_k"
in = ["router_logits"]
out = [
  { edge = "topk_w", format = "f32", shape = "n x top_k" },
  { edge = "topk_id", format = "i32", shape = "n x top_k" },
]
params = { top_k = "8", scoring = "softmax" }

[[block.moe_ffn.node]]
id = "experts_gate_up"
op = "expert_gate_up"
in = ["xn", "topk_id"]
out = [{ edge = "egu", format = "bf16", shape = "n*top_k x moe_inter*2" }]
binding = ["{L}.mlp.experts.*.gate_proj", "{L}.mlp.experts.*.up_proj"]

[[block.moe_ffn.node]]
id = "experts_act"
op = "silu_mul"
in = ["egu"]
# 2026-09-30: BF16 as the reference computes it; a precision whose down projection reads F32 (the
# grouped FP8 expert kernels' FP32 SiLU product) widens it (crates/circuit/src/instantiate.rs).
out = [{ edge = "eact", format = "bf16", shape = "n*top_k x moe_inter" }]

[[block.moe_ffn.node]]
id = "experts_down"
op = "expert_down"
in = ["eact", "topk_id"]
out = [{ edge = "edown", format = "bf16", shape = "n*top_k x hidden" }]
binding = ["{L}.mlp.experts.*.down_proj"]

[[block.moe_ffn.node]]
id = "shared_gate_up"
op = "linear"
role = "shared_gate_up"
in = ["xn"]
out = [{ edge = "sgu", format = "bf16", shape = "n x shared_inter*2" }]
binding = ["{L}.mlp.shared_expert.gate_proj", "{L}.mlp.shared_expert.up_proj"]

[[block.moe_ffn.node]]
id = "shared_act"
op = "silu_mul"
in = ["sgu"]
out = [{ edge = "sact", format = "bf16", shape = "n x shared_inter" }]

[[block.moe_ffn.node]]
id = "shared_down"
op = "linear"
role = "shared_down"
in = ["sact"]
out = [{ edge = "sdown", format = "bf16", shape = "n x hidden" }]
binding = ["{L}.mlp.shared_expert.down_proj"]

[[block.moe_ffn.node]]
id = "shared_gate"
op = "linear"
role = "shared_gate"
in = ["xn"]
out = [{ edge = "sg", format = "bf16", shape = "n x 1" }]
binding = ["{L}.mlp.shared_expert_gate"]

[[block.moe_ffn.node]]
id = "blend"
op = "blend"
in = ["edown", "topk_w", "sdown", "sg"]
out = [{ edge = "f", format = "bf16", shape = "n x hidden" }]

[[block.moe_ffn.node]]
id = "add"
op = "residual_add"
in = ["x", "f"]
out = [{ edge = "y", format = "bf16", shape = "n x hidden" }]
