#
# 2026-10-23: The rule pairs whose critical pairs are settled by rule priority alone
# (`met circuit rules --critical-pairs`, report kernels/circuits/plans/critical/CRITICAL-PAIRS.md):
# the two resolution orders give plans of different headroom floor, so the plan depends on which
# rule the greedy tries first. Each entry states why the priority is the intended resolution.
# Shrink-only: the gate (crates/server/src/cli/circuit_rules.rs) fails on a gated pair without an
# entry, on an entry no plan gates any more, and on a list longer than its CEILING. Seeded with 32
# entries on 2026-10-23 (critpairs @ origin/megakernel e824f8b98); in every one today's plan takes
# the cheaper side. Prefer making a pair joinable (or deleting the dominated rule) to adding one.

[[pair]]
rules = ["deinterleave_qg", "w4a16_qg_batch2"]
why = "the q projection with the q/gate split folded in (batch 2) covers the split; priority takes it first and it is the cheaper side in every plan"

[[pair]]
rules = ["gdn_ba_gates_gemm_batched", "gdn_ba_gates_gemv_per_row"]
why = "alternate kernels over the same nodes: priority encodes the serve's dispatch (the batched launch above one row), the cheaper side in every plan"

[[pair]]
rules = ["gdn_ba_gates_gemm_batched_twin", "gdn_ba_gates_gemv_per_row"]
why = "alternate kernels over the same nodes: priority encodes the serve's dispatch (the batched launch above one row), the cheaper side in every plan (the Hopper-tuned twin at 96-128 rows)"

