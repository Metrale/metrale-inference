# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Repository gates: cargo xtask deps | env-ban | selftest | purity and its gates."
# 2026-10-17: A repository tool, never a crates.io package.
publish = false

[dependencies]
# 2026-10-22: `cargo xtask kzx-corpus` writes postcard blueprint bodies and `.kbp` containers.
postcard = { workspace = true, features = ["use-std"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
toml = { workspace = true, features = ["std", "serde", "parse"] }

[lints]
workspace = true

[package.metadata.metrale]
role = "tool"
