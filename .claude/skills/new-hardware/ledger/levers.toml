  { rung = "C1",   tok_s_pct = 0.9, j_tok_pct = -0.6, n = 3, ttft_pct = 8.0 },
  { rung = "C4",   tok_s_pct = 2.7, j_tok_pct = -3.0, n = 3 },
  { rung = "C8",   tok_s_pct = 1.3, j_tok_pct = -2.4, n = 3 },
  { rung = "C16",  tok_s_pct = 3.0, j_tok_pct = -3.5, n = 3, ttft_pct = -50.0 },
  { rung = "C32",  tok_s_pct = 4.0, j_tok_pct = -4.3, n = 3 },
  { rung = "C64",  tok_s_pct = 6.1, j_tok_pct = -6.4, n = 3 },
