failure_mode = ""
caught_by = ""
time_lost_hours = 0
would_catch_earlier = ""
effort_hours = 20
transferability = "any model whose prefill forms a burst of same-length concurrent prompts under this engine's batched-prefill scheduler; the fixed-format admission rule is the reusable piece, independent of model"
links = { pr = "#120", commit = "", evidence = "campaign PR #120, same-box A/B vs the comparison engine's own ladder" }
notes = "four real identity bugs surfaced while proving this lever and are logged as their own entries below (per-stream fallback skipped the tail split, a metadata-slot size assumption, a pinned-staging upload race, and a state-pool exhaustion changing a downstream split point) — each would have shipped a silent numerics change without the strict-prefill-bits gate"

[[lever]]
id = "gb10-moe-nvfp4-first-varlen-codispatch-gate-fail"
date = "2026-10-05"
hardware_class = "gb10"
model = "Qwen3.6-35B-A3B-NVFP4 (MoE)"
recipe_or_tier = "adaptive activation-quantization, --prefill-varlen-batch + --prefill-codispatch (no fixed-format admission yet)"
symptom = "identity gate on a single request passed (0/19 differ) but the same gate at 16 concurrent requests failed: varlen alone 2/19 transcripts differ, varlen+codispatch together 15/19 differ"
diagnosis_tool = "parity-oracle"
root_cause_class = "numerics-path-mismatch"
lever_type = "scheduling"
lkb_effect = "none (the lever was parked before productizing)"
parity_tier_kept = "n/a"
per_rung = []
verdict = "parity-broken"
verdict_reason = "the batched prefill path for concurrent requests ran a format-sensitive wave (mixed attention/activation formats, a different recurrent-state split, a drafter capture skip) that was never proven bit-identical to the serial path; measured only at width 1 before this, which cannot see a width-dependent defect"
failure_mode = "a lever proven only at concurrency 1 was assumed safe at concurrency 16+; the identity check that would have caught it was not run at the width the lever actually changes behavior at"
caught_by = "parity-oracle identity gate at width 16 (strict transcript match), run before the timed A/B as campaign policy requires"
time_lost_hours = 6
would_catch_earlier = "run the identity gate at the WIDEST concurrency the lever can reach, not just width 1, before any timed A/B is scheduled"
effort_hours = 6
transferability = "any batched/varlen prefill lever on any class: a per-request fast path and a batched path diverging under load is the generic risk, not specific to this model"
links = { pr = "", commit = "", evidence = "parked lever's gate output on the GB10 reference box" }
notes = "this failure is what motivated the 'exact wave' redesign (entry above): instead of trying to make an arbitrary batched wave bit-identical to serial, admit the batched levers only beside a FIXED wave format, and refuse everything else"

[[lever]]
id = "gb10-moe-nvfp4-moe-prefill-tc"
date = "2026-10-05"
hardware_class = "gb10"
model = "Qwen3.6-35B-A3B-NVFP4 (MoE, declared)"
recipe_or_tier = "nvfp4-declared + --moe-prefill-tc (grouped tensor-core MoE prefill)"
symptom = "NVFP4 MoE prefill ran an E4M3xE4M3 path on an UNSCALED BF16->E4M3 activation cast — below the checkpoint's declared W4A16 format and different arithmetic from the (already-kept) decode kernel; it also kept ~18 GiB of transposed weight tables resident only for this path"
diagnosis_tool = "manual-inspection"
root_cause_class = "below-declared-precision"
lever_type = "new-kernel"
lkb_effect = "prefill now reuses the decode engine's grouped-TC kernel family under a GroupedRows policy instead of a separate prefill-only kernel; duplicate-materialization removed (the transposed copies are skipped under the flag)"
parity_tier_kept = "accuracy-gated"
per_rung = [
  { rung = "C1", tok_s_pct = 0.0, j_tok_pct = 0.0, n = 1, ttft_pct = -12.0 },
]
verdict = "kept"
verdict_reason = "raises prefill to the DECLARED precision (same arithmetic as decode), frees ~17 GiB of duplicate weight tables, and cuts cold TTFT ~10-13%; the recipe-level flip to default-on waits on its own accuracy gate because the bits it produces are not the ones already certified"
failure_mode = ""
caught_by = ""
time_lost_hours = 0
would_catch_earlier = ""
effort_hours = 10
transferability = "any declared-precision MoE model whose prefill path still runs an older, lower-precision kernel than its own decode path — check prefill and decode arithmetic for agreement as a standard audit step on a new MoE bring-up"
links = { pr = "#121", commit = "", evidence = "campaign PR #121" }
notes = "found by simply reading the prefill kernel's own math, not by profiling a speed gap — the lesson is to audit precision on BOTH phases explicitly, since a phase can be fast and simultaneously wrong"

