# SPDX-License-Identifier: MIT OR Apache-2.0

# 2026-10-05: The LEVER JOURNAL. One [[lever]] per optimization ATTEMPT made during a
# Hardware Beachhead Campaign or a /new-model improvement loop, whether it was kept, discarded,
# or failed outright. `ledger/<class>.toml` tracks campaign MILESTONES (TTBP/TTPV/LKB/LAB) per
# hardware+model combo; this file tracks the individual LEVERS behind those milestones, so a
# later campaign can find "what worked and why" instead of re-discovering it. A failed or
# discarded entry is as valuable as a kept one: it is the fastest way to NOT repeat a mistake.
# Append an entry after every loop-iteration verdict (`references/improvement-loop.md` step f)
# and after every methodology failure caught along the way, even when no code shipped.
# Read `references/lever-patterns.md` BEFORE choosing a lever on a new campaign: it is mined
# from this file and states the recurring (symptom -> root cause -> lever) rules.

# Schema (every key present; an inapplicable field is "" / 0 / [] with a one-line reason in
# `notes` if that is not obvious):
#   id                 unique slug: <hardware-class>-<model-or-area>-<short-name>
#   date               the verdict date (not the start date), YYYY-MM-DD
#   hardware_class     kernels/<class>/ id, e.g. "gb10", "hopper"
#   model              checkpoint id or area, with (dense/MoE) and the precision tier if relevant
#   recipe_or_tier     the recipe name or --weight-quantization/--activation-quantization tier
#   symptom            the PROFILE SIGNATURE that triggered the attempt (tool + shape + numbers),
#                      e.g. "kernel X = 85% of C16 step, grid 8-136 CTAs on 132 SMs"
#   diagnosis_tool     one of: nsys | ncu | bench | parity-oracle | roofline | microbench |
#                      circuit-ledger-test | manual-inspection  (the tool that FOUND the gap or
#                      the defect; for a pure methodology failure, the tool that caught it)
#   root_cause_class   from the controlled vocabulary below
#   lever_type         one of: data-row | parameterization | precision-fix | scheduling |
#                      fusion | new-kernel | recipe-flag | process-fix
#                      ("process-fix": no kernel/recipe changed; the fix is to how the campaign
#                      measures or builds, e.g. a build-hygiene or harness defect)
#   lkb_effect         free text: residual delta, coverage delta, family promoted (or "none yet")
#   parity_tier_kept   "1" | "2" | "accuracy-gated" | "n/a" (bit-parity.md tiers; "n/a" only for
#                      a pure process-fix that touches no served bits)
#   per_rung           array of { rung, tok_s_pct, j_tok_pct, n, ttft_pct? }; tok_s_pct/j_tok_pct
#                      are the lever's delta vs its own control, same box, same build, from the
#                      campaign's timed A/B (never a cross-box number); [] if never timed
#   verdict            one of:
#                        kept          - wins without losing another rung outside noise, shipped
#                        discarded     - correctly implemented, proven, but does not pay
#                        marginal      - inside or barely outside the noise band; not worth a PR
#                        regressed     - made speed OR energy worse on some rung when combined
#                                        with other kept levers, or vs an earlier measurement
#                        parity-broken - failed Tier 1/2 or the accuracy bar
#                        failed        - did not build, did not route, ran on a stale binary, or
#                                        the "pass" was a vacuous test
#   verdict_reason     one line: why
#   failure_mode       (non-kept only) what went wrong, precisely
#   caught_by          (non-kept only) which gate, tool or person caught it
#   time_lost_hours    (non-kept only) wall-clock hours burned before the catch
#   would_catch_earlier (non-kept only) the cheapest gate that WOULD have caught it sooner, and
#                      why it did not fire this time (missing, not run yet, or not built)
#   effort_hours       wall-clock hours for the whole attempt (diagnosis through verdict)
#   transferability    which other classes or models this lever, or this failure mode, likely
#                      applies to
#   links              { pr = "", commit = "", evidence = "" } — evidence is a public-safe
#                      description ("same-box microbench vs the GB10 reference box's own ..."),
#                      NEVER an internal path or hostname; "" if there is none to cite publicly
#   notes              one or two lines of color a future reader needs

# Controlled vocabulary for root_cause_class (defined here; extend by adding a bullet, never a
# synonym of an existing one):
#  - inherited-constant-underfill   a constant (SM-count tile width, util ceiling, buffer size,
#                                   batch cap) sized for the PARENT class or an earlier, smaller
#                                   model silently underfills the new one
#  - below-declared-precision       a path runs a format BELOW what the checkpoint declares (or
#                                   below what the comparison engine runs), found by the parity
#                                   oracle or a Tier-2 check, not by a speed regression
#  - phase-serialization            the prefill burst and the decode steady-state are mixed in
#                                   one profile window, hiding which phase actually costs time
#  - bandwidth-underutilization     a kernel leaves achievable DRAM/L2 bandwidth on the table at
#                                   its shape (measured against the class's own roofline)
#  - launch-overhead                too many small launches, or host-side gaps between them, at
#                                   this concurrency
#  - duplicate-materialization      a redundant copy of weights or activations is kept resident
#                                   or computed (a transposed twin table, a predequant copy)
#  - memory-waste                   a buffer or arena is sized unconditionally for a flag/feature
#                                   every caller pays for, used or not
#  - numerics-path-mismatch         two code paths that should compute the same bits for the same
#                                   inputs (serial vs batched, mock vs real, old vs new kernel)
#                                   silently diverge
#  - silent-gate-bypass             a lever's own predicate never actually arms at the shape
#                                   being measured (refused by a scheduler policy, routed around,
#                                   or the env/flag is read by nothing) — the "pass" or "no
#                                   effect" result proves nothing because the lever never ran
#  - measurement-methodology-error  the result is an artifact of HOW it was measured (a debug
#                                   build timed as release, a vacuous identity check comparing
#                                   two empty things, a contaminated or stale-binary run), not of
#                                   the code under test
#  - config-drift                   an unpinned dependency, image tag or version moved between
#                                   two measurements that were assumed comparable

[[lever]]
id = "gb10-moe-nvfp4-lean-expert-decode"
date = "2026-10-04"
hardware_class = "gb10"
model = "Qwen3.6-35B-A3B-NVFP4 (MoE, declared)"
recipe_or_tier = "nvfp4-declared, grouped NVFP4 expert decode"
symptom = "same-box energy microbench: the grouped-expert MoE kernel cost 12-30% more mJ/call than the comparison engine's equivalent kernel at equal time, M=8..255; SASS showed ~25 ALU ops per MMA for the E2M1/E4M3 decode vs the kept design's ~11"
diagnosis_tool = "microbench"
root_cause_class = "numerics-path-mismatch"
lever_type = "new-kernel"
lkb_effect = "new weight_layout point on the MoE grouped-TC family (lean bit-field decode); single-class so far, no family promoted"
parity_tier_kept = "1"
per_rung = [
  { rung = "C1",  tok_s_pct = 1.5,  j_tok_pct = -6.0,  n = 3 },
  { rung = "C4",  tok_s_pct = 3.4,  j_tok_pct = -10.5, n = 3 },
  { rung = "C8",  tok_s_pct = 4.5,  j_tok_pct = -11.0, n = 3 },
  { rung = "C16", tok_s_pct = 3.0,  j_tok_pct = -9.0,  n = 3 },
]
verdict = "kept"
verdict_reason = "bit-identical at every row count (proven by microtest across 1..256 rows, two routing distributions); cuts routed-expert energy 10-17% at equal time, reaching the comparison engine's own energy at small M and beating it 2-8% at M>=32"
failure_mode = ""
caught_by = ""
time_lost_hours = 0
would_catch_earlier = ""
effort_hours = 14
transferability = "any class/model that runs this engine's NVFP4 grouped-expert MoE decode kernel family (same E2M1/E4M3 decode path); ruled out activation re-reads (L2) as the cause first, by a half-re-read variant that changed neither time nor energy"
links = { pr = "", commit = "", evidence = "same-box microbench vs the comparison engine's own fused-MoE kernel, on the GB10 reference box, flock-held quiet window" }
notes = "the decode ALU work, not activation bandwidth, was the power gap; ruling out bandwidth first (a byte-identical half-re-read variant) saved a wrong detour into tiling before the real cause (ALU) was found"

