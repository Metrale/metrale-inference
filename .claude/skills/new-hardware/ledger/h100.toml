#
# 2026-10-05: The bring-up ledger of the Hardware Beachhead Campaign: H100 (class `hopper`), one
# [[combo]] per hardware + model combination, in campaign order. Machine-readable so later
# campaigns can compare: read every ledger under .claude/skills/new-hardware/ledger/ before
# starting a new one, and update this one at every milestone (bit parity on the mock, bit parity
# on the real model, each loop iteration, victory, certification).
#
# Schema (every key present; a milestone not reached yet is the empty string, a count not
# started is 0):
#   device, class, model, checkpoint, revision  what the combo is (revision: the checkpoint commit)
#   started            RFC 3339 UTC: the campaign start for this combo
#   ttbp_mock_at       RFC 3339 UTC: Tier 1 parity recorded on the mock (references/bit-parity.md)
#   ttbp_real_at       RFC 3339 UTC: Tier 1 + Tier 2 parity recorded on the real model
#   ttpv_speed_at      RFC 3339 UTC: first same-box scoreboard faster (tok/s) at every rung C1-C128
#   ttpv_energy_at     RFC 3339 UTC: first same-box scoreboard cheaper (J/tok) at every rung but at
#                      most one mid-ladder rung lost by a small margin
#   ttpv_at            RFC 3339 UTC: the later of the two (the loop's exit criterion), PARITY-PASS
#   certified_at       RFC 3339 UTC: the certification campaign passed
#   ttbp_mock_h, ttbp_real_h, ttpv_speed_h, ttpv_energy_h, ttpv_h
#                      hours from `started` to the milestones above (0.0 until reached)
#   loop_budget        the improvement loop's time budget for this combo (the target file's)
#   escalations        one line per escalation: when, why (stall limit or budget), objectives won
#   iterations         improvement-loop iterations run
#   levers_kept, levers_discarded      one short name per lever, with the PR or commit
#   loc_added, loc_removed             lines added and removed by the campaign's PRs
#   loc_removed_by_parameterization    the part of loc_removed a parameterization deleted
#   evidence           where the records are (PR comments, files in the tree)
#   notes              one line

