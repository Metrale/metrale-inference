ttbp_mock_at = ""
ttbp_real_at = ""
ttpv_speed_at = ""
ttpv_energy_at = ""
ttpv_at = ""
certified_at = ""
ttbp_mock_h = 0.0
ttbp_real_h = 0.0
ttpv_speed_h = 0.0
ttpv_energy_h = 0.0
ttpv_h = 0.0
