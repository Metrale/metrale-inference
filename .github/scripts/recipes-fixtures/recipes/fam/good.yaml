recipe_version: "2"
model: example/model
runtime: metrale
container: metrale/metrale-inference-gb10:latest
min_nodes: 2
metadata:
  description: |
    Fixture for recipes-selftest.py. Every key maps to a flag the engine
    has had since the recipe format existed, except spec_objective
    (2026-10-10), which speculation without --mtp-gate force requires.
defaults:
  port: 8888
  host: 0.0.0.0
  max_model_len: 4096
  gpu_memory_utilization: 0.85
  scheduler: slai
  speculative: true
  spec_objective: throughput
  ep_size: 2
env:
  METRALE_EP_GRAPHS: "0"
