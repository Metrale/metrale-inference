# SPDX-License-Identifier: MIT OR Apache-2.0
name: Owed certifications

# 2026-10-15: After a change lands on main, open one certification PR per model it
# left owed: the change re-opened a gate, certified it on another model it
# reaches, and merged. Which PRs to open is decided in Rust
# (crates/bench/src/gate/owed_prs.rs via the owed_certs binary); this workflow
# only runs .github/scripts/owed-certifications.sh, whose --dry-run half the
# `owed-certifications-dry-run` job in ci.yml exercises on every PR, so a
# broken listing or a broken binary shows on the PR and not first on main.
on:
  push:
    branches: [main]

# 2026-10-15: The workflow token only reads; the branches, manifests and PRs are
# written with the certification App's token, so the PRs it opens run CI (a PR
# opened with the workflow token does not trigger workflows).
permissions:
  contents: read

# 2026-10-15: One run at a time, never cancelled: two pushes landing together
# would otherwise both see "no branch yet" and race to open the same PR, and a
# cancelled run could stop between creating a branch and opening its PR (the
# next run then opens the PR alone, but only if it is not cancelled too).
concurrency:
  group: owed-certifications
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  METRALE_SKIP_BUILD: "1"
  CUDARC_CUDA_VERSION: "13000"

jobs:
  open:
    name: Open owed certification PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 2026-10-15: Records are judged against the trees of the commits they
          # were measured at, so the whole history and every branch must be here.
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: The certification App must be configured
        env:
          CLIENT_ID: ${{ vars.CERTIFICATION_APP_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLIENT_ID" ]; then
            echo "::error title=No certification App::vars.CERTIFICATION_APP_CLIENT_ID is empty, so no owed certification PR can be opened."
            exit 1
          fi
      - name: Mint the certification App token
        id: apptoken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.CERTIFICATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.CERTIFICATION_APP_PRIVATE_KEY }}
      - name: Open one PR per owed model
        # 2026-10-15: Every `${{ }}` value arrives through the environment, never
        # spliced into the script text (certification-bot.yml says why).
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: .github/scripts/owed-certifications.sh "$BEFORE" "$HEAD_SHA" --open
