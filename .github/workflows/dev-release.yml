# SPDX-License-Identifier: MIT OR Apache-2.0

# Rolling dev releases from `main`.
#
# The problem this solves: the release matrix has been building a working
# `met` for nine (OS, arch, GPU) combinations for months, and NOT ONE of
# them was ever downloadable. `release.yml` publishes only on
# workflow_dispatch, and no dispatch has ever been run with dry_run=false, so
# the repo's Releases page is empty. Everything a PR builds is uploaded as an
# Actions artifact, which expires after one day (ci.yml passes
# retention_days: 1) and cannot be downloaded without a GitHub login at all.
#
# The practical effect was that "how do I test it?" had no good answer for
# anyone without a full CUDA/HIP/ROCm toolchain and half an hour — even
# though a binary for their exact platform had already been built and thrown
# away. This workflow keeps it.
#
# Modelled on llama.cpp, which publishes a numbered build off master
# (`b10423`) many times a day, one zip per backend. Same idea here: the tag
# is `b<commit-count>`, the assets are the SAME per-platform packages
# `release-build.yml` already produces, and nothing about the curated semver
# path in `release.yml` changes.
#
# Deliberately NOT a replacement for `release.yml`:
#   - every release here is a PRERELEASE, so it never becomes "Latest" and
#     never shadows a real semver release on the Releases page
#   - no Cargo.toml version bump, no commit pushed back to main
#   - the tag is `bNNNN`, which cannot collide with `vX.Y.Z`
name: Dev release

on:
  # workflow_run, NOT push. CI already runs on every push to main, so a
  # `push` trigger here would either duplicate the whole test suite or skip
  # the gate entirely and publish binaries from a main that does not pass its
  # own checks. Chaining off CI's verdict costs nothing and gates properly.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual escape hatch, for the same reason ci.yml has one: during the
  # 2026-08-06 Actions incident webhook triggers were throttled and no runs
  # were created at all.
  #
  # Deliberately takes NO `ref` input. An arbitrary ref would flow into
  # release-build.yml's checkout, which runs Swatinem/rust-cache in the
  # default-branch context — letting anyone who can dispatch this workflow
  # poison the cache that every later main build restores from. CodeQL
  # (actions/cache-poisoning) flagged exactly that path when this workflow
  # first had the input. This hatch only ever needs to build main, which is
  # what it does.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # NOT cancel-in-progress. Two runs never contend for a tag (the build
  # number is derived from the commit), and cancelling a run midway through
  # uploading assets leaves a published release with a partial set of
  # binaries — worse than spending the runner minutes.
  group: dev-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # Decide whether to build at all, and what to call the result. Cheap, so
  # every reason to skip is discovered before the matrix starts.
  # ---------------------------------------------------------------------
  prepare:
    name: decide + number the build
    runs-on: ubuntu-24.04
    # Never publish from a fork: a fork running this would try to create a
    # release on its own repo with our tag scheme, and fail confusingly.
    if: github.repository == 'Metrale/metrale-inference'
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      build_number: ${{ steps.decide.outputs.build_number }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # workflow_run runs against the DEFAULT branch's workflow files but
          # must build the commit CI actually validated, not whatever main
          # points at now — those differ as soon as a second PR merges while
          # this run is queued.
          # workflow_run: the commit CI actually validated. Manual dispatch:
          # main, and only ever main — see the trigger comment above.
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          # rev-list --count needs real history. depth-1 would report 1.
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          # workflow_run gives the upstream verdict; a manual dispatch has no
          # upstream run and is treated as an explicit "yes".
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          # A monotonically increasing integer that is stable for a given
          # commit and needs no state stored anywhere. This is the same
          # quantity llama.cpp's BUILD_NUMBER tracks.
          n="$(git rev-list --count HEAD)"
          echo "build_number=b$n" >> "$GITHUB_OUTPUT"

          skip() { echo "::notice::skipping dev release — $1"; \
                   echo "should_build=false" >> "$GITHUB_OUTPUT"; exit 0; }

          if [ "$EVENT" = workflow_run ] && [ "$CI_CONCLUSION" != success ]; then
            skip "CI concluded '$CI_CONCLUSION'"
          fi

          # Opt-out escape hatch, llama.cpp's convention. Lets a docs-only or
          # obviously-broken merge land without minting a build.
          msg="$(git log -1 --pretty=%B)"
          case "$msg" in
            *'[no release]'*) skip "commit message contains [no release]" ;;
          esac

          # Re-runs of CI on an already-published commit must not try to
          # recreate the tag: `gh release create` fails on an existing tag,
          # which would turn a harmless re-run red.
          if git ls-remote --exit-code --tags origin "refs/tags/b$n" >/dev/null 2>&1; then
            skip "tag b$n already published"
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "will publish b$n from $sha"

  # ---------------------------------------------------------------------
  # The SAME reusable matrix every semver release uses. Pull requests and
  # queue entries only validate it (ci.yml passes `main_only`), so this is
  # where the nine legs actually build.
  # ---------------------------------------------------------------------
  build:
    name: build
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.prepare.outputs.build_number }}
      ref: ${{ needs.prepare.outputs.sha }}
      pr_mode: false
      # Short: the assets live on the Release from here on, so the Actions
      # artifact is only a handoff between two jobs in this run.
      retention_days: 7
      publishing: true

  publish:
    name: publish b-release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    outputs:
      # 2026-09-30: `success` when the checked recipe bundle was attached; the
      # metralectl mirror below runs only then.
      recipes: ${{ steps.recipes.outcome }}
    permissions:
      # The only job in this workflow that can write anything.
      contents: write
      # Reads the recipe bundle artifact from the CI run that validated this
      # commit.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Refuse to publish an empty release
        run: |
          set -euo pipefail
          # Every GPU row is `experimental: true`, i.e. continue-on-error, so
          # the matrix can go green with binaries missing. A release with no
          # binaries is worse than no release.
          count=$(find dist -type f ! -name '*.sha256' | wc -l)
          [ "$count" -gt 0 ] || { echo "::error::no artifacts to publish"; exit 1; }
          echo "publishing $count artifact(s)"
          find dist -type f | sort

      # 2026-09-27: The launch recipes, as ci.yml's `recipes` job
      # checked them against this commit's own `met`: recipes.tar.gz,
      # serve-options.json and index.json, each with a .sha256. Taken from that
      # run rather than rebuilt, so what is attached is what was checked. A
      # missing or failed bundle costs the release these three assets, never the
      # binaries: this step may fail, and the next one attaches them only when
      # it did not.
      - name: Fetch the checked recipe bundle
        id: recipes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          # A manual dispatch has no upstream run: use the newest successful
          # push run of CI on this commit.
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" \
                       --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          [ -n "$RUN_ID" ] || { echo "::warning::no CI run for $SHA to take the recipe bundle from"; exit 1; }
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n recipes-bundle -D recipes-dist || {
            echo "::warning::CI run $RUN_ID has no recipes-bundle artifact (the recipe check failed or did not run); publishing without the recipe assets"
            exit 1
          }
          want="index.json index.json.sha256 recipes.tar.gz recipes.tar.gz.sha256 serve-options.json serve-options.json.sha256"
          got=$(cd recipes-dist && ls | sort | tr '\n' ' ' | sed 's/ $//')
          [ "$got" = "$want" ] || { echo "::warning::unexpected recipe bundle contents: $got"; exit 1; }
          (cd recipes-dist && sha256sum -c ./*.sha256)
          commit=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' recipes-dist/index.json)
          [ "$commit" = "$SHA" ] || { echo "::warning::the bundle was built from $commit, not $SHA"; exit 1; }

      - name: Create the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.prepare.outputs.build_number }}
          SHA: ${{ needs.prepare.outputs.sha }}
          RECIPES: ${{ steps.recipes.outcome }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$RECIPES" = success ]; then
            extra=(recipes-dist/*)
          fi
          # --target creates the tag as part of creating the release, so this
          # job needs no git push and no tag step that could half-apply.
          # --prerelease keeps `bNNNN` out of the "Latest release" slot that
          # belongs to semver releases from release.yml.
          # Every claim in these notes has to survive the fact that CI has no
          # GPU of any vendor. "It built" is the only thing this run proves,
          # so it is the only thing the notes are allowed to say.
          {
            echo "Rolling development build from \`main\` @ \`${SHA:0:12}\`."
            echo
            echo "**Not a stable release, and not a tested one.** Every GPU target"
            echo "in the matrix is marked experimental and is *built* on a hosted"
            echo "runner that has no GPU of that vendor. These binaries compile and"
            echo "link; whether they run on your hardware is exactly what has not"
            echo "been checked here."
            echo
            echo "One archive per platform, named"
            echo "\`met-${BUILD}-<os>-<arch>-<vendor>-<toolchain>\`, each with a"
            echo "matching \`.sha256\`. Verify before running:"
            echo
            echo '```'
            echo "sha256sum -c met-${BUILD}-<platform>.<ext>.sha256"
            echo '```'
            echo
            echo "Per-target caveats — including which ones are known *not* to run"
            echo "yet — are recorded in \`.github/release-matrix.json\` under each"
            echo "entry's \`note\` field."
            if [ "$RECIPES" = success ]; then
              echo
              echo "The launch recipes at this commit are attached as \`recipes.tar.gz\`,"
              echo "with \`index.json\` (each recipe's id, path and sha256) and"
              echo "\`serve-options.json\` (the \`met serve\` flag surface they were checked"
              echo "against). \`index.json\` is also a recipe cache: saved as"
              echo "\`~/.metrale/metrale-recipes/index.json\`, it is what \`met\`'s recipe"
              echo "library and launches read until the next \`met sync-recipes\`."
            fi
          } > notes.md
          gh release create "$BUILD" \
            --title "Metrale Engine $BUILD" \
            --notes-file notes.md \
            --prerelease \
            --target "$SHA" \
            dist/* "${extra[@]}"
          echo "published: $(gh release view "$BUILD" --json url --jq .url)"

  # ---------------------------------------------------------------------
  # 2026-09-30: Hand the release to metralectl, which ships the recipes to
  # users. metralectl mirrors `recipes/` and `serve-options.json` from one
  # engine release (its vendor/engine-pin.toml); its engine-recipes workflow
  # moves the pin and opens the mirror PR, but ran only daily. Dispatching it
  # here opens that PR within minutes of a release that changes what it
  # mirrors. Merging the PR, and the metralectl release that ships it, stay
  # with a person (CONTRIBUTING.md, "How a recipe change reaches users").
  #
  # The sync logic stays metralectl's own: this job only asks whether the
  # release changes the mirrored files (`recipes.py mirror-needed`, tested in
  # recipes-selftest.py) and dispatches. The certification App is installed
  # on every Metrale repository with actions:write, which a dispatch needs.
  # ---------------------------------------------------------------------
  mirror-recipes:
    name: dispatch the metralectl recipe mirror
    needs: [prepare, publish]
    if: needs.publish.outputs.recipes == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      MIRROR_REPO: Metrale/metralectl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          # The whole history: the pinned commit is compared with this one.
          fetch-depth: 0
          persist-credentials: false

      # recipes_lib imports yaml; ci.yml's recipes job installs it the same way.
      - run: python3 -m pip install --quiet PyYAML

      - name: Does this release change what metralectl mirrors?
        id: need
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.prepare.outputs.build_number }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          # An unread pin or snapshot is passed on as unknown, and unknown
          # dispatches (recipes_lib.mirror_verdict).
          pinned=""
          if pin=$(gh api "repos/$MIRROR_REPO/contents/vendor/engine-pin.toml" -H "Accept: application/vnd.github.raw"); then
            pinned=$(python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["commit"])' <<<"$pin") || pinned=""
          fi
          mkdir -p mirror release
          gh api "repos/$MIRROR_REPO/contents/vendor/serve-options.v2.json" -H "Accept: application/vnd.github.raw" \
            > mirror/serve-options.json || rm -f mirror/serve-options.json
          gh release download "$BUILD" -R "$GITHUB_REPOSITORY" -p serve-options.json -D release
          python3 .github/scripts/recipes.py mirror-needed --pinned-commit "$pinned" --head "$SHA" \
            --pinned-serve-options mirror/serve-options.json \
            --release-serve-options release/serve-options.json | tee -a "$GITHUB_OUTPUT"

      - name: Mint a token for metralectl
        if: steps.need.outputs.dispatch == 'true'
        id: apptoken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.CERTIFICATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.CERTIFICATION_APP_PRIVATE_KEY }}
          owner: Metrale
          repositories: metralectl
          permission-actions: write

      - name: Dispatch metralectl's engine-recipes workflow
        if: steps.need.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
          BUILD: ${{ needs.prepare.outputs.build_number }}
        run: |
          set -euo pipefail
          gh workflow run engine-recipes.yml -R "$MIRROR_REPO" --ref main -f release="$BUILD"
          echo "dispatched engine-recipes.yml for $BUILD on $MIRROR_REPO"
