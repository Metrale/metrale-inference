name: CodeRAG

# Builds the "Ask the codebase" corpora. Every merge to main that touches Metrale
# Engine source, book or docs chunks + embeds what changed (incremental against
# the previously published corpus, so steady state embeds only what moved) and
# publishes self-verifying lattice-jsonl corpora -- gzip + metadata -- for the
# website to load into an in-browser lattice-db.
#
# One corpus per source, because GitHub rejects any pushed file over 100 MB:
#   metrale-coderag   the engine's Rust / CUDA / Metal source   (code profile)
#   metrale-docs      book/src, docs/ and the root *.md         (prose profile)
#   books-rust        The Rust Programming Language, pinned     (prose profile)
#
# Stable URLs this produces (no TTL, fetchable directly from the browser):
#   https://metrale.github.io/metrale-inference/coderag/<corpus>.jsonl.gz
#   https://metrale.github.io/metrale-inference/coderag/<corpus>.jsonl.meta.json
#   https://metrale.github.io/metrale-inference/coderag/SOURCES.md
#
# Why gh-pages and not the alternatives: GitHub Pages serves with
# `Access-Control-Allow-Origin: *` (verified 2026-08-16), so the site can fetch
# the corpus cross-origin. Release assets send no CORS headers at all, and
# workflow artifacts are auth-only downloads capped at 90 days -- neither can
# back an anonymous browser fetch. The 30-day artifacts below are CI copies for
# inspection, not the serving path.
#
# One-time prerequisite (repo settings, not automatable from here):
# Settings -> Pages -> "Deploy from a branch" -> branch `gh-pages`, folder
# `/ (root)`. Until that is enabled the branch updates but nothing is served.
#
# Fallback if Pages ever misbehaves: publish the same files beside the site
# that loads them (metrale.ai), so they are served same-origin -- same bytes,
# and no CORS in play at all.
#
# The embed model is the ORG variable OPENROUTER_EMBED_MODEL, never a literal
# here or in .github/ai-models.json: free-tier ids rotate without notice and a
# second copy of the id is the thing that drifts.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'kernels/**'
      - 'book/**'
      - 'docs/**'
      - '*.md'
      - '.github/ai-models.json'
      - '.github/scripts/coderag-*.sh'
      - '.github/workflows/coderag.yml'
  workflow_dispatch:
    inputs:
      force-books:
        description: Rebuild the pinned book corpus even when the published copy is current (use after changing its chunk profile)
        type: boolean
        required: true
        default: false

# Two corpus publishes must never race the gh-pages force-push; a superseded
# run's corpus is worthless the moment a newer main exists, so cancel it.
concurrency:
  group: coderag-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PAGES_BASE: https://metrale.github.io/metrale-inference/coderag
  # 95 MiB. GitHub rejects any pushed file over 100 MB; fail here with the real
  # number instead of dying inside git push with an LFS hint.
  SIZE_CAP_BYTES: '99614720'
  # Shared by all three corpora. A lattice-server release the action downloads
  # and sha256-verifies; vectors rounded to 4 significant digits (the embedding
  # noise floor sits well above the 4th digit, and the code corpus at 5 digits
  # was 99,316,510 B against the 99,614,720 B cap).
  LATTICE_VERSION: v0.3.3
  VECTOR_PRECISION: '4'
  # Slower than the action's old 2500ms default: OPENROUTER_API_KEY_FREE rides
  # the free tier, and a merge-time batch job has no latency SLO. The three
  # build jobs run one after another for the same reason: they share one key.
  REQUEST_INTERVAL_MS: '3000'
  # The embedder rejects inputs over 8192 tokens; dense generated code (hex
  # tables, LUT headers) can reach ~2 bytes per token, so a 16 KB chunk
  # overflowed at 8 245 tokens on 2026-08-16. Capping chunks at 8 192 BYTES
  # guarantees <= 8 192 tokens even at the 1-byte-per-token worst case.
  MAX_CHUNK_BYTES: '8192'
  # Code: 150-line chunks with light overlap keep the corpus under the cap
  # (the action's old 90-line default produced a 165 MB gz).
  CODE_CHUNK_LINES: '150'
  CODE_CHUNK_OVERLAP: '10'
  # Prose: shorter windows, so a chunk is about one section of a page.
  PROSE_CHUNK_LINES: '40'
  PROSE_CHUNK_OVERLAP: '5'

jobs:
  config:
    name: Read the model and source SSOT
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      embed_model: ${{ steps.ssot.outputs.embed_model }}
      endpoint_base: ${{ steps.ssot.outputs.endpoint_base }}
      book_repo: ${{ steps.ssot.outputs.book_repo }}
      book_ref: ${{ steps.ssot.outputs.book_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Read model SSOT
        id: ssot
        env:
          EMBED_MODEL: ${{ vars.OPENROUTER_EMBED_MODEL }}
        # `jq -e` fails the step on a missing/null key instead of exporting
        # "null", and an unset org variable fails here instead of reaching the
        # action as an empty embedding-model.
        run: |
          set -euo pipefail
          [ -n "$EMBED_MODEL" ] || { echo "::error::org variable OPENROUTER_EMBED_MODEL is unset"; exit 1; }
          {
            echo "embed_model=${EMBED_MODEL}"
            echo "endpoint_base=$(jq -er '.endpoint_base' .github/ai-models.json)"
            echo "book_repo=$(jq -er '.sources.rust_book.repo' .github/ai-models.json)"
            echo "book_ref=$(jq -er '.sources.rust_book.ref' .github/ai-models.json)"
          } >> "$GITHUB_OUTPUT"

  code:
    name: Code corpus
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      status: ${{ steps.status.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build corpus (incremental against the published one)
        id: rag
        # A corpus is DERIVED data. If the embedder is rate limited, a chunk
        # trips a provider limit, or verification finds a real problem, the
        # right outcome is a loud warning and yesterday's corpus staying up,
        # not a red main that blocks unrelated work. Every downstream step is
        # gated on this one's outcome and the job concludes green either way.
        continue-on-error: true
        uses: Avarok-Cybersecurity/AutoRepoRAG@dff770896c2c0f9fe0cfaf26ef7f70a75251ab20 # v2.0.0
        with:
          collection: metrale-coderag
          # output-name is a basename: the action writes <name>.jsonl,
          # <name>.jsonl.gz and <name>.meta.json. "metrale-coderag.jsonl" is
          # deliberate -- it makes the metadata file metrale-coderag.jsonl.meta.json,
          # the exact name the site's OPFS preflight fetches; the doubled
          # .jsonl.jsonl(.gz) intermediates are renamed by coderag-stage.sh.
          output-name: metrale-coderag.jsonl
          paths: |
            crates/**/*.rs
            crates/**/*.cu
            crates/**/*.cuh
            kernels/**/*.cu
            kernels/**/*.cuh
            kernels/**/*.h
            kernels/**/*.metal
          exclude: |
            **/target/**
            **/*_tests.rs
            crates/**/tests/**
          chunk-lines: ${{ env.CODE_CHUNK_LINES }}
          chunk-overlap: ${{ env.CODE_CHUNK_OVERLAP }}
          max-chunk-bytes: ${{ env.MAX_CHUNK_BYTES }}
          vector-precision: ${{ env.VECTOR_PRECISION }}
          embedding-endpoint: ${{ needs.config.outputs.endpoint_base }}
          embedding-model: ${{ needs.config.outputs.embed_model }}
          embedding-api-key: ${{ secrets.OPENROUTER_API_KEY_FREE }}
          # The first run 404s here -> the action warns and does a full embed.
          # Every later run reuses vectors for unchanged chunks by chunk_hash.
          previous-corpus-url: ${{ env.PAGES_BASE }}/metrale-coderag.jsonl.gz
          previous-corpus-meta-url: ${{ env.PAGES_BASE }}/metrale-coderag.jsonl.meta.json
          lattice-version: ${{ env.LATTICE_VERSION }}
          request-interval-ms: ${{ env.REQUEST_INTERVAL_MS }}
          generate-website-chat: 'false'

      - name: Name the files as published
        if: steps.rag.outcome == 'success'
        env:
          GZ: ${{ steps.rag.outputs.corpus-gz-file }}
          META: ${{ steps.rag.outputs.metadata-file }}
        run: bash .github/scripts/coderag-stage.sh metrale-coderag "$GZ" "$META" coderag-stage

      - name: Upload CI copy (30-day artifact)
        if: steps.rag.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: metrale-coderag
          path: coderag-stage/
          retention-days: 30
          if-no-files-found: error

      - name: Record the outcome
        id: status
        if: always()
        env:
          BUILD: ${{ steps.rag.outcome }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BUILD" = success ]; then
            echo "value=built" >> "$GITHUB_OUTPUT"
          else
            echo "value=failed" >> "$GITHUB_OUTPUT"
            echo "::warning::CodeRAG code corpus build did not succeed. The published corpus is unchanged. See the build step log."
            echo "### CodeRAG code corpus NOT refreshed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The build step failed at \`$SHA\`. The previously published corpus stays live." >> "$GITHUB_STEP_SUMMARY"
          fi

  docs:
    name: Docs corpus
    needs: [config, code]
    # Runs whether or not `code` succeeded: one failed corpus must not hold
    # back the others. Only a failed `config` (no model, no endpoint) stops all.
    if: ${{ !cancelled() && needs.config.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      status: ${{ steps.status.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build corpus (incremental against the published one)
        id: rag
        continue-on-error: true
        uses: Avarok-Cybersecurity/AutoRepoRAG@dff770896c2c0f9fe0cfaf26ef7f70a75251ab20 # v2.0.0
        with:
          collection: metrale-docs
          output-name: metrale-docs.jsonl
          paths: |
            book/src/**/*.md
            docs/**/*.md
            *.md
          exclude: |
            **/target/**
            **/node_modules/**
          chunk-lines: ${{ env.PROSE_CHUNK_LINES }}
          chunk-overlap: ${{ env.PROSE_CHUNK_OVERLAP }}
          max-chunk-bytes: ${{ env.MAX_CHUNK_BYTES }}
          vector-precision: ${{ env.VECTOR_PRECISION }}
          embedding-endpoint: ${{ needs.config.outputs.endpoint_base }}
          embedding-model: ${{ needs.config.outputs.embed_model }}
          embedding-api-key: ${{ secrets.OPENROUTER_API_KEY_FREE }}
          previous-corpus-url: ${{ env.PAGES_BASE }}/metrale-docs.jsonl.gz
          previous-corpus-meta-url: ${{ env.PAGES_BASE }}/metrale-docs.jsonl.meta.json
          lattice-version: ${{ env.LATTICE_VERSION }}
          request-interval-ms: ${{ env.REQUEST_INTERVAL_MS }}
          generate-website-chat: 'false'

      - name: Name the files as published
        if: steps.rag.outcome == 'success'
        env:
          GZ: ${{ steps.rag.outputs.corpus-gz-file }}
          META: ${{ steps.rag.outputs.metadata-file }}
        run: bash .github/scripts/coderag-stage.sh metrale-docs "$GZ" "$META" coderag-stage

      - name: Upload CI copy (30-day artifact)
        if: steps.rag.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: metrale-docs
          path: coderag-stage/
          retention-days: 30
          if-no-files-found: error

      - name: Record the outcome
        id: status
        if: always()
        env:
          BUILD: ${{ steps.rag.outcome }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BUILD" = success ]; then
            echo "value=built" >> "$GITHUB_OUTPUT"
          else
            echo "value=failed" >> "$GITHUB_OUTPUT"
            echo "::warning::CodeRAG docs corpus build did not succeed. The published corpus is unchanged. See the build step log."
            echo "### CodeRAG docs corpus NOT refreshed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The build step failed at \`$SHA\`. The previously published corpus stays live." >> "$GITHUB_STEP_SUMMARY"
          fi

  books:
    name: Rust book corpus
    needs: [config, docs]
    if: ${{ !cancelled() && needs.config.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      status: ${{ steps.status.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github
          persist-credentials: false

      # The book changes only when its pin does, so the free-tier quota is not
      # spent re-embedding it on every merge: skip when the published copy was
      # built from the pinned commit by the current embed model.
      - name: Preflight (is the published book corpus current?)
        id: preflight
        env:
          META_URL: ${{ env.PAGES_BASE }}/books-rust.jsonl.meta.json
          PINNED_REF: ${{ needs.config.outputs.book_ref }}
          EMBED_MODEL: ${{ needs.config.outputs.embed_model }}
          FORCE: ${{ inputs.force-books || false }}
        run: bash .github/scripts/coderag-books-preflight.sh

      - name: Check out the book at the pinned commit
        if: steps.preflight.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ needs.config.outputs.book_repo }}
          ref: ${{ needs.config.outputs.book_ref }}
          path: .sources/rust-book
          persist-credentials: false

      - name: Build corpus (incremental against the published one)
        id: rag
        if: steps.preflight.outputs.skip != 'true'
        continue-on-error: true
        uses: Avarok-Cybersecurity/AutoRepoRAG@dff770896c2c0f9fe0cfaf26ef7f70a75251ab20 # v2.0.0
        with:
          source-dir: .sources/rust-book
          collection: books-rust
          output-name: books-rust.jsonl
          paths: |
            src/**/*.md
          chunk-lines: ${{ env.PROSE_CHUNK_LINES }}
          chunk-overlap: ${{ env.PROSE_CHUNK_OVERLAP }}
          max-chunk-bytes: ${{ env.MAX_CHUNK_BYTES }}
          vector-precision: ${{ env.VECTOR_PRECISION }}
          embedding-endpoint: ${{ needs.config.outputs.endpoint_base }}
          embedding-model: ${{ needs.config.outputs.embed_model }}
          embedding-api-key: ${{ secrets.OPENROUTER_API_KEY_FREE }}
          previous-corpus-url: ${{ env.PAGES_BASE }}/books-rust.jsonl.gz
          previous-corpus-meta-url: ${{ env.PAGES_BASE }}/books-rust.jsonl.meta.json
          lattice-version: ${{ env.LATTICE_VERSION }}
          request-interval-ms: ${{ env.REQUEST_INTERVAL_MS }}
          generate-website-chat: 'false'

      - name: Name the files as published
        if: steps.rag.outcome == 'success'
        env:
          GZ: ${{ steps.rag.outputs.corpus-gz-file }}
          META: ${{ steps.rag.outputs.metadata-file }}
        run: bash .github/scripts/coderag-stage.sh books-rust "$GZ" "$META" coderag-stage

      - name: Upload CI copy (30-day artifact)
        if: steps.rag.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: books-rust
          path: coderag-stage/
          retention-days: 30
          if-no-files-found: error

      - name: Record the outcome
        id: status
        if: always()
        env:
          SKIP: ${{ steps.preflight.outputs.skip }}
          BUILD: ${{ steps.rag.outcome }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$SKIP" = true ]; then
            echo "value=skipped" >> "$GITHUB_OUTPUT"
          elif [ "$BUILD" = success ]; then
            echo "value=built" >> "$GITHUB_OUTPUT"
          else
            echo "value=failed" >> "$GITHUB_OUTPUT"
            echo "::warning::CodeRAG book corpus build did not succeed. The published corpus is unchanged. See the build step log."
            echo "### CodeRAG book corpus NOT refreshed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The build step failed at \`$SHA\`. The previously published corpus stays live." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Publish to gh-pages
    needs: [config, code, docs, books]
    # Only main publishes: a dispatch from a branch validates the build and
    # stops. Nothing to publish when no corpus was built this run (a skipped
    # book alone is not news).
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.config.result == 'success' && contains(needs.*.outputs.status, 'built') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github
          persist-credentials: false

      # Every artifact of this run is a corpus (names are the corpus bases), so
      # the glob needs no list that could drift from the jobs above.
      - name: Download the corpora built in this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*'
          merge-multiple: true
          path: incoming

      # Orphan single-commit branch: gh-pages history never grows, this
      # workflow is its sole owner, and the corpus URLs are stable forever. The
      # script starts from what gh-pages holds now, so a corpus that failed,
      # was skipped or came out over the size cap keeps its last good copy.
      - name: Publish all corpora as one gh-pages commit
        env:
          CORPORA: >-
            metrale-coderag:${{ needs.code.outputs.status || 'failed' }}
            metrale-docs:${{ needs.docs.outputs.status || 'failed' }}
            books-rust:${{ needs.books.outputs.status || 'failed' }}
          INCOMING: incoming
          SOURCES_JSON: .github/ai-models.json
          PUBLISH_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: bash .github/scripts/coderag-publish.sh
