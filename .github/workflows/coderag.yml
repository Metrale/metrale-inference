name: CodeRAG

# Builds the "Ask the codebase" corpora. Every merge to main that touches Metrale
# Engine source, book or docs chunks + embeds what changed (incremental against
# the previously published corpus, so steady state embeds only what moved) and
# publishes self-verifying lattice-jsonl corpora -- gzip + metadata -- for the
# website to load into an in-browser lattice-db.
#
# One corpus per source slice, because GitHub rejects any pushed file over
# 100 MB. Each corpus is built by .github/workflows/coderag-corpus.yml:
#   metrale-code-crates        crates/** except the model-* crates   (code profile)
#   metrale-code-crates-model  crates/model-*                        (code profile)
#   metrale-code-kernels       kernels/** (CUDA, Metal, HIP)         (code profile)
#   metrale-docs               book/src, docs/ and the root *.md     (prose profile)
#   books-rust                 The Rust Programming Language, pinned (prose profile)
#
# 2026-10-11: the single `metrale-coderag` code corpus came out at 105,944,953 B
# (6,624 points) against the 99,614,720 B cap, so it was split. Measured on that
# build, a point costs ~16 KB gzipped whatever it holds, so the cap is ~6,200
# points and the split targets <= 50% of it per corpus (>= 50% headroom).
# Built 2026-10-11 (run 38183263400, full embeds):
#   crates         2,536 points   40,623,154 B   (40% of the cap)
#   crates-model   2,712 points   43,239,119 B   (43%)
#   kernels        1,376 points   22,017,014 B   (22%)
# crates/ alone was 5,248 points (~84 MB, 16% headroom), so kernels/ vs crates/
# was not enough and crates/ is cut again by crate name. The two crates halves
# are one glob and its complement, so a new crate lands in exactly one of them;
# assert-coderag-code-partition.py fails CI if any file falls in none or two.
#
# `metrale-coderag` (the old unsplit corpus) is no longer built. Its last
# published copy stays on gh-pages, listed in RETIRED_CORPORA below, until the
# consumers have moved to the three code corpora; dropping the name from that
# list removes the files on the next publish.
#
# Stable URLs this produces (no TTL, fetchable directly from the browser):
#   https://metrale.github.io/metrale-inference/coderag/<corpus>.jsonl.gz
#   https://metrale.github.io/metrale-inference/coderag/<corpus>.jsonl.meta.json
#   https://metrale.github.io/metrale-inference/coderag/SOURCES.md
#
# Why gh-pages and not the alternatives: GitHub Pages serves with
# `Access-Control-Allow-Origin: *` (verified 2026-08-16), so the site can fetch
# the corpus cross-origin. Release assets send no CORS headers at all, and
# workflow artifacts are auth-only downloads capped at 90 days -- neither can
# back an anonymous browser fetch. The 30-day artifacts below are CI copies for
# inspection, not the serving path.
#
# One-time prerequisite (repo settings, not automatable from here):
# Settings -> Pages -> "Deploy from a branch" -> branch `gh-pages`, folder
# `/ (root)`. Until that is enabled the branch updates but nothing is served.
#
# Fallback if Pages ever misbehaves: publish the same files beside the site
# that loads them (metrale.ai), so they are served same-origin -- same bytes,
# and no CORS in play at all.
#
# The embed model is the ORG variable OPENROUTER_EMBED_MODEL, never a literal
# here or in .github/ai-models.json: free-tier ids rotate without notice and a
# second copy of the id is the thing that drifts.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'kernels/**'
      - 'book/**'
      - 'docs/**'
      - '*.md'
      - '.github/ai-models.json'
      - '.github/scripts/coderag-*.sh'
      - '.github/workflows/coderag.yml'
      - '.github/workflows/coderag-corpus.yml'
  workflow_dispatch:
    inputs:
      force-books:
        description: Rebuild the pinned book corpus even when the published copy is current (use after changing its chunk profile)
        type: boolean
        required: true
        default: false

# Two corpus publishes must never race the gh-pages force-push; a superseded
# run's corpus is worthless the moment a newer main exists, so cancel it.
concurrency:
  group: coderag-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PAGES_BASE: https://metrale.github.io/metrale-inference/coderag
  # 95 MiB. GitHub rejects any pushed file over 100 MB; fail here with the real
  # number instead of dying inside git push with an LFS hint.
  SIZE_CAP_BYTES: '99614720'
  # Warn once a corpus reaches 75% of the cap, i.e. before the headroom a split
  # is meant to leave (>= 25%) is gone, not after the build is over the cap.
  SIZE_WARN_PERCENT: '75'
  # Corpora no longer built whose last published copy is kept on gh-pages.
  RETIRED_CORPORA: metrale-coderag

jobs:
  config:
    name: Read the model and source SSOT
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      embed_model: ${{ steps.ssot.outputs.embed_model }}
      endpoint_base: ${{ steps.ssot.outputs.endpoint_base }}
      book_repo: ${{ steps.ssot.outputs.book_repo }}
      book_ref: ${{ steps.ssot.outputs.book_ref }}
      # `with:` of a reusable-workflow call cannot read `env`, so the values the
      # builds share are exported here, from the one place they are defined.
      pages_base: ${{ env.PAGES_BASE }}
      size_cap_bytes: ${{ env.SIZE_CAP_BYTES }}
      size_warn_percent: ${{ env.SIZE_WARN_PERCENT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Read model SSOT
        id: ssot
        env:
          EMBED_MODEL: ${{ vars.OPENROUTER_EMBED_MODEL }}
        # `jq -e` fails the step on a missing/null key instead of exporting
        # "null", and an unset org variable fails here instead of reaching the
        # action as an empty embedding-model.
        run: |
          set -euo pipefail
          [ -n "$EMBED_MODEL" ] || { echo "::error::org variable OPENROUTER_EMBED_MODEL is unset"; exit 1; }
          {
            echo "embed_model=${EMBED_MODEL}"
            echo "endpoint_base=$(jq -er '.endpoint_base' .github/ai-models.json)"
            echo "book_repo=$(jq -er '.sources.rust_book.repo' .github/ai-models.json)"
            echo "book_ref=$(jq -er '.sources.rust_book.ref' .github/ai-models.json)"
          } >> "$GITHUB_OUTPUT"

  # The corpus builds run one after another: they share one free-tier key. Each
  # runs whether or not the one before it succeeded, so one failed corpus does
  # not hold back the others; only a failed `config` (no model, no endpoint)
  # stops all. Every build calls the same workflow; only the slice differs.
  code_crates:
    name: Code corpus (crates)
    needs: config
    if: ${{ !cancelled() && needs.config.result == 'success' }}
    uses: ./.github/workflows/coderag-corpus.yml
    with:
      base: metrale-code-crates
      profile: code
      paths: |
        crates/**/*.rs
        crates/**/*.cu
        crates/**/*.cuh
      # The first three lines are shared by all three code corpora (the
      # partition check relies on that); the last is this corpus's complement of
      # metrale-code-crates-model.
      exclude: |
        **/target/**
        **/*_tests.rs
        crates/**/tests/**
        crates/model-*/**
      embed_model: ${{ needs.config.outputs.embed_model }}
      endpoint_base: ${{ needs.config.outputs.endpoint_base }}
      pages_base: ${{ needs.config.outputs.pages_base }}
      size_cap_bytes: ${{ needs.config.outputs.size_cap_bytes }}
      size_warn_percent: ${{ needs.config.outputs.size_warn_percent }}
    secrets:
      OPENROUTER_API_KEY_FREE: ${{ secrets.OPENROUTER_API_KEY_FREE }}

  code_crates_model:
    name: Code corpus (model crates)
    needs: [config, code_crates]
    if: ${{ !cancelled() && needs.config.result == 'success' }}
    uses: ./.github/workflows/coderag-corpus.yml
    with:
      base: metrale-code-crates-model
      profile: code
      paths: |
        crates/model-*/**/*.rs
        crates/model-*/**/*.cu
        crates/model-*/**/*.cuh
      exclude: |
        **/target/**
        **/*_tests.rs
        crates/**/tests/**
      embed_model: ${{ needs.config.outputs.embed_model }}
      endpoint_base: ${{ needs.config.outputs.endpoint_base }}
      pages_base: ${{ needs.config.outputs.pages_base }}
      size_cap_bytes: ${{ needs.config.outputs.size_cap_bytes }}
      size_warn_percent: ${{ needs.config.outputs.size_warn_percent }}
    secrets:
      OPENROUTER_API_KEY_FREE: ${{ secrets.OPENROUTER_API_KEY_FREE }}

  code_kernels:
    name: Code corpus (kernels)
    needs: [config, code_crates_model]
    if: ${{ !cancelled() && needs.config.result == 'success' }}
    uses: ./.github/workflows/coderag-corpus.yml
    with:
      base: metrale-code-kernels
      profile: code
      paths: |
        kernels/**/*.cu
        kernels/**/*.cuh
        kernels/**/*.h
        kernels/**/*.metal
      exclude: |
        **/target/**
        **/*_tests.rs
        crates/**/tests/**
      embed_model: ${{ needs.config.outputs.embed_model }}
      endpoint_base: ${{ needs.config.outputs.endpoint_base }}
      pages_base: ${{ needs.config.outputs.pages_base }}
      size_cap_bytes: ${{ needs.config.outputs.size_cap_bytes }}
      size_warn_percent: ${{ needs.config.outputs.size_warn_percent }}
    secrets:
      OPENROUTER_API_KEY_FREE: ${{ secrets.OPENROUTER_API_KEY_FREE }}

  docs:
    name: Docs corpus
    needs: [config, code_kernels]
    if: ${{ !cancelled() && needs.config.result == 'success' }}
    uses: ./.github/workflows/coderag-corpus.yml
    with:
      base: metrale-docs
      profile: prose
      paths: |
        book/src/**/*.md
        docs/**/*.md
        *.md
      exclude: |
        **/target/**
        **/node_modules/**
      embed_model: ${{ needs.config.outputs.embed_model }}
      endpoint_base: ${{ needs.config.outputs.endpoint_base }}
      pages_base: ${{ needs.config.outputs.pages_base }}
      size_cap_bytes: ${{ needs.config.outputs.size_cap_bytes }}
      size_warn_percent: ${{ needs.config.outputs.size_warn_percent }}
    secrets:
      OPENROUTER_API_KEY_FREE: ${{ secrets.OPENROUTER_API_KEY_FREE }}

  # The book changes only when its pin does, so the free-tier quota is not
  # spent re-embedding it on every merge: skip when the published copy was
  # built from the pinned commit by the current embed model.
  books_preflight:
    name: Rust book preflight (is the published corpus current?)
    needs: config
    if: ${{ !cancelled() && needs.config.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.preflight.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Preflight
        id: preflight
        env:
          META_URL: ${{ env.PAGES_BASE }}/books-rust.jsonl.meta.json
          PINNED_REF: ${{ needs.config.outputs.book_ref }}
          EMBED_MODEL: ${{ needs.config.outputs.embed_model }}
          FORCE: ${{ inputs.force-books || false }}
        run: bash .github/scripts/coderag-books-preflight.sh

  books:
    name: Rust book corpus
    needs: [config, books_preflight, docs]
    # A failed preflight leaves `skip` empty, which builds: a wasted build is
    # cheap, a stale book silently kept is not.
    if: ${{ !cancelled() && needs.config.result == 'success' && needs.books_preflight.outputs.skip != 'true' }}
    uses: ./.github/workflows/coderag-corpus.yml
    with:
      base: books-rust
      profile: prose
      source_repo: ${{ needs.config.outputs.book_repo }}
      source_ref: ${{ needs.config.outputs.book_ref }}
      paths: |
        src/**/*.md
      embed_model: ${{ needs.config.outputs.embed_model }}
      endpoint_base: ${{ needs.config.outputs.endpoint_base }}
      pages_base: ${{ needs.config.outputs.pages_base }}
      size_cap_bytes: ${{ needs.config.outputs.size_cap_bytes }}
      size_warn_percent: ${{ needs.config.outputs.size_warn_percent }}
    secrets:
      OPENROUTER_API_KEY_FREE: ${{ secrets.OPENROUTER_API_KEY_FREE }}

  publish:
    name: Publish to gh-pages
    needs: [config, code_crates, code_crates_model, code_kernels, docs, books_preflight, books]
    # Only main publishes: a dispatch from a branch validates the build and
    # stops. Nothing to publish when no corpus was built this run (a skipped
    # book alone is not news).
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.config.result == 'success' && contains(needs.*.outputs.status, 'built') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github
          persist-credentials: false

      # Every artifact of this run is a corpus (names are the corpus bases), so
      # the glob needs no list that could drift from the jobs above.
      - name: Download the corpora built in this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*'
          merge-multiple: true
          path: incoming

      # Orphan single-commit branch: gh-pages history never grows, this
      # workflow is its sole owner, and the corpus URLs are stable forever. The
      # script starts from what gh-pages holds now, so a corpus that failed,
      # was skipped or came out over the size cap keeps its last good copy, and
      # a RETIRED corpus is carried forward untouched.
      - name: Publish all corpora as one gh-pages commit
        env:
          CORPORA: >-
            metrale-code-crates:${{ needs.code_crates.outputs.status || 'failed' }}
            metrale-code-crates-model:${{ needs.code_crates_model.outputs.status || 'failed' }}
            metrale-code-kernels:${{ needs.code_kernels.outputs.status || 'failed' }}
            metrale-docs:${{ needs.docs.outputs.status || 'failed' }}
            books-rust:${{ needs.books.outputs.status || (needs.books_preflight.outputs.skip == 'true' && 'skipped' || 'failed') }}
          INCOMING: incoming
          SOURCES_JSON: .github/ai-models.json
          PUBLISH_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: bash .github/scripts/coderag-publish.sh
